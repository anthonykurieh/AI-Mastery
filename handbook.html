<script>
/* ============ PART II: THE CONSULTING HANDBOOK (general consulting, chapters 14-19) ============ */
window.MODULES.push({
id:"m1",n:"1",spine:false,t:"The Consulting Business",
sub:"What consultants actually sell, how firms make money, and the life of an engagement from first meeting to follow-on. The context every other chapter assumes.",
lessons:[
{id:"l1",t:"What consultants sell & who sells it",min:7,html:`
<p class="lead">Clients don't buy slides. They buy a better decision, made faster and with less risk than they could manage alone. Everything a consultant does should trace back to that.</p>
<h3>Why clients hire consultants</h3>
<p>There are five honest reasons, and knowing which one is in play tells you what ‘good' looks like on the engagement:</p>
<ul>
<li><strong>Expertise</strong>: the client lacks a skill or a pattern library (pricing, M&amp;A integration, AI architecture).</li>
<li><strong>Capacity</strong>: they know what to do but don't have the people to do it in time.</li>
<li><strong>Objectivity</strong>: an outsider can say what insiders can't, and can compare against other companies.</li>
<li><strong>Speed</strong>: a team that has done this twenty times gets there in weeks, not quarters.</li>
<li><strong>Legitimacy</strong>: a board or regulator wants an independent view, or a leader needs backing for a hard call.</li>
</ul>
<div class="box key"><div class="bx-h">Read the real brief</div>If the reason is legitimacy, the deliverable must survive scrutiny from skeptics. If it's capacity, speed and execution matter more than novelty. Ask early: ‘what will you do with our answer, and who has to agree with it?'</div>
<h3>The firm landscape</h3>
<div class="tblwrap"><table class="tbl"><tr><th>Type</th><th>Examples</th><th>Typical work</th></tr>
<tr><td>Strategy houses</td><td>McKinsey, BCG, Bain (MBB)</td><td>CEO-level strategy, growth, M&amp;A, transformation, short intense projects</td></tr>
<tr><td>Big Four advisory</td><td>Deloitte, PwC, EY, KPMG (with strategy arms such as EY-Parthenon, Strategy&amp;, Monitor Deloitte)</td><td>Strategy through implementation, transactions, risk, tech, tax and audit-adjacent work</td></tr>
<tr><td>Implementation and tech</td><td>Accenture, Capgemini, IBM Consulting</td><td>Large technology and operations programs, long multi-year delivery</td></tr>
<tr><td>Boutiques</td><td>Sector or function specialists</td><td>Deep niche expertise (pricing, healthcare, AI), senior attention</td></tr>
<tr><td>In-house strategy</td><td>Corporate strategy and transformation teams</td><td>The same methods, applied from the inside</td></tr>
</table></div>
<h3>The main practice areas</h3>
<p><strong>Strategy</strong> (where to play, how to win), <strong>operations</strong> (cost, supply chain, process), <strong>technology and digital</strong> (including AI), <strong>organization and people</strong> (structure, culture, change), <strong>transactions</strong> (due diligence, integration) and <strong>risk and regulation</strong>. Most real engagements mix two or three of these.</p>
`,checks:[
{q:"A CEO hires you to review a restructuring she has already decided on, mainly so the board will accept it. The main reason you were hired is:",opts:["Expertise","Speed","Legitimacy","Capacity"],a:2,why:"When legitimacy is the real brief, the standard is defensibility: transparent evidence, tested alternatives, and conclusions a skeptic can check."}
]},
{id:"l2",t:"How a consulting firm makes money",min:6,html:`
<p class="lead">Understanding the firm's economics explains almost every behavior you'll see on a project: the staffing pyramid, the obsession with scope, and why partners sell follow-on work.</p>
<h3>The leverage pyramid</h3>
<p>A typical team is a <strong>partner</strong> (sells and owns the relationship), a <strong>principal or associate partner</strong> (shapes the answer across projects), an <strong>engagement manager</strong> (runs the day-to-day), and several <strong>consultants and analysts</strong> (do the analysis). Juniors bill at lower rates but carry most of the hours, so the pyramid's shape (its <strong>leverage</strong>) drives profit.</p>
<div class="box num">Revenue = headcount × utilization × billing rate × realization</div>
<ul>
<li><strong>Utilization</strong>: the share of available hours that are billable. Bench time is pure cost.</li>
<li><strong>Billing rate</strong>: set by seniority and brand.</li>
<li><strong>Realization</strong>: the share of billed value actually collected after discounts and write-offs.</li>
</ul>
<h3>Fee models</h3>
<div class="tblwrap"><table class="tbl"><tr><th>Model</th><th>How it works</th><th>Risk sits with</th></tr>
<tr><td>Time and materials</td><td>Pay for hours worked</td><td>The client (open-ended cost)</td></tr>
<tr><td>Fixed fee</td><td>A set price for defined deliverables</td><td>The firm (overruns eat margin)</td></tr>
<tr><td>Value or outcome-based</td><td>Part of the fee tied to measured results (savings, revenue)</td><td>Shared, needs a clean baseline</td></tr>
<tr><td>Retainer</td><td>Recurring fee for ongoing access</td><td>Balanced, relationship-driven</td></tr>
</table></div>
<div class="box warnbx"><div class="bx-h">Why scope creep matters so much</div>Most project work is fixed fee. Every ‘small extra analysis' agreed in a hallway is unpaid work that lowers realization. Good managers log every request and route anything outside scope into a formal change request or a phase two.</div>
`,checks:[
{q:"Your fixed-fee project keeps absorbing extra requests. The firm's economics suffer mainly through:",opts:["Lower realization","Worse leverage","Higher billing rates","Lower utilization"],a:0,why:"On a fixed fee, extra hours don't add revenue, so the collected value per hour (realization) falls. That's why scope is managed formally."}
]},
{id:"l3",t:"The engagement lifecycle",min:7,html:`
<p class="lead">Every engagement follows the same arc. Knowing where you are in it tells you what the client needs from you this week.</p>
<h3>The seven stages</h3>
<ol>
<li><strong>Origination</strong>: a relationship, a referral, or an RFP surfaces a need.</li>
<li><strong>Proposal</strong>: situation, objectives, approach, deliverables, team, timeline and fees. A good proposal already contains an early hypothesis.</li>
<li><strong>Kickoff</strong>: align on the key question, success criteria, governance (who decides), data access and interviews.</li>
<li><strong>Diagnostic</strong>: understand the current state with data, interviews and benchmarks. Typically the first 2 to 4 weeks.</li>
<li><strong>Solution design</strong>: develop and test options, size the impact, choose.</li>
<li><strong>Recommendation</strong>: the final steering committee with a clear answer, a business case and a roadmap.</li>
<li><strong>Implementation and close</strong>: support the rollout, transfer knowledge, capture impact, and shape the follow-on.</li>
</ol>
<h3>Governance that keeps a project healthy</h3>
<p>A <strong>steering committee</strong> (senior client sponsors) meets every 2 to 4 weeks to make decisions. A <strong>weekly check-in</strong> with the day-to-day client lead keeps work aligned. The cardinal rule: <strong>no surprises in the steering committee</strong>. Every major finding is pre-wired with the key stakeholders before the meeting.</p>
<div class="box key"><div class="bx-h">The proposal in one page</div>Situation (what's happening) · Objectives (what success means, measurably) · Approach (phases and key analyses) · Deliverables · Team · Timeline · Fees. If you can't write the objectives measurably, the engagement isn't ready to start.</div>
`,checks:[
{q:"A finding in your deck will embarrass the CFO. The right move before the steering committee is:",opts:["Pre-wire it privately with the CFO first","Soften it so it no longer names finance","Remove it to protect the relationship","Present it and let the meeting debate it"],a:0,why:"No surprises in the steering committee. Pre-wiring turns a potential ambush into a supported decision and often improves the finding itself."}
]}
],
exam:[
{q:"Which is NOT one of the five reasons clients hire consultants?",opts:["Extra capacity","Legitimacy with the board","Objectivity and independence","Guaranteed outcomes"],a:3,why:"The five are expertise, capacity, objectivity, speed and legitimacy. Nobody can honestly guarantee an outcome."},
{q:"Consulting revenue can be written as:",opts:["Headcount × billing rate × total hours worked per year","Headcount × utilization × billing rate × realization","Utilization × average salary × leverage ratio","Partners × projects per partner × average project fee"],a:1,why:"Each factor is a lever: keep people billable, price by seniority, and collect what you bill."},
{q:"On a fixed-fee contract, the cost-overrun risk sits with:",opts:["Shared equally","The client","The consulting firm","The client's procurement team"],a:2,why:"The firm promised deliverables for a set price, so extra hours cut its margin. That's why scope is tightly managed."},
{q:"The cardinal rule for steering committees is:",opts:["Keep it short: never more than thirty minutes","No surprises: pre-wire major findings beforehand","Show progress: always present new analysis each time","Let the client lead and present the findings"],a:1,why:"Steering committees exist to decide, not to be ambushed. Pre-wiring builds support and stress-tests findings."},
{q:"A proposal is not ready if:",opts:["The fee isn't broken down by week","Its objectives can't be stated measurably","It doesn't list every analysis planned","It doesn't include an early hypothesis"],a:1,why:"Unmeasurable objectives mean nobody can agree when the work is done or whether it worked."}
]
});

window.MODULES.push({
id:"m2",n:"2",spine:false,t:"Problem Solving",
sub:"The core method: define the problem precisely, break it into a MECE tree, form hypotheses, and plan only the analyses that can change the answer.",
lessons:[
{id:"l1",t:"Defining the problem",min:7,html:`
<p class="lead">Most failed projects solved the wrong problem well. A precise problem statement is the cheapest insurance you'll ever buy.</p>
<h3>The key question</h3>
<p>Turn a vague brief into one <strong>key question</strong> that is specific, measurable, action-oriented, relevant and time-bound. Compare:</p>
<div class="tblwrap"><table class="tbl"><tr><th>Weak</th><th>Strong</th></tr>
<tr><td>How can we improve our stores?</td><td>How can we raise like-for-like store profit by 10% within 18 months without cutting service scores?</td></tr>
<tr><td>Should we use AI?</td><td>Which three customer-service processes can automation take 30% cost out of by end of next year, and at what investment?</td></tr>
</table></div>
<h3>The problem statement worksheet</h3>
<ul>
<li><strong>Key question</strong>: the one sentence above.</li>
<li><strong>Context</strong>: what's happening and why now.</li>
<li><strong>Success criteria</strong>: how the client will judge the outcome.</li>
<li><strong>Scope</strong>: what's in and, just as important, what's out.</li>
<li><strong>Constraints</strong>: budget, timing, things that can't change (no layoffs, no new IT system).</li>
<li><strong>Stakeholders</strong>: who decides, who must agree, who can block.</li>
<li><strong>Sources of insight</strong>: data, people, and benchmarks you'll use.</li>
</ul>
<div class="box key"><div class="bx-h">Framing with SCQ</div>A clean way to open any problem: <strong>Situation</strong> (the stable context everyone agrees with), <strong>Complication</strong> (what changed or what's wrong), <strong>Question</strong> (what we must answer as a result). ‘We've led the regional market for a decade (S). A low-cost entrant has taken 6 points of share in a year (C). How should we respond to protect profit (Q)?'</div>
`,checks:[
{q:"Which is the strongest key question?",opts:["How can we use digital and AI to grow revenue and reduce costs at the same time?","How can we grow EBITDA $20M in two years in existing markets, without M&A?","What growth strategy should we adopt to stay competitive in our core markets?","How can we become the clear leading player in our region over the next decade?"],a:1,why:"It's specific, measurable, action-oriented, scoped (existing markets, no acquisitions) and time-bound."}
]},
{id:"l2",t:"Issue trees & hypothesis trees",min:8,html:`
<p class="lead">An issue tree turns one big question into smaller ones you can actually answer. It's the backbone of the workplan, the interview guide and eventually the storyline.</p>
<h3>Three kinds of tree</h3>
<div class="tblwrap"><table class="tbl"><tr><th>Tree</th><th>Asks</th><th>Example branches</th></tr>
<tr><td>Diagnostic (why)</td><td>Why is this happening?</td><td>Profit fell: revenue down? costs up? mix shift?</td></tr>
<tr><td>Solution (how)</td><td>What could we do?</td><td>Grow profit: raise price, sell more, cut cost, change mix</td></tr>
<tr><td>Deductive (math)</td><td>What does this equal?</td><td>Revenue = customers × visits × spend per visit</td></tr>
</table></div>
<p>Deductive trees are the most powerful because they are MECE by construction: if the arithmetic holds, nothing is missing and nothing overlaps.</p>
<h3>Testing for MECE</h3>
<ul>
<li><strong>Mutually exclusive</strong>: could one fact fall into two branches? If so, redraw.</li>
<li><strong>Collectively exhaustive</strong>: is there any cause that fits no branch? Add an ‘other' only as a last resort.</li>
<li>Go 3 to 4 levels deep, until each leaf is something you can test with one analysis.</li>
</ul>
<h3>From issue tree to hypothesis tree</h3>
<p>Once you have a view, restate the branches as claims you believe are true: ‘profit fell mainly because input costs rose', supported by ‘bean prices rose 20%' and ‘we did not pass costs through to price'. Each claim names the analysis that would prove or kill it. This is the <strong>Day-1 answer</strong>: a best guess at the final recommendation, written on the first day and revised as evidence arrives.</p>
<div class="box key"><div class="bx-h">The ghost deck</div>Draft the final presentation's slide titles on day one, with empty charts underneath. It forces you to name what you must prove, exposes gaps early, and keeps the team from collecting data nobody will use.</div>
`,checks:[
{q:"Why are deductive (math) trees especially useful?",opts:["They're MECE by construction","They're easier for clients to read","They replace the need for hypotheses","They don't need any data to build"],a:0,why:"Revenue = customers × frequency × spend leaves no gaps and no overlaps, so every driver is covered."},
{q:"A Day-1 answer is:",opts:["A falsifiable best guess, revised as evidence arrives","The client's own view of the answer","A list of the data needed on day one","The final answer, defended throughout the project"],a:0,why:"It focuses the work on proving or killing a specific claim instead of collecting everything."}
]},
{id:"l3",t:"Prioritizing & building the workplan",min:7,html:`
<p class="lead">You will never have time to analyze everything. The skill is choosing the few analyses that can change the answer.</p>
<h3>Prioritize the tree</h3>
<ul>
<li><strong>80/20</strong>: a few branches usually hold most of the value. Size each branch roughly before diving in.</li>
<li><strong>Impact × ease</strong>: plot options on a 2x2. High impact, easy to test goes first.</li>
<li><strong>Can it change the decision?</strong> If no plausible result of an analysis would change the recommendation, skip it.</li>
</ul>
<h3>The workplan</h3>
<p>For each hypothesis, one row:</p>
<div class="tblwrap"><table class="tbl"><tr><th>Hypothesis</th><th>Analysis</th><th>Data source</th><th>Owner</th><th>Due</th><th>End product</th></tr>
<tr><td>Bean costs drove the profit drop</td><td>Cost per cup by component, this year vs last</td><td>Finance ledger, supplier invoices</td><td>Analyst A</td><td>Week 2</td><td>Waterfall chart</td></tr>
<tr><td>Prices weren't adjusted</td><td>Price history vs competitors</td><td>POS data, store checks</td><td>Analyst B</td><td>Week 2</td><td>Price benchmark table</td></tr>
</table></div>
<h3>The ‘so what' discipline</h3>
<p>Every analysis must end in a sentence the client can act on. ‘Labor is 30% of cost' is a fact. ‘Labor scheduling doesn't follow footfall, so we overstaff mornings by about 15%' is a so-what. Ask ‘so what?' until the answer is a decision or an action.</p>
<div class="box warnbx"><div class="bx-h">Don't boil the ocean</div>The classic junior mistake is gathering every available dataset before forming a view. It feels thorough and produces nothing. Hypothesis first, then the minimum data to test it.</div>
`,checks:[
{q:"An analysis would take a week, but no plausible result would change your recommendation. You should:",opts:["Hand it to the client's own team to run in parallel","Do a lighter version in two days to cover the base","Skip it; spend the time where results can change the answer","Do it anyway, so the final deck is complete and defensible"],a:2,why:"The test of an analysis is whether it can change the answer. Effort spent elsewhere is waste."}
]}
],
exam:[
{q:"A good key question is:",opts:["Broad enough to cover every possible issue the client faces","Short enough to fit comfortably into a single slide title","Agreed with every single stakeholder before you start drafting","Specific, measurable, action-oriented, relevant, time-bound"],a:3,why:"A sharp key question defines success and scope, which protects the whole engagement."},
{q:"SCQ stands for:",opts:["Summary, Complication, Quote","Situation, Complication, Question","Situation, Cause, Quantification","Scope, Context, Question"],a:1,why:"Situation sets agreed context, Complication says what changed, Question is what must be answered."},
{q:"A diagnostic tree asks:",opts:["Which option is best?","Why is this happening?","How could we fix it?","What does this number equal?"],a:1,why:"Diagnostic trees find causes. Solution trees list options. Deductive trees break a number into its drivers."},
{q:"The ghost deck is:",opts:["A short pre-read sent before the steering committee","Final slide titles drafted on day one with empty charts","The deck from a similar past project, reused","The appendix of backup analyses"],a:1,why:"It names what you must prove and keeps the team from gathering data nobody needs."},
{q:"‘Labor is 30% of cost' fails the so-what test because:",opts:["It needs a benchmark to be meaningful","It's a fact with no implication or action","It should be shown as a chart instead","It's too precise for an executive audience"],a:1,why:"A so-what says what it means and what to do, e.g. scheduling doesn't follow footfall, so mornings are overstaffed."}
]
});

window.MODULES.push({
id:"m3",n:"3",spine:false,t:"The Analyst's Toolkit",
sub:"The frameworks, financial math, research methods and operations tools you'll reach for on almost every project, and when each one actually fits.",
lessons:[
{id:"l1",t:"Strategy frameworks, and when each fits",min:8,html:`
<p class="lead">A framework is a checklist for not forgetting things. Use it to generate your tree, then throw away whatever doesn't fit the problem.</p>
<div class="tblwrap"><table class="tbl"><tr><th>Framework</th><th>What it does</th><th>Use it for</th></tr>
<tr><td>Porter's Five Forces</td><td>Rivalry, new entrants, substitutes, buyer power, supplier power</td><td>How attractive and profitable an industry is</td></tr>
<tr><td>PESTEL</td><td>Political, economic, social, technological, environmental, legal trends</td><td>Scanning the macro environment, e.g. before market entry</td></tr>
<tr><td>3Cs</td><td>Customers, company, competitors</td><td>A quick first structure for most strategy questions</td></tr>
<tr><td>Value chain</td><td>The activities that create value, from inputs to after-sales</td><td>Finding where cost or advantage sits</td></tr>
<tr><td>Ansoff matrix</td><td>Existing or new products × existing or new markets</td><td>Mapping growth options by risk</td></tr>
<tr><td>BCG growth-share matrix</td><td>Market growth × relative share (stars, cash cows, question marks, dogs)</td><td>Portfolio decisions across business units</td></tr>
<tr><td>Three Horizons</td><td>Core today, emerging next, options for the future</td><td>Balancing investment across time</td></tr>
<tr><td>McKinsey 7S</td><td>Strategy, structure, systems, shared values, style, staff, skills</td><td>Diagnosing organizational alignment</td></tr>
<tr><td>SWOT</td><td>Strengths, weaknesses, opportunities, threats</td><td>A workshop summary, rarely an analysis on its own</td></tr>
</table></div>
<h3>Ansoff in more detail</h3>
<p>Growth options rise in risk as you move away from what you know: <strong>market penetration</strong> (sell more of today's products to today's customers), <strong>product development</strong> (new products, same customers), <strong>market development</strong> (same products, new markets) and <strong>diversification</strong> (new products in new markets, the riskiest).</p>
<div class="box warnbx"><div class="bx-h">Why SWOT is weak on its own</div>It lists facts without priorities, causes or actions. If you use it, follow every item with ‘so what do we do?' and size it.</div>
`,checks:[
{q:"A client asks whether the industry it might enter is structurally profitable. The best-fitting lens is:",opts:["McKinsey 7S","BCG growth-share matrix","Ansoff matrix","Porter's Five Forces"],a:3,why:"Five Forces explains industry profitability through rivalry, entry barriers, substitutes and the power of buyers and suppliers."},
{q:"In the Ansoff matrix, the riskiest growth option is:",opts:["Market penetration","Market development","Diversification","Product development"],a:2,why:"Diversification combines a new product with a new market, so the firm leaves everything it knows."}
]},
{id:"l2",t:"Financial analysis for consultants",min:9,html:`
<p class="lead">Almost every recommendation ends in money. You need a handful of formulas you can apply on a whiteboard without hesitation.</p>
<h3>The P&amp;L in one line</h3>
<p>Revenue minus cost of goods sold gives <strong>gross profit</strong>. Minus operating expenses gives <strong>EBITDA</strong> (earnings before interest, taxes, depreciation and amortization), the usual proxy for operating cash profit. Then depreciation, interest and tax down to <strong>net income</strong>.</p>
<h3>Unit economics and break-even</h3>
<div class="box num">Contribution margin per unit = price − variable cost per unit
Break-even volume = fixed costs ÷ contribution margin per unit</div>
<p>Example: a product sells for $10 with $6 of variable cost, so each unit contributes $4. With $2M of fixed costs, break-even is 500,000 units.</p>
<h3>Investment decisions</h3>
<ul>
<li><strong>Payback period</strong>: how long until cumulative cash flow turns positive. Simple and intuitive, but ignores the time value of money.</li>
<li><strong>NPV (net present value)</strong>: the sum of future cash flows discounted at the cost of capital, minus the investment. Positive NPV creates value.</li>
<li><strong>IRR (internal rate of return)</strong>: the discount rate at which NPV equals zero. Compare it to the hurdle rate.</li>
</ul>
<div class="box num">NPV = Σ CFₜ ÷ (1 + r)ᵗ − initial investment</div>
<h3>Customer economics</h3>
<ul>
<li><strong>CAC</strong>: cost to acquire one customer (sales and marketing spend ÷ new customers).</li>
<li><strong>CLV or LTV</strong>: margin a customer generates over their lifetime. A quick version: annual margin per customer × expected years retained.</li>
<li>A common rule of thumb is <strong>LTV:CAC of at least 3:1</strong>, with CAC paid back within about 12 to 18 months.</li>
</ul>
<div class="box key"><div class="bx-h">Always show sensitivity</div>A business case is only as good as its assumptions. Show which one moves the answer most (usually volume, price or adoption) and the break-even value of that assumption. ‘This works as long as adoption exceeds 22%' is far more useful than a single NPV.</div>
`,checks:[
{q:"Price $50, variable cost $30, fixed costs $1M. Break-even volume is:",opts:["20,000 units","25,000 units","50,000 units","33,333 units"],a:2,why:"Contribution is $50 − $30 = $20 per unit, and $1M ÷ $20 = 50,000 units."},
{q:"Why is NPV preferred over payback for comparing investments?",opts:["It's easier to calculate and explain to client executives","It ignores risk, which makes comparing projects fairer","It always produces a shorter, more attractive payback period","It discounts cash flows and counts those after payback"],a:3,why:"Payback ignores discounting and anything after the payback point, so it can favor fast but small returns."}
]},
{id:"l3",t:"Research: interviews, experts & data",min:7,html:`
<p class="lead">Good consulting answers rest on facts the client didn't already have. The craft is getting them fast and triangulating so no single source can mislead you.</p>
<h3>The main sources</h3>
<ul>
<li><strong>Client interviews</strong>: leaders, front-line staff and skeptics. Front-line staff often know the real cause.</li>
<li><strong>Expert calls</strong>: former industry executives via expert networks (GLG, AlphaSights, Third Bridge). Great for market structure and competitor practices.</li>
<li><strong>Customer research</strong>: interviews for the why, surveys for the how many. Never use a survey to discover something you don't yet understand.</li>
<li><strong>Internal data</strong>: finance, operations, CRM, transactions. Profile it early because it is always messier than promised.</li>
<li><strong>External data</strong>: annual reports, industry reports, government statistics, pricing scrapes, store visits.</li>
</ul>
<h3>Interview technique</h3>
<ol>
<li>Prepare a short guide built from your issue tree, not a long questionnaire.</li>
<li>Open broad (‘what's really driving this?'), then narrow to test your hypotheses.</li>
<li>Ask for examples and numbers: ‘when did that last happen, and how much did it cost?'</li>
<li>Close with ‘what should I have asked that I didn't?' and ‘who else should I talk to?'</li>
<li>Write up within 24 hours: key facts, quotes, and implications for each hypothesis.</li>
</ol>
<div class="box key"><div class="bx-h">Triangulate everything that matters</div>A key number should be confirmed from at least two independent directions, for example a market size estimated top-down from population and bottom-up from competitor revenues. When sources disagree, the gap itself is often the insight.</div>
`,checks:[
{q:"You don't yet understand why customers are leaving. The best first research method is:",opts:["A large survey listing all the likely reasons for leaving","Benchmark the churn rate against several direct competitors","Interviews first, then a survey to size the reasons","Analyze every pricing change made over the past year or two"],a:2,why:"Interviews uncover the why. A survey can only measure options you already know to ask about."}
]},
{id:"l4",t:"Operations & organization tools",min:8,html:`
<p class="lead">Cost and performance problems usually live in processes and structures. These tools find where.</p>
<h3>Process and operations</h3>
<ul>
<li><strong>Process mapping</strong>: draw each step, owner, hand-off and wait time. Waiting time usually dwarfs working time.</li>
<li><strong>Lean's seven wastes</strong>: transport, inventory, motion, waiting, overproduction, over-processing and defects.</li>
<li><strong>Bottleneck analysis</strong>: a system's output equals the capacity of its slowest step. Improving anything else adds no throughput.</li>
<li><strong>Benchmarking</strong>: compare cost and performance per unit against peers, internal sites or best practice to size the gap.</li>
</ul>
<h3>Cost tools</h3>
<ul>
<li><strong>Cost baseline</strong>: one agreed view of spend by category, function and driver. Without it, savings can't be proven.</li>
<li><strong>Zero-based budgeting</strong>: rebuild each budget from what is actually needed, instead of last year plus inflation.</li>
<li><strong>Procurement levers</strong>: consolidate suppliers, renegotiate, standardize specifications, manage demand.</li>
</ul>
<h3>Organization tools</h3>
<ul>
<li><strong>Spans and layers</strong>: how many direct reports each manager has and how many levels sit between the CEO and the front line. Narrow spans and many layers slow decisions and add cost.</li>
<li><strong>RACI</strong>: for each decision or activity, who is Responsible, Accountable (one person only), Consulted and Informed.</li>
</ul>
<div class="box key"><div class="bx-h">Fix the constraint first</div>If a loan approval process has a two-day underwriting queue, speeding up document intake changes nothing. Find the bottleneck, fix it, then find the next one.</div>
`,checks:[
{q:"A factory's assembly step can handle 80 units an hour while every other step handles 120. Doubling packaging capacity will:",opts:["Double output to 160 units an hour","Raise output modestly, to about 100 an hour","Add no output, since assembly is the bottleneck","Raise output to 120 units an hour"],a:2,why:"Throughput equals the slowest step's capacity. Only improving assembly raises output."},
{q:"In a RACI, how many people should be Accountable for one decision?",opts:["At least two, for backup","As many as are Responsible","Exactly one","One per team involved"],a:2,why:"Single accountability prevents decisions from falling between people."}
]}
],
exam:[
{q:"To assess whether an industry is structurally attractive, use:",opts:["SWOT analysis","McKinsey 7S","BCG growth-share matrix","Porter's Five Forces"],a:3,why:"Five Forces explains industry profitability."},
{q:"Break-even volume equals:",opts:["Fixed costs ÷ contribution margin per unit","Variable costs ÷ price per unit","Total costs ÷ contribution margin per unit","Fixed costs ÷ price per unit"],a:0,why:"Each unit contributes price minus variable cost toward fixed costs."},
{q:"A positive NPV means:",opts:["The project's internal rate of return is exactly zero","The project pays back its investment within the first year","The project carries no meaningful financial or delivery risk","Value is created after discounting at the cost of capital"],a:3,why:"Discounted future cash flows exceed the investment."},
{q:"A healthy rule of thumb for LTV:CAC is:",opts:["At least 3:1","About 1:3","About 1:1","At least 10:1"],a:0,why:"Below about 3:1, acquisition spend struggles to earn back its cost with margin to spare."},
{q:"System throughput is set by:",opts:["The first step","The slowest step","The fastest step","The average step"],a:1,why:"Improving a non-bottleneck step adds no output."},
{q:"Surveys are best used to:",opts:["Discover reasons you don't yet know","Find expert contacts","Size things you already understand","Replace customer interviews"],a:2,why:"Interviews discover; surveys measure."}
]
});

window.MODULES.push({
id:"m4",n:"4",spine:false,t:"Storylining & Communication",
sub:"How to turn analysis into a recommendation people act on: the storyline, slides that carry one message each, and the stakeholder work that happens outside the meeting.",
lessons:[
{id:"l1",t:"The storyline: SCR & the pyramid",min:7,html:`
<p class="lead">The analysis is not the product. The product is a decision, and the storyline is how you get the client to make it.</p>
<h3>Situation, Complication, Resolution</h3>
<p>Most consulting stories follow <strong>SCR</strong>. The <strong>situation</strong> states context the audience already accepts. The <strong>complication</strong> says what changed or what is at risk. The <strong>resolution</strong> is your answer. Keep the first two short: their only job is to make the resolution feel necessary.</p>
<h3>The pyramid behind the deck</h3>
<ul>
<li><strong>Governing thought</strong>: one sentence that answers the key question.</li>
<li><strong>Key line</strong>: 2 to 4 supporting arguments, each a full sentence, that together prove the governing thought.</li>
<li><strong>Support</strong>: the evidence under each argument, one level down.</li>
</ul>
<p>Two logic checks: <strong>vertical</strong> (each level answers the ‘why?' or ‘how?' raised by the level above) and <strong>horizontal</strong> (the arguments at one level are MECE and in a deliberate order, such as by size, time or sequence).</p>
<h3>The executive summary</h3>
<p>One page that reads as the whole story: the answer first, then the 3 or so reasons with their key numbers, then what you need from the audience. If a reader only sees this page, they should still be able to make the decision.</p>
<div class="box key"><div class="bx-h">The dot-dash test</div>Write the storyline as bullets (dots) with sub-bullets (dashes) before building any slides. If the dots, read alone, don't tell a convincing story, no amount of chart design will save the deck.</div>
`,checks:[
{q:"In SCR, what is the main job of the situation and complication?",opts:["To list every option considered","To set out the project scope","To make the resolution feel necessary","To show how much research the team did"],a:2,why:"They set up the answer. Long situations bury the point; keep them short and agreed."}
]},
{id:"l2",t:"Slides that carry one message",min:7,html:`
<p class="lead">A consulting slide is an argument, not a container. One slide, one message, stated in the title.</p>
<h3>Action titles</h3>
<p>The title is a full sentence stating the so-what, ideally under two lines. ‘Revenue by region' is a label. ‘Two regions drive 80% of the decline, both after the 2025 price change' is an action title. Reading only the titles in order should tell the whole story.</p>
<h3>The body proves the title</h3>
<ul>
<li>Pick the chart that matches the message: a <strong>bar</strong> to compare items, a <strong>line</strong> for change over time, a <strong>waterfall</strong> to explain how one number became another, a <strong>stacked bar</strong> for parts of a whole.</li>
<li>Highlight the data point the title talks about. Grey out the rest.</li>
<li>Label units, source and date. A number without a source will be challenged.</li>
<li>Move detail to the appendix. Main slides carry only what the argument needs.</li>
</ul>
<h3>Spreadsheets clients will reuse</h3>
<p>Separate inputs, calculations and outputs. Never hardcode a number inside a formula. Label every assumption and its source, and add checks (totals that must match) so errors show up.</p>
<div class="box warnbx"><div class="bx-h">The common failure</div>A beautiful chart under a vague title. If the reader has to work out the point themselves, many will reach a different one.</div>
`,checks:[
{q:"Which is the best action title?",opts:["Churn is concentrated in SMB customers on monthly plans","Overview of churn analysis and supporting data","Monthly churn rate by customer segment, 2024 to 2026","Churn has changed across several segments recently"],a:0,why:"It states a specific, checkable so-what. The others are labels or vague."},
{q:"To show how last year's profit became this year's, the best chart is usually:",opts:["A pie chart","A line chart","A waterfall","A scatter plot"],a:2,why:"A waterfall shows each driver's contribution between two totals."}
]},
{id:"l3",t:"Meetings, workshops & stakeholders",min:7,html:`
<p class="lead">Recommendations are adopted or killed in conversations before and after the meeting, not in it.</p>
<h3>Stakeholder mapping</h3>
<p>Plot each stakeholder by <strong>influence</strong> over the decision and current <strong>support</strong>. High influence, low support needs the most time: understand their concerns early and address them in the work. High influence, high support become your sponsors and messengers.</p>
<h3>Pre-wiring</h3>
<p>Walk key people through the findings one-on-one before any group meeting. You learn objections while you can still respond, people feel consulted, and the meeting becomes a confirmation rather than a debate.</p>
<h3>Running a workshop</h3>
<ol>
<li>Set one clear objective and the decision or output you need by the end.</li>
<li>Send a short pre-read so the session is spent deciding, not presenting.</li>
<li>Structure the time: diverge (generate options), then converge (choose with explicit criteria).</li>
<li>Capture decisions, owners and dates live, and send them the same day.</li>
</ol>
<h3>Handling pushback</h3>
<p>Get curious before you get defensive. Ask what the concern is based on, check whether it reveals a gap in your analysis, and separate disagreement on facts (resolve with data) from disagreement on priorities (escalate to the decision owner).</p>
<div class="box key"><div class="bx-h">Write emails answer-first too</div>The first line of any update says the conclusion or the ask. ‘We recommend option B; I need your approval by Thursday.' Then the reasons.</div>
`,checks:[
{q:"A powerful executive is skeptical of your recommendation. Your best move before the steering committee is:",opts:["Bring the strongest data to win the argument in the meeting","Ask your sponsor to overrule them on the day","Leave them off the invite to keep the meeting focused","Meet them privately first and address the concern in the work"],a:3,why:"High influence, low support needs early one-on-one engagement. Their objection may also improve the work."}
]}
],
exam:[
{q:"In the pyramid principle, horizontal logic checks that:",opts:["The executive summary fits on one page without appendices","Each level answers the question raised by the level above","Arguments on one level are MECE and deliberately ordered","Every slide in the main body carries exactly one chart"],a:2,why:"Vertical logic links levels. Horizontal logic checks the arguments on one level."},
{q:"An action title should:",opts:["State the so-what in a full sentence","Pose a question that the slide answers","Use three words or fewer, for scanning","Name the data and the period on the slide"],a:0,why:"Reading titles alone should tell the story."},
{q:"The dot-dash test checks:",opts:["Whether the deck follows the firm's brand template throughout","Whether the bullet storyline persuades before slides exist","Whether every chart is labelled, sourced and dated correctly","Whether the appendix supports each claim made in the main deck"],a:1,why:"If the bullet storyline doesn't persuade, slide design won't fix it."},
{q:"Disagreement on priorities, rather than facts, is best resolved by:",opts:["Average the positions into a compromise","Escalate to the decision owner","Drop the contested recommendation","Run analysis until one side concedes"],a:1,why:"Data settles facts. Trade-offs between priorities belong to the decision owner."},
{q:"In a good spreadsheet model, assumptions should be:",opts:["In labelled input cells with sources","Typed into the formulas that use them","Rounded to whole numbers","On a hidden, locked sheet"],a:0,why:"Separating inputs from calculations makes the model auditable and reusable."}
]
});

window.MODULES.push({
id:"m5",n:"5",spine:false,t:"The Case Types Playbook",
sub:"Structures and key questions for the case types you'll meet in interviews and on real projects: growth, market entry, M&A, pricing, cost reduction and the unusual ones.",
lessons:[
{id:"l1",t:"Growth & profitability",min:8,html:`
<p class="lead">Most business problems reduce to ‘make more money'. These two structures cover a large share of all cases.</p>
<h3>Profitability: why is profit falling?</h3>
<div class="box num">Profit = Revenue − Cost
Revenue = volume × price (by product, channel, region)
Cost = fixed + variable</div>
<p>Compare against last year and against competitors. If revenue is flat, look at cost and mix. If revenue fell, split volume from price. Find the one or two drivers that explain most of the change before suggesting fixes.</p>
<h3>Growth: how do we grow revenue?</h3>
<ul>
<li><strong>Existing customers</strong>: raise frequency, basket size or share of wallet, reduce churn.</li>
<li><strong>New customers</strong> in existing markets: win share, new segments, new channels.</li>
<li><strong>New products</strong> for existing customers: cross-sell, upsell, adjacent offers.</li>
<li><strong>New markets</strong>: geographic expansion (see market entry).</li>
<li><strong>Inorganic</strong>: acquisitions and partnerships.</li>
<li><strong>Price</strong>: often the fastest lever and the most under-used.</li>
</ul>
<h3>Key questions to ask</h3>
<p>What is the target and by when? Is the market growing, and are we gaining or losing share? Which customers are most profitable? What capabilities and budget constraints apply?</p>
<div class="box key"><div class="bx-h">Separate market from share</div>Revenue growth = market growth + share change. A company growing 5% in a market growing 12% is losing ground. Always check which one is moving.</div>
`,checks:[
{q:"A company's revenue grew 4% last year. Before calling that a success, the most important thing to check is:",opts:["Price versus volume growth","Whether costs grew more slowly","How fast the market grew","Whether it hit the CEO's target"],a:2,why:"All are useful, but if the market grew 10%, the company lost share. Market versus share comes first."}
]},
{id:"l2",t:"Market entry & new products",min:8,html:`
<p class="lead">‘Should we enter?' cases are about attractiveness, ability to win, and economics, ending in a clear go or no-go.</p>
<h3>The four-part structure</h3>
<ol>
<li><strong>Market attractiveness</strong>: size, growth, profitability, customer needs, regulation, and industry structure (Five Forces).</li>
<li><strong>Ability to win</strong>: competitors and their positions, our differentiating capabilities, brand, channel access.</li>
<li><strong>Economics</strong>: entry investment, unit economics, time to break-even, NPV under realistic share assumptions.</li>
<li><strong>Entry mode</strong>: build (organic), buy (acquire), or partner (joint venture, licensing). Trade speed and control against cost and risk.</li>
</ol>
<h3>Build, buy or partner</h3>
<div class="tblwrap"><table class="tbl"><tr><th>Mode</th><th>Strength</th><th>Weakness</th></tr>
<tr><td>Build</td><td>Full control, lower upfront cost</td><td>Slow, must build capabilities from scratch</td></tr>
<tr><td>Buy</td><td>Fast, immediate share and capabilities</td><td>Expensive, integration risk</td></tr>
<tr><td>Partner</td><td>Shared risk, local knowledge</td><td>Less control, shared returns, alignment issues</td></tr>
</table></div>
<h3>New product launches</h3>
<p>Same logic, plus cannibalization (how much of the new product's sales come from our existing products) and the launch plan: target segment, positioning, price, channel and a test-and-learn pilot before full rollout.</p>
<div class="box key"><div class="bx-h">End with conditions</div>Don't stop at ‘yes'. Say ‘go, provided we reach 8% share by year three, which needs X; if the pilot shows less than Y, stop.' Conditions turn a recommendation into a decision rule.</div>
`,checks:[
{q:"A client wants to enter a new country quickly and lacks local distribution. Which entry mode usually fits best?",opts:["License the brand","Acquire or partner locally","Export first, expand later","Build organically"],a:1,why:"Speed and missing distribution favor buying or partnering, at the cost of price or control."},
{q:"Cannibalization in a product launch means:",opts:["Unit costs rising as production volume grows","Rivals cutting their prices in response to it","Competitors copying the new product quickly","Sales taken from the company's own products"],a:3,why:"Net new revenue is the launch's revenue minus what it takes from existing products."}
]},
{id:"l3",t:"M&A & due diligence",min:8,html:`
<p class="lead">Acquisition cases ask whether a deal creates value: is the target worth more to us than we pay, after integration costs and risks?</p>
<h3>The structure</h3>
<ol>
<li><strong>Strategic rationale</strong>: why this deal? Growth, new capabilities, scale, market access, or removing a competitor.</li>
<li><strong>Target attractiveness</strong>: its market, position, financial health, and quality of earnings.</li>
<li><strong>Synergies</strong>: <strong>cost synergies</strong> (combined procurement, overlapping functions, sites) are more reliable than <strong>revenue synergies</strong> (cross-selling, new markets), which are often overestimated.</li>
<li><strong>Valuation and price</strong>: standalone value plus realistic synergies, minus integration cost. Compare with the price asked.</li>
<li><strong>Risks and integration</strong>: culture, key people, systems, regulatory approval, customer loss.</li>
</ol>
<h3>Commercial due diligence</h3>
<p>For investors (often private equity) the key question is whether the business plan is achievable. Test market growth, the target's share and its drivers, customer loyalty (interviews, churn data), competitive threats, and whether margins are sustainable.</p>
<h3>Valuation methods to name</h3>
<p><strong>DCF</strong> (discounted cash flow, intrinsic value), <strong>trading comparables</strong> (multiples such as EV/EBITDA of similar listed companies) and <strong>precedent transactions</strong> (multiples paid in similar deals, which include a control premium).</p>
<div class="box warnbx"><div class="bx-h">Why many deals destroy value</div>Overpaying for revenue synergies that never arrive, and underestimating integration. Discount revenue synergies heavily and plan integration before signing.</div>
`,checks:[
{q:"Which synergies should you trust most in a deal model?",opts:["Revenue synergies","Market-entry synergies","Cost synergies","Brand synergies"],a:2,why:"Cost synergies are more within management's control. Revenue synergies depend on customers and are often overestimated."}
]},
{id:"l4",t:"Pricing",min:7,html:`
<p class="lead">Price is usually the biggest profit lever: a 1% price rise often lifts operating profit far more than a 1% volume rise, because it costs nothing to deliver.</p>
<h3>Three ways to set price</h3>
<ul>
<li><strong>Cost-plus</strong>: cost plus a margin. Simple, but ignores what customers will pay.</li>
<li><strong>Competitor-based</strong>: price relative to alternatives. Useful in commoditized markets.</li>
<li><strong>Value-based</strong>: price from the value the customer gets (savings, revenue, avoided risk). Captures the most, but needs customer insight.</li>
</ul>
<p>Cost sets the floor, value sets the ceiling, and competitors tell you where in between you can land.</p>
<h3>Elasticity</h3>
<p>Price elasticity is the percentage change in volume for a 1% change in price. Necessities and differentiated products tend to be inelastic. Commodities with close substitutes are elastic. Test with pilots before full rollout.</p>
<h3>Other tools</h3>
<ul>
<li><strong>Price waterfall</strong>: from list price down through discounts, rebates and terms to the pocket price actually received. Leakage is often large and fixable.</li>
<li><strong>Good, better, best</strong>: tiered offers that let customers self-select.</li>
<li><strong>Bundling</strong> and <strong>dynamic pricing</strong> where demand varies by time or segment.</li>
</ul>
<div class="box key"><div class="bx-h">Quick math</div>With a 10% operating margin, a 1% price rise with no volume loss raises profit by about 10%. That's why the price waterfall is often the first place to look.</div>
`,checks:[
{q:"A company has a 10% operating margin. A 2% price rise with no volume change increases operating profit by roughly:",opts:["2%","20%","12%","10%"],a:1,why:"The extra 2% of revenue is all profit. On a 10% margin base, 2 ÷ 10 = a 20% profit increase."},
{q:"The price waterfall analyzes:",opts:["List price down to the pocket price received","Our prices compared with each competitor's prices","How volume responds to each change in price","How our prices changed over the past several years"],a:0,why:"It traces discounts, rebates and terms that leak value from the list price."}
]},
{id:"l5",t:"Cost reduction & unusual cases",min:8,html:`
<p class="lead">Cost cases reward a clean baseline and prioritized levers. Unusual cases reward adapting your structure to a different objective.</p>
<h3>Cost reduction</h3>
<ol>
<li><strong>Baseline</strong>: total cost by category, function and driver, compared with benchmarks.</li>
<li><strong>Levers</strong>: procurement (what we buy and at what price), operations (process and productivity), organization (spans, layers, location), and demand (stop doing low-value work).</li>
<li><strong>Prioritize</strong>: size each lever against effort and risk, and protect what customers value.</li>
<li><strong>Sustain</strong>: track savings against the baseline and build them into budgets so costs don't creep back.</li>
</ol>
<h3>Cases with a different objective</h3>
<ul>
<li><strong>Public sector and non-profit</strong>: the goal is impact per dollar, not profit. Define the outcome metric first (patients treated, students graduating).</li>
<li><strong>Competitive response</strong>: a rival cut prices or launched a product. Assess the threat's size before reacting, and avoid a price war you can't win.</li>
<li><strong>Digital and AI transformation</strong>: start from business outcomes and use cases, then data readiness, capabilities and change management. Technology is rarely the constraint.</li>
<li><strong>Operations</strong>: capacity, bottlenecks, quality and supply chain. Use process maps and throughput math.</li>
</ul>
<div class="box key"><div class="bx-h">The universal fallback</div>If a case fits no template, go back to first principles: what is the objective, how is it measured, what drives that measure, and which driver can we move most?</div>
`,checks:[
{q:"A rival cut prices by 15%. The best first step is:",opts:["Cut costs by 15% so that margins hold at the new, lower price point","Match the cut at once, before customers start to switch away to them","Size the threat: which customers are at risk and how price-sensitive","Launch a premium tier and move away from the price fight altogether"],a:2,why:"Reacting before sizing the threat risks an expensive price war over customers who may not switch."},
{q:"In a public hospital case, what should you define first?",opts:["The budget for new equipment","The outcome metric, such as patients treated","Cost benchmarks against private hospitals","The hospital's operating profit target"],a:1,why:"Non-profit cases optimize impact, so the objective metric replaces profit at the top of the tree."}
]}
],
exam:[
{q:"Revenue grew 6% while the market grew 11%. The company:",opts:["Lost market share","Gained market share","Held share constant","Can't tell without profit data"],a:0,why:"Growing slower than the market means a falling share."},
{q:"The four parts of a market entry structure are:",opts:["Customers, company, competitors and cost structure","Attractiveness, ability to win, economics, entry mode","Strengths, weaknesses, opportunities and threats","Product, price, place and promotion, then a decision"],a:1,why:"End with a go or no-go and the conditions that would change it."},
{q:"Precedent transaction multiples usually exceed trading multiples because they include:",opts:["Lower interest rates","A control premium","Realized revenue synergies","Future capital expenditure"],a:1,why:"Buyers pay extra for control of the company."},
{q:"Value-based pricing sets price according to:",opts:["Cost plus a target margin","What the sales team can sell easily","The average competitor price","The value customers receive"],a:3,why:"Cost is the floor, value is the ceiling."},
{q:"In cost reduction, savings tend to creep back unless you:",opts:["Track them against the baseline and lock them into budgets","Announce the savings publicly so leaders are held accountable","Repeat the whole cost exercise every quarter from scratch","Cut evenly across every department so it feels fair to all"],a:0,why:"Sustaining savings requires measurement and budget changes."},
{q:"A case fits no standard template. Your fallback is:",opts:["Use the profitability framework anyway, then adapt","Return to the objective, its metric and its drivers","Ask the interviewer which framework they'd like to see","Use SWOT, since it covers every angle of the case"],a:1,why:"First principles always work, and adapting your structure is what interviewers want to see."}
]
});

window.MODULES.push({
id:"m6",n:"6",spine:false,t:"Delivering Change & Client Craft",
sub:"Why good recommendations fail in implementation, how to run a program that lands, and the client-management habits that build trust and repeat work.",
lessons:[
{id:"l1",t:"Why change fails & the change models",min:7,html:`
<p class="lead">A recommendation only creates value when people change what they do. Most failed transformations had sound strategy and weak adoption.</p>
<h3>Why implementation fails</h3>
<ul>
<li>No visible, sustained sponsor at the top.</li>
<li>The ‘why' was never explained to the people who must change.</li>
<li>Too many initiatives at once, with no capacity freed up.</li>
<li>Incentives, systems and processes still reward the old way.</li>
<li>Early wins weren't created or celebrated, so momentum faded.</li>
</ul>
<p>You'll often hear that ‘70% of transformations fail'. Treat that figure as folklore: the evidence behind it is weak. The underlying point, that adoption is the hard part, is well supported.</p>
<h3>Two models worth knowing</h3>
<p><strong>Kotter's eight steps</strong> (organization level): create urgency, build a guiding coalition, form a vision, communicate it, remove obstacles, create short-term wins, build on the change, anchor it in the culture.</p>
<p><strong>ADKAR</strong> (individual level): <strong>Awareness</strong> of the need, <strong>Desire</strong> to take part, <strong>Knowledge</strong> of how, <strong>Ability</strong> to do it, <strong>Reinforcement</strong> to make it stick. Use it to find where a specific group is stuck.</p>
<div class="box key"><div class="bx-h">Design for adoption from day one</div>Involve the people who will use the change in designing it, change incentives and systems alongside the process, and plan visible early wins in the first 90 days.</div>
`,checks:[
{q:"Staff understand why a new process matters and want to use it, but keep making errors with it. In ADKAR, they are stuck at:",opts:["Ability","Reinforcement","Desire","Awareness"],a:0,why:"They know why and want to, and probably know how, but can't yet do it well. That calls for practice and coaching."}
]},
{id:"l2",t:"Running the program",min:7,html:`
<p class="lead">Large changes are delivered as programs: several workstreams, one governance rhythm, and a relentless focus on benefits.</p>
<h3>The structure</h3>
<ul>
<li><strong>Steering committee</strong>: senior sponsors who make decisions and remove blockers.</li>
<li><strong>PMO</strong> (program management office): tracks plans, risks, dependencies and benefits across workstreams.</li>
<li><strong>Workstreams</strong>: each with a client owner, a plan, milestones and KPIs.</li>
</ul>
<h3>The tools</h3>
<ul>
<li><strong>RAID log</strong>: Risks, Assumptions, Issues and Dependencies, reviewed weekly.</li>
<li><strong>RAG status</strong>: red, amber or green per workstream, with honest criteria. An amber that stays amber for months is usually red.</li>
<li><strong>Benefits tracking</strong>: savings or revenue measured against the agreed baseline, signed off by finance.</li>
<li><strong>Stage gates</strong>: go or no-go checkpoints with explicit criteria before each phase.</li>
</ul>
<h3>Leading and lagging indicators</h3>
<p>Lagging indicators (cost, revenue) confirm results months later. Leading indicators (adoption rate, process compliance, pipeline) warn you early. Track both.</p>
<div class="box warnbx"><div class="bx-h">Watermelon reporting</div>Green on the outside, red on the inside. Status reports that never show red teach sponsors to stop trusting them. Escalate early with options, not late with excuses.</div>
`,checks:[
{q:"Which is a leading indicator for a new CRM rollout?",opts:["Customer satisfaction score at the end of the year","Annual revenue growth in the first full year","Total project cost against the approved budget","Share of reps logging deals in the CRM each week"],a:3,why:"Adoption shows early whether results will follow. The others confirm outcomes much later."}
]},
{id:"l3",t:"Client management & trust",min:7,html:`
<p class="lead">Repeat work comes from trust, and trust is built in small, consistent behaviors over the whole engagement.</p>
<h3>The trust equation</h3>
<div class="box num">Trust = (Credibility + Reliability + Intimacy) ÷ Self-orientation</div>
<p>From Maister, Green and Galford's <em>The Trusted Advisor</em>. <strong>Credibility</strong> is whether your words are believable. <strong>Reliability</strong> is whether you do what you say. <strong>Intimacy</strong> is whether the client feels safe sharing concerns. <strong>Self-orientation</strong> (focusing on yourself, your firm or the next sale) divides everything else.</p>
<h3>Managing scope and expectations</h3>
<ul>
<li>Agree what ‘done' looks like at the start and revisit it at each steering committee.</li>
<li>When new requests arrive, say yes to the need and then discuss the trade-off: what moves out, or a change request.</li>
<li>Under-promise on timing, then deliver early. Never surprise the client with a slip.</li>
</ul>
<h3>Difficult conversations</h3>
<p>Deliver bad news early, in person, with the facts and options. ‘The data won't support a 15% saving; here's what will, at 9%, and two ways to close the gap.' Clients forgive bad news. They don't forgive hiding it.</p>
<h3>Professional standards</h3>
<p>Protect confidential information, declare conflicts of interest, and never shade findings to please a sponsor. Your independence is the product.</p>
`,checks:[
{q:"In the trust equation, which factor reduces trust the most when it rises?",opts:["Self-orientation","Intimacy and openness","Credibility with the client","Reliability over time"],a:0,why:"Self-orientation is the denominator, so it divides every other factor."},
{q:"The client asks for an extra analysis outside the agreed scope. The best response is:",opts:["Do it quietly, to keep the relationship as strong as possible","Acknowledge the need, then agree a trade-off or change request","Decline it outright, since it isn't covered in the contract","Do it now, then add the extra cost to the final invoice"],a:1,why:"Saying yes to the need while being explicit about the trade-off protects both the relationship and the project."}
]}
],
exam:[
{q:"ADKAR describes change at the level of:",opts:["The organization","The individual","The steering committee","The industry"],a:1,why:"Kotter's model works at organization level; ADKAR diagnoses where individuals are stuck."},
{q:"The first step in Kotter's model is:",opts:["Communicate the vision","Generate short-term wins","Form a guiding coalition","Create urgency"],a:3,why:"Without urgency, people don't engage with the rest of the process."},
{q:"A RAID log tracks:",opts:["Roles, accountabilities, inputs, deliverables","Risks, assumptions, issues, dependencies","Revenue, assets, investment, debt","Reports, actions, ideas, decisions"],a:1,why:"It's the PMO's weekly view of what could derail the program."},
{q:"‘Watermelon reporting' means:",opts:["Mixed red and green statuses","Green status hiding red reality","Reports sent too late to act on","A colour-coded template"],a:1,why:"It destroys trust in status reports. Escalate early with options."},
{q:"The 70% transformation-failure figure is best treated as:",opts:["Weak evidence, but a valid point","A figure specific to IT projects","A well-established research finding","A target for programs to beat"],a:0,why:"The number is shaky, but adoption really is the hard part."}
]
});
