id:"m3",n:"3",spine:false,t:"Data Foundations & Readiness",
sub:"Why engagements die on data, not models — and the readiness diagnostic you run before promising a client anything.",
lessons:[
{id:"l1",t:"Why AI projects die on data",min:6,html:`
<p class="lead">Every AI ambition is a data project wearing a costume. The consultant who assesses the data before scoping the AI never has to walk back a promise.</p>
<p>Post-mortems of failed AI initiatives converge on the same finding: the dominant causes are not algorithms but <strong>data</strong> — data that doesn't exist, can't be accessed, can't be joined, can't be trusted, or can't legally be used. The discipline is sequencing: <strong>data readiness first, ambition second.</strong></p>
<h3>The modern data estate, in one tour</h3>
<p>Operational systems (ERP, CRM, POS) are where data is born — built for transactions, not analysis. Data is copied into an analytical layer: a <strong>warehouse</strong> (structured, governed — Snowflake, BigQuery), a <strong>lake</strong> (cheap raw storage, prone to becoming a swamp), or the <strong>lakehouse</strong> synthesis. Between them sit <strong>pipelines</strong> (ELT + orchestration) where freshness is won or lost. Ask: where does this data live, how fresh is it, who owns it, can we query it without touching production?</p>
<h3>Quality has six testable dimensions</h3>
<p>Accuracy, completeness, consistency, timeliness, uniqueness, validity — each measurable, so each can be an automated test. The maturing form is the <strong>data contract</strong>: an enforced agreement about schema, semantics, freshness and quality so upstream teams can't silently break downstream models by renaming a column.</p>
<div class="box warnbx"><div class="bx-h">The governance question with teeth</div>Permissioning. A RAG assistant that indexes the whole document store and answers anyone can leak documents to employees who were never entitled to see them. Retrieval must respect source-system permissions <strong>per user</strong> — far easier to design in than to retrofit, and clients almost never think of it until you raise it. Raising it is a credibility moment.</div>
`,checks:[
{q:"A client wants a company-wide assistant over all their documents. Your first data concern:",opts:["The chunk size, because the documents vary so much in length","Permissions: answers must respect each user's access","The embedding model, since it caps retrieval quality overall","A model with a context window long enough for all documents"],a:1,why:"Over-permissioned retrieval is a data-leak-without-an-attacker. Per-user permission enforcement at retrieval must be designed in from day one, not retrofitted."}
]},
{id:"l2",t:"The data-readiness assessment",min:7,html:`
<p class="lead">A short, fixed-fee diagnostic (1–3 weeks) run before, or as phase zero of, any AI engagement. It protects everyone — and it's one of the easiest engagements to sell.</p>
<p>The output is a scored, per-use-case readiness report. For each candidate use case, score five things <strong>red / amber / green</strong>:</p>
<div class="tblwrap"><table class="tbl"><tr><th>Dimension</th><th>The question</th></tr>
<tr><td class="mono">Existence &amp; history</td><td>Captured at all, at the right grain, going back far enough (a churn model wants a couple of business cycles of labelled history)?</td></tr>
<tr><td class="mono">Quality</td><td>Sample and profile the six dimensions — a day of profiling reveals more than a week of meetings.</td></tr>
<tr><td class="mono">Accessibility</td><td>A queryable analytical copy, or locked in an operational system / a vendor silo that exports monthly PDFs?</td></tr>
<tr><td class="mono">Joinability</td><td>One customer ID across systems, or three? Identity resolution is the hidden multi-month project inside many ‘simple' use cases.</td></tr>
<tr><td class="mono">Rights &amp; permissions</td><td>May this data legally be used for this purpose? Personal data? Can per-user access be enforced at retrieval?</td></tr></table></div>
<p>Greens proceed; ambers get scoped remediation; reds get <strong>honest bad news early</strong> — which, delivered well, builds more trust than optimism ever does. And the remediation the report identifies is itself the next engagement.</p>
<div class="box key"><div class="bx-h">Red flags to spot in the room</div>‘The data's all in the warehouse' said with no specifics (verify with a day of profiling); finance and marketing quoting different revenue numbers (no semantic layer); key data in a vendor silo with no API; nobody owns the pipeline; ‘everyone can see everything' document stores.</div>

id:"m4",n:"4",spine:false,t:"Embeddings, Retrieval & Vector Search",
sub:"The mathematical substrate of every search, RAG and recommendation system you will ever scope.",
lessons:[
{id:"l1",t:"Embeddings: meaning as geometry",min:6,html:`
<p class="lead">Once meaning becomes geometry, search becomes arithmetic.</p>
<p>An <strong>embedding</strong> is a fixed-length vector representing content, with one defining property: <strong>semantically similar content lands close together</strong> in the vector space. This is learned via <strong>contrastive training</strong> — shown millions of pairs that belong together (a question and its answer) and pairs that don't, adjusted until belonging-together means being-nearby. Then: embed the query, find the nearest stored vectors, return their content. That one idea underlies semantic search, RAG retrieval, deduplication, clustering, and modern recommenders.</p>
<h3>The decisions that actually matter</h3>
<ul>
<li><strong>Model choice</strong> — a competitive field, but the gap between top models on your corpus is usually smaller than the gap between good and bad chunking. Start with a solid default; spend effort downstream.</li>
<li><strong>Distance metric</strong> — use what the model's docs say; cosine similarity is the near-universal text default. Mismatching metrics silently degrades retrieval — a classic invisible bug.</li>
<li><strong>Multilingual reality</strong> — English-centric embedding models measurably underperform on Arabic, Hindi, and other under-represented languages. For multilingual corpora choose an explicitly multilingual model — and get <strong>cross-lingual retrieval</strong>, where an English query correctly pulls an Arabic document because equivalent meaning maps to nearby vectors.</li>
</ul>
`,checks:[
{q:"A corpus is half Arabic, half English. What changes?",opts:["Nothing changes, since modern embeddings are language-neutral","Use a multilingual embedding model; test on real Arabic queries","Build two separate indexes and route each query by its language","Translate all Arabic documents to English before embedding them"],a:1,why:"English-centric embedders fail silently on Arabic. A multilingual model maps equivalent meaning to nearby vectors regardless of language, so an English query can retrieve Arabic documents."}
]},
{id:"l2",t:"Vector DBs, HNSW, chunking & hybrid search",min:8,ex:[
{type:"fillcode",title:"Reciprocal rank fusion",intro:"Fuse a dense ranking and a BM25 ranking into one hybrid score. Fill the blanks.",code:`def rrf(rankings, k=60):        # rankings = [dense_ids, bm25_ids]
    scores = {}
    for ranking in rankings:
        for rank, doc_id in enumerate(ranking):
            scores[doc_id] = scores.get(doc_id, 0) + 1 / (k + [[1]])
    return sorted(scores, key=scores.get, reverse=[[2]])

hybrid = rrf([dense_results, [[3]]_results])`,blanks:[{a:["rank"],ph:"?"},{a:["true"],ph:"?"},{a:["bm25","lexical","keyword","sparse"],ph:"?"}],why:"RRF rewards documents ranking well in either list, needs no tuning, and lifts recall 10–20% over dense-only. Pure dense retrieval is an anti-pattern; hybrid is the default."}
],html:`
<p class="lead">The commodity layer, the index that makes it fast, the humble decision that sets the quality ceiling, and the fix that's an anti-pattern to skip.</p>
<h3>Vector databases — a commodity layer</h3>
<p>They store vectors with metadata, find the K nearest neighbours fast, and filter by metadata. Options: <strong>pgvector</strong> (right default when Postgres is already in the stack, good to ~10M vectors), <strong>Qdrant</strong> (open-source, strong filtering/hybrid), <strong>Pinecone</strong> (zero-ops, priced accordingly), object-storage-native designs (cheap at huge scale). Pick by operational fit, not benchmark theatre — and don't let the vector-DB debate consume energy the chunking deserves.</p>
<h3>HNSW — the index name that matters</h3>
<p>Approximate nearest neighbour via a layered navigable graph, searched greedily: ~logarithmic search at 95–99% recall, the production default everywhere. Below ~1M vectors, stock HNSW is fine and optimization is procrastination.</p>
<h3>Chunking — the unglamorous decision that sets the ceiling</h3>
<p>Chunks too large blur multiple topics into one mushy vector; too small, they lack context; badly cut, retrieval surfaces garbled fragments. The strong production default: <strong>recursive splitting at ~400–600 tokens with 10–15% overlap</strong>, plus metadata (source, section, date, permissions) on every chunk. <strong>Most ‘bad RAG' is bad chunking</strong> — auditing chunk quality is often the fastest fix you can sell.</p>
<div class="box key"><div class="bx-h">Hybrid search: dense + lexical, fused</div>Dense vectors excel at meaning and fail on exact strings — product codes, names, acronyms, error messages. The keyword algorithm <strong>BM25</strong> nails exactly those. Run both and fuse with <strong>reciprocal rank fusion</strong> → a routine 10–20% recall lift at trivial cost. Pure dense retrieval is an anti-pattern at scale; hybrid is the default.</div>
`,checks:[
{q:"Retrieval whiffs whenever a user searches for a specific product SKU or error code. The fix:",opts:["Shrink chunks so each holds a single product code","Add hybrid search: BM25 plus dense vectors, fused","Move to a faster vector database with better indexing","Switch to a larger, higher-dimension embedding model"],a:1,why:"Dense embeddings capture meaning but miss exact tokens. BM25 handles codes and acronyms; fusing the two lifts recall 10–20% for near-zero cost."},
{q:"How should a consultant choose a vector database?",opts:["By whichever supports the largest embedding dimension available","By operational fit with the client's stack, scale and budget","By picking the fully managed option to avoid any operations work","By the highest score on public recall and latency benchmarks"],a:1,why:"Vector DBs are a commodity. Chunking and evaluation move quality far more than the DB choice does."}
]}
],
exam:[
{q:"An embedding is:",opts:["A hash used to find and remove exact duplicate documents","A learned vector where similar meaning means nearby points","An index structure built to speed up keyword search over documents","A compressed copy of the text, kept for faster storage and lookup"],a:1,why:"It turns search into nearest-neighbour arithmetic and underlies semantic search, RAG, dedup and recommenders."},
{q:"Why hybrid over pure vector search?",opts:["Vector search can't apply metadata filters on its own","Dense vectors miss exact strings that BM25 catches","Hybrid search is cheaper to host than pure vector search","BM25 handles meaning better than dense vectors"],a:1,why:"Pure dense retrieval is an anti-pattern at scale. Hybrid is the default."},
{q:"HNSW is:",opts:["A contrastively trained embedding model for retrieval","A distance metric used for comparing two vectors together","The standard approximate nearest-neighbor graph index","A recursive strategy for splitting documents into chunks"],a:2,why:"It's the production default in essentially every vector database. Below ~1M vectors, stock HNSW is fine."},
{q:"A RAG system returns irrelevant chunks. Where do you look FIRST?",opts:["The temperature: lower it so generated answers stay on topic","The LLM: swap in a larger model with stronger reasoning ability","The vector database vendor: migrate to a faster, newer engine","Retrieval: chunking, hybrid search, filters, measured by recall@K"],a:3,why:"Most ‘bad RAG' lives below the LLM, usually in chunking. Measure recall@K on a labelled query set, then fix in leverage order."},
{q:"The strong production default for chunking is:",opts:["400 to 600 tokens, recursive splits, 10 to 15% overlap, metadata","Whole pages of about 2,000 tokens, with no overlap or metadata","Fixed 100-token chunks with no overlap, for maximum precision","One chunk per document, so that no context is ever split apart"],a:0,why:"Recursive splitting respects natural boundaries; metadata enables filtering and citations. Auditing chunk quality is often the fastest fix to sell."}
]

id:"m5",n:"5",spine:true,t:"RAG Architecture",
sub:"From the naive baseline everyone builds to the production system someone will pay for — the most-sold AI pattern of the decade.",
lessons:[
{id:"l1",t:"Naive RAG & its four honest failures",min:7,html:`
<p class="lead">Eight lines of code, a compelling demo — and a system that falls apart in front of real users for four predictable reasons. Every production technique exists to fix one of them.</p>
<p>Naive RAG: embed the question, fetch the most similar chunks, hand them to an LLM to answer from. It breaks because:</p>
<ol>
<li><strong>Bad queries retrieve bad chunks</strong> — users ask vague, conversational questions whose embeddings sit far from declarative document language.</li>
<li><strong>Similarity is not relevance</strong> — the most embedding-similar chunks often aren't the ones with the answer; unreranked top-K carries 20–40% noise.</li>
<li><strong>Exact-match misses</strong> — dense retrieval whiffs on the table name, the SKU, the error code (the hybrid fix).</li>
<li><strong>Contradictory / irrelevant context</strong> — stuff five chunks in, two relevant, three noise, and the model synthesizes confidently from the noise.</li>
</ol>
<p>Present the architecture this way to a client or interviewer — <strong>not as fashion, but as targeted fixes for named failures.</strong> That framing is itself a credibility signal.</p>
`,checks:[
{q:"A client says ‘we tried RAG, it didn't work.' The best response:",opts:["Get their worst real questions, find the failure, fix in order","Rebuild the whole system with a different vector database vendor","Agree it's overhyped and move the client over to fine-tuning instead","Switch to a bigger model, since retrieval is rarely the real issue"],a:0,why:"‘RAG' isn't one thing; it's a ladder, and most failed attempts stopped on the first rung. Diagnosing the specific failure and measuring the fix is the professional move."}
]},
{id:"l2",t:"The production ladder",min:8,ex:[
{type:"order",title:"The RAG production ladder",intro:"Order the production techniques from the first rung to the last, the way you'd build and measure them.",items:["Hybrid retrieval + RRF fusion — fix exact-match misses","Reranking — cross-encoder over top ~50, keep top 5","Query transformation — rewrite, multi-query, HyDE","Query decomposition for multi-hop questions","Context engineering — order, filter, dedupe, format","Citations & grounding — answer only from chunks, cite per claim"],why:"Build in leverage order, measuring after each rung. Hybrid fixes exact-match; the reranker is usually the biggest single jump; transformation and decomposition fix hard queries; context engineering and citations finish it."}
],html:`
<p class="lead">Build in this order, measuring after each rung, because each solves a specific failure your eval set will expose.</p>
<div class="tblwrap"><table class="tbl"><tr><th>Rung</th><th>Technique</th><th>Fixes</th></tr>
<tr><td class="mono">1</td><td>Hybrid retrieval + RRF fusion</td><td>Exact-match misses</td></tr>
<tr><td class="mono">2</td><td><b>Reranking</b> (cross-encoder over top ~50 → keep top 5)</td><td>Similarity ≠ relevance</td></tr>
<tr><td class="mono">3</td><td>Query transformation (rewrite, multi-query, HyDE)</td><td>Bad queries</td></tr>
<tr><td class="mono">4</td><td>Query decomposition (split multi-hop questions)</td><td>Complex questions</td></tr>
<tr><td class="mono">5</td><td>Context engineering (order, filter, dedupe, format)</td><td>Irrelevant / contradictory context</td></tr>
<tr><td class="mono">6</td><td>Citations & grounding (answer only from chunks, cite per claim)</td><td>Trust &amp; auditability</td></tr></table></div>
<div class="box key"><div class="bx-h">The highest-confidence recommendation in the playbook</div><strong>Add a reranker.</strong> A cross-encoder reads query and candidate together and scores true relevance — too slow to run over millions of docs, so you retrieve ~50 cheaply then rerank to a true top 5. Typically the single biggest quality jump available — commonly <strong>+10–20%</strong> — at trivial cost.</div>
<p><strong>HyDE</strong> (Hypothetical Document Embeddings): a cheap model drafts a plausible answer and you search with <em>that</em> embedding, because answers live near answers in vector space. Great on vague queries; A/B it on your eval set. <strong>Context engineering:</strong> best chunk at the top, filter aggressively (three good chunks beat five mediocre — padding actively hurts), dedupe, and format with numbered delimiters so the model can cite.</p>
`,checks:[
{q:"You can add exactly one thing to a mediocre RAG system. The highest-expected-value move:",opts:["A larger LLM for the final answer-generation step","A reranker over the top 50, keeping the best 5","A higher-dimension embedding model for all documents","More chunks in the context window, from 5 up to 20"],a:1,why:"Unreranked top-K carries 20–40% noise. Reranking is the single biggest quality jump available at trivial cost — the highest-confidence recommendation in the RAG playbook."}
]},
{id:"l3",t:"Evaluating RAG & knowing when it's wrong",min:6,html:`
<p class="lead">You cannot debug what you measure as one blob. RAG failures come from three separable places — retrieval, context assembly, generation.</p>
<p>Measure <strong>retrieval</strong> with <strong>recall@K</strong> against a hand-labelled query set (the single most important number). Measure <strong>generation</strong> with <strong>faithfulness</strong> — does every claim trace to a provided chunk — scored by a calibrated LLM judge. Thirty hand-built questions, half easy, half multi-hop, beat any framework-by-default; add every production failure to the set and the eval flywheel turns.</p>
<h3>Know the alternatives honestly</h3>
<ul>
<li><strong>Long context + caching</strong> — for a small (under ~500k-token), stable corpus, can beat RAG on simplicity.</li>
<li><strong>Fine-tuning</strong> — for tone/format needs, not facts.</li>
<li><strong>Agents</strong> — for taking actions.</li>
</ul>
<p>The senior answer to ‘should we use RAG?' is a <strong>decision tree, not a yes</strong>. And remember the long-context tax: a 200k call is ~10× the cost and latency of a 20k call even when it ‘fits.'</p>
<div class="box key"><div class="bx-h">Why citations are worth paying for</div>They're operational, not cosmetic: users verify answers (trust), you trace every wrong answer to the chunk that caused it (debuggability), you enable automated faithfulness checking (quality), and you produce an audit trail (compliance). An uncited answer is an unaccountable answer — and unaccountable systems don't survive their first executive-visible mistake.</div>
`,checks:[
{q:"Your RAG assistant hallucinates. The correct debugging sequence:",opts:["Swap in a larger model, since hallucination is fundamentally a model issue","Lower the temperature to zero so the model stops inventing details","Add more retrieved chunks so every answer is always fully covered","Measure retrieval recall first; fix generation only if retrieval is fine"],a:3,why:"Separate the layers. Debug retrieval and generation independently, and feed every production failure back into the eval set so the fix is permanent, not anecdotal."}
]},
{id:"l4",t:"RAG vs fine-tuning vs long context: the decision",min:7,ex:[
{type:"order",title:"The adaptation ladder",intro:"Order the levers from the first one you try to the last, the way a senior engineer escalates.",items:["Prompting & few-shot examples","Long context + prompt caching (small, stable corpus)","RAG (large, changing or permissioned knowledge)","Fine-tuning (behaviour, format, tone, cost at scale)","Pretraining / continued pretraining (almost never)"],why:"Climb only as far as the evidence forces you. Each rung costs more to build, to change and to evaluate than the one before."}
],html:`
<p class="lead">One of the most common interview probes: ‘Should we fine-tune or use RAG?' The weak answer picks one. The strong answer separates <em>knowledge</em> from <em>behaviour</em> and walks a decision tree.</p>
<h3>The core distinction</h3>
<p><strong>RAG changes what the model knows at answer time.</strong> It injects facts from your documents into the prompt, so updating knowledge means updating the index, not the model. <strong>Fine-tuning changes how the model behaves.</strong> It adjusts weights so the model reliably follows a format, tone, style or narrow task. It is a poor way to teach facts: they get blurred, can't be cited, go stale the moment a policy changes, and can't be removed per user.</p>
<div class="box key"><div class="bx-h">The one-liner to say in the room</div>RAG for knowledge, fine-tuning for behaviour, prompting first for both. They are not rivals: many production systems use a fine-tuned small model <em>on top of</em> RAG.</div>
<h3>The decision tree</h3>
<div class="tblwrap"><table class="tbl"><tr><th>Situation</th><th>Reach for</th><th>Why</th></tr>
<tr><td>Answers must come from company docs, which change</td><td><b>RAG</b></td><td>Update the index, not the model; citations; per-user permissions at retrieval time</td></tr>
<tr><td>Small (under ~500k tokens), stable corpus</td><td><b>Long context + caching</b></td><td>No retrieval pipeline to build; caching makes repeat calls cheap</td></tr>
<tr><td>Output format or tone keeps drifting despite good prompts</td><td><b>Fine-tuning</b></td><td>Bakes the behaviour into weights; shorter prompts</td></tr>
<tr><td>High-volume narrow task (classify, extract) on an expensive model</td><td><b>Fine-tune a small model</b></td><td>Distil the big model's behaviour into a cheaper, faster one</td></tr>
<tr><td>Domain jargon the retriever and model both miss</td><td><b>Fine-tune the embedding model</b>, or hybrid search</td><td>Fix retrieval quality where the failure actually lives</td></tr></table></div>
<h3>What fine-tuning really costs</h3>
<p>It is not the training run. It is the <strong>labelled data</strong> (hundreds to thousands of high-quality examples), the <strong>eval set</strong> to prove it helped, the <strong>retraining</strong> every time the base model or requirements change, and the <strong>lock-in</strong> to one base model version. RAG's ongoing cost is the pipeline and the index, which you can change daily.</p>
<div class="box key"><div class="bx-h">The senior framing</div>‘I'd start with prompting and an eval set. If the gap is missing or changing knowledge, RAG. If the knowledge is there but the format, tone or cost is wrong, fine-tune. And I'd only claim it worked once the eval set shows it.'</div>
`,checks:[
{q:"A client wants the bot to know their 2,000-page policy library, updated monthly. Best approach:",opts:["Fine-tune the model on the library every month","RAG over the library, re-indexing documents as they change","Paste the entire library into the system prompt","Pretrain a domain model from scratch"],a:1,why:"Changing knowledge belongs in an index. Fine-tuning blurs facts, can't cite them and needs retraining on every change."},
{q:"Your RAG bot retrieves the right chunks but answers in the wrong JSON shape a third of the time, even with clear instructions. The strongest next step:",opts:["Add more documents to the index","Switch to a bigger embedding model","Use structured outputs, then fine-tune for format if it still drifts","Increase top-k so more context is retrieved"],a:2,why:"Retrieval is fine, so this is behaviour, not knowledge. Constrained/structured output first; fine-tuning is the behavioural lever if that's not enough."}
]}
],
exam:[
{q:"Naive RAG's four failure modes are:",opts:["Cost, latency, security and user experience problems at scale","Bad queries, similarity mistaken for relevance, exact-match misses, noise","Chunking, embedding, storage and retrieval speed problems","Hallucination, sycophancy, drift and prompt injection in generation"],a:1,why:"Every production RAG technique is a targeted fix for one of these four named failures — that's the honest way to present the architecture."},
{q:"The single biggest RAG quality win, per the playbook:",opts:["Use a bigger embedding model","Fine-tune the LLM","Add a reranker","Put more context in the prompt"],a:2,why:"Unreranked top-K carries 20–40% noise. ‘Add a reranker' is the highest-confidence recommendation."},
{q:"You evaluate a RAG system by:",opts:["User satisfaction ratings collected after every single answer","One overall accuracy score on a respected public benchmark","Response latency and cost per query, tracked on a dashboard","Retrieval by recall@K, generation by faithfulness, separately"],a:3,why:"You can't debug a blob. Recall@K is the number that matters most; faithfulness checks every claim traces to a chunk."},
{q:"When does long context beat RAG?",opts:["When answers need per-user permissions and a full audit trail","A small, stable corpus where caching keeps repeat calls cheap","Whenever the model's context window is large enough to hold it all","For large document collections that change several times a day"],a:1,why:"‘Should we use RAG?' is a decision tree. And the long-context tax means a 200k call is ~10× a 20k call even when it fits."},
{q:"Why pay for citations?",opts:["They make answers look more authoritative and polished to users","They reduce token costs by keeping generated answers shorter","They improve retrieval recall on later, related user queries","Verification, debugging, faithfulness checks and audit trails"],a:3,why:"An uncited answer is an unaccountable answer, and unaccountable systems don't survive their first executive-visible mistake."},
{q:"HyDE works by:",opts:["Filter documents by metadata first, then run the vector search","Search with the embedding of a drafted hypothetical answer","Rewrite the query into several keyword variants and merge results","Embed the query twice with different models and average the vectors"],a:1,why:"HyDE shines on vague queries that sit far from document language; A/B it on your eval set since it can hurt when queries already match document phrasing."}
]

id:"m6",n:"6",spine:false,t:"Agents & Orchestration",
sub:"Models that act — the loop, the tools, the containment, and the discipline of knowing when a workflow beats an agent.",
lessons:[
{id:"l1",t:"Agent vs workflow, tools & containment",min:8,html:`
<p class="lead">Strip the mystique: an agent is a model in a loop with tools. The single most valuable judgment here — and a favourite interview probe — is knowing when <em>not</em> to build one.</p>
<h3>The definitions</h3>
<p>An <strong>agent</strong> receives a goal, decides an action (call a tool, run a query, browse), observes the result, and repeats until the goal is met or a stop condition fires. A <strong>workflow</strong> is a predefined sequence where <em>code</em> decides the path and LLM calls fill specific slots (classify, extract, draft).</p>
<div class="box key"><div class="bx-h">Workflows are the default; agents are the exception</div>If the path through the task is knowable in advance, hard-coding it is cheaper, faster, more reliable, and infinitely easier to debug. Agents earn autonomy only when the path genuinely can't be predetermined — open-ended research, coding against a live codebase, operating software whose state must be discovered. ‘We built an agent' is not a boast when a five-step workflow would have done the job at a tenth the cost.</div>
<h3>Tool design &amp; loop hygiene</h3>
<p>Agent quality is mostly <strong>tool quality</strong> — the model routes by reading tool names and descriptions, so vague descriptions are routing bugs. Principles: few tools sharply described, typed narrow inputs, idempotent handlers (retries happen), errors written for the model to act on. <strong>MCP</strong> (Model Context Protocol) standardized the integration layer — but every mounted server widens the security surface.</p>
<p>Loop hygiene separates production from demos: explicit <strong>budgets</strong> (max steps, tokens, spend), stop conditions, checkpoints that persist state, and — non-negotiable — <strong>human approval gates on consequential or irreversible actions</strong> (sending messages, moving money, deleting data, committing code). Ask of every tool: <em>what's the worst thing this can do, and who approves it?</em></p>
<h3>Why agents fail on long tasks</h3>
<p>Errors compound: 95% reliability per step is ~60% over ten steps. Mitigations are structural — decompose into shorter verified segments, checkpoint state externally, keep context clean, cap steps/spend. Reliability comes from structure, not from hoping the model focuses harder. Evaluate on <strong>task success rate</strong> over realistic end-to-end tasks, plus cost and steps, and review failure trajectories.</p>
`,checks:[
{q:"A client wants a ‘fully autonomous agent running our operations.' The best response:",opts:["Decline, because agents are simply not ready for operations work yet","Run it fully autonomously, but log every action for later review","Build full autonomy now, since approval gates slow operations too much","Earn autonomy stepwise: human gates first, removed as results prove out"],a:3,why:"Full autonomy on day one is an unbounded system making irreversible mistakes at machine speed. You capture most of the labour savings immediately while approval gates protect during the trust-building phase."},
{q:"Most ‘agent ideas' clients bring you should actually become:",opts:["Single agents with access to every relevant tool","Workflows, since the path is usually known in advance","Multi-agent systems, so each step gets a specialist","Fine-tuned models trained on past operations"],a:1,why:"Workflows are the default; agents earn autonomy only when the path genuinely can't be predetermined. Applying that triage is the core Chapter-7 consulting move."}
]}
],
exam:[
{q:"Agent or workflow — which is the default?",opts:["Multi-agent, because specialists outperform generalists","Agent; it adapts to cases a workflow would miss","Whichever the client's engineers prefer to build","Workflow; agents only when the path can't be predetermined"],a:3,why:"If the path is knowable in advance, hard-coding it wins on every axis. Reserve agents for genuinely open-ended tasks."},
{q:"What makes a good agent tool?",opts:["Sharp description, narrow typed inputs, idempotent, least privilege","Broad permissions, so the agent never gets blocked mid-task","One general-purpose tool that can handle many different actions","A long, detailed description covering every possible edge case"],a:0,why:"The model routes by reading descriptions, so tool quality drives agent quality. Ask of every tool: what's the worst it can do and who approves it?"},
{q:"Why do agents fail on long multi-step tasks?",opts:["Models lose interest after a fixed number of steps","Each step resets the context, so earlier work is lost","Rate limits cut off agents partway through long tasks","Per-step errors compound: 95% a step is about 60% over ten"],a:3,why:"Reliability comes from structure, not from hoping the model tries harder. Containment and narrow scope beat raw model quality as reliability levers."},
{q:"The non-negotiable containment control for consequential actions is:",opts:["A step limit on how many actions the agent can take","Detailed logging of every action for later audit","Human approval on irreversible or external actions","A stronger model for the steps that take actions"],a:2,why:"Autonomy over consequential actions is granted per action class based on demonstrated success rate, never assumed. Treat all tool output as untrusted input, too."}
]
});

id:"m7",n:"7",spine:true,t:"Evaluation & Quality Systems",
sub:"The discipline that turns ‘it seems good' into ‘it scores 87% and here's the trend' — and the product enterprises are actually buying.",
lessons:[
{id:"l1",t:"Why evals are the center of gravity",min:6,html:`
<p class="lead">Every module has ended in the same place: build a labelled set, measure, improve, feed failures back. That's not coincidence — evaluation is the control system of AI engineering.</p>
<p>Without evals you cannot choose a model, tune a prompt, approve a change, or answer the only question executives actually ask: <strong>‘is it good, and is it getting better?'</strong> The eval mindset inverts amateur practice: amateurs build then eyeball; professionals define what good means, encode it as a measurable suite, and let the suite gate every change.</p>
<div class="box key"><div class="bx-h">Evals are what trust costs</div>Enterprises don't buy ‘an AI assistant' — they buy ‘an assistant whose accuracy we can state, monitor, and stand behind in front of a regulator.' The consultant who leads with the eval plan is selling the thing procurement actually needs to say yes. In an SOW, an eval threshold turns ‘is it done' from an argument into a measurement.</div>
`,checks:[
{q:"‘How would you know it works?' — the single most common serious interview question. The winning answer:",opts:["Run the model on well-known public benchmarks and report the scores","Have domain experts review a random sample of outputs before launch","Define good, build a golden set, gate changes on it, grow it from failures","Pilot with real users and track complaints and satisfaction ratings"],a:2,why:"The golden-set + calibrated-judge + flywheel answer is the pass across all three interview tracks. Quality becomes a number with an owner and a trend."}
]},
{id:"l2",t:"Golden sets & LLM-as-judge",min:7,html:`
<p class="lead">The machinery — small and honest beats large and synthetic.</p>
<h3>The golden set</h3>
<p>30–100 labelled examples to start — real inputs, expected outcomes, hand-labelled, deliberately spanning easy cases, hard cases, and known failure modes. Grow it from production failures: <strong>every bad output becomes a permanent regression test</strong> — the eval flywheel.</p>
<h3>Scoring</h3>
<p>Use <strong>exact checks</strong> wherever the output is checkable — schemas validate, SQL executes to a comparable result, extractions match labels, code passes tests. Deterministic scoring is free and unarguable. For open-ended quality (helpfulness, faithfulness, tone), use <strong>LLM-as-judge</strong>: a strong model scores against a written rubric.</p>
<div class="box warnbx"><div class="bx-h">Judge failure modes to manage</div><strong>Position bias</strong> (favours the first answer in pairwise — swap order and average), <strong>verbosity bias</strong> (longer reads as better — instruct against it), <strong>self-preference</strong> (favours its own family's style — consider a cross-provider judge), and <strong>rubric drift</strong> (vague rubrics score vibes — write criteria a human could apply, and calibrate against human labels until the agreement rate earns trust).</div>
<p>Wire the suite into CI so prompt/model changes can't regress silently, keep it small enough to actually run on every change, and spend scarce human attention where it buys the most calibration — labelling the set, auditing the judge, reviewing the low-confidence and high-stakes slice.</p>
`,checks:[
{q:"Exact-match scoring says the model ‘failed' but the answer looks correct. What's wrong?",opts:["The test set is too small to give a meaningful, stable score overall","The reference answers stored in the test set are probably out of date","The model is inconsistent and needs a much lower temperature setting","The metric is too rigid; score at the right level, like running the SQL"],a:3,why:"Metric design is half the eval craft. A bad metric punishes good behaviour and trains you to optimize the wrong thing."}
]}
],
exam:[
{q:"Why are evals the center of gravity?",opts:["They're required by the EU AI Act for every system in production","They're mainly useful for comparing vendors once, at selection time","They replace the need for any human review of the model's outputs","They're the control system for model, prompt and release decisions"],a:3,why:"Amateurs build then eyeball; professionals define good, encode it, and gate every change. Leading with the eval plan is selling the trust procurement needs."},
{q:"A golden set should be:",opts:["The vendor's public benchmark, so results stay comparable","30 to 100 real labelled examples, grown from failures","Thousands of synthetic examples generated by a strong model","Only the hardest edge cases, since easy ones always pass anyway"],a:1,why:"Small and honest beats large and synthetic. Every production failure becomes a permanent regression test."},
{q:"LLM-as-judge biases you must manage include:",opts:["Only position bias, solved by randomizing order","Latency, cost, randomness and temperature sensitivity","Position, verbosity, self-preference and rubric drift","None, as long as the judge is a stronger model"],a:2,why:"Judges work only with their failure modes managed. Swap order and average, instruct against verbosity, consider a cross-provider judge, and write applicable rubrics."},
{q:"In a contract, an eval threshold serves as:",opts:["A penalty clause triggered by any error","An optional extra the client can add later","A marketing claim to include in the proposal","Acceptance criteria that make ‘done' measurable"],a:3,why:"An SOW that says ‘≥85% on a jointly-labelled 100-question set' converts the ambiguous done-or-not into a measurement."}
]
});

id:"m8",n:"8",spine:false,t:"Security, Privacy & Adversarial Robustness",
sub:"Prompt injection and its relatives — the vulnerability class that defines AI security, and the review every serious deployment needs.",
lessons:[
{id:"l1",t:"Prompt injection & the lethal trifecta",min:8,html:`
<p class="lead">The most important security fact about LLM systems: the model cannot reliably distinguish instructions from data.</p>
<p>Anything entering the context — a user message, a retrieved document, a web page, an email, a tool result — is text the model may treat as something to obey. <strong>Direct injection</strong> is a user telling the model to ignore its rules. <strong>Indirect injection</strong> — the dangerous one — is instructions hidden in content the system processes on the user's behalf: a résumé telling the screening bot to rank it first, an email telling the assistant to forward the inbox, a web page telling the browsing agent to exfiltrate what it knows.</p>
<div class="box warnbx"><div class="bx-h">No complete defence exists</div>This is a structural property of instruction-following models, not a bug to patch, and as of 2026 no complete defence exists — saying so plainly is a credibility marker. Anyone selling a guaranteed fix is selling snake oil.</div>
<h3>The lethal trifecta</h3>
<p>Real danger concentrates where a system combines: <strong>(1) access to private data</strong>, <strong>(2) exposure to untrusted content</strong>, and <strong>(3) a channel to communicate outward or take actions</strong>. Remove or human-gate any one leg and the catastrophic scenarios collapse — which is why the defences are architectural, not prompt-level.</p>
<figure class="fig"><svg viewBox="0 0 340 224" style="width:100%;max-width:420px;display:block;margin:0 auto" role="img" aria-label="The lethal trifecta: access to private data, exposure to untrusted content, and an outward channel — all three together enable exfiltration.">
<path d="M170,44 L64,178 L276,178 Z" fill="none" stroke="var(--crit)" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="170" y="118" text-anchor="middle" font-size="11" fill="var(--crit)" font-family="monospace" font-weight="700">DANGER</text>
<text x="170" y="132" text-anchor="middle" font-size="11" fill="var(--crit)" font-family="monospace" font-weight="700">ZONE</text>
<rect x="118" y="22" width="104" height="26" rx="7" fill="var(--surf)" stroke="var(--line2)"/><text x="170" y="39" text-anchor="middle" font-size="9.5" fill="var(--tx)" font-family="monospace">private data</text>
<rect x="6" y="182" width="120" height="26" rx="7" fill="var(--surf)" stroke="var(--line2)"/><text x="66" y="199" text-anchor="middle" font-size="9.5" fill="var(--tx)" font-family="monospace">untrusted content</text>
<rect x="214" y="182" width="120" height="26" rx="7" fill="var(--surf)" stroke="var(--line2)"/><text x="274" y="199" text-anchor="middle" font-size="9.5" fill="var(--tx)" font-family="monospace">outward channel</text>
</svg><figcaption>Strip the data access, quarantine the untrusted reading, or approval-gate the outbound — collapse any one leg and the worst scenarios go with it.</figcaption></figure>
<h3>The defence stack, in order of load-bearing</h3>
<p><strong>Least privilege</strong> (tools grant only what the task needs) → <strong>human approval gates</strong> on consequential actions → <strong>privilege separation</strong> (a trusted agent that never reads untrusted content orchestrates a quarantined one that does) → treat all tool/retrieval output as untrusted → output/action filtering (allow-list what agents may fetch and to whom they may send) → injection classifiers (useful but porous) → logging and red-teaming (adversarial cases live in the eval suite).</p>
<p>Quieter risks: <strong>data leakage</strong> (over-permissioned retrieval — a security control, not a nicety), sensitive data to third-party APIs without contractual cover, jailbreaks (brand/abuse risk), and <strong>supply chain</strong> — every MCP server and plugin is third-party code with data access; vet, pin, and permission it.</p>
`,checks:[
{q:"A client says ‘we told the model to never reveal confidential data, so we're covered.' Your response:",opts:["Add a classifier that blocks confidential words in outputs","Instructions aren't a control; access limits and approval gates are","Agree, as long as the instruction is repeated in each prompt","Encrypt the system prompt so users can't read it"],a:1,why:"Instruction-following can't reliably separate instructions from data, so a polite request isn't security. The lethal trifecta and least-privilege architecture are the real controls."},
{q:"The fastest way to threat-model any AI system is to check for the lethal trifecta:",opts:["Model size, context window length and temperature","Encryption at rest, firewall rules and VPN access","Cost per call, end-to-end latency and answer accuracy","Private data, untrusted content, an outbound channel"],a:3,why:"A system holding all three can be hijacked into exfiltration or harmful action. Collapsing any one leg collapses the worst scenarios."}
]}
],
exam:[
{q:"Prompt injection can't just be patched because:",opts:["Well-written system prompts already block it reliably","It only affects older and smaller language models","Vendors haven't yet prioritized patching the issue","Models can't reliably tell instructions from data"],a:3,why:"Indirect injection hides instructions in content the system processes. No complete defence exists as of 2026 — anyone guaranteeing a fix is selling snake oil."},
{q:"The lethal trifecta is:",opts:["Private data, untrusted content, an outbound channel","Cost, latency and quality across the whole system","Prompt design, model choice and the tools available","Users, data stores and network access permissions"],a:0,why:"Remove or human-gate any one leg and the catastrophic injection scenarios collapse. It's the fastest threat-modeling frame."},
{q:"Data can leak from an AI system with no attacker via:",opts:["Only when the model has been jailbroken by a determined, skilled user","Over-permissioned retrieval, third-party APIs without cover, PII in logs","Only through a successful prompt injection attack from an outside party","It can't happen, because a data leak always requires an active attacker"],a:1,why:"These are governance failures, not exploits, and all three appear in the first hour of a competent review. Enforce per-user permissions at retrieval."},
{q:"An MCP server or agent plugin should be treated as:",opts:["Safe if it is popular and widely downloaded","Low risk, because it only exposes read access","A trusted component, since the protocol is standardized","Third-party code with data access: vet, pin and limit it"],a:3,why:"The 2025–26 incident record already includes compromised and malicious tool servers. ‘It's just a connector' is how the supply chain gets you."}
]
});
</script>

id:"m9",n:"9",spine:false,added:true,t:"Deployment & Production Engineering",
sub:"The gap between the demo and the deployed system — expanded well beyond the source with the serving, CI/CD, reliability, release and on-call practice that ship real AI.",
lessons:[
{id:"l1",t:"The POC-to-production gap",min:6,html:`
<p class="lead">The defining statistic of enterprise AI this decade is the share of pilots that never reach production — anywhere from half to the vast majority. The causes are rarely the model.</p>
<p>They are reliability, integration, cost control, monitoring, security review, and ownership. A demo is a happy path; a production system is the happy path <strong>plus everything else</strong> — provider outages, rate limits, malformed inputs, adversarial users, cost spikes, model deprecations, and the question of who gets paged.</p>
<div class="box key"><div class="bx-h">Commercially, the gap is a gift</div>‘Productionization' is a distinct, scopeable engagement. The consultant who can enumerate the gap credibly in discovery — while a competitor is still demoing — wins the work. The deliverable is a <strong>production-readiness review</strong>: a red/amber/green report against a checklist, plus a remediation backlog. It pairs naturally with the cost audit and the security review as the ‘make it real' package.</div>
<h3>The production checklist, at a glance</h3>
<ul>
<li><strong>Reliability</strong> — retries with backoff, timeouts, fallback chains, rate-limit handling, idempotency</li>
<li><strong>Streaming &amp; UX</strong> — stream tokens (perceived latency is TTFT), honest loading/error/‘can't answer' states</li>
<li><strong>Memory management</strong> — window or summarize long chats, persist state, cache the growing transcript</li>
<li><strong>Observability</strong> — per-request prompt, completion, token counts, latency, cost, model version, trace ID</li>
<li><strong>Cost operations</strong> — budgets and alerts per feature, max-token caps, batch APIs, spend attribution</li>
<li><strong>Change management</strong> — prompts in version control, eval-gated, canaried; model versions pinned</li>
</ul>
`,checks:[
{q:"A client says ‘the pilot works — why do you want another engagement to launch it?' The best answer:",opts:["Agree; the pilot works, so ship it as it is","Rebuild from scratch for production standards","The pilot proves value; production hardening protects it","Wait for the next model generation before launching"],a:2,why:"A pilot is the happy path; production is everything else. The hardening sprint is the difference between an AI feature and an AI incident."}
]},
{id:"l2",t:"Serving & the API-vs-self-host decision",min:8,html:`
<p class="lead">Before you deploy anything, decide where the model runs. The self-hosting decision deserves arithmetic, not ideology. <span class="tag added">expanded</span></p>
<h3>How model serving actually works</h3>
<p>The tricks that set market prices, worth knowing so you can explain why casual self-hosting rarely matches API cost:</p>
<ul>
<li><strong>Continuous (in-flight) batching</strong> — the scheduler admits and retires requests token-by-token, keeping the GPU saturated. This single technique is why API prices collapsed 2023–26. vLLM's PagedAttention made it practical.</li>
<li><strong>Speculative decoding</strong> — a small draft model proposes several tokens; the big model verifies them in one parallel pass. 1.5–3× decode speed-up with identical output distribution.</li>
<li><strong>KV quantization &amp; prefix sharing</strong> — FP8 caches halve memory; shared prefixes are the substrate for prompt caching.</li>
<li><strong>Prefill/decode disaggregation</strong> — large fleets route the two phases to GPU pools tuned for compute vs bandwidth.</li>
</ul>
<p>The open-source serving stack you'll name: <strong>vLLM</strong> and <strong>TGI</strong> (text-generation-inference) for self-hosting, both doing continuous batching.</p>
<div class="box add"><div class="bx-h">The honest TCO of self-hosting</div>Costs = GPU time (an H100-class card ~$2–4/hr cloud-rented, before reservations) + engineering (serving, monitoring, upgrades — a fraction-to-whole engineer) + the hidden killer, <strong>utilization</strong>. APIs achieve high GPU utilization by batching thousands of tenants; a single tenant's spiky traffic often leaves expensive GPUs 80% idle. The rule that survives contact with spreadsheets: <strong>below sustained high-volume usage, APIs win on cost.</strong> The legitimate reasons to self-host are usually not cost but <strong>data residency/sovereignty</strong>, deep customization, or latency locality.</div>
<p>The middle path clients miss: open models served by a hosted provider, or hyperscaler <strong>private endpoints</strong>, capturing much of the sovereignty benefit without the ops burden.</p>
`,checks:[
{q:"A client wants to self-host to save money at moderate volume. The real math:",opts:["API prices include a vendor margin that self-hosting avoids","Self-hosting only costs more for models above 100B parameters","Self-hosting is always cheaper once the GPUs are fully paid off","Utilization: shared APIs keep GPUs busy; your spiky traffic can't"],a:3,why:"Continuous batching gives APIs utilization a single tenant can't match. Name the real reason to self-host (usually residency), size the true cost including people, and consider hosted-open-model or private-endpoint middle paths."}
]},
{id:"l3",t:"Reliability engineering",min:8,ex:[
{type:"fillcode",title:"Retry with exponential backoff + jitter",intro:"Complete the resilient call wrapper. Backoff and jitter prevent a retry storm; the fallback fails fast off a dying provider.",code:`for attempt in range([[1]]):              # bounded retries
    try:
        return call_model(payload)
    except TransientError:
        if attempt == max_retries - 1:
            return fallback_provider(payload)   # fail over
        delay = base * (2 ** [[2]]) + random.uniform(0, jitter)
        time.sleep(delay)`,blanks:[{a:["max_retries","retries","n"],ph:"?"},{a:["attempt"],ph:"?"}],why:"Exponential backoff (2**attempt) spaces retries; jitter desynchronizes clients to avoid a thundering herd; a bounded loop with a fallback means you fail fast instead of hanging every user on the dying primary."}
],html:`
<p class="lead">The layer that turns a customer-facing demo into a system that survives a provider outage at 2am. <span class="tag added">expanded</span></p>
<h3>The reliability primitives</h3>
<ul>
<li><strong>Timeouts on everything</strong> — a call with no timeout is a hung request waiting to cascade.</li>
<li><strong>Retries with exponential backoff + jitter</strong> — on transient errors (429, 5xx, network). Jitter prevents a thundering-herd retry storm.</li>
<li><strong>Idempotency</strong> — so a retry doesn't double-execute an action. Attach an idempotency key to anything that mutates state.</li>
<li><strong>Fallback chains</strong> — primary model → secondary provider → degraded-but-honest response. Single-provider dependence on a customer-facing path is an outage on a countdown.</li>
</ul>
<div class="box add"><div class="bx-h">The circuit breaker — the pattern the source skips</div>When a downstream provider starts failing, retrying harder makes it worse. A <strong>circuit breaker</strong> trips after N consecutive failures: it stops sending traffic to the failing provider for a cool-down window (‘open' state), periodically lets one trial request through (‘half-open'), and closes again only when that succeeds. Combined with a fallback chain, it fails <em>fast</em> to the secondary instead of hanging every user on the dying primary. Pair it with a <strong>bulkhead</strong> (isolated connection pools per dependency) so one slow provider can't exhaust the threads the rest of the app needs.</div>
<h3>Load, rate limits & backpressure</h3>
<p>Provider rate limits are a capacity ceiling you must design around: a <strong>request queue</strong> with backpressure (shed or defer when full), a token-bucket <strong>rate limiter</strong> on your side to stay under the provider's, and <strong>graceful degradation</strong> — when overloaded, serve a cached or simpler response rather than erroring. For non-interactive work, route to <strong>batch APIs</strong> (~50% discounts) and off-peak windows.</p>
`,checks:[
{q:"Your primary model provider starts returning 5xx errors under load. Retrying every request harder will:",opts:["Help, as long as you add longer timeouts","Clear the errors faster by keeping pressure on","Make it worse; trip a circuit breaker to a fallback","Have no effect on users, only on billing"],a:2,why:"Retrying a failing dependency amplifies the failure. The circuit breaker + fallback chain fails fast to the secondary; a bulkhead stops the slow provider from exhausting shared resources."},
{q:"For an action-taking tool (e.g. ‘create invoice'), retries are safe only if the handler is:",opts:["Fast","Stateless","Idempotent","Cached"],a:2,why:"Retries happen. Without idempotency, a network blip that triggers a retry can create two invoices. Idempotent handlers are a day-one reliability requirement."}
]},
{id:"l4",t:"Containers, orchestration & CI/CD for AI",min:9,html:`
<p class="lead">How AI systems actually ship and update — the deployment mechanics the source only gestures at. <span class="tag added">expanded</span></p>
<h3>Packaging &amp; running</h3>
<p>The application (your orchestration, retrieval, prompts, adapters) is packaged in a <strong>container</strong> (Docker) — reproducible, versioned, environment-independent. At scale it runs on an orchestrator (<strong>Kubernetes</strong> or a managed equivalent) that handles scheduling, health checks, rolling restarts, and <strong>autoscaling</strong>. For LLM apps, autoscale on the metrics that matter — concurrent requests and queue depth, not just CPU — because a request can be cheap on CPU while blocked on a slow model call. GPU workloads (self-hosted models) need GPU-aware scheduling and scale more coarsely and slowly, so keep a warm floor of capacity.</p>
<h3>CI/CD — treat prompts and models like code</h3>
<p>The core discipline from the source, made concrete:</p>
<div class="box add"><div class="bx-h">The AI release pipeline</div>1 · <strong>Version control</strong> — prompts, few-shot sets, tool schemas, and model-version pins all live in git.<br>
2 · <strong>CI gate</strong> — on every change, the eval suite (Module 7) runs automatically; a regression below threshold blocks the merge. This is the CI-for-prompts idea made real.<br>
3 · <strong>Build</strong> — container built, tagged with the commit, pushed to a registry.<br>
4 · <strong>Staged rollout</strong> — deploy to staging, run smoke + eval, then canary to a slice of production (next lesson).<br>
5 · <strong>Instant rollback</strong> — because the previous container and prompt version are pinned, a bad release is a one-command revert, not a firefight.</div>
<p><strong>Secrets &amp; config</strong> — API keys in a secrets manager (never in the image or git), config by environment, and network egress locked down so a compromised container can't phone home. <strong>Model-version pinning</strong> is non-negotiable: providers deprecate models on schedules, and an unpinned dependency on a deprecated model is a production outage with a countdown.</p>
`,checks:[
{q:"How should a one-word change to a production prompt ship?",opts:["Version-controlled, eval-gated in CI, canaried, with rollback","Reviewed by a second engineer, then shipped to everyone","Held until the next monthly release window","Edited live, since one word can't cause a regression"],a:0,why:"Prompts edited live are unaudited production changes — a one-word tweak can shift cost 30% or break a downstream parser. The eval-gated pipeline catches that before customers do."},
{q:"For an LLM-heavy service, the best autoscaling signal is usually:",opts:["Memory utilization per container","CPU utilization across all pods","Concurrent requests and queue depth","Disk I/O on the serving nodes"],a:2,why:"LLM calls are I/O-bound waits, not CPU burn. Scaling on CPU alone under-provisions under load. Scale on concurrency/queue depth, and keep a warm floor for slow-scaling GPU pools."}
]},
{id:"l5",t:"Observability & cost operations",min:8,html:`
<p class="lead">You cannot operate what you cannot see — and for AI, ‘see' means per-request cost and quality attribution, not just uptime. <span class="tag added">expanded</span></p>
<h3>The three pillars, LLM-flavoured</h3>
<ul>
<li><strong>Traces</strong> — a trace ID stitching a multi-step flow (retrieve → rerank → generate → tool call) so you can see exactly what the user experienced and where time and tokens went. The LLM-specific tracing stacks: <strong>Langfuse, Phoenix, Braintrust</strong> and peers.</li>
<li><strong>Metrics</strong> — latency percentiles (p50/p95/p99 — <strong>watch p95, not the average</strong>), error rate, tokens in/out/cached, cost per request, cache-hit rate, and <strong>quality metrics from online evals</strong> running on a sample of live traffic.</li>
<li><strong>Logs</strong> — per request: prompt, completion, token counts, model version, and outcome — the raw material for evals, cost ops, and incident response.</li>
</ul>
<div class="box add"><div class="bx-h">FinOps for LLMs</div>Cost is a first-class operational metric, not a monthly surprise. Attribute spend <strong>by feature and by customer</strong> (the trace ID carries it), set <strong>budgets with alerts</strong> per feature, enforce <strong>max-token caps</strong> everywhere, and put the cache-hit rate on a dashboard — it's the cheapest dashboard you'll ever build. The levers from Module 1 (cut output, cache, route by difficulty, batch async) become a standing operational discipline, not a one-off audit.</div>
<h3>Online evals &amp; drift</h3>
<p>The eval suite doesn't stop at CI. Run a lightweight faithfulness/quality judge on a <strong>sample of production traffic</strong> so quality regressions surface on a dashboard, not in an executive's inbox. Watch for <strong>drift</strong> — the world and the inputs move, and a model that worked in January degrades silently by June without monitoring and a re-verification cadence.</p>
`,checks:[
{q:"Which single latency number should you watch for a user-facing AI feature?",opts:["p95 or p99","The average","The median, p50","The minimum"],a:0,why:"Percentiles, not averages, reveal the experience real users get. A great average with an ugly p95 is a system quietly failing a chunk of traffic."},
{q:"The cheapest, highest-value AI observability dashboard is:",opts:["Cache reads versus writes, and cost by feature","Network throughput between all the services","Total requests per day, broken down by region","GPU temperature and utilization over time"],a:0,why:"Per-request token/cost attribution answers ‘why was yesterday expensive' and ‘which prompt version regressed.' Without it you operate blind."}
]},
{id:"l6",t:"Release strategies: canary, blue-green, shadow",min:7,html:`
<p class="lead">How to change a live AI system without betting the whole userbase on it. <span class="tag added">expanded</span></p>
<div class="tblwrap"><table class="tbl"><tr><th>Strategy</th><th>How it works</th><th>Best for</th></tr>
<tr><td class="mono">Canary</td><td>Route a small % of traffic (1→5→25→100) to the new version, watching quality/cost/error metrics at each step; halt and roll back on regression.</td><td>The default for prompt and model changes — bounds blast radius.</td></tr>
<tr><td class="mono">Blue-green</td><td>Stand up the new version ('green') fully alongside the old ('blue'); flip all traffic at once; keep blue warm for instant rollback.</td><td>Infra/version cutovers where you want a clean switch and fast revert.</td></tr>
<tr><td class="mono">Shadow</td><td>Send a copy of live traffic to the new version <em>without serving its output to users</em>; compare against the current version offline.</td><td>De-risking a model swap — measure the new model on real traffic before it ever faces a customer.</td></tr>
<tr><td class="mono">A/B</td><td>Serve two versions to randomized cohorts and compare business/quality outcomes with significance.</td><td>Deciding <em>which</em> change is better, not just whether it's safe.</td></tr></table></div>
<div class="box add"><div class="bx-h">The model-deprecation playbook</div>A provider announces your model retires in 90 days. Because versions were pinned and a thin adapter layer exists, it's a migration, not a crisis: run the eval suite against candidate replacements, compare quality/cost/latency, <strong>shadow-test</strong> the winner on live traffic, <strong>canary</strong> it, watch for prompt-sensitivity differences and re-tune where evals flag regressions, update the pins. The clients who hardcoded one unpinned model with no evals are having a very different quarter — and that's a rescue engagement.</div>
`,checks:[
{q:"You want to swap the underlying model but are nervous about quality regressions. The safest first step:",opts:["Run an A/B test on half of all production traffic","Fine-tune the new model so it matches the old model's outputs","Shadow-deploy it on copied live traffic, compare offline","Deploy it to everyone and watch closely for user complaints"],a:2,why:"Shadow mode measures the new model on real traffic before any customer sees it. Then canary the winner, watch metrics per step, and keep instant rollback ready."},
{q:"The default release strategy for a routine prompt or model change is:",opts:["Canary, stepping traffic up while watching metrics","A/B testing across two equal cohorts","Shadow, running indefinitely beside production","Blue-green, flipping all traffic at once"],a:0,why:"Canary bounds the blast radius of a bad change to a small traffic slice and gives you metric-gated go/no-go at each step."}
]},
{id:"l7",t:"Private endpoints, residency & edge",min:6,html:`
<p class="lead">How enterprises actually consume models in production — and where the data is allowed to live. <span class="tag added">expanded</span></p>
<p>Most enterprises consume frontier models not from provider websites but through hyperscaler platforms — <strong>AWS Bedrock, Google Vertex AI, Azure AI Foundry</strong>. This changes the deployment conversation from ‘which lab' to ‘which cloud, which controls':</p>
<ul>
<li><strong>Private endpoints</strong> — traffic stays inside the customer's cloud tenant, never traversing the public internet.</li>
<li><strong>Regional processing</strong> — in-region inference for data residency (decisive in the Gulf, EU, and regulated sectors).</li>
<li><strong>Existing IAM/SSO and billing rails</strong>, plus procurement's beloved single-vendor paper.</li>
</ul>
<p>A consultant fluent in ‘Claude via Bedrock, in-region, with a private endpoint and a no-training DPA' speaks procurement's language; one who only knows lab APIs sounds like a hobbyist.</p>
<div class="box add"><div class="bx-h">Edge & small-language-model deployment</div>Alongside frontier giants, a tier of <strong>small models</strong> (~1–12B — Phi, Gemma, small Llama/Qwen) runs on laptops and phones. They matter for three deployment reasons: <strong>privacy</strong> (data never leaves the device), <strong>latency and offline operation</strong>, and <strong>cost at extreme volume</strong>. The pattern is <strong>hybrid routing</strong>: on-device or a small self-hosted model for the routine, cloud frontier for the hard — Module 1's tier-by-difficulty routing, extended to the edge. Pair with distillation (a frontier model teaches the small one your narrow task).</p></div>
`,checks:[
{q:"A Gulf government client wants frontier-model quality but their data legally cannot leave the country. The deployment answer:",opts:["Self-host an open model, since that's the only legal option there","Anonymize all the data, then use any global API that's available","In-region hyperscaler platform, private endpoint, no-training terms","Wait for a local frontier model to be released in the country"],a:2,why:"Private endpoints + regional processing capture most of the sovereignty benefit without full self-hosting. Residency is a design input that selects the procurement path, not a compliance surprise in month three."}
]},
{id:"l8",t:"Incident response & the on-call runbook",min:6,ex:[
{type:"order",title:"The incident-response loop",intro:"A silent quality regression just paged you. Put the response in the right order.",items:["Confirm the alert against the SLO — is quality actually below threshold?","Mitigate fast — roll back the last prompt release or flip to the fallback provider","Communicate status to stakeholders","Diagnose root cause once the bleeding has stopped","Write a blameless post-mortem","Add the failure to the eval set so CI blocks it forever"],why:"Mitigate before you diagnose — stop the bleeding first. The durable fix is last: every production failure becomes a permanent regression test, closing the loop back into CI."}
],html:`
<p class="lead">Production means someone gets paged. The maturity of an AI deployment shows in what happens at 2am. <span class="tag added">expanded</span></p>
<h3>What ‘on-call for AI' actually covers</h3>
<p>Beyond ordinary outages, AI systems have their own incident classes: a provider outage or rate-limit storm, a silent quality regression (drift or a bad prompt release), a cost spike (a loop, a cache miss, a verbose new prompt), a safety incident (an injection that reached a tool, a leaked document), and a model deprecation deadline.</p>
<div class="box add"><div class="bx-h">The runbook essentials</div>Each alert needs a <strong>runbook</strong>: what the alert means, how to confirm it, the first mitigation (flip to the fallback provider, roll back the last prompt release, trip the cost circuit-breaker, disable the offending tool), and who to escalate to. Define <strong>SLOs</strong> (e.g. p95 latency, availability, a minimum online-eval quality score) and alert on <em>them</em>, not on raw noise. After every incident, a blameless <strong>post-mortem</strong> — and the fix that matters most: add the failure to the <strong>eval set</strong> so it becomes a permanent regression test. That's the eval flywheel closing the loop from production back into CI.</div>
<h3>The consultant's framing</h3>
<p>You rarely run the client's on-call, but you <strong>design it</strong> — the alerts, the runbooks, the rollback paths, the SLOs — as part of productionization. Discovery questions that expose the gap instantly: <em>‘What happens when your provider has an outage? Who gets paged? What did yesterday cost and which feature spent it? How do you ship a prompt change? What model version are you pinned to?'</em> Blank stares are common — and billable.</p>
`,checks:[
{q:"After a production incident where a bad prompt release degraded answer quality, the most important durable fix is:",opts:["Move to a larger, more robust model","Add the failure to the eval set so CI blocks it in future","Retrain the team on prompt-writing best practice","Add a second human review step before every release"],a:1,why:"The eval flywheel: every production failure becomes a permanent regression test. Combined with a runbook and instant rollback, the same incident can't recur silently."}
]}
],

sub:"The business case that survives finance review, and how enterprises actually buy AI.",
lessons:[
{id:"l1",t:"The business case that survives finance",min:7,html:`
<p class="lead">AI business cases die in finance review for predictable reasons. The anatomy that survives closes faster than an optimistic one — because finance's real question isn't ‘is the number big' but ‘can I trust the person who built this.'</p>
<h3>Why they die</h3>
<p>Benefits stated as points instead of ranges, baselines never measured, costs missing their biggest lines, and benefits no owner will sign for.</p>
<h3>The anatomy that survives</h3>
<ul>
<li><strong>Baseline first</strong> — measure the current process (minutes per ticket, cost per document, days per cycle) before promising to improve it. An unmeasured baseline makes every later claim unfalsifiable.</li>
<li><strong>Benefits as ranges with owners</strong> — conservative/expected/optimistic, each assumption named, and the P&amp;L owner who will bank the benefit <strong>signing</strong> it. A benefit nobody owns is fiction.</li>
<li><strong>Full costs</strong> — build, run (token economics at projected volume, with the multilingual multiplier), integration, <strong>change &amp; enablement</strong> (the line everyone omits and the reason benefits don't land), evaluation and governance overhead, ongoing operations.</li>
<li><strong>Sensitivity, not certainty</strong> — show which assumption moves the answer most (usually adoption or deflection rate, almost never token price) and the break-even on it.</li>
</ul>
<div class="box key"><div class="bx-h">Objection: ‘AI is too expensive for us'</div>Reframe from sticker price to unit economics: the question isn't what a million tokens costs but what a resolved ticket or an analyst-hour saved costs, and whether that beats the alternative. Most ‘too expensive' AI is <strong>un-optimized</strong> AI — no caching, no routing, verbose outputs.</div>
`,checks:[
{q:"A CFO says a vendor's tool ‘pays for itself in six months.' Your view:",opts:["Trust it, since vendors have data from many similar clients already","Rebuild it; vendors omit integration, change, evals and volume pricing","Approve it if one reference customer confirms the six-month claim","Ask the vendor for a larger discount to shorten the payback period"],a:1,why:"Vendors sell the expected case; you fund the conservative one and are pleasantly surprised. The sensitivity table showing what must be true for six months to hold is what closes finance."}
]},
{id:"l2",t:"Build-buy ladder & how enterprises buy",min:7,html:`
<p class="lead">The self-host arithmetic from Module 9 becomes a client-facing ladder — and procurement has its own language you must speak.</p>
<div class="tblwrap"><table class="tbl"><tr><th>Option</th><th>When</th></tr>
<tr><td class="mono">SaaS with AI built in</td><td>Fastest, least differentiated, per-seat pricing</td></tr>
<tr><td class="mono">Buy an AI platform/vendor</td><td>Faster than building — beware per-seat/per-query at scale, audit the lock-in</td></tr>
<tr><td class="mono">Build on frontier APIs</td><td>The default for differentiated workflows</td></tr>
<tr><td class="mono">Open weights (hosted/self-hosted)</td><td>Residency, customization, cost at sustained volume</td></tr></table></div>
<div class="box key"><div class="bx-h">The build-vs-buy tiebreaker</div>Is this capability <strong>differentiating</strong>? Buy commodity (meeting notes, generic copilots); build differentiated (anything encoding your process, data, or customer-experience advantage). Stress-test any usage-priced ‘buy' at <strong>5× projected volume</strong> — per-query pricing that looks cute in pilot becomes the largest line in production. Revisit annually; the buy market improves fast.</div>
<h3>What to negotiate</h3>
<p><strong>Data terms</strong> (DPA, no-training commitments, retention, residency), <strong>model lifecycle</strong> (deprecation notice + migration support — the countdown risk, contractualized), <strong>commitments vs flexibility</strong> (committed-use discounts priced against the freedom to switch as the frontier moves), <strong>SLAs</strong> (uptime, rate limits, incident response), and <strong>exit</strong> (data export, transition assistance). Run a written, criteria-based vendor scorecard — capability on <em>your</em> evals (never the vendor's demo), commercials at projected volume, data terms, roadmap, lock-in — because a documented decision survives a board challenge and a vendor's counter-lobbying.</p>
`,checks:[
{q:"Build vs buy — the tiebreaker question:",opts:["Is the capability differentiating?","Which vendor has the strongest demo?","Which option the CEO prefers","Which option is cheaper today?"],a:0,why:"Speed favours buying commodity; owning the differentiated system compounds. And per-query pricing that looks fine in pilot can become the largest line at production volume."}
]}
],
exam:[
{q:"What kills AI business cases in finance review?",opts:["Benefits that are far too conservative to be credible","Presenting benefits as ranges rather than one number","Point estimates, no baseline, missing costs, no benefit owner","Too much detail in the cost model for finance to follow"],a:2,why:"Fix it structurally: baseline first, benefits as owner-signed ranges, full TCO, and a sensitivity table. Finance funds credibility, not optimism."},
{q:"The build-vs-buy tiebreaker is:",opts:["Which vendor has the strongest reputation","Which option is faster to deploy and scale","Whether the capability is differentiating","Which option is cheaper in the first year"],a:2,why:"Build where the workflow encodes your advantage; buy where the market is racing and the capability is generic."},
{q:"Enterprises typically buy frontier models through:",opts:["Buying GPUs and running every model on-premises","Resellers that bundle models into their SaaS tools","The labs' own consumer subscription plans, per seat","Hyperscaler platforms such as Bedrock, Vertex or Azure"],a:3,why:"The enterprise wrapper is what procurement and security actually buy. ‘In-region, private endpoint, no-training DPA' is the implementable recommendation."},
{q:"In an AI vendor contract, model lifecycle terms matter because:",opts:["They fix the price for every future version of the model you use","They're standard boilerplate, with no real room to negotiate them","Models retire on the vendor's schedule, so you need notice and help","They decide who owns the outputs and any IP the model generates"],a:2,why:"An unpinned dependency on a deprecated model is a production outage with a countdown. Contractualize notice and migration support."}
]
