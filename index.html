id:"m13",n:"13",spine:false,t:"General Case Craft",
sub:"The case-interview fundamentals that transfer to any consulting room — the flow, market sizing, the core business frameworks, mental math, and behavioral fit.",
lessons:[
{id:"l1",t:"The case flow & the mindset",min:7,ex:[
{type:"order",title:"The five-step case flow",intro:"Order the flow you run inside any case interview, first to last.",items:["Clarify — 2–3 sharp questions about objective, metric, timeframe","Structure out loud — a MECE issue tree tailored to this problem","Hypothesize — a falsifiable best guess and the analysis to test it","Analyze — visible arithmetic with stated assumptions","Recommend — answer-first, then reasons, risks, next step"],why:"Structure and communication score more than the exact number. Clarify, structure, hypothesize, analyze, recommend — a container you think inside."}
],html:`
<p class="lead">A case interview isn't a trivia test — it's a simulation of the job. It's scored on structure, communication, and composure far more than on the ‘right' number.</p>
<h3>The five-step flow (use it as a container you think inside)</h3>
<ol>
<li><strong>Clarify</strong> — 2–3 sharp questions before diving in. What's the objective and the metric of success? What's the timeframe? What's already been tried? Playing back the question shows you listen.</li>
<li><strong>Structure out loud</strong> — a MECE issue tree tailored to <em>this</em> problem, not a memorized framework bolted on. Interviewers score the structure before the answer.</li>
<li><strong>Hypothesize</strong> — state a falsifiable best guess and the analysis that would test it. Drive toward the answer instead of wandering.</li>
<li><strong>Analyze (do visible arithmetic)</strong> — state assumptions, round aggressively, narrate the math. Reason about levers, not just numbers.</li>
<li><strong>Recommend, answer-first</strong> — lead with the recommendation, then the reasons, the risks, and the next step.</li>
</ol>
<div class="box key"><div class="bx-h">The behaviors that actually score</div><strong>Structure</strong> (MECE, not a laundry list) · <strong>hypothesis-driven</strong> (a testable guess, updated out loud) · <strong>quantification</strong> (comfortable, visible arithmetic with stated assumptions) · <strong>communication</strong> (answer-first, signposted: ‘three reasons…') · <strong>poise</strong> (calm with ambiguity, coachable when nudged). A candidate who structures beautifully and hedges the deep tech beats one who knows everything and rambles.</div>
<h3>The mindset shift</h3>
<p>Amateurs try to <em>find</em> the answer. Professionals build a structure that <em>guarantees</em> they'll cover the territory, then let evidence steer. Treat the interviewer as a teammate: think out loud so they can follow and nudge you. Silence is your enemy; a visible, revisable structure is your friend.</p>
`,checks:[
{q:"An interviewer hands you a vague prompt: ‘help a hotel chain with AI.' Your first sixty seconds:",opts:["Immediately propose building a chatbot","Clarify (what's the priority — cost, guest experience, revenue? what's the digital estate? what's been tried?), then structure out loud (guest-facing / operations / back office) and name an early hypothesis about where the money is","List every AI use case you know","Ask for more data and wait"],a:1,why:"Sharp clarifying questions, a visible MECE structure, and an early hypothesis — that's the whole game. Technology-first ideation produces solution-in-search-of-problem lists."}
]},
{id:"l2",t:"Market sizing & Fermi estimation",min:7,drill:"marketsize",html:`
<p class="lead">‘How many X in country Y?' The point is never the exact number — it's a defensible chain of stated assumptions and a sanity check. Build the estimate multiplicatively in the drill below.</p>
<h3>The method</h3>
<p><strong>Top-down</strong>: start from a big known number (a population, a GDP, a number of households) and narrow with ratios — segment, adoption, frequency, price. <strong>Bottom-up</strong>: build from units (per-store sales × number of stores). Pick whichever has firmer anchors, and cross-check with the other if you can.</p>
<div class="box"><div class="bx-h">The disciplines that score</div>
<ul style="margin:0">
<li><strong>State every assumption out loud</strong> — the interviewer is grading the chain, not the digits.</li>
<li><strong>Segment where it matters</strong> — don't average a bimodal population; split urban/rural, B2B/B2C, if the ratios differ sharply.</li>
<li><strong>Round aggressively</strong> — use round anchors (population ~30M, ~2.5 people/household) so the arithmetic stays clean and narratable.</li>
<li><strong>End with a sanity check</strong> — a per-capita or per-household reasonableness test. ‘$150M/year is ~$5 per person — plausible for toothbrush heads.'</li>
</ul></div>
<h3>Anchors worth carrying</h3>
<p>A few round numbers make you fast: world ~8B, a large country ~30–70M, a mega-country ~300M–1.4B; ~2.5 people per household; ~4 chars/token (from Module 1 — the same estimation muscle). You don't memorize markets; you reason them from anchors.</p>
`,checks:[
{q:"Midway through a market-sizing question you realize your population assumption was too high. You should:",opts:["Quietly keep going and hope it averages out","Say so out loud, revise the assumption, and continue — updating visibly is exactly the behavior being tested","Restart the whole case","Abandon the estimate"],a:1,why:"The estimate is a chain of assumptions; updating one out loud demonstrates the honest, coachable reasoning interviewers reward. The final number matters far less than the defensible structure."}
]},
{id:"l3",t:"Core frameworks — and the anti-framework warning",min:7,html:`
<p class="lead">Frameworks are scaffolding for <em>your</em> structure, never a substitute for it. Bolting a memorized framework onto a problem it doesn't fit is a classic tell of a weak candidate.</p>
<h3>Profitability — the workhorse</h3>
<p><strong>Profit = Revenue − Cost.</strong> Revenue = volume × price (segment by product, channel, geography). Cost = fixed + variable (COGS, labor, rent, marketing, overhead). When profit falls but revenue is flat, the problem is on the cost side or in margin mix — and you isolate it by walking the tree branch by branch, sizing each driver. This one identity unlocks a huge share of business cases.</p>
<h3>Market entry / new opportunity</h3>
<p>Four questions: <strong>Is the market attractive?</strong> (size, growth, margins) · <strong>Can we win?</strong> (competition, our differentiated capabilities and fit) · <strong>Do the economics work?</strong> (entry cost, unit economics, payback) · <strong>How do we enter?</strong> (build / buy / partner). End with a clear go / no-go and the conditions that would change it.</p>
<h3>The classic lenses (use judiciously)</h3>
<p><strong>3Cs</strong> (Customer, Company, Competition), <strong>4Ps</strong> (Product, Price, Place, Promotion), <strong>Porter's Five Forces</strong> (industry attractiveness), <strong>value chain</strong>. Reach for one only when it genuinely fits — and adapt it to the specific problem rather than reciting it.</p>
<div class="box warnbx"><div class="bx-h">The anti-framework warning</div>A bespoke, MECE structure built for <em>this</em> problem beats any off-the-shelf framework recited from memory. If you find yourself forcing the 4Ps onto a cost-reduction case, stop — that's the moment interviewers mark you down. Structure the actual problem.</div>
`,checks:[
{q:"A coffee chain's profit fell 18% though revenue was flat. The sharpest opening structure:",opts:["Apply the 4Ps marketing framework","Start from Profit = Revenue − Cost: since revenue is flat, the driver is cost or margin mix — build a MECE tree of cost lines (COGS, labor, rent, marketing) and mix, then size each","Analyze the competition first","Recommend raising prices immediately"],a:1,why:"Flat revenue + falling profit points to the cost side or a mix shift. The profitability identity plus a tailored cost tree isolates it — not a bolted-on marketing framework."}
]},
{id:"l4",t:"Mental math & behavioral / STAR",min:6,html:`
<p class="lead">Two skills that quietly decide cases: arithmetic you can do out loud without panic, and stories that show you've done the work.</p>
<h3>Mental math that survives pressure</h3>
<p>Round to clean anchors, work in scientific-ish notation for big numbers (30M × $5 = 3×10⁷ × 5 = 1.5×10⁸ = $150M), handle percentages as fractions (18% ≈ ~1/5), and <strong>narrate as you go</strong> so a slip is caught, not hidden. Estimate first, refine second. Comfort matters more than speed — a calm, structured estimate beats a fast, silent one.</p>
<h3>Behavioral / fit — STAR</h3>
<p>Behavioral questions pattern-match to a small set: a hard problem, a conflict or pushback, a failure and what you learned, influencing without authority, delivering bad news, learning something fast. Prepare <strong>5–6 stories</strong> in <strong>STAR</strong> shape — Situation, Task, Action, <strong>Result (with a measured outcome)</strong> — each mapped to 2–3 prompts and rehearsed to ~90 seconds.</p>
<div class="box key"><div class="bx-h">Pick stories that position you</div>Choose stories that showcase the themes this whole track builds: a right-sizing decision (talking someone out of the expensive option), a measured quality climb, an adoption save, bad news delivered early with options. The stories you tell <em>are</em> the positioning you take. Rehearse them out loud and timed — the discomfort is the training.</div>

]}

window.CASES=[
{id:"prof",cls:"gen",type:"General · Profitability",title:"The coffee chain's shrinking profit",
blurb:"A regional coffee chain's profit fell 18% on flat revenue. Diagnose why and recommend what to do.",
scenario:"<b>GreenCup</b> is a 120-store regional coffee chain. Last year revenue was flat at ~$50M, but operating profit fell 18% — from ~$10M to ~$8.2M. The CEO wants to know what's driving it and what to do. You have the CFO and the head of operations available for questions.",
debrief:"Notice the arc: you led with the profit identity, isolated the driver with arithmetic instead of guessing, and recommended answer-first with a quantified action and a named risk. That structure — not the exact numbers — is what a profitability case rewards.",
steps:[
{t:"Clarify & structure",prompt:"How do you open? Lay out your clarifying questions and your structure for finding the cause.",hint:"Start from an identity, then build a MECE tree. Ask 2–3 sharp questions first.",
model:"Open from <b>Profit = Revenue − Cost</b>. Since revenue is flat but profit fell, the driver is the <b>cost side or a margin-mix shift</b>. Clarifying questions: is this one-off or structural? Uniform across stores or concentrated? Any change in product mix or channel? Then a MECE tree: <b>Revenue</b> (volume × price, by product/channel) and <b>Cost</b> (variable: COGS, hourly labor, packaging; fixed: rent, salaried staff, marketing, overhead).",
rubric:["Stated Profit = Revenue − Cost explicitly","Reasoned that flat revenue + falling profit ⇒ cost side or mix","Built a MECE tree (revenue drivers + fixed vs variable costs)","Asked 2–3 sharp clarifying questions (one-off vs structural, concentration, mix)"]},
{t:"Hypothesize & pull the right data",prompt:"State a falsifiable hypothesis and name exactly what you'd ask the CFO for.",hint:"Prioritize the biggest cost lines and the mix.",
model:"Hypothesis: <b>variable cost per cup rose</b> (bean prices and/or wages) <em>or</em> the mix shifted toward lower-margin items. Ask for: the cost breakdown by line this year vs last, gross margin by product, and any wage or supplier-price changes. Prioritize the largest lines first — for a coffee chain that's COGS and labor, so a few points of movement there dwarfs a big swing in a small line.",
rubric:["Stated a falsifiable hypothesis (cost-per-unit up, or mix shift)","Named the specific data to pull (cost by line, margin by product)","Prioritized the biggest cost lines (COGS, labor) over small ones","Kept mix-shift on the table as an alternative"]},
{t:"Do the arithmetic",prompt:"The CFO says COGS is ~35% of revenue and bean prices rose ~20%; labor held. Size the impact and reconcile it against the profit drop.",hint:"Work in round numbers, out loud.",
model:"COGS ≈ 35% × $50M = <b>$17.5M</b>. A 20% rise on the bean portion of COGS: if beans are ~half of COGS (~$8.75M), a 20% increase adds ≈ <b>$1.75M</b> of cost. That alone explains essentially all of the ~$1.8M profit drop. So the story is <b>input-cost inflation on beans</b>, not a demand or labor problem — which sharpens the recommendation.",
rubric:["Computed COGS in round numbers ($17.5M)","Isolated the bean portion and applied the 20% rise (~$1.75M)","Reconciled it against the ~$1.8M profit drop","Concluded the driver is bean-price inflation, not labor/demand"]},
{t:"Recommend, answer-first",prompt:"Give the CEO your recommendation.",hint:"Answer first, 2–3 grouped actions, a risk, a next step.",
model:"‘<b>Profit fell because bean costs rose ~20% while you held prices — that's ~$1.75M, essentially the whole drop.</b> Three moves: (1) a <b>selective price increase</b> on the most inelastic items (a 3–4% rise on espresso drinks likely recovers most of it); (2) <b>hedge or renegotiate</b> bean supply to cap volatility; (3) <b>nudge the mix</b> toward higher-margin drinks via menu and promo. The risk is price elasticity, so I'd <b>test the increase in a few stores first</b> and read volume before rolling out.'",
rubric:["Led with the answer in one sentence","Gave 2–3 grouped, concrete actions","Quantified the expected recovery","Named the key risk (elasticity) and a de-risking next step (price test)"]}

{id:"size",cls:"gen",type:"General · Market sizing",title:"Size the coffee-cup lid market",
blurb:"Estimate the annual market for disposable coffee-cup lids in a country of 40 million. A pure structure-and-assumptions drill.",
scenario:"A packaging manufacturer is considering entering the <b>disposable coffee-cup lid</b> business in a country of ~40 million people. Estimate the annual market size (units and revenue). There is no ‘right' answer — you're graded on the structure, the assumptions, and the sanity check.",
debrief:"The number is almost irrelevant — what mattered was the multiplicative chain, segmenting coffee-drinkers from the whole population, rounding to clean anchors, and closing with a per-capita reasonableness check. That's the market-sizing muscle. Try the interactive sizer in the General Case Craft module to feel the levers.",
steps:[
{t:"Structure the estimate",prompt:"Lay out your top-down structure before any numbers.",hint:"Population → drinkers → to-go cups → lids → price.",
model:"Top-down: <b>population → share who drink coffee → to-go cups per drinker per day → days per year → % of to-go cups that use a lid → price per lid</b>. Only <b>takeaway</b> cups need disposable lids, so I'll separate to-go from sit-in. I'll also note the buyer is really cafés and chains, so ‘market' = units × wholesale lid price.",
rubric:["Laid out a clear multiplicative chain","Isolated takeaway cups (not all coffee) as the lid-relevant segment","Identified price per lid as the final multiplier","Noted the real buyer is cafés/chains (wholesale price)"]},
{t:"State assumptions & compute",prompt:"Put round numbers on each step and compute units and revenue.",hint:"Round hard; narrate the arithmetic.",
model:"Say ~50% drink coffee = <b>20M drinkers</b>; ~0.5 to-go coffees/drinker/day on average = <b>10M to-go cups/day</b>; × 365 ≈ <b>3.65B to-go cups/year</b>; ~90% use a lid ≈ <b>3.3B lids/year</b>. At a wholesale ~$0.03/lid → ≈ <b>$100M/year</b>. (All figures rounded for clean mental math.)",
rubric:["Put an explicit, reasonable number on every step","Rounded to clean anchors and narrated the arithmetic","Reached a unit figure and a revenue figure","Kept assumptions visible and defensible"]},
{t:"Sanity-check",prompt:"Is your answer plausible? Pressure-test it.",hint:"Per-capita or per-cup reasonableness.",
model:"Sanity check: 3.3B lids ÷ 40M people ≈ <b>~80 lids per person per year</b> — i.e. ~1.5 takeaway coffees a week on average across the whole population, which is reasonable for a coffee-drinking country. Revenue ~$100M on lids alone is plausible for a 40M market. If the interviewer thinks coffee culture is lighter, I'd flex the drinker share or cups/day and the answer scales linearly — which is the point: the structure holds, the inputs flex.",
rubric:["Ran a per-capita (or per-cup) sanity check","Judged the result plausible with reasoning","Named which single assumption most moves the answer","Showed the structure is robust even as inputs flex"]}
]},
{id:"entry",cls:"gen",type:"General · Market entry",title:"Should the grocer enter meal kits?",
blurb:"A European grocery chain is weighing entry into the meal-kit delivery market. Give a structured go/no-go.",
scenario:"<b>FreshMart</b>, a mid-sized European grocery chain (~$4B revenue), is considering launching a <b>meal-kit delivery</b> business. The board wants a structured recommendation: should they, and if so, how? You have market data available on request.",
debrief:"A strong market-entry answer never jumps to yes/no — it walks attractiveness, ability to win, economics, and entry mode, then lands a conditional recommendation. Note how ‘build vs buy vs partner' turned an all-or-nothing question into a de-risked path.",
steps:[
{t:"Structure the decision",prompt:"Lay out the framework you'll use to reach a recommendation.",hint:"Four questions — adapt them to this company.",
model:"Four questions: <b>(1) Is the market attractive?</b> — size, growth, margins, and how crowded/consolidated it is. <b>(2) Can FreshMart win?</b> — its differentiated assets (supplier relationships, fresh sourcing, brand, existing customer base, store network as pickup points) vs incumbents. <b>(3) Do the economics work?</b> — meal-kit unit economics are notoriously thin (high CAC, churn, cold-chain logistics, food waste); what's the payback? <b>(4) How to enter?</b> — build, buy an existing player, or partner/white-label.",
rubric:["Used the four market-entry questions","Tailored ‘can we win' to FreshMart's real assets (sourcing, stores, base)","Flagged meal-kit economics as historically thin (CAC, churn, logistics)","Included entry mode (build/buy/partner) as an explicit question"]},
{t:"Hypothesize & probe",prompt:"State your leaning and the two or three data points that would confirm or kill it.",hint:"Be falsifiable.",
model:"Leaning: <b>cautious yes, but partner/acquire rather than build from scratch</b>, and use stores as a moat. It would be killed if: the market is already saturated with thin margins and no differentiation available; CAC/payback is worse than FreshMart's existing customer economics; or the cold-chain build is prohibitive. I'd pull market growth and incumbent margins, a CAC/LTV benchmark, and the cost of a fulfillment build vs an acquisition.",
rubric:["Stated a falsifiable leaning","Named specific kill criteria","Identified the data that would confirm or refute it","Connected the recommendation to FreshMart's structural advantage (stores/sourcing)"]},
{t:"Recommend with conditions",prompt:"Give the board your answer.",hint:"Go/no-go + how + conditions + risk.",
model:"‘<b>Enter — but by acquiring or partnering with an existing meal-kit player rather than building, and by leaning on your stores as low-cost pickup/fulfillment nodes to beat rivals on last-mile cost.</b> This turns your two real advantages — fresh sourcing and a store network — into a moat pure-play rivals don't have. Conditions: proceed only if a target is available at a sane multiple and pilot CAC/payback beats your current customer economics. Biggest risk is thin unit economics, so I'd run a limited-region pilot before a national rollout.'",
rubric:["Answer-first with a clear go/no-go","Chose an entry mode and justified it (buy/partner, not build)","Turned FreshMart's assets into the competitive angle (stores, sourcing)","Attached conditions and a de-risking pilot before full commitment"]}
]},
{id:"cost",cls:"ai",type:"AI · Cost & diagnostics",title:"The cost blowout",
blurb:"A marketplace's LLM bill went from $8k to $70k/month in a quarter while traffic doubled. Diagnose and fix.",
scenario:"A <b>marketplace app</b> shipped a few LLM features. Over one quarter the provider bill went from <b>$8k to $70k/month</b> — a ~9× jump — while traffic only doubled. Leadership is alarmed and nobody can fully explain it. You're brought in to explain the bill and cut it without degrading quality.",
debrief:"This is the signature Chapter-1 engagement. You instrumented before guessing, worked the levers in order of leverage, quantified, and ended with prevention. The ~9× jump on ~2× traffic is the tell that structure — not volume — is the problem.",
steps:[
{t:"Hypothesize & instrument",prompt:"Traffic doubled but the bill went up ~9×. What's your hypothesis, and what do you measure first?",hint:"The gap between 2× and 9× is structural, not volume.",
model:"A ~9× bill on ~2× traffic means <b>per-request cost roughly quadrupled</b> — that's structural. Hypothesis: <b>untiered routing</b> (everything to the top-tier model) plus <b>no caching</b> plus <b>verbose/uncapped outputs</b>, possibly a new feature with a huge prompt. First: <b>instrument</b> — per-request cost attributed by feature, and the input : output : cached token breakdown. You can't fix what you can't see.",
rubric:["Spotted that per-request cost rose (~4×), so it's structural not volume","Hypothesized the usual culprits (routing, caching, output length)","Called for instrumentation first — per-feature cost, token split","Resisted jumping to a fix before measuring"]},
{t:"Work the levers, with arithmetic",prompt:"You find: everything routes to the frontier model, no caching, and answers average 800 output tokens. Size the levers.",hint:"Output ~5× input; caching ~90% off the stable prefix.",
model:"Levers in order of leverage: <b>(1) Output reduction</b> — output is ~5× input, so trimming 800→300 tokens with caps and structured outputs is a big, direct cut. <b>(2) Caching</b> — if there's a large stable system prompt, caching it saves ~90% of that prefix's cost (pays back after a single reuse). <b>(3) Routing</b> — send the easy majority of queries to a value-tier model at equal quality; often 40–60% off that slice. <b>(4) Context discipline</b> — right-size retrieved context. <b>(5) Batch</b> anything async (~50% off). A competent audit routinely finds 40–70% total.",
rubric:["Ordered levers by leverage (output first, then caching, routing, context, batch)","Quantified at least two levers with the right ratios (5× output, ~90% cache)","Noted routing the easy-query majority to a cheaper tier","Landed a credible total savings range (40–70%)"]},
{t:"Deliver the plan & prevent recurrence",prompt:"How do you package it, and how do you make sure it never surprises them again?",hint:"A CFO should approve it in one reading.",
model:"Deliver a <b>prioritized, costed list</b> — projected monthly savings per line and a one-page executive summary a CFO approves in a single reading. Sequence: cap outputs and add caching (fastest ROI), then the difficulty router, then context and batch. Prevention: <b>budgets and alerts per feature, max-token caps everywhere, and a cost dashboard attributing spend by feature</b> — plus cache-read vs cache-write monitoring to confirm you're actually hitting the cache. Scope the implementation as a separate follow-on so the diagnostic stays small and fast to say yes to.",
rubric:["Prioritized, costed plan with per-line savings + a one-page summary","Sequenced fixes by ROI","Added prevention: budgets, alerts, token caps, a cost dashboard","Scoped implementation as a separate follow-on engagement"]}
]},
{id:"stall",cls:"ai",type:"AI · Strategy & delivery",title:"The stalled program",
blurb:"A bank ran 14 AI pilots in 18 months; zero reached production. The board wants answers.",
scenario:"A <b>retail bank</b> ran <b>14 AI pilots over 18 months</b>. Not one reached production. The board is frustrated and wants to know what's wrong and what to do. You have the CIO, a few product owners, and the pilot list available.",
debrief:"‘Pilot purgatory' is almost never a technology problem — it's operating-model and ownership. You diagnosed with a MECE tree, went for the org-level fix, and gave a 90-day path. That's a strategy answer, not a modeling one.",
steps:[
{t:"Structure the diagnosis",prompt:"Structure why 14 pilots produced zero production systems.",hint:"MECE — and resist blaming the models.",
model:"MECE tree of why pilots don't ship: <b>selection</b> (chosen for enthusiasm, not value × feasibility; no clear owner of the decision they'd drive), <b>delivery</b> (no production-readiness discipline — reliability, integration, evals, security), <b>adoption</b> (no one accountable for behavior change), and <b>governance/process</b> (no stage gates or kill criteria, so pilots neither ship nor die — they accumulate). Note upfront: this is almost certainly <b>operating-model, not technology</b>.",
rubric:["Built a MECE tree (selection / delivery / adoption / process)","Explicitly framed it as an operating-model problem, not a model problem","Named ‘no owner for the decision' as a selection failure","Named missing stage gates / kill criteria"]},
{t:"Confirm the hypothesis",prompt:"You learn: no pilot had success criteria defined upfront, no kill criteria, and funding rewarded starting pilots. What's the diagnosis?",hint:"Where do the incentives point?",
model:"Diagnosis: <b>classic pilot purgatory driven by incentives and missing gates</b>. No upfront success criteria means ‘done' is undefined; no kill criteria means dead ideas linger; funding that rewards <em>starts</em> not <em>finishes</em> guarantees a pile of zombies and no owner accountable for production or adoption. It's not that the models failed — nothing was ever set up to ship.",
rubric:["Named the pattern (pilot purgatory)","Traced it to incentives (funding rewards starts, not finishes)","Connected ‘no success/kill criteria' to why nothing ships or dies","Reaffirmed it's structural, not technical"]},
{t:"Recommend to the board",prompt:"Give the board your recommendation.",hint:"Triage, gates, operating model, a near-term win.",
model:"‘<b>Your pilots don't ship because nothing was set up to ship them — it's an operating-model gap, not a technology one.</b> Three moves: (1) <b>Triage the 14</b> — kill, fix, or ship each against value × feasibility, and be ruthless. (2) <b>Install stage gates with kill criteria and clear owners</b>, and change funding to reward production and adoption, not starts. (3) <b>Stand up a hub-and-spoke operating model</b> — a small central hub owning platform, evals and governance; business-unit spokes owning use cases and adoption. Target: <b>two use cases in production in 90 days</b> to rebuild credibility, then scale.’",
rubric:["Answer-first: it's an operating-model failure","Triage the existing 14 (kill/fix/ship)","Gates + kill criteria + ownership + funding change","Proposed an operating model and a concrete 90-day production target"]}
]},
{id:"ambition",cls:"ai",type:"AI · Scoping & risk",title:"The ambitious ask",
blurb:"A GCC government entity wants an Arabic-first citizen assistant across all services in six months. Shape it.",
scenario:"A <b>Gulf government entity</b> wants an <b>Arabic-first AI assistant</b> covering <b>all citizen services</b>, live in <b>six months</b>. The minister is enthusiastic. Your job is to give an honest, deliverable plan without deflating the ambition or over-promising.",
debrief:"The move was to honor the ambition and then reshape it — regional constraints, the Arabic token/latency reality, a staged scope, and gates. The six-month version that ships beats the six-month version that headlines and then fails in public.",
steps:[
{t:"Honor, then reshape",prompt:"How do you respond to ‘all services, Arabic-first, six months' without saying no and without over-promising?",hint:"Reshape scope while keeping the ambition.",
model:"Honor the ambition, then shape it: <b>‘all services in six months' becomes ‘the top ~20 highest-volume citizen intents in six months, then expand'</b>. Full breadth on day one guarantees a public failure; a focused, excellent launch that visibly improves service builds the mandate to expand. Frame it as sequencing, not scaling back.",
rubric:["Kept the ambition intact while reshaping scope","Proposed a staged scope (top-N intents first, then expand)","Explained why breadth-first risks a public failure","Framed it as sequencing rather than saying no"]},
{t:"Surface the constraints",prompt:"What constraints specific to this context must shape the design?",hint:"Sovereignty, language economics, fairness, failure visibility.",
model:"Four: <b>(1) Data sovereignty/residency</b> — architect via in-region hyperscaler platforms with private endpoints, or open-weight self-hosting where required. <b>(2) Arabic token & latency reality</b> — Arabic runs ~1.5–2.5× the tokens of English, inflating cost and latency; benchmark the real tokenizer and pick the most efficient one, and budget accordingly. <b>(3) Fairness & transparency</b> — decisions about citizens sit in the strictest governance tier; citations mandatory, human handoff on anything consequential. <b>(4) Failure is front-page news</b> — so start low-risk (answers from published regulations, no autonomous decisions).",
rubric:["Sovereignty/residency as a design input (in-region, private endpoint, or open weights)","Arabic token/latency tax and tokenizer benchmarking","Fairness/transparency: citations mandatory, human handoff","Recognized public-failure risk → start low-risk / informational"]},
{t:"Stage the delivery",prompt:"Lay out the six-month plan and how you keep it honest.",hint:"Gates, an Arabic eval set, a friendly pilot.",
model:"‘<b>Ship the top-20 intents in six months — informational, cited, with human handoff — on a residency-compliant architecture, and expand by intent as accuracy earns it.</b> Keep it honest with stage gates: a PoC gated on an <b>Arabic eval set built from day one</b> (real citizen questions), a pilot with a friendly user group whose failures feed the eval set, then production with monitoring. Publish the accuracy number and grow scope against it. That's the six-month version that ships versus the one that headlines and then embarrasses everyone.’",
rubric:["Staged plan: top-N intents, informational + cited + human handoff","Residency-compliant architecture named","Arabic eval set from day one + a friendly pilot","Gates and a published accuracy metric driving expansion"]}
]},
{id:"meridian",cls:"run",type:"Running case · Meridian Group",title:"Meridian Group, end to end",
blurb:"The book's running client: a six-country retail & food-service company. Take them from a vague ask to a defended, sequenced program.",
scenario:"<b>Meridian Group</b> — a mid-market retail and food-service company across six countries, with a legacy warehouse, a nervous CFO, an enthusiastic CMO, and a skeptical CISO. The CMO arrives wanting ‘an AI that predicts what customers will buy,' picturing something large and generative. Take the engagement from here.",
debrief:"You just ran the whole arc: reframed a vague generative wish into right-sized, separately-fundable workstreams; scored readiness honestly; sequenced around the gaps; and shaped a business case that survives finance. Diagnostic → build → the honest bad news → a defended program — that's the operating model of the entire track.",
steps:[
{t:"Discovery: reframe the ask",prompt:"The CMO wants ‘an AI that predicts what customers will buy.' How do you reframe it into real work?",hint:"Triage into distinct problem types.",
model:"Reframe the one vague wish into <b>three correctly-sized workstreams</b>: <b>demand forecasting</b> per store/SKU is a classical gradient-boosted-tree problem (cheap, accurate, explainable to the CFO); <b>product recommendations</b> is a recommender; and the CMO's real recurring question — ‘why did sales drop in three stores' — is a <b>causal</b> question needing an experiment, not a prediction. One hour of triage delivers more value than a month of building the wrong (generative) thing.",
rubric:["Split the vague ask into distinct problem types","Identified forecasting as classical ML (GBDT), not an LLM","Separated recommendation from forecasting","Spotted the causal question hiding inside (needs an experiment)"]},
{t:"Readiness: score the data",prompt:"Before promising anything, how do you assess whether Meridian can actually do this?",hint:"Score per use case; deliver honest bad news early.",
model:"Run a <b>data-readiness assessment</b>, scoring each use case red/amber/green on existence, quality, accessibility, joinability, and rights. Meridian's forecasting scores <b>green</b> on history (5 years of POS) but <b>amber</b> on joinability (promotions live in a marketing spreadsheet with no store-week keys); the CMO's personalization dream scores <b>red</b> (the loyalty program only launched 8 months ago — the behavioral history isn't there yet). Deliver the reds and ambers as honest, early bad news with a re-sequenced plan.",
rubric:["Ran a per-use-case readiness assessment (5 dimensions, R/A/G)","Found forecasting viable but flagged the promotions-join gap","Flagged personalization as not-yet-feasible (no loyalty history)","Committed to delivering honest bad news early with a re-sequence"]},
{t:"Sequence & make the business case",prompt:"Lay out the program sequence and the shape of the business case that gets it funded.",hint:"Now / next / later, gated — and a case that survives finance.",
model:"Sequence: <b>now</b> — demand forecasting (green data) and document automation; <b>next</b> — conversational analytics, gated on building a semantic layer; <b>later</b> — personalization, gated on a year of loyalty history. Business case that survives the CFO: <b>measured baseline</b> (e.g. minutes per invoice × volume), <b>owner-signed benefit ranges</b>, <b>full TCO</b> including change management, and a <b>sensitivity table</b> showing adoption rate — not token price — drives the outcome. Route procurement through an in-region cloud platform with a no-training DPA, which turns the CISO from blocker into sponsor.",
rubric:["Sequenced now / next / later with explicit gates","Gated conversational analytics on a semantic layer","Business case: measured baseline + owner-signed ranges + full TCO + sensitivity","Addressed the CISO via residency-compliant procurement (in-region, no-training DPA)"]}
]}
];

function caseDone(id){return !!(S.cases[id]&&S.cases[id].done);}
function casesTotal(){return (window.CASES||[]).length;}
function casesDoneN(){return (window.CASES||[]).filter(c=>caseDone(c.id)).length;}

function viewLab(v){
  setCrumb("Case Lab");
  const groups=[
    ["gen","General consulting cases","Classic case-interview scenarios — the reasoning transfers to any strategy or client room."],
    ["ai","AI-specific cases","The rooms you'll actually be tested in — cost, delivery, and the ambitious ask."],
    ["run","The running engagement","Meridian Group, end to end — from a vague ask to a defended program."]
  ];
  let secs='';
  groups.forEach(g=>{
    const items=(window.CASES||[]).filter(c=>c.cls===g[0]);
    if(!items.length)return;
    let cards='';
    items.forEach(c=>{
      const dn=caseDone(c.id);
      cards+='<button class="modcard '+(dn?'dn':'')+'" onclick="go(\'case/'+c.id+'\')">'+
        '<div class="top"><span class="num">'+(dn?svg(IC.check,2.5):svg(IC.target,2))+'</span>'+
        '<h3 style="flex:1">'+c.title+'</h3><span class="casetype '+c.cls+'">'+c.type.split(" · ")[0]+'</span></div>'+

<script>
/* ============ CHARTS ============ */
function activitySpark(){
  const days=14;const base=new Date(new Date().toISOString().slice(0,10)+"T00:00:00");
  const arr=[];for(let k=days-1;k>=0;k--){const dd=new Date(base);dd.setDate(dd.getDate()-k);const key=dd.toISOString().slice(0,10);arr.push({key,v:(S.activity&&S.activity[key])||0});}
  const max=Math.max(1,...arr.map(a=>a.v));const total=arr.reduce((s,a)=>s+a.v,0);
  const W=100,H=40,gap=1.6,bw=(W-gap*(days-1))/days;
  let bars='';arr.forEach((a,i)=>{const h=a.v?Math.max(2.5,a.v/max*H):1.2;const x=i*(bw+gap);const y=H-h;const cur=i===days-1;
    bars+='<rect x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+bw.toFixed(2)+'" height="'+h.toFixed(2)+'" rx="1" fill="'+(a.v?"var(--acc)":"var(--line)")+'" opacity="'+(a.v?(cur?1:0.82):1)+'"><title>'+a.key+" · "+a.v+" XP</title></rect>";});
  return '<div class="chartcard"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="eyebrow">XP earned · last 14 days</span><span class="mono" style="font-size:13px;font-weight:700;color:var(--acc)">'+total+'</span></div>'+

  return '<div class="chartcard"><div class="eyebrow" style="margin-bottom:10px">Mastery by module</div>'+rows+'</div>';

/* ============ EXERCISE ENGINES ============ */
window.__EX=window.__EX||{};
function _norm(s){return (s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[;]+$/,"");}
function exFillcodeHTML(x,key){
  window.__EX[key]=x;
  let esc=x.code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  esc=esc.replace(/\[\[(\d+)\]\]/g,function(_,n){const b=x.blanks[+n-1];const sz=Math.max(4,(b.a[0]||"").length+1);return '<input class="blankin" data-ex="'+key+'" data-n="'+(+n-1)+'" size="'+sz+'" placeholder="'+(b.ph||"?")+'" aria-label="blank '+n+'" autocapitalize="off" autocorrect="off" spellcheck="false">';});
  return '<div class="exbox"><div class="ex-h">'+svg(IC.play,2)+' Code completion · '+x.title+'</div>'+
    (x.intro?'<div class="ex-i">'+x.intro+'</div>':'')+
    '<pre class="codeex">'+esc+'</pre>'+
    '<div class="row" style="margin-top:11px"><button class="btn sm pri" onclick="checkFill(\''+key+'\')">Check</button><button class="btn sm ghost" onclick="revealFill(\''+key+'\')">Reveal</button><span class="exmsg" id="msg_'+key+'"></span></div>'+
    '<div class="why" data-why="'+key+'"><b>Why:</b> '+x.why+'</div></div>';
}
function checkFill(key){
  const x=window.__EX[key];let all=true;
  document.querySelectorAll('[data-ex="'+key+'"]').forEach(inp=>{const n=+inp.dataset.n;const acc=x.blanks[n].a.map(_norm);const ok=acc.indexOf(_norm(inp.value))>-1;inp.classList.remove("ok","bad");inp.classList.add(ok?"ok":"bad");if(!ok)all=false;});
  const msg=document.getElementById("msg_"+key);
  if(all){msg.className="exmsg ok";msg.textContent="All correct ✓";document.querySelector('[data-why="'+key+'"]').classList.add("show");if(!S.drills[key]){S.drills[key]=1;save();touchStreak();addXP(12,"Exercise solved");}}
  else{msg.className="exmsg bad";msg.textContent="Some blanks are off — adjust or reveal";}
}
function revealFill(key){
  const x=window.__EX[key];
  document.querySelectorAll('[data-ex="'+key+'"]').forEach(inp=>{const n=+inp.dataset.n;inp.value=x.blanks[n].a[0];inp.classList.remove("bad");inp.classList.add("ok");});
  document.querySelector('[data-why="'+key+'"]').classList.add("show");const msg=document.getElementById("msg_"+key);msg.className="exmsg";msg.textContent="";
}
function exOrderHTML(x,key){
  window.__EX[key]=x;
  const idx=x.items.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t;}
  // guard against accidental already-sorted shuffle
  if(idx.every((v,i)=>v===i)&&idx.length>1){idx.push(idx.shift());}
  let lis='';idx.forEach(oi=>{lis+='<li class="ordli" data-idx="'+oi+'"><span class="ord-move"><button class="ord-btn" onclick="orderMove(this,-1)" aria-label="Move up">▲</button><button class="ord-btn" onclick="orderMove(this,1)" aria-label="Move down">▼</button></span><span class="ord-num"></span><span>'+x.items[oi]+'</span></li>';});
  return '<div class="exbox"><div class="ex-h">'+svg(IC.play,2)+' Put it in order · '+x.title+'</div>'+
    (x.intro?'<div class="ex-i">'+x.intro+'</div>':'')+
    '<ul class="orderlist" id="ord_'+key+'">'+lis+'</ul>'+
    '<div class="row" style="margin-top:11px"><button class="btn sm pri" onclick="checkOrder(\''+key+'\')">Check order</button><span class="exmsg" id="msg_'+key+'"></span></div>'+
    '<div class="why" data-why="'+key+'"><b>Why:</b> '+x.why+'</div></div>';
}
function orderMove(btn,dir){
  const li=btn.closest("li");const list=li.parentNode;
  if(dir<0){const prev=li.previousElementSibling;if(prev)list.insertBefore(li,prev);}
  else{const next=li.nextElementSibling;if(next)list.insertBefore(next,li);}
}
function checkOrder(key){
  const list=document.getElementById("ord_"+key);const lis=list.querySelectorAll("li");let ok=true;
  lis.forEach((li,pos)=>{const good=(+li.dataset.idx===pos);li.classList.remove("ok","bad");li.classList.add(good?"ok":"bad");if(!good)ok=false;});
  const msg=document.getElementById("msg_"+key);
  if(ok){msg.className="exmsg ok";msg.textContent="Correct order ✓";document.querySelector('[data-why="'+key+'"]').classList.add("show");if(!S.drills[key]){S.drills[key]=1;save();touchStreak();addXP(12,"Exercise solved");}}
  else{msg.className="exmsg bad";msg.textContent="Not quite — reorder and check again";}
}
</script>

<script>

const KEY="aict_v1";

function today(){return new Date().toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}

function touchStreak(){
  const t=today();
  if(!S.started)S.started=t;
  if(S.last===t){save();return}
  if(S.last){const d=daysBetween(S.last,t);S.streak=(d===1)?S.streak+1:1;}else{S.streak=1;}
  S.last=t;save();
}

/* =================== QUIZ ENGINE =================== */
function quizHTML(c,id,label){
  let opts='';
  c.opts.forEach((o,i)=>{opts+='<button class="opt" data-i="'+i+'" data-a="'+c.a+'" data-q="'+id+'"><span class="mk">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>';});
  return '<div class="quiz" data-quiz="'+id+'"><div class="qh"><span class="qi">'+(label||"Question")+'</span></div>'+
    '<div class="qq">'+c.q+'</div>'+opts+'<div class="why" data-why="'+id+'"><b>Why:</b> '+c.why+'</div></div>';
}
function bindQuizzes(){
  document.querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click",function(){
      const q=this.dataset.q;const wrap=document.querySelector('[data-quiz="'+q+'"]');
      if(wrap.dataset.answered)return;wrap.dataset.answered="1";
      const a=+this.dataset.a;const chosen=+this.dataset.i;
      wrap.querySelectorAll(".opt").forEach(o=>{
        o.classList.add("locked");const oi=+o.dataset.i;
        if(oi===a)o.classList.add("correct");
        else if(oi===chosen)o.classList.add("wrong");
        else o.classList.add("muted");
      });
      const why=wrap.querySelector(".why");why.classList.add("show");
      if(chosen!==a)why.classList.add("bad");
      if(!S.seen[q]){S.seen[q]=1;save();if(chosen===a)addXP(6,"Correct");}
    });
  });
}

/* =================== DRILL ENGINE =================== */
function drillHTML(key){
  const d=DRILLS[key];if(!d)return"";
  let f='';d.fields.forEach(x=>{f+='<div class="field"><label>'+x.label+'</label><input type="number" step="any" id="'+key+'_'+x.id+'" value="'+x.def+'"></div>';});
  return '<div class="drill" id="drill_'+key+'"><h4>'+svg(IC.play,2)+' '+d.title+'</h4><div class="di">'+d.desc+'</div>'+
    '<div class="fields">'+f+'</div>'+
    '<div class="dout" id="'+key+'_out"></div>'+
    (d.guess?'<div class="dguess"><div class="field" style="max-width:180px"><label>'+d.guess.label+'</label><input type="number" step="any" id="'+key+'_guess" placeholder="your estimate"></div><button class="btn sm" onclick="checkGuess(\''+key+'\')">Check my estimate</button><span class="verdict" id="'+key+'_verdict"></span></div><div style="font-size:12px;color:var(--tx3);margin-top:8px">'+d.tip+'</div>':'')+'</div>';
}
function bindDrill(key){const d=DRILLS[key];d.fields.forEach(x=>{document.getElementById(key+'_'+x.id).addEventListener("input",()=>runDrill(key));});runDrill(key);}
function val(key,id){return parseFloat(document.getElementById(key+'_'+id).value)||0;}
function runDrill(key){DRILLS[key].compute(key);}
function checkGuess(key){
  const d=DRILLS[key];const g=parseFloat(document.getElementById(key+'_guess').value);
  const truth=d.answer(key);const v=document.getElementById(key+'_verdict');
  if(isNaN(g)){v.className="verdict no";v.textContent="Enter a number";return}
  const err=Math.abs(g-truth)/Math.abs(truth);
  if(err<=0.2){v.className="verdict ok";v.textContent="Within range ✓ (actual "+d.fmt(truth)+")";if(!S.drills[key]){S.drills[key]=1;save();addXP(12,"Drill solved");}}
  else{v.className="verdict no";v.textContent="Off — actual is "+d.fmt(truth);}
}

function viewExam(v,mid){
  const isFinal=mid==="final";
  const m=isFinal?null:modById(mid);
  const qs=isFinal?FINAL:(m?m.exam:null);
  if(!qs){go("dashboard");return}
  const title=isFinal?"The Interview Gauntlet":m.t+" — Exam";
  setCrumb((isFinal?'<b onclick="go(\'final\')" style="cursor:pointer">Gauntlet</b>':'<b onclick="go(\'module/'+mid+'\')" style="cursor:pointer">'+m.t+'</b>')+' / Exam');
  let state={i:0,answers:[],qs:shuffle(qs.slice())};
  const startT=Date.now();
  if(window.__examTimer)clearInterval(window.__examTimer);
  window.__examTimer=setInterval(function(){const el=document.getElementById("examClock");if(el){const s=Math.floor((Date.now()-startT)/1000);el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}},1000);
  renderExamQ();
  function renderExamQ(){
    delete v.dataset.locked;
    const q=state.qs[state.i];
    let opts='';q.opts.forEach((o,i)=>{opts+='<button class="opt" onclick="window.__pick('+i+')" data-i="'+i+'"><span class="mk">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>';});
    v.innerHTML='<div class="page-in read">'+
      '<div class="row" style="justify-content:space-between;align-items:center"><div class="eyebrow">'+title+'</div><span class="mono" id="examClock" style="font-size:12px;color:var(--tx3)" title="Elapsed time">00:00</span></div>'+
      '<div class="row" style="justify-content:space-between;margin:6px 0 4px"><span class="mono" style="font-size:12px;color:var(--tx3)">Question '+(state.i+1)+' / '+state.qs.length+'</span><span class="mono" style="font-size:12px;color:var(--acc)">'+Math.round(state.i/state.qs.length*100)+'%</span></div>'+
      '<div class="bar" style="margin-bottom:22px"><i style="width:'+(state.i/state.qs.length*100)+'%"></i></div>'+
      '<div class="qq" style="font-size:18px;font-weight:700;margin-bottom:18px">'+q.q+'</div>'+opts+
      '<div class="why" data-examwhy><b>Why:</b> '+q.why+'</div>'+
      '<div class="row" style="justify-content:space-between;margin-top:16px"><span class="keyhint hide-sm">Keys <span class="kbd">1</span>–<span class="kbd">'+q.opts.length+'</span> or <span class="kbd">A</span>–<span class="kbd">'+String.fromCharCode(64+q.opts.length)+'</span> · <span class="kbd">Enter</span> next</span><button class="btn pri" id="examNext" style="display:none" onclick="window.__next()">'+(state.i===state.qs.length-1?'See results':'Next question')+' '+svg(IC.arrow,2)+'</button></div>'+
    '</div>';
  }
  window.__pick=function(i){
    const q=state.qs[state.i];const wrap=v;if(wrap.dataset.locked)return;wrap.dataset.locked="1";
    v.querySelectorAll(".opt").forEach(o=>{o.classList.add("locked");const oi=+o.dataset.i;
      if(oi===q.a)o.classList.add("correct");else if(oi===i)o.classList.add("wrong");else o.classList.add("muted");});
    state.answers.push(i===q.a);
    const w=v.querySelector("[data-examwhy]");w.classList.add("show");if(i!==q.a)w.classList.add("bad");
    document.getElementById("examNext").style.display="inline-flex";
  };
  window.__next=function(){
    delete v.dataset.locked;
    if(state.i<state.qs.length-1){state.i++;renderExamQ();window.scrollTo(0,0);}
    else finishExam();
  };
  function finishExam(){
    if(window.__examTimer){clearInterval(window.__examTimer);window.__examTimer=null;}
    const elapsed=Math.floor((Date.now()-startT)/1000);
    const elapStr=String(Math.floor(elapsed/60)).padStart(2,"0")+":"+String(elapsed%60).padStart(2,"0");
    const correct=state.answers.filter(Boolean).length;
    const pct=Math.round(correct/state.qs.length*100);const passed=pct>=75;
    const prev=S.exams[mid]||{best:0};
    const best=Math.max(prev.best||0,pct);
    const firstPass=passed&&!examPassed(mid);
    S.exams[mid]={best,passed:passed||(prev.passed),lastPct:pct,ts:Date.now()};save();touchStreak();
    if(firstPass)addXP(isFinal?120:60,"Exam passed!");
    else if(pct>(prev.lastPct||0))addXP(10,"Improved score");
    v.innerHTML='<div class="page-in result-hero">'+
      '<div class="eyebrow" style="color:'+(passed?'var(--good)':'var(--crit)')+'">'+(passed?'Passed':'Not yet — 75% to pass')+'</div>'+
      '<div class="score" style="color:'+(passed?'var(--good)':'var(--crit)')+'">'+pct+'%</div>'+
      '<div class="mono" style="color:var(--tx2);margin-bottom:6px">'+correct+' of '+state.qs.length+' correct · '+elapStr+' · best '+best+'%</div>'+
      '<div class="pill '+(passed?'pass':'fail')+'" style="margin-bottom:22px">'+(passed?svg(IC.check,2.5)+' unit cleared':'keep going')+'</div>'+
      '<p class="sub" style="margin:0 auto 22px">'+(passed?(isFinal?'You can hold the room. Re-drill anything that slipped and keep the flashcards warm.':'Locked in. The reasoning is yours now — the flashcards will keep it retrievable.'):'Review the explanations, re-read the weak lesson, and retake. Mastery is the retake, not the first try.')+'</p>'+
      '<div class="row" style="justify-content:center">'+
        '<button class="btn" onclick="go(\''+(isFinal?'final':'module/'+mid)+'\')">Back</button>'+
        '<button class="btn pri" onclick="retryExam(\''+mid+'\')">Retake</button>'+
        (passed&&!isFinal?'<button class="btn gold" onclick="go(\'dashboard\')">Continue →</button>':'')+
      '</div></div>';
    window.scrollTo(0,0);
    bindQuizzes();
  }
}

/* =================== MISC UI =================== */
let toastT;
function toast(msg,xp){const el=document.getElementById("toast");el.innerHTML=(msg)+(xp?' <span class="xpv">+'+xp+' XP</span>':'');el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2100);}
function resetAll(){if(confirm("Reset all progress, XP, streaks and flashcard scheduling? This cannot be undone.")){localStorage.removeItem(KEY);S=load();renderChrome();go("dashboard");route();toast("Progress reset");}}

/* modal + backup/restore */
function openModal(html){const m=document.getElementById("modal");m.querySelector(".sheet").innerHTML=html;m.classList.add("on");}
function closeModal(){document.getElementById("modal").classList.remove("on");}
function openBackup(){
  const cur=JSON.stringify(S);
  openModal('<h3>Backup &amp; restore</h3>'+
    '<p style="font-size:13px;color:var(--tx2);margin:6px 0 16px">Your progress lives in this browser only. Copy the text below and keep it somewhere safe — or paste a saved backup to restore it (here or on another device).</p>'+
    '<label class="eyebrow" style="display:block;margin-bottom:5px">Your progress · copy this</label>'+
    '<textarea class="ta" id="bkOut" readonly onclick="this.select()" style="min-height:84px;font-family:var(--mono);font-size:11px">'+cur+'</textarea>'+
    '<div class="row" style="margin:9px 0 20px"><button class="btn sm" onclick="copyBackup()">'+svg(IC.check,2)+' Copy</button><span class="mono" style="font-size:11px;color:var(--tx3)">'+overall().done+' units · '+S.xp+' XP · '+casesDoneN()+' cases</span></div>'+
    '<label class="eyebrow" style="display:block;margin-bottom:5px">Restore from a backup · paste, then restore</label>'+
    '<textarea class="ta" id="bkIn" placeholder="Paste a previously copied backup here..." style="min-height:66px;font-family:var(--mono);font-size:11px"></textarea>'+
    '<div class="row" style="justify-content:space-between;margin-top:16px"><button class="btn ghost sm" onclick="closeModal()">Close</button><button class="btn pri" onclick="restoreBackup()">Restore progress</button></div>');
}
function copyBackup(){const t=document.getElementById("bkOut");t.select();try{document.execCommand("copy");toast("Copied to clipboard");}catch(e){toast("Select the text and copy manually");}}
function restoreBackup(){
  const raw=(document.getElementById("bkIn").value||"").trim();
  if(!raw){toast("Paste a backup first");return;}
  try{const obj=JSON.parse(raw);if(!obj||typeof obj!=="object"||!("xp" in obj))throw 0;
    S=Object.assign({},DEF,obj);save();closeModal();renderChrome();go("dashboard");route();toast("Progress restored");}
  catch(e){toast("That doesn't look like a valid backup");}
}

/* theme */
function initTheme(){const t=localStorage.getItem("aict_theme");if(t)document.documentElement.setAttribute("data-theme",t);syncThemeIco();}
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme");const isDark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;const nx=isDark?"light":"dark";document.documentElement.setAttribute("data-theme",nx);localStorage.setItem("aict_theme",nx);syncThemeIco();}
function syncThemeIco(){const cur=document.documentElement.getAttribute("data-theme");const isDark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;document.getElementById("themeIco").innerHTML=isDark?'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>':'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>';}

/* rail (mobile) */
function openRail(){document.getElementById("rail").classList.add("open");document.getElementById("scrim").classList.add("on");}
function closeRail(){document.getElementById("rail").classList.remove("open");document.getElementById("scrim").classList.remove("on");}

/* =================== BOOT =================== */
document.getElementById("themeBtn").addEventListener("click",toggleTheme);
document.getElementById("burger").addEventListener("click",openRail);
document.getElementById("scrim").addEventListener("click",closeRail);
document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});

/* keyboard controls: exams (1-4 / A-D / Enter) and flashcards (Space / 1 / 2) */
document.addEventListener("keydown",function(e){
  if(document.getElementById("modal").classList.contains("on")){if(e.key==="Escape")closeModal();return;}
  if(e.target&&(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT"))return;
  const h=location.hash;
  if(h.indexOf("exam")>-1){
    let idx=-1;
    if(e.key>="1"&&e.key<="9")idx=+e.key-1;
    else{const c=e.key.toLowerCase();if(c.length===1&&c>="a"&&c<="j")idx=c.charCodeAt(0)-97;}
    if(idx>=0){const opts=document.querySelectorAll("#view .opt");if(opts[idx]){opts[idx].click();e.preventDefault();}return;}
    if(e.key==="Enter"){const n=document.getElementById("examNext");if(n&&n.style.display!=="none"){n.click();e.preventDefault();}}
  } else if(h.indexOf("cards")>-1){
    const fc=document.getElementById("fc");if(!fc)return;
    if(e.key===" "||e.key==="Enter"){fc.click();e.preventDefault();}
    else if(fc.classList.contains("flip")&&window.__grade){
      if(e.key==="1"||e.key==="ArrowLeft"){window.__grade(false);e.preventDefault();}
      else if(e.key==="2"||e.key==="ArrowRight"){window.__grade(true);e.preventDefault();}
    }
  }
});

/* reading-progress bar on lessons and cases */
window.addEventListener("scroll",function(){
  const el=document.getElementById("readbar");if(!el)return;
  const h=location.hash;const on=(h.indexOf("lesson")>-1||h.indexOf("case")>-1);
  if(!on){if(el.style.opacity!=="0")el.style.opacity=0;return;}
  const max=document.documentElement.scrollHeight-window.innerHeight;
  const p=max>40?Math.min(100,window.scrollY/max*100):0;
  el.style.opacity=1;el.querySelector("i").style.width=p+"%";
},{passive:true});

initTheme();renderChrome();route();
</script>
