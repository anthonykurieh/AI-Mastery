<title>AI Consultant Track — Interactive</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#0f1518; --ink2:#151d21; --ink3:#1c262b;
  --paper:#f3f6f4; --paper2:#ffffff; --paper3:#e9eeec;
  --bg:var(--paper); --surf:var(--paper2); --surf2:var(--paper3);
  --line:#d3ddd9; --line2:#c2cec9;
  --tx:#12201d; --tx2:#41544e; --tx3:#6c807a;
  --acc:#0c9a8a; --acc2:#0a8578; --accdim:#7fcdc4; --accwash:#dcf0ed;
  --gold:#c98a1e; --goldwash:#f6ecd6;
  --good:#1f9d63; --warn:#c58318; --crit:#d94b4b;
  --goodwash:#dcf0e5; --critwash:#f6dede;
  --shadow:0 1px 2px rgba(16,40,36,.06),0 8px 24px -12px rgba(16,40,36,.14);
  --shadow2:0 2px 4px rgba(16,40,36,.05),0 18px 44px -20px rgba(16,40,36,.22);
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px; --r2:10px; --r3:7px;
  --rail:270px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1316; --surf:#111a1e; --surf2:#16211f;
    --line:#25322f; --line2:#31413d;
    --tx:#e7efec; --tx2:#a7b9b3; --tx3:#72857f;
    --acc:#25c2ae; --acc2:#1fae9c; --accdim:#2f5a55; --accwash:#123029;
    --gold:#e0b054; --goldwash:#2b2313;
    --good:#3cc37f; --warn:#e0a94e; --crit:#ef6b6b;
    --goodwash:#12291f; --critwash:#2c1717;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    --shadow2:0 2px 6px rgba(0,0,0,.35),0 22px 50px -22px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1316; --surf:#111a1e; --surf2:#16211f;
  --line:#25322f; --line2:#31413d;
  --tx:#e7efec; --tx2:#a7b9b3; --tx3:#72857f;
  --acc:#25c2ae; --acc2:#1fae9c; --accdim:#2f5a55; --accwash:#123029;
  --gold:#e0b054; --goldwash:#2b2313;
  --good:#3cc37f; --warn:#e0a94e; --crit:#ef6b6b;
  --goodwash:#12291f; --critwash:#2c1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow2:0 2px 6px rgba(0,0,0,.35),0 22px 50px -22px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#f3f6f4; --surf:#ffffff; --surf2:#e9eeec;
  --line:#d3ddd9; --line2:#c2cec9;
  --tx:#12201d; --tx2:#41544e; --tx3:#6c807a;
  --acc:#0c9a8a; --acc2:#0a8578; --accdim:#7fcdc4; --accwash:#dcf0ed;
  --gold:#c98a1e; --goldwash:#f6ecd6;
  --good:#1f9d63; --warn:#c58318; --crit:#d94b4b;
  --goodwash:#dcf0e5; --critwash:#f6dede;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;font-size:16px}
h1,h2,h3,h4{line-height:1.2;text-wrap:balance;margin:0}
a{color:var(--acc);text-decoration:none}
button{font-family:inherit}
::selection{background:var(--accwash);color:var(--tx)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600}

/* ============ SHELL ============ */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surf);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40}
.rail::-webkit-scrollbar{width:8px}.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--acc),var(--acc2));
  display:grid;place-items:center;flex:none;box-shadow:0 3px 10px -3px var(--acc)}
.brand .mark svg{width:19px;height:19px}
.brand b{font-size:14.5px;letter-spacing:-.01em;display:block;line-height:1.15}
.brand span{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase}
.railprog{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.navwrap{padding:10px 10px 26px;flex:1}
.navsec{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3);
  padding:14px 10px 6px;font-weight:600}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  padding:8px 10px;border-radius:9px;color:var(--tx2);font-size:13.5px;transition:background .12s,color .12s;position:relative}
.navitem:hover{background:var(--surf2);color:var(--tx)}
.navitem.on{background:var(--accwash);color:var(--acc2);font-weight:600}
.navitem .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:11px;font-weight:700;background:var(--surf2);color:var(--tx2)}
.navitem.on .ico{background:var(--acc);color:#fff}
.navitem .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navitem .pct{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.navitem.done .ico::after{content:"";position:absolute}
.navdone{color:var(--good)!important}

/* ============ TOPBAR ============ */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 26px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.burger{display:none}
.crumb{font-family:var(--mono);font-size:11.5px;color:var(--tx3);letter-spacing:.03em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--tx2)}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;font-weight:600;
  padding:5px 10px;border-radius:20px;background:var(--surf);border:1px solid var(--line);color:var(--tx2)}
.stat svg{width:14px;height:14px}
.stat.xp{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 32%,var(--line))}
.stat.streak{color:var(--warn)}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surf);cursor:pointer;
  display:grid;place-items:center;color:var(--tx2);transition:.12s}
.iconbtn:hover{color:var(--tx);border-color:var(--line2)}
.iconbtn svg{width:16px;height:16px}

/* ============ CONTENT ============ */
.content{padding:34px 26px 90px;max-width:1080px;width:100%;margin:0 auto;flex:1}
.read{max-width:70ch}
.page-in{animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* headings + prose */
.h-hero{font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;font-weight:800;margin-bottom:8px}
.sub{color:var(--tx2);font-size:16px;max-width:64ch}
.lead{font-size:17px;color:var(--tx2)}
.prose h3{font-size:19px;font-weight:750;margin:30px 0 8px;letter-spacing:-.01em}
.prose h4{font-size:14px;font-weight:700;margin:22px 0 6px;color:var(--acc2);
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 16px;padding-left:20px}
.prose li{margin:5px 0}
.prose strong{color:var(--tx);font-weight:700}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--surf2);padding:1.5px 5px;border-radius:5px;
  border:1px solid var(--line)}
.prose em{color:var(--tx);font-style:italic}
.kd{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* callouts */
.box{border:1px solid var(--line);border-radius:var(--r2);padding:15px 17px;margin:18px 0;background:var(--surf)}
.box .bx-h{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  margin-bottom:7px;display:flex;align-items:center;gap:7px}
.box.key{background:var(--accwash);border-color:color-mix(in srgb,var(--acc) 26%,var(--line))}
.box.key .bx-h{color:var(--acc2)}
.box.warnbx{background:var(--critwash);border-color:color-mix(in srgb,var(--crit) 30%,var(--line))}
.box.warnbx .bx-h{color:var(--crit)}
.box.add{background:var(--goldwash);border-color:color-mix(in srgb,var(--gold) 34%,var(--line))}
.box.add .bx-h{color:var(--gold)}
.box.num{background:var(--surf2);font-family:var(--mono);font-size:13.5px;line-height:1.75;white-space:pre-wrap;
  overflow-x:auto}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid transparent}
.tag.added{background:var(--goldwash);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 34%,transparent)}
.tag.spine{background:var(--accwash);color:var(--acc2)}

/* data table */
.tbl{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.5px;overflow:hidden;border-radius:10px;
  border:1px solid var(--line)}
.tblwrap{overflow-x:auto;margin:16px 0}
.tbl th{background:var(--surf2);text-align:left;padding:9px 12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--tx2);border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .mono{font-size:12.5px}

/* ============ CARDS / GRIDS ============ */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;position:relative}
.tile .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.tile .big{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .foot{font-size:12px;color:var(--tx3);margin-top:3px}
.tile.accent .big{color:var(--acc)}
.tile.gold .big{color:var(--gold)}

/* module cards */
.modcard{display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.15s;text-align:left;
  border:1px solid var(--line);background:var(--surf);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.modcard:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--line2)}
.modcard .top{display:flex;align-items:center;gap:11px}
.modcard .num{width:34px;height:34px;border-radius:9px;background:var(--surf2);display:grid;place-items:center;
  font-family:var(--mono);font-weight:800;font-size:14px;color:var(--tx2);flex:none}
.modcard.dn .num{background:var(--acc);color:#fff}
.modcard h3{font-size:15.5px;letter-spacing:-.01em;flex:1}
.modcard p{font-size:13px;color:var(--tx2);margin:0;flex:1}
.modcard .meta{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;color:var(--tx3)}

/* progress bar + ring */
.bar{height:7px;border-radius:6px;background:var(--surf2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.gold>i{background:linear-gradient(90deg,var(--gold),#e8bd66)}
.ring{--v:0;width:64px;height:64px;border-radius:50%;flex:none;
  background:conic-gradient(var(--acc) calc(var(--v)*1%),var(--surf2) 0);
  display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surf)}
.ring b{position:relative;font-family:var(--mono);font-size:14px;font-weight:800}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:10px;
  font-size:14px;font-weight:650;padding:10px 17px;border:1px solid var(--line2);background:var(--surf);color:var(--tx);
  transition:.14s;text-align:center}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 4px 12px -4px var(--acc)}
.btn.pri:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ============ QUIZ / CHECK ============ */
.quiz{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);padding:18px;margin:22px 0;box-shadow:var(--shadow)}
.quiz .qh{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.quiz .qh .qi{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--acc2)}
.quiz .qq{font-size:15.5px;font-weight:650;margin:8px 0 14px;line-height:1.4}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;border:1px solid var(--line);
  background:var(--surf);border-radius:10px;padding:11px 13px;margin-bottom:9px;transition:.12s;font-size:14px;color:var(--tx)}
.opt:hover:not(.locked){border-color:var(--acc);background:var(--accwash)}
.opt .mk{width:23px;height:23px;border-radius:6px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--tx3);transition:.12s}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--good);background:var(--goodwash)}
.opt.correct .mk{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--crit);background:var(--critwash)}
.opt.wrong .mk{background:var(--crit);border-color:var(--crit);color:#fff}
.opt.muted{opacity:.55}
.why{margin-top:6px;padding:12px 14px;border-radius:10px;background:var(--surf2);font-size:13.5px;line-height:1.6;
  border-left:3px solid var(--acc);display:none}
.why.show{display:block;animation:fade .25s}
.why b{color:var(--acc2)}
.why.bad{border-left-color:var(--crit)}.why.bad b{color:var(--crit)}

/* ============ DRILL (calculators) ============ */
.drill{border:1px solid var(--line2);border-radius:var(--r);background:var(--surf);padding:18px;margin:22px 0;box-shadow:var(--shadow)}
.drill h4{font-family:var(--mono);color:var(--acc2);margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.drill .di{font-size:13.5px;color:var(--tx2);margin-bottom:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);margin-bottom:4px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
  color:var(--tx);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.dout{background:var(--surf2);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.8;
  white-space:pre-wrap;border:1px dashed var(--line2)}
.dout b{color:var(--acc)}
.dguess{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.verdict{font-family:var(--mono);font-size:13px;font-weight:700;padding:8px 12px;border-radius:8px;display:none}
.verdict.ok{display:inline-block;background:var(--goodwash);color:var(--good)}
.verdict.no{display:inline-block;background:var(--critwash);color:var(--crit)}

/* ============ CASE LAB ============ */
.ta{width:100%;min-height:120px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:14px;line-height:1.55;resize:vertical}
.ta:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.stepbar{display:flex;gap:5px;margin:12px 0 18px}
.stepbar i{height:5px;flex:1;border-radius:5px;background:var(--surf2);transition:background .3s}
.stepbar i.on{background:var(--acc)}
.stepbar i.done{background:var(--acc2)}
.reveal{margin-top:16px;border:1px solid var(--accdim);background:var(--accwash);border-radius:12px;padding:16px 18px;display:none}
.reveal.show{display:block;animation:fade .3s}
.reveal h4{font-family:var(--mono);color:var(--acc2);text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin:0 0 8px}
.reveal .model{font-size:14px;line-height:1.6}
.reveal .model b{color:var(--tx)}
.rubric{list-style:none;padding:0;margin:12px 0 0}
.rubric li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line2);font-size:13.5px;cursor:pointer;color:var(--tx2)}
.rubric li .cb{width:21px;height:21px;border-radius:6px;border:1.6px solid var(--line2);flex:none;display:grid;place-items:center;color:transparent;transition:.12s}
.rubric li .cb svg{width:13px;height:13px}
.rubric li.on{color:var(--tx)}
.rubric li.on .cb{background:var(--good);border-color:var(--good);color:#fff}
.casetype{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;flex:none}
.casetype.ai{background:var(--accwash);color:var(--acc2)}
.casetype.gen{background:var(--goldwash);color:var(--gold)}
.casetype.run{background:var(--critwash);color:var(--crit)}

/* ============ FLASHCARDS ============ */
.fc-stage{max-width:620px;margin:0 auto}
.fc{perspective:1600px;height:320px;margin:20px 0;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surf);box-shadow:var(--shadow2);display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:34px}
.fc-face .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  position:absolute;top:16px;left:18px}
.fc-front .q{font-size:20px;font-weight:650;line-height:1.35}
.fc-back{transform:rotateY(180deg);background:var(--accwash);border-color:var(--accdim)}
.fc-back .a{font-size:17px;line-height:1.5}
.fc-hint{text-align:center;font-family:var(--mono);font-size:11px;color:var(--tx3);margin-top:-8px}
.fc-grade{display:flex;gap:10px;justify-content:center;margin-top:18px}

/* ============ EXAM ============ */
.exam-intro{text-align:center;max-width:520px;margin:20px auto}
.result-hero{text-align:center;padding:24px}
.result-hero .score{font-family:var(--mono);font-size:60px;font-weight:800;letter-spacing:-.03em}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;font-weight:700;
  padding:4px 11px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em}
.pill.pass{background:var(--goodwash);color:var(--good)}
.pill.fail{background:var(--critwash);color:var(--crit)}
.pill.lock{background:var(--surf2);color:var(--tx3)}

/* misc */
.divider{height:1px;background:var(--line);margin:26px 0;border:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;z-index:100;
  background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow2);transition:.3s;display:flex;gap:9px;align-items:center;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .xpv{font-family:var(--mono);color:var(--gold)}
.empty{text-align:center;color:var(--tx3);padding:50px 20px}
.scrim{display:none}

/* focus-visible for keyboard users */
a:focus-visible,button:focus-visible,.opt:focus-visible,.modcard:focus-visible,.navitem:focus-visible,.fc:focus-visible,.iconbtn:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.rubric li:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}

/* reading progress */
.readbar{position:absolute;left:0;right:0;bottom:-1px;height:2px;opacity:0;transition:opacity .25s;pointer-events:none}
.readbar>i{display:block;height:100%;width:0;background:var(--acc);box-shadow:0 0 8px var(--acc)}

/* keyhint */
.keyhint{font-family:var(--mono);font-size:10.5px;color:var(--tx3);letter-spacing:.02em}
.kbd{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 5px;border:1px solid var(--line2);border-radius:5px;background:var(--surf2);color:var(--tx2)}

/* modal */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(8,16,14,.55);backdrop-filter:blur(3px)}
.modal.on{display:flex;animation:fade .2s}
.modal .sheet{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);max-width:540px;width:100%;
  padding:24px;box-shadow:var(--shadow2);max-height:86vh;overflow:auto}
.modal .sheet h3{font-size:18px;letter-spacing:-.01em}

/* exercises: code completion + ordering */
.exbox{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);padding:16px 18px;margin:18px 0;box-shadow:var(--shadow)}
.ex-h{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2);font-weight:700;display:flex;gap:7px;align-items:center;margin-bottom:6px}
.ex-h svg{width:13px;height:13px}
.ex-i{font-size:13.5px;color:var(--tx2);margin-bottom:12px}
.codeex{font-family:var(--mono);font-size:12.5px;line-height:2.05;background:var(--surf2);color:var(--tx);padding:14px 16px;border-radius:10px;overflow-x:auto;white-space:pre;margin:0;border:1px solid var(--line);tab-size:2}
.blankin{font-family:var(--mono);font-size:12.5px;background:var(--bg);border:1px solid var(--line2);border-bottom:2px solid var(--acc);border-radius:5px;padding:1px 6px;color:var(--tx);min-width:46px;font-variant-numeric:tabular-nums}
.blankin:focus{outline:2px solid var(--acc);outline-offset:1px}
.blankin.ok{border-color:var(--good);border-bottom-color:var(--good);background:var(--goodwash);color:var(--good)}
.blankin.bad{border-color:var(--crit);border-bottom-color:var(--crit);background:var(--critwash)}
.exmsg{font-family:var(--mono);font-size:12px;font-weight:700;margin-left:2px}
.exmsg.ok{color:var(--good)}.exmsg.bad{color:var(--crit)}
.orderlist{list-style:none;padding:0;margin:6px 0 0;counter-reset:o}
.ordli{display:flex;align-items:center;gap:11px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;margin-bottom:8px;background:var(--surf);font-size:13.5px;transition:.12s}
.ordli.ok{border-color:var(--good);background:var(--goodwash)}
.ordli.bad{border-color:var(--crit);background:var(--critwash)}
.ord-num{font-family:var(--mono);font-size:11px;color:var(--tx3);font-weight:700;min-width:15px}
.ord-num::before{counter-increment:o;content:counter(o)}
.ord-move{display:flex;flex-direction:column;gap:2px}
.ord-btn{width:24px;height:15px;border:1px solid var(--line2);background:var(--surf2);border-radius:4px;cursor:pointer;font-size:7px;color:var(--tx2);display:grid;place-items:center;line-height:1;padding:0}
.ord-btn:hover{border-color:var(--acc);color:var(--acc)}

/* dashboard charts */
.chartcard{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:17px 18px;box-shadow:var(--shadow)}
.mrow{display:flex;align-items:center;gap:9px;padding:2.5px 0}
.mrow .mn{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--tx3);min-width:15px}
.mrow .ml{font-size:11.5px;color:var(--tx2);flex:0 0 120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mp{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--acc);min-width:32px;text-align:right}
@media(max-width:560px){.mrow .ml{flex-basis:84px}}

/* schematic diagrams (theme-aware via tokens) */
.fig{margin:18px 0;border:1px solid var(--line);border-radius:var(--r2);background:var(--surf2);padding:16px}
.fig figcaption{font-size:12px;color:var(--tx3);text-align:center;margin-top:10px;font-style:italic}
.diagram{display:flex;gap:12px;flex-wrap:wrap}
.dcol{flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;background:var(--surf);padding:13px}
.dcol h5{margin:0 0 8px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.dtok{display:inline-block;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);margin:2px;background:var(--bg)}
.dnote{font-size:11.5px;color:var(--tx2);margin-top:9px;line-height:1.5}

/* ============ RESPONSIVE ============ */
@media(max-width:900px){
  :root{--rail:0px}
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;width:280px;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow2)}
  .rail.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
  .burger{display:grid}
  .content{padding:24px 16px 80px}
  .topbar{padding:10px 14px}
  .hide-sm{display:none}
}

<script>
/* ============ INTERACTIVE DRILLS ============ */
var DRILLS={
  kvcache:{
    title:"KV-cache sizer — derive, don't recite",
    desc:"The formula that replaces folklore: KV bytes/token = 2 × layers × kv_heads × head_dim × bytes. Change any input and watch the memory move. Defaults model a Llama-70B-class model with GQA.",
    fields:[
      {id:"layers",label:"n_layers",def:80},
      {id:"heads",label:"kv_heads (GQA)",def:8},
      {id:"dim",label:"head_dim",def:128},
      {id:"bytes",label:"bytes/value (FP16=2)",def:2},
      {id:"ctx",label:"context tokens",def:100000}
    ],
    compute:function(k){
      var b=2*val(k,"layers")*val(k,"heads")*val(k,"dim")*val(k,"bytes");
      var mb=b/1e6, gb=b*val(k,"ctx")/1e9;
      document.getElementById(k+"_out").innerHTML=
        "bytes/token = 2 × "+val(k,"layers")+" × "+val(k,"heads")+" × "+val(k,"dim")+" × "+val(k,"bytes")+" = <b>"+b.toLocaleString()+" B</b>\n"+
        "            ≈ <b>"+mb.toFixed(2)+" MB / token</b>\n"+
        "at "+val(k,"ctx").toLocaleString()+" tokens → <b>"+gb.toFixed(1)+" GB</b> of KV cache\n"+
        "note: without GQA (say 64 kv_heads) this would be ~"+(mb*8).toFixed(1)+" MB/token — the whole reason GQA exists.";
    },
    guess:{label:"Your GB estimate"},
    answer:function(k){return 2*val(k,"layers")*val(k,"heads")*val(k,"dim")*val(k,"bytes")*val(k,"ctx")/1e9;},
    fmt:function(x){return x.toFixed(1)+" GB";},
    tip:"Interview move: an 80GB GPU can't even hold the weights of a 70B model (~140GB in FP16) — so long-context concurrent serving needs multiple GPUs. That's why the advertised context window is a ceiling, not a recommendation."
  },
  callcost:{
    title:"Anatomy of one call's cost — cut output first",
    desc:"A retrieval-augmented call on a mid-tier model. Watch which line dominates the bill. Rates are $ per million tokens.",
    fields:[
      {id:"cached",label:"cached prefix tok",def:10000},
      {id:"fresh",label:"fresh input tok",def:2000},
      {id:"out",label:"output tok",def:500},
      {id:"crate",label:"cached $/Mtok",def:0.30},
      {id:"irate",label:"input $/Mtok",def:3},
      {id:"orate",label:"output $/Mtok",def:15}
    ],
    compute:function(k){
      var cc=val(k,"cached")*val(k,"crate")/1e6, ic=val(k,"fresh")*val(k,"irate")/1e6, oc=val(k,"out")*val(k,"orate")/1e6;
      var tot=cc+ic+oc; var pc=function(x){return tot?Math.round(x/tot*100):0;};
      var totTok=val(k,"cached")+val(k,"fresh")+val(k,"out");
      var seg=function(w,c){return w>0?'<div style="width:'+w+'%;background:'+c+'"></div>':'';};
      var txt="cached prefix  $"+cc.toFixed(4)+"   "+pc(cc)+"% of bill\n"+
        "fresh input    $"+ic.toFixed(4)+"   "+pc(ic)+"%\n"+
        "output         $"+oc.toFixed(4)+"   <b>"+pc(oc)+"%</b>  ← "+Math.round(val(k,"out")/totTok*100)+"% of the tokens\n"+
        "─────────────────────────\n"+
        "total          <b>$"+tot.toFixed(4)+"</b> / call\n"+
        "one output token ≈ "+(val(k,"orate")/val(k,"irate")).toFixed(0)+"× a fresh input token, "+(val(k,"orate")/val(k,"crate")).toFixed(0)+"× a cached one.";
      var bar='<div style="display:flex;height:20px;border-radius:6px;overflow:hidden;margin-top:15px;gap:2px" role="img" aria-label="Share of the bill: cached '+pc(cc)+'%, input '+pc(ic)+'%, output '+pc(oc)+'%">'+seg(pc(cc),"var(--accdim)")+seg(pc(ic),"var(--acc)")+seg(pc(oc),"var(--acc2)")+'</div>'+
        '<div style="display:flex;gap:14px;margin-top:7px;font-family:var(--mono);font-size:10.5px;color:var(--tx2)"><span><b style="color:var(--accdim)">■</b> cached '+pc(cc)+'%</span><span><b style="color:var(--acc)">■</b> input '+pc(ic)+'%</span><span><b style="color:var(--acc2)">■</b> output '+pc(oc)+'%</span></div>';
      document.getElementById(k+"_out").innerHTML='<div style="white-space:pre-wrap">'+txt+'</div>'+bar;
    },
    guess:{label:"Output's % of bill"},
    answer:function(k){var cc=val(k,"cached")*val(k,"crate"),ic=val(k,"fresh")*val(k,"irate"),oc=val(k,"out")*val(k,"orate");return oc/(cc+ic+oc)*100;},
    fmt:function(x){return Math.round(x)+"%";},
    tip:"The first law of LLM cost optimization: generate fewer output tokens — tight instructions, structured outputs, max-token caps — before touching anything else."
  },
  cache:{
    title:"Prompt-cache break-even — one reuse already wins",
    desc:"A stable prefix of P tokens, reused N times within the cache lifetime. Cached reads cost ~10% of input; the write costs ~1.25× (5-min tier). See where caching pays off.",
    fields:[
      {id:"p",label:"prefix tokens (P)",def:20000},
      {id:"n",label:"reuses (N)",def:500},
      {id:"rate",label:"input $/Mtok",def:3},
      {id:"read",label:"cache read mult",def:0.1},
      {id:"write",label:"cache write mult",def:1.25}
    ],
    compute:function(k){
      var P=val(k,"p"),N=val(k,"n"),c=val(k,"rate")/1e6;
      var uncached=(N+1)*P*c;
      var cached=val(k,"write")*P*c + N*val(k,"read")*P*c;
      var save=uncached-cached, pct=uncached?Math.round(save/uncached*100):0;
      document.getElementById(k+"_out").innerHTML=
        "uncached total  $"+uncached.toFixed(4)+"\n"+
        "cached total    $"+cached.toFixed(4)+"  (1 write + "+N+" reads)\n"+
        "─────────────────────────\n"+
        "saving          <b>$"+save.toFixed(4)+"</b>   <b>"+pct+"%</b> off that prefix\n"+
        "break-even at N > "+(( (val(k,"write")-1) / (1-val(k,"read")) ).toFixed(2))+" reuses — a single reuse already wins.";
    },
    guess:{label:"Your % saving estimate"},
    answer:function(k){var P=val(k,"p"),N=val(k,"n"),c=val(k,"rate")/1e6;var u=(N+1)*P*c;var ca=val(k,"write")*P*c+N*val(k,"read")*P*c;return (u-ca)/u*100;},
    fmt:function(x){return Math.round(x)+"%";},
    tip:"Corrected rule (v1 said ~3 reuses): cache any stable prefix of meaningful size that will plausibly be hit even once. Keep timestamps and IDs BELOW the cache point — byte-stability is the whole game."
  },
  marketsize:{
    title:"Market sizing — build the estimate multiplicatively",
    desc:"Top-down Fermi structure. The skill isn't the exact number — it's a defensible chain of stated assumptions plus a sanity check. Worked example: the annual market for replacement electric-toothbrush heads in a country of 30M.",
    fields:[
      {id:"pop",label:"population",def:30000000},
      {id:"pct",label:"% using electric brush",def:25},
      {id:"peryear",label:"heads / user / year",def:4},
      {id:"price",label:"price per head ($)",def:5}
    ],
    compute:function(k){
      var users=val(k,"pop")*val(k,"pct")/100;
      var units=users*val(k,"peryear");
      var mkt=units*val(k,"price");
      document.getElementById(k+"_out").innerHTML=
        "users        = "+val(k,"pop").toLocaleString()+" × "+val(k,"pct")+"%  = <b>"+Math.round(users).toLocaleString()+"</b>\n"+
        "units / year = "+Math.round(users).toLocaleString()+" × "+val(k,"peryear")+" = <b>"+Math.round(units).toLocaleString()+"</b>\n"+
        "market / yr  = units × $"+val(k,"price")+" = <b>$"+(mkt/1e6).toFixed(1)+"M</b>\n"+
        "sanity: ≈ $"+(mkt/val(k,"pop")).toFixed(2)+" per capita/year — plausible?";
    },
    guess:{label:"Your estimate ($ millions)"},
    answer:function(k){return val(k,"pop")*val(k,"pct")/100*val(k,"peryear")*val(k,"price")/1e6;},
    fmt:function(x){return "$"+x.toFixed(1)+"M";},
    tip:"Interview move: state every assumption out loud, segment where it matters, and always end with a per-capita sanity check. A defensible chain beats a precise-looking guess every time."
  }
};

/* ============ FLASHCARDS: numbers & one-liners to know cold ============ */
window.CARDS=[
  {id:"c1",k:"Cost",q:"Output : input price ratio on a mid-tier model?",a:"~5:1 (e.g. $3 in / $15 out per Mtok). This is why output reduction is the first cost lever."},
  {id:"c2",k:"Cost",q:"Cached vs fresh input price?",a:"~10× cheaper to read cached (Anthropic ~$0.30 vs $3). Caching is the single biggest cost lever."},
  {id:"c3",k:"Cost",q:"Prompt-cache break-even?",a:"Under 1 reuse on the 5-min tier — a single reuse saves ~33%. (Corrects the old ‘~3 reuses’ myth.)"},
  {id:"c4",k:"Memory",q:"KV bytes per token — the formula?",a:"2 × n_layers × n_kv_heads × head_dim × bytes_per_value. Derive it, never recite a memorized GB number."},
  {id:"c5",k:"Memory",q:"KV/token for a 70B GQA model in FP16?",a:"~0.33 MB/token → ~33 GB at 100k context. Without GQA it'd be ~2.6 MB/token."},
  {id:"c6",k:"Latency",q:"What sets TTFT vs TPOT?",a:"Prefill (parallel, compute-bound) sets TTFT; decode (sequential, memory-bandwidth-bound) sets per-token latency. ~0.5–2s TTFT, ~15–40ms/token."},
  {id:"c7",k:"Architecture",q:"What is GQA for, in one line?",a:"To shrink the KV cache — the binding memory constraint of inference. Groups of query heads share one K/V pair."},
  {id:"c8",k:"Architecture",q:"MoE: total vs active parameters?",a:"Active params drive compute/cost; total params drive memory (all experts must be resident). Never compare models by headline size."},
  {id:"c9",k:"Tokenization",q:"English tokenization rule of thumb?",a:"~4 characters or ~0.75 words per token."},
  {id:"c10",k:"Tokenization",q:"The Arabic multilingual tax in 2026?",a:"~1.5–2.5× English, tokenizer-dependent and shrinking. Hits cost, latency, and effective context at once. Measure on the real tokenizer."},
  {id:"c11",k:"Determinism",q:"Is temperature 0 deterministic?",a:"No — it's greedy, not deterministic. FP non-associativity, batch composition, MoE routing, and fleet heterogeneity all leak variation. Sell reproducibility-of-process, never determinism."},
  {id:"c12",k:"Failure",q:"Intrinsic vs extrinsic hallucination?",a:"Intrinsic = contradicts the given source. Extrinsic = unverifiable from any source. Retrieval attacks extrinsic; grounding + faithfulness evals attack intrinsic."},
  {id:"c13",k:"Structured output",q:"The reliability ladder for JSON?",a:"Constrained decoding > schema'd tool call > JSON mode > ‘please respond in JSON’ (fails 1–5% forever). Ship at rung 1–2 and validate on receipt regardless."},
  {id:"c14",k:"Classical ML",q:"State of the art for tabular data in 2026?",a:"Gradient-boosted trees (XGBoost/LightGBM/CatBoost) — not deep learning, not LLMs. Cheaper, more accurate, explainable."},
  {id:"c15",k:"Classical ML",q:"Why is accuracy a trap?",a:"On imbalanced problems (fraud, churn) a model can score 99.9% by predicting the majority class. Use precision, recall, F1, AUC — and map them to the cost of each error type."},
  {id:"c16",k:"Decision science",q:"Prediction vs causation?",a:"Correlation is enough to predict, never to justify an intervention. A/B tests establish causation; uplift modelling targets the persuadables."},
  {id:"c17",k:"Tool choice",q:"The decision framework, condensed?",a:"Rule (simple/known) → classical ML (structured + decide) → LLM (unstructured/generate) → chain them. Always ask: would something cheaper be nearly as good?"},
  {id:"c18",k:"Data",q:"Why do AI projects actually die?",a:"On data — missing, dirty, unjoinable, unpermissioned — far more than on models. Assess readiness before promising anything. Data work is ~60–80% of effort."},
  {id:"c19",k:"Retrieval",q:"Why hybrid search, not pure vector?",a:"Dense vectors miss exact strings (codes, names, acronyms) that BM25 nails. Fuse both with reciprocal rank fusion → routine 10–20% recall lift. Pure dense is an anti-pattern."},
  {id:"c20",k:"RAG",q:"The single biggest RAG quality win?",a:"Add a reranker (cross-encoder over top ~50 → keep top 5). Commonly +10–20% for pennies. Unreranked top-K carries 20–40% noise."},
  {id:"c21",k:"RAG",q:"How do you evaluate RAG?",a:"Separately: retrieval by recall@K on a labelled set (the number that matters most); generation by faithfulness (every claim traces to a chunk) via a calibrated LLM judge."},
  {id:"c22",k:"Agents",q:"Agent or workflow — the default?",a:"Workflow is the default (cheaper, reliable, debuggable). Agents earn autonomy only when the path genuinely can't be predetermined."},
  {id:"c23",k:"Security",q:"What is the ‘lethal trifecta’?",a:"Access to private data + exposure to untrusted content + an outward channel. Remove or human-gate any one leg and the catastrophic prompt-injection scenarios collapse."},
  {id:"c24",k:"Security",q:"Can prompt injection be patched?",a:"No complete defence exists — models can't reliably separate instructions from data. Security is architectural: least privilege, approval gates, privilege separation, treat all tool output as untrusted."},
  {id:"c25",k:"Evals",q:"How do you know it works?",a:"Golden set of labelled real examples → exact checks where checkable + a calibrated LLM judge for open-ended → run on every change → grow it from production failures. A number and a trend, not anecdotes."},
  {id:"c26",k:"Economics",q:"What kills AI business cases in finance?",a:"Point-estimate benefits, no measured baseline, missing cost lines (change management!), and benefits no P&L owner will sign. Fix: baseline first, owner-signed ranges, full TCO, sensitivity table."},
  {id:"c27",k:"Deployment",q:"Why do most AI pilots die before production?",a:"Not the model — reliability, integration, cost control, monitoring, security review, and ownership. A demo is the happy path; production is everything else."},
  {id:"c28",k:"Deployment",q:"When does self-hosting beat an API on cost?",a:"Rarely — the killer is utilization. APIs batch thousands of tenants; your spiky traffic leaves GPUs idle. Below sustained heavy volume, APIs win. Self-host for residency, deep customization, or latency locality."},
  {id:"c29",k:"Governance",q:"The EU AI Act spine in one line?",a:"Risk tiers: prohibited (banned) → high-risk (heavy obligations, phasing ~Aug 2026) → limited (transparency) → minimal (free). Extraterritorial like GDPR. Verify dates before quoting."},
  {id:"c30",k:"Craft",q:"The Pyramid Principle?",a:"Answer first, then grouped reasons, then evidence. Executives read the first line and decide whether to read the second. In interviews: answer in one sentence, then ‘three reasons,’ then give them."},
  {id:"c31",k:"Craft",q:"What does MECE guarantee?",a:"Mutually exclusive, collectively exhaustive branches — no overlap, nothing missing. Test: name what each branch excludes. It's what signals structured thinking in the first 30 seconds."},
  {id:"c32",k:"Delivery",q:"Why do AI programs underdeliver?",a:"People don't change how they work. Treat adoption as a funded workstream: champions, workflow redesign, the honest job-security answer, usage instrumented weekly. A mediocre system used daily beats a brilliant one routed around."}
];

id:"m1",n:"1",spine:true,t:"LLM Foundations & Inference Economics",
sub:"How the machine works, where the money goes, and how to hold that in a boardroom without notes. The spine everything else stands on.",
lessons:[
{id:"l1",t:"The transformer, operationally",min:7,html:`
<p class="lead">You don't need the maths to consult — you need the mental model that explains cost, latency, and failure behaviour. Everything operationally important is a consequence of one loop.</p>
<h3>The one-paragraph model</h3>
<p>A modern LLM is a deep stack of identical blocks. Each block does two things: <strong>self-attention</strong>, where every token builds a new representation of itself by selectively reading all prior tokens, and a <strong>feed-forward network</strong> that transforms each token independently. Stack 60–100 blocks, train on trillions of tokens to predict the next token, and you have a frontier model.</p>
<p>The decisive fact: it generates <strong>one token at a time, left to right</strong>. Why output tokens cost more, why long context is slow, why caching saves ~90%, why chain-of-thought works — all fall out of this loop.</p>
<h3>Attention, precisely enough to reason about it</h3>
<p>For each token the model computes a <strong>Query</strong> (what am I looking for?), a <strong>Key</strong> (what do I offer?), and a <strong>Value</strong> (what do I contribute if selected?). It scores its Query against every prior Key, softmaxes the scores into weights that sum to 1, and outputs the weighted sum of Values. In matrix form: <code>Attention = softmax(QKᵀ/√dₖ)·V</code>.</p>
<div class="box"><div class="bx-h">Two things interviewers probe</div>
<p style="margin:0 0 8px"><strong>Why √dₖ?</strong> Dot products of high-dimensional vectors grow with dimension; unscaled, the softmax saturates and gradients vanish. Dividing keeps the distribution expressive.</p>
<p style="margin:0"><strong>Why is it quadratic?</strong> Each of n tokens attends over up to n prior tokens → ~n² compute per layer. Double the context, roughly quadruple attention compute. That's the physical reason ‘just stuff everything into context’ is an anti-pattern — a retrieval system feeding 4k relevant tokens usually beats a 100k-token dump on quality <em>and</em> cost.</p></div>
<div class="box key"><div class="bx-h">Consultant takeaway</div>The cheapest mitigation for quadratic cost is usually <strong>not sending irrelevant tokens</strong> — retrieval, summarization, and context budgets beat architectural heroics for most applications. That beat separates engineers from consultants.</div>
`,checks:[
{q:"Why do output tokens fundamentally cost more than input tokens?",opts:["Providers mark them up for profit","Output is generated sequentially, one forward pass per token, each reading the whole KV cache — bandwidth-bound","Output tokens are larger in bytes","The model thinks harder about outputs"],a:1,why:"Input is processed in one parallel, compute-bound prefill pass. Output is sequential decode — one forward pass per token, each streaming the full KV cache from memory. GPU memory bandwidth is the scarcest serving resource, so output runs ~5× input."},
{q:"A client wants to ‘just put all 100k tokens of context in every call.’ The strongest objection is:",opts:["The model can't read that much","Attention compute scales ~quadratically with context, so it's expensive and slow — and usually 4k relevant tokens beat a 100k dump","It's against the provider's terms","Long context always hallucinates"],a:1,why:"Quadratic attention makes long context expensive and slow, and relevance beats volume. The senior move is retrieval and context budgets, not architectural heroics."}
]},
{id:"l2",t:"GQA, MoE, RoPE & reasoning models",min:8,html:`
<p class="lead">Four upgrades since the textbook transformer that you must be able to name — because each one shows up in a cost, capability, or model-comparison conversation.</p>
<h4>1 · Grouped-query attention (GQA)</h4>
<p>During generation, K/V tensors are cached per token, so KV memory scales with the number of heads. GQA lets <strong>groups of query heads share one K/V pair</strong> (e.g. 64 query heads → 8 KV heads), cutting KV-cache memory 4–8× with minimal quality loss. One-line answer to ‘what is GQA for?’: <em>it exists to shrink the KV cache, the binding memory constraint of inference.</em></p>
<h4>2 · Mixture-of-experts (MoE)</h4>
<p>The feed-forward layer becomes many parallel ‘experts’; a router activates only a few per token. A ‘400B-parameter’ model may activate only ~17B per token. Consequences: <strong>active parameters drive compute/cost; total parameters drive memory</strong> (all experts must be resident). Never compare models by headline parameter count — correcting a client on this gently is an instant credibility win.</p>
<h4>3 · Position: RoPE &amp; lost-in-the-middle</h4>
<p>Attention is order-blind; position is injected via rotary embeddings (RoPE). Long-context variants (128k–1M+) are made by <strong>retraining</strong> with scaled frequencies — not a flag — which is why quality at 500k isn't automatically equal to quality at 5k. <strong>Lost-in-the-middle</strong> (weaker recall for facts buried mid-context) is real but narrowing; treat it as a design prior (put critical material at the edges, and measure).</p>
<h4>4 · Reasoning models &amp; test-time compute</h4>
<p>Models now generate internal <strong>thinking tokens</strong> before the visible answer. Mechanically it's the same loop spending extra decode steps — which is why it works: computation lives in tokens. Operationally: thinking tokens are billed as output, effort is a knob, latency rises with effort, and telling a reasoning model to ‘think step by step’ is redundant and can hurt.</p>
`,checks:[
{q:"A prospect compares two models purely by parameter count — ‘400B must be better than 70B.’ Your correction:",opts:["Bigger is always better, they're right","With MoE, active parameters (not total) drive compute and cost; a 400B/17B-active MoE can be cheaper than a 70B dense model — compare on your task, not headline size","Parameter count is irrelevant","70B is always faster"],a:1,why:"MoE decouples total params (memory) from active params (compute). Headline size no longer predicts cost or speed. The professional move is to compare on measured performance for the task."},
{q:"Prompting a reasoning (‘extended thinking’) model to ‘think step by step’ is:",opts:["Essential for accuracy","Redundant and can degrade output — it already allocates thinking tokens; spend the reasoning-effort budget instead","Required by the API","A good way to save cost"],a:1,why:"Reasoning models already generate thinking tokens. Manual chain-of-thought on top is redundant and can hurt; the lever is the reasoning-effort setting."}
]},
{id:"l3",t:"The KV cache & the two phases",min:9,drill:"kvcache",ex:[
{type:"fillcode",title:"The KV-cache formula",intro:"Fill in the KV-cache size calculation for a 70B GQA model — the numbers are from this lesson.",code:`# bytes cached per token (the leading 2 covers K and V)
bytes_per_token = [[1]] * n_layers * n_kv_heads * head_dim * bytes_per_value

# a Llama-70B-class model, FP16:
n_layers, n_kv_heads, head_dim, bytes_per_value = 80, 8, 128, [[2]]
# -> ~0.33 MB per token

gb_at_100k = bytes_per_token * [[3]] / 1e9   # ~33 GB`,blanks:[{a:["2"],ph:"?"},{a:["2"],ph:"bytes"},{a:["100000","100_000","100e3","1e5"],ph:"tokens"}],why:"KV bytes/token = 2 × layers × kv_heads × head_dim × bytes_per_value. FP16 = 2 bytes/value; 0.33 MB/token × 100k ≈ 33 GB. Derive it, never recite a memorized number."}
],html:`
<p class="lead">The most production-relevant and most interview-tested mechanic in the stack — now with a formula you derive instead of recite.</p>
<h3>Why generation has two phases</h3>
<p>To generate token N+1 the model needs the Keys and Values of all N prior tokens. Recomputing them every step would be ruinous, so they're cached — the <strong>KV cache</strong>. This splits generation into two phases with opposite cost profiles:</p>
<div class="tblwrap"><table class="tbl"><tr><th></th><th>Prefill (your input)</th><th>Decode (the output)</th></tr>
<tr><td class="mono">bound by</td><td>Compute (FLOPs) — GPUs love this</td><td>Memory bandwidth — streaming the cache every step</td></tr>
<tr><td class="mono">latency</td><td>TTFT (time to first token) ~0.5–2s</td><td>TPOT ~15–40ms/token — dominates long answers</td></tr>
<tr><td class="mono">pricing</td><td>Cheap per token (amortized parallel pass)</td><td>~5× input — its own forward pass + full cache read</td></tr></table></div>
<p>This table is the complete answer to <strong>‘why do output tokens cost 3–5× input?’</strong> Across providers in 2026 the ratio sits around 5:1 (e.g. $3 in / $15 out).</p>
<figure class="fig"><div class="diagram">
<div class="dcol"><h5 style="color:var(--acc2)">Prefill · your input</h5>
<div><span class="dtok">The</span><span class="dtok">cat</span><span class="dtok">sat</span><span class="dtok">on</span><span class="dtok">the</span></div>
<div class="dnote"><b>One parallel pass</b> builds the KV cache for every input token at once. Bound by <b>compute</b> — sets <b>TTFT</b>, cheap per token.</div></div>
<div class="dcol" style="border-color:var(--acc)"><h5 style="color:var(--acc)">Decode · the output</h5>
<div><span class="dtok">mat</span> → <span class="dtok">,</span> → <span class="dtok">purring</span> → …</div>
<div class="dnote">Each step reads the <b>entire KV cache</b>, samples one token, appends its K/V. Bound by <b>memory bandwidth</b> — sets <b>TPOT</b>, <b>~5× the price</b>.</div></div>
</div><figcaption>Prefill is parallel and compute-bound; decode is sequential and bandwidth-bound — the asymmetry behind the entire pricing model.</figcaption></figure>
<h3>Sizing the KV cache — the formula that replaces folklore</h3>
<div class="box num">KV bytes/token = 2 × n_layers × n_kv_heads × head_dim × bytes_per_value
(the 2 covers K and V)</div>
<p>Play with the sizer below. The corrected reality (an old curriculum claimed ~1 MB/token and ‘100 GB fits in an 80 GB H100’ — both wrong): a modern 70B GQA model is ~0.33 MB/token → ~33 GB at 100k context. <strong>Never carry a memory number you can't derive.</strong></p>
`,checks:[
{q:"Long contexts are expensive to serve concurrently primarily because:",opts:["The model reads slower","KV-cache memory grows linearly with context and competes with model weights for GPU memory, cutting how many requests a GPU can serve at once","Providers throttle long calls","Attention breaks past 100k"],a:1,why:"KV memory scales linearly with context and shares scarce HBM with the weights, so long contexts reduce concurrency — which is why the advertised window is a ceiling, not a recommendation, and a 200k call costs real money even when it ‘fits.’"}
]},
{id:"l4",t:"Tokenization & the multilingual tax",min:6,html:`
<p class="lead">Why identical meaning costs different money in different languages — and why you measure instead of assume.</p>
<h3>BPE in five minutes</h3>
<p>Models see <strong>tokens</strong> — subword chunks from byte-pair encoding. Frequent English subwords become single tokens; rare words split; numbers split by digit-group; code tokenizes densely. Rules of thumb for English: <strong>~4 characters or ~0.75 words per token</strong>.</p>
<h3>The multilingual tax — the 2026-honest version</h3>
<p>Tokenizers are trained on English-dominant corpora, so under-represented scripts burn more tokens per unit of meaning. The tax is real but <strong>shrinking</strong> as large-vocab tokenizers arrive. Representative mid-2026 multipliers vs English: French ~1.2–1.6×, <strong>Arabic ~1.5–2.5×</strong>, Devanagari ~1.5–3×, CJK ~1–1.5× — heavily tokenizer-dependent.</p>
<div class="box warnbx"><div class="bx-h">The hidden triple hit</div>More tokens per sentence means (a) higher cost, (b) higher latency (more decode steps), and (c) less effective context — a 200k window holds fewer Arabic words than English words. Any non-English deployment needs a <strong>per-language token multiplier as an explicit budget line</strong>.</div>
<p>The professional move is a ten-minute benchmark on the candidate models' own tokenizers using real target-language samples, reporting tokens-per-100-chars by language. <strong>That table is the deliverable</strong> — it turns folklore into a budget line.</p>
`,checks:[
{q:"A client budgeted 100M tokens/month from English testing, then launches in Arabic. What happens?",opts:["Nothing — tokens are language-neutral","At a ~2× multiplier the same interactions consume ~200M tokens: the bill roughly doubles, latency rises, and effective context halves — so prompts tuned on English may break","Only cost changes, not latency","The model refuses Arabic"],a:1,why:"The Arabic tax hits cost, latency, and effective context simultaneously. Benchmark the real tokenizer on real Arabic, apply the measured multiplier to budget and SLAs, and consider a tokenizer that's more efficient on Arabic."}
]},
{id:"l5",t:"Sampling & the determinism myth",min:6,html:`
<p class="lead">What the knobs do, which defaults to ship, and why ‘temperature 0’ is not a compliance strategy.</p>
<h3>The knobs</h3>
<ul>
<li><strong>temperature</strong> — sharpens (low) or flattens (high) the distribution. 0–0.3 for extraction/structured; 0.5–0.8 conversation/RAG/code; ~1.0 creative. Above ~1.3 is noise.</li>
<li><strong>top_p (nucleus)</strong> — keeps the smallest token set exceeding cumulative probability p. Default 0.9–0.95. Tune <em>either</em> temperature or top_p, not both.</li>
<li><strong>top_k / min_p / penalties</strong> — blunter caps and loop-breakers, mostly left off in production.</li>
</ul>
<h3>The determinism myth — the full argument</h3>
<p>Temperature 0 (greedy) does <strong>not</strong> guarantee identical outputs. Four independent reasons: (1) floating-point arithmetic on GPUs is non-associative and kernel scheduling varies; (2) <strong>batch composition</strong> — your request is served alongside strangers', changing numerics; (3) MoE routing varies under load; (4) providers run heterogeneous hardware and rolling updates behind one name. Seeds are best-effort, not a contract.</p>
<div class="box key"><div class="bx-h">Sell reproducibility, never determinism</div>For regulated flows, don't promise determinism — promise <strong>reproducibility of process</strong>: pinned model versions, logged prompts and parameters, archived outputs, re-verification in the design. For evaluation, design tests that tolerate variation (semantic scoring, majority-of-k, tolerance bands) instead of golden-string matching.</div>
`,checks:[
{q:"A client says ‘we set temperature 0, so the system is deterministic and therefore compliant.’ The correct response:",opts:["Agree — temperature 0 is deterministic","Temperature 0 is greedy, not deterministic; FP order, batch composition, MoE routing and fleet heterogeneity all leak variation. Build compliance on reproducibility-of-process, not determinism","Raise temperature instead","Determinism is impossible so give up on compliance"],a:1,why:"This is a dangerous, common misconception. Determinism can't be guaranteed and can't ground a compliance claim. Promise pinned versions, logged prompts/params, and archived outputs instead."}
]},
{id:"l6",t:"Why models fail",min:8,html:`
<p class="lead">Selling AI honestly means being fluent in how it breaks. A failure you can explain mechanically is a failure you can design against — and that earns trust no capability pitch can buy.</p>
<h3>Hallucination — the defining failure</h3>
<p>A confident, fluent, false statement. Not a bug to patch — a direct consequence of a model optimized to produce <em>plausible</em> continuations, not <em>true</em> ones. When a fact was rare or absent in training, the model has no ‘I don't know’ mechanism; a fluent fabrication often out-scores an admission of ignorance, especially since preference optimization rewarded confident answers.</p>
<p>Two flavours, different fixes: <strong>intrinsic</strong> (contradicts the source you gave it) → grounding discipline + faithfulness evals; <strong>extrinsic</strong> (unverifiable from any source) → retrieval supplies the missing facts. The honest framing: hallucination can't be reduced to zero, but it can be <strong>bounded and made visible</strong> via citations, confidence surfacing, and human review on high-stakes paths.</p>
<h3>Miscalibration &amp; sycophancy</h3>
<p><strong>Miscalibration:</strong> post-training pushes models toward uniformly confident language regardless of actual uncertainty. Don't trust verbalized confidence — build uncertainty externally (ensembling, self-consistency, a separate judge). <strong>Sycophancy:</strong> agreeing with the user because raters preferred agreeable answers. Dangerous in analysis work — counter it with system prompts that instruct disagreement, capitulation evals, and ‘generate-before-react’ workflows.</p>
<h3>Hard capability limits (2026)</h3>
<p>Unreliable without tools: precise multi-step arithmetic, strict counting/exact constraints, long-horizon planning and state tracking, faithful reasoning over very long contexts, and genuine novelty far outside training. ‘Let's test it on your data’ beats a confident guess.</p>
`,checks:[
{q:"The most trust-building way to present model failure to a client is to:",opts:["Hide the failure modes so the demo dazzles","Walk them through exactly how it can fail and the specific mechanism — retrieval, evals, human review — that bounds each failure to an acceptable level","Promise zero hallucinations","Blame the user's data"],a:1,why:"Every acknowledged-and-mitigated failure becomes evidence of competence. Naming the mechanism reframes you from vendor-selling-magic to advisor-managing-a-powerful-but-imperfect-tool."},
{q:"Sycophancy in an analysis assistant is dangerous because:",opts:["It makes the model slower","It quietly conforms conclusions to the executive's prior beliefs — laundering bias as analysis","It increases token cost","It only affects creative tasks"],a:1,why:"Sycophancy is a fingerprint of preference optimization. In consulting deployments it's worse than useless. Mitigate with disagreement instructions, capitulation evals, and workflows that make the model commit before it can be pushed."}
]},
{id:"l7",t:"Structured output, prompting & caching",min:9,drill:"callcost",ex:[
{type:"fillcode",title:"Structured output via a forced tool call",intro:"Complete the call that forces the model to emit a schema-conforming object (rung 2 of the reliability ladder).",code:`resp = client.messages.create(
    model="claude-sonnet-4-6",
    tools=[verdict_tool],
    tool_choice={"type": "[[1]]", "name": "emit_verdict"},
    messages=msgs)

# always validate on receipt, even from a strict endpoint:
Verdict.[[2]](resp.content[0].input)`,blanks:[{a:["tool"],ph:"?"},{a:["model_validate","parse","validate"],ph:"method"}],why:"Forcing tool_choice to a named tool is the reliable structured-output path. And you validate every payload on receipt regardless of rung — two lines that turn silent corruption into a loud, loggable failure."}
],html:`
<p class="lead">Machine-readable output is a solved problem if you use the right mechanism — and caching is still the single biggest cost lever. First, run the cost anatomy below and read the ratios.</p>
<h3>The structured-output reliability ladder</h3>
<div class="tblwrap"><table class="tbl"><tr><th>Rung</th><th>Mechanism</th><th>Guarantee</th></tr>
<tr><td class="mono">1</td><td>Constrained decoding / strict schema (provider masks non-conforming tokens)</td><td>Parses and conforms, or errors</td></tr>
<tr><td class="mono">2</td><td>Schema'd tool call (force a named tool)</td><td>Very high conformance</td></tr>
<tr><td class="mono">3</td><td>JSON mode</td><td>Valid JSON, not your schema</td></tr>
<tr><td class="mono">4</td><td>‘Please respond in JSON’ in the prompt</td><td>None — fails 1–5% forever</td></tr></table></div>
<p>Ship at rung 1–2, and <strong>validate every payload on receipt</strong> (Pydantic/Zod) regardless — schema drift and provider changes are real, and two lines of validation turn silent corruption into a loud, loggable failure.</p>
<h3>Prompting that survived</h3>
<p><strong>Keep:</strong> few-shot examples (selection beats count), decomposition into small testable calls, structure/placement (stable content first), meta-prompting, chain-of-thought on <em>non-reasoning</em> tiers. <strong>Dropped:</strong> persona padding, threats/bribes, manual ReAct scaffolds, and CoT on reasoning models. The folklore layer died; the engineering layer got promoted — prompts are versioned, eval-gated artifacts.</p>
<h3>The first law of cost optimization</h3>
<p>From the drill above: output is ~4% of the tokens but ~45% of the bill. So <strong>generate fewer output tokens first</strong> — tight instructions, structured outputs, max-token caps, no throat-clearing — before touching anything else.</p>
`,checks:[
{q:"You're using a strict constrained-decoding endpoint that guarantees schema conformance. Should you still validate on receipt?",opts:["No — the endpoint guarantees it","Yes, always — schema evolution, provider changes, and enum drift are operational realities; validation converts silent corruption into a loud failure","Only in production","Only for large payloads"],a:1,why:"Validate every structured payload regardless of rung. Interviewers who've run production systems listen for exactly this instinct."}
]},
{id:"l8",t:"Prompt caching & the provider map",min:8,drill:"cache",html:`
<p class="lead">Caching is the biggest single cost lever after cutting output — and the old break-even math undersold it. Then: how to stay credible when the model landscape churns monthly.</p>
<h3>What is actually cached</h3>
<p>The provider stores the computed K/V tensors for a stable prefix. The next byte-identical request skips prefill for that span — ~90% off those tokens plus a TTFT drop. Two iron rules: <strong>(1) exact prefix match</strong> — one changed character invalidates everything after it; <strong>(2) stable content first, dynamic last</strong> — system prompt, tools, examples up top; retrieved context, history, and the user's question below.</p>
<div class="box warnbx"><div class="bx-h">The silent cache killer</div>No timestamps, request IDs, or user names above the cache point. One well-meaning ‘Today's date is…’ line at the top has silently zeroed many a cache-hit rate.</div>
<p>Run the break-even drill above: a single reuse already saves ~33% (correcting the old ‘~3 reuses’ myth). <strong>Cache any stable prefix of meaningful size that will plausibly be hit even once.</strong></p>
<h3>Carry the routine, not the table</h3>
<p>Model names, prices and rankings churn monthly. Reciting a stale table in a client room is worse than saying ‘let me confirm current pricing.’ The durable asset is the <strong>verification routine</strong>: prices only from the provider's live page checked the same day (with an ‘as-of’ date on every number); capability claims triangulated against one independent aggregator and then your own eval set; a 15-minute monthly changelog sweep (deprecations are paid-engagement leads). Route by difficulty and capability, keep a fallback chain, and stay one thin adapter away from portable.</p>
`,checks:[
{q:"An engineer puts ‘Current time: 14:32:07’ at the very top of a 20k-token system prompt to help the model. The effect on caching:",opts:["Improves cache hits","Zeroes the cache-hit rate — the prefix changes every call, so no request ever byte-matches the previous one","No effect","Only affects the first call"],a:1,why:"Byte-stability is the whole game. Volatile tokens above the cache point invalidate the entire prefix every call. Keep timestamps and IDs strictly below the cache breakpoint."},
{q:"The most credible way to handle model prices in a client deliverable is:",opts:["Recite the numbers you memorized last quarter","Quote from the provider's live pricing page checked the same day, with an ‘as-of’ date next to every number","Use round numbers so they're never wrong","Avoid mentioning price"],a:1,why:"Prices churn monthly. The verification habit — live page + as-of date + your own evals — is the durable asset. It reads as rigor because it is rigor."}
]}
],

id:"m2",n:"2",spine:false,t:"Classical ML & Decision Science",
sub:"The non-LLM half of enterprise AI, and the single most valuable judgment a consultant makes: when a boring model beats a large language model.",
lessons:[
{id:"l1",t:"Two kinds of AI, one job",min:6,html:`
<p class="lead">The most senior thing you can do in many engagements is talk the client <em>out</em> of an LLM.</p>
<p>Because LLMs are the visible, headline form of AI, clients arrive assuming ‘doing AI’ means ‘using an LLM.’ But a huge share of enterprise value comes from a quieter family: predicting churn, forecasting demand, flagging fraud, recommending products, scoring risk. <strong>None of these is an LLM problem.</strong> Most are solved best, cheapest and most reliably by methods that predate the transformer.</p>
<div class="box key"><div class="bx-h">The reframe that wins trust</div>When a client says ‘we want AI to reduce churn,’ the amateur designs an LLM system. The professional says: ‘Churn is a classic supervised-learning problem — we already know who left, so we can score who's likely to leave next, cheaply and explainably. The interesting question isn't the model, it's what you'll <em>do</em> with the scores.’ That single reframe repositions you from vendor to advisor.</div>
<h3>The vocabulary, precisely</h3>
<p><strong>Features</strong> = input variables. <strong>Target/label</strong> = what you predict. <strong>Training</strong> = fitting the function to labelled history. <strong>Inference/scoring</strong> = applying it to new cases. <strong>Supervised</strong> = you have labelled outcomes to learn from; <strong>unsupervised</strong> = you don't, and you're looking for structure.</p>
`,checks:[
{q:"A client asks for ‘an AI to analyze our sales data.’ The high-leverage reframe is:",opts:["Design a custom LLM to read the spreadsheets","Recognize it as a structured-data problem — almost certainly classical ML or BI at a fraction of the cost, and ask what decision the analysis will drive","Recommend the largest frontier model","Tell them it can't be done"],a:1,why:"Structured, tabular data pointed at an LLM is the wrong tool — more expensive, less accurate, harder to govern. The reframe to a right-sized classical approach is close to an instant credibility win."}
]},
{id:"l2",t:"Supervised learning, overfitting & honest metrics",min:8,html:`
<p class="lead">The workhorse behind most enterprise ML value — and the two ideas (the bias-variance tradeoff and honest metrics) that separate people who've shipped models from people who've read about them.</p>
<h3>Classification vs regression</h3>
<p>Classification predicts a category (churn/not); regression predicts a number (next month's revenue). Subtlety: most classifiers output a <strong>probability</strong>, and a threshold turns it into a decision. The threshold is a <em>business</em> decision about the relative cost of the two error types — not a modelling tuning exercise.</p>
<h3>Overfitting &amp; the bias-variance tradeoff</h3>
<p>A model too simple <strong>underfits</strong> (high bias); too complex, it memorizes noise and <strong>overfits</strong> (high variance) — perfect on training data, terrible on new data. You detect overfitting as a large gap between training and held-out performance. Hence the discipline: never judge on training data — split into <strong>train / validate / test</strong>, keep the test set untouched until the end, and cross-validate to tune honestly.</p>

</svg><figcaption>The train–validation gap is your overfitting gauge; the art is the sweet spot where validation error bottoms out.</figcaption></figure>
<h3>Metrics that actually matter</h3>
<p>Accuracy is a trap on imbalanced problems: a fraud model predicting ‘legitimate’ for everything scores 99.9% while catching nothing. Use <strong>precision</strong> (are your alarms trustworthy?), <strong>recall</strong> (are you catching cases?), <strong>F1</strong> (their balance), <strong>AUC</strong> (separation across thresholds). For regression: MAE and RMSE. The consultant's skill is translating these to money: precision vs recall is the cost of false alarms vs missed cases.</p>
`,checks:[
{q:"A vendor boasts their fraud model is ‘99.5% accurate.’ Your first question:",opts:["‘Great, let's deploy'","‘What's the base rate, and what are the precision and recall?' — on a rare-event problem, high accuracy often just means it predicts the majority class and catches nothing","‘Can you get to 99.9%?'","‘What model architecture?'"],a:1,why:"Accuracy hides failure exactly where the value is. On imbalanced problems you need precision, recall, and the base rate before celebrating."},
{q:"A model scores 96% on training data and 71% on held-out test data. The diagnosis:",opts:["It's a great model","It's overfitting — the train-test gap is too wide; add regularization, simplify, or get more data","It's underfitting","The test set is broken"],a:1,why:"A large train-test gap is the signature of overfitting (high variance). Diagnosing it on sight is a mark of someone who's shipped models."}
]},
{id:"l3",t:"The model families that ship (GBDT wins)",min:6,html:`
<p class="lead">You need working fluency in about six families — and to know why one wins far more often than the rest.</p>
<ul>
<li><strong>Linear / logistic regression</strong> — the interpretable baseline you never skip. Never deploy a complex model without checking whether a linear one is nearly as good.</li>
<li><strong>Gradient-boosted trees (XGBoost, LightGBM, CatBoost)</strong> — trees built sequentially, each correcting the last. Highly accurate, handle messy data, train in seconds-to-minutes on a laptop.</li>
<li><strong>Random forests</strong> — robust, low-tuning default.</li>
<li><strong>Clustering (k-means)</strong> — unsupervised segmentation.</li>
<li><strong>Neural nets / deep learning</strong> — state of the art for unstructured data (images, audio, text); usually the wrong, expensive choice on a business spreadsheet.</li>
</ul>
<div class="box key"><div class="bx-h">The single most useful fact in this chapter</div>For the structured, tabular data most enterprises run on, <strong>gradient-boosted decision trees remain state of the art in 2026 — not deep learning, not LLMs.</strong> Benchmarks consistently show GBDTs matching or beating neural nets on tabular problems while training faster, tuning easier, and interpreting more readily. If a client's problem is a spreadsheet, your default is a boosted tree — and it costs a thousandth of an LLM to run.</div>
`,checks:[
{q:"A client with a churn spreadsheet asks whether they need a custom neural network or an LLM. The right answer is usually:",opts:["A frontier LLM for best results","A custom neural network","No — a gradient-boosted tree on their existing data will likely outperform both, cost almost nothing to run, and be explainable to a regulator","They need more data first"],a:2,why:"GBDTs are state of the art on tabular data. Reaching for a large, opaque, expensive model here is the most common and costly over-engineering mistake in enterprise AI."}
]},
{id:"l4",t:"Causation, A/B tests & uplift",min:7,html:`
<p class="lead">The most valuable, most misunderstood idea in applied data science — and a favourite interview topic because it separates people who ran a model from people who understand what a model can license.</p>
<h3>Correlation predicts; it doesn't license intervention</h3>
<p>A predictive model finds correlations — enough to <em>forecast</em>, never enough to justify <em>changing</em> something. The classic blunder: a model finds customers who use feature X churn less, so the company pushes everyone to X — and nothing improves, because loyal customers happened to use X; X didn't cause loyalty. Spotting this reasoning error in a client's plan prevents expensive mistakes.</p>
<h3>The gold standard: A/B tests</h3>
<p>Randomly split into treatment and control, compare outcomes. Because assignment is random, the groups are identical except the intervention — so any difference is <strong>caused</strong> by it. Be fluent in the pitfalls: pre-defined metric, adequate sample size (power), significance, the danger of peeking, and confounds. When you can't randomize, reach for quasi-experimental methods (difference-in-differences, regression discontinuity) — while naming their weaker assumptions.</p>
<div class="box add"><div class="bx-h">Uplift modelling — where the money is</div>Propensity scoring ranks who's <em>likely</em> to churn. But among high-risk customers, some leave regardless (lost causes) and some would stay anyway (sure things) — spending retention budget on either is wasted. <strong>Uplift modelling</strong> targets the <em>persuadables</em>, whose behaviour the intervention actually changes. It needs experimental data to train and is harder than propensity — but it's where the real ROI lives.</div>
`,checks:[
{q:"A client wants to give retention discounts to the top 10% highest-risk churners. The senior critique is:",opts:["Perfect plan","Propensity ranks risk, not incrementality — some high-risk customers leave regardless and some would stay anyway; the money is in the persuadables, which uplift modelling targets. At minimum, test the discount's actual effect before scaling","Use a bigger model","Target the bottom 10% instead"],a:1,why:"Spending on risk rather than incrementality wastes budget on lost causes and sure things. Uplift modelling (or at least an experiment) identifies whose behaviour the intervention actually changes."}
]},
{id:"l5",t:"The decision: LLM, classical ML, or neither",min:6,ex:[
{type:"order",title:"The tool-choice decision framework",intro:"Order the questions you ask — from first to last — to right-size the solution.",items:["Is the logic simple, stable and known? → a rule, no model","Structured data + a bounded prediction? → classical ML (default: a boosted tree)","Unstructured content, or open-ended generation? → an LLM","Does it need both? → chain them (LLM reads the language, the tree decides)"],why:"Ask in order, cheapest first. The most senior move is recognizing when no model is needed at all; only then classical ML, then LLM, then a chain."}
],html:`
<p class="lead">The judgment this whole module builds toward — a defensible framework you can apply live in a room and defend.</p>
<div class="box num" style="background:var(--surf);border-style:solid">Ask, in order:
1 · Is the logic simple, stable, known?     → a RULE, no model
2 · Structured data + bounded prediction?    → CLASSICAL ML (default: GBDT)
3 · Unstructured content or generation?       → LLM
4 · Does it need both?                          → CHAIN them
   (LLM reads the language, the tree makes the decision)
Always: would something cheaper be nearly as good?</div>
<p>Why it matters commercially: running a boosted tree over a million records costs cents and milliseconds; running an LLM over the same records costs dollars-to-hundreds and is likely <em>less</em> accurate on the structured task — and a tree's decisions can be explained to a regulator, an LLM's can't. The reflex to use an LLM for everything is a direct cause of the runaway costs and governance headaches that generate remediation engagements.</p>
<div class="box key"><div class="bx-h">The most senior move</div>Recognizing when the answer is a <strong>rule, not a model</strong>. ‘You don't need AI for this, you need three business rules and a dashboard’ builds more trust than selling an unnecessary model ever could.</div>
`,checks:[
{q:"‘Should we use an LLM to predict which invoices will be paid late?’ Run the framework:",opts:["Yes, LLMs are best at prediction","Structured data (invoice records) + bounded prediction (late: yes/no) → classical ML, a gradient-boosted tree — cheaper, more accurate, explainable to finance","Only a rule is needed","Chain three LLMs"],a:1,why:"It's a structured bounded-prediction task → GBDT. If there were unstructured notes to exploit, you'd chain an LLM to extract features and feed the tree — but the prediction itself is classical."}
]}
],

{q:"Why is accuracy misleading on a fraud problem?",opts:["Fraud is easy to detect","On rare-event problems a model can score 99.9% by predicting the majority class while catching zero fraud — use precision, recall, AUC","Accuracy is always fine","Fraud data is always clean"],a:1,why:"Class imbalance means accuracy hides total failure. Precision, recall and the base rate are the honest metrics."},
{q:"A model performs perfectly offline but fails in production. Prime suspect:",opts:["The GPU","Target leakage — a feature carrying post-outcome information inflated the offline score","Too little RAM","The wrong programming language"],a:1,why:"Suspiciously perfect offline performance is the classic signature of leakage — a feature only populated after the outcome. Audit features for anything unavailable at prediction time."},
{q:"Correlation vs causation matters in business because:",opts:["They're the same","Correlation is enough to predict but never to justify an intervention — acting on it as if causal is a classic expensive blunder","Causation is unknowable","Prediction is useless"],a:1,why:"A model can be right about correlation and useless for action. Establishing causation needs an experiment (A/B test) or, failing that, quasi-experimental methods."},

{q:"Roughly what share of an ML project is data work?",opts:["~10%","~60–80%","~30%","~5%"],a:1,why:"Data collection, cleaning and joining is routinely 60–80% of the effort. The model is the small part; scoping only the model is how projects get promised at a quarter of their true size."},
{q:"The classification threshold (e.g. ‘flag anyone above 0.5') is:",opts:["A fixed technical constant","A business decision about the relative cost of false alarms vs missed cases","Set by the model automatically","Always 0.5"],a:1,why:"The same model serves a fraud team and a disease screen by moving the threshold. Choosing it is a conversation about error costs, not a tuning exercise."}
]
