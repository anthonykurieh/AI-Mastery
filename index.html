{id:"tc-script",grp:"interview",name:"1 · Fix it: the technical case script (C·B·M·F·G·R)",tag:"Say it word for word",
one:"One fill-in-the-blanks script for any AI system question: wrong answers, cost, speed, safety or evals. Six steps, always in the same order.",
html:`
<div class="box key"><div class="bx-h">The one rule</div>You never say a fix until you've said the breakdown. If you catch yourself about to say "caching", stop and say "let me break this down first."</div>
<h3>1 · Clarify <span class="fwtime">30 sec</span></h3>
<div class="fwsay">"Let me make sure I've got it. <i>[Client]</i> has <i>[system]</i>, and the problem is <i>[symptom]</i>. Before I structure it, a few questions:<br>1. Is it built in-house or bought?<br>2. What's already in place, like RAG, caching or evals?<br>3. What does success look like, and is there a constraint like budget, deadline or regulation?"</div>
<h3>2 · Break it down <span class="fwtime">30 sec · never skip</span></h3>
<div class="fwsay">"Can I take 30 seconds to structure this?"<br>"This is a <i>[quality / cost / speed / safety]</i> problem, so I'll break it into <i>[pieces]</i>. I'll find which piece is causing it before I propose any fixes."</div>
<table class="tbl"><tr><th>If the problem is…</th><th>Say these pieces</th></tr>
<tr><td><b>Wrong answers</b></td><td>Retrieval → generation</td></tr>
<tr><td><b>Too expensive</b></td><td>Requests × tokens per request × price per token</td></tr>
<tr><td><b>Too slow</b></td><td>Retrieval → reading the prompt → writing → streaming</td></tr>
<tr><td><b>Unsafe</b></td><td>Inputs → tools → outputs</td></tr>
<tr><td><b>"Is it good?"</b></td><td>Golden set → metrics → pass bar → CI gate → monitoring</td></tr></table>
<h3>3 · Measure</h3>
<div class="fwsay">"To find which piece it is, I'd look at <i>[the logs / one failing example]</i> and check <i>[data for piece 1]</i>, <i>[piece 2]</i>, <i>[piece 3]</i>. Do we have that?"</div>
<p style="font-size:13.5px;color:var(--tx2)">Once you have the data:</p>
<div class="fwsay">"So the problem is in <i>[piece]</i>, because <i>[data point]</i>."</div>
<h3>4 · Fix</h3>
<div class="fwsay">"I'd fix it in order of cheapest and safest first:<br>1. <i>[quick win, no risk]</i><br>2. <i>[medium change]</i><br>3. <i>[bigger change, only if still needed]</i>"</div>
<h3>5 · Guard</h3>
<div class="fwsay">"Every one of these changes could hurt quality, so each one has to pass the golden-set evals before shipping, and we'd monitor <i>[metric]</i> after launch."</div>
<h3>6 · Recommend <span class="fwtime">under 45 sec</span></h3>
<div class="fwsay">"My recommendation is <i>[answer in one sentence]</i>, for three reasons: <i>[1]</i>, <i>[2]</i>, <i>[3]</i>. Next steps: <i>[this week]</i>, <i>[this month]</i>. The main risk is <i>[risk]</i>, and we'd manage it by <i>[mitigation]</i>."</div>
<div class="box warnbx"><div class="bx-h">Emergency phrases</div>
<b>Jumped to a fix?</b> "Let me step back, I want to find the cause first."<br>
<b>Don't know a term?</b> "I'm not certain of the exact mechanism, but here's how I'd reason about it…"<br>
<b>Blanked?</b> "Let me go back to my structure." Then look at the step 2 pieces.</div>
<h3>Worked example: the slow, expensive support bot</h3>
<p>An e-commerce support assistant's LLM bill tripled in three months and answers take 8 to 10 seconds to start.</p>
<table class="tbl">
<tr><td><b>Clarify</b></td><td>Built in-house on a pay-per-token API, uses RAG, no caching, no tuning since launch.</td></tr>
<tr><td><b>Break down</b></td><td>Cost = requests × tokens × price. Latency = retrieval → reading → writing → streaming.</td></tr>
<tr><td><b>Measure</b></td><td>Requests up 1.5× (healthy adoption). Tokens per request doubled: full history resent every turn, about 20 chunks retrieved. Biggest model for every question. No streaming.</td></tr>
<tr><td><b>Fix</b></td><td>1. Stream responses. 2. Trim the prompt (fewer chunks plus a reranker, summarise old history). 3. Provider prompt caching with a fixed prefix. 4. Route simple questions to a small model. 5. Semantic cache for stable FAQ answers only.</td></tr>
<tr><td><b>Guard</b></td><td>Each change passes the golden-set evals before shipping.</td></tr>
<tr><td><b>Recommend</b></td><td>"Same root cause: oversized prompts sent to the largest model on every request. Stream this week, then trim and cache, then route, each step gated on evals."</td></tr></table>
<div class="box"><div class="bx-h">Three caching terms not to mix up</div>
<b>KV cache:</b> inside the model during one request; automatic, not a fix to propose.<br>
<b>Prompt caching:</b> a provider feature that reuses an identical prompt <em>prefix</em> across requests, so put fixed content first and variable content last.<br>
<b>Response caching:</b> your own store of full answers to repeated questions; the biggest saving and the biggest risk of serving a stale answer.</div>`,
src:"Built from our mock interview sessions; breakdowns synthesised from course modules 5, 7, 8 and 9"},

{id:"int-design",grp:"interview",name:"2 · Design it from scratch",tag:"System design",
one:"Start with the simplest design that works, then show where it breaks and how you'd know. Interviewers grade the trade-offs, not the boxes.",
html:`
<div class="box key"><div class="bx-h">The one rule</div>Requirements before boxes, and the boring baseline before anything clever. Let evals earn the right to add complexity.</div>
<h3>1 · Clarify <span class="fwtime">2 min</span></h3>
<div class="fwsay">"Before I design, a few questions: who are the users and how many, <i>[internal / customers]</i>? What data does it answer from, and how often does it change? Any latency or cost target? What's the cost of a wrong answer? Any data that can't leave the region?"</div>
<h3>2 · Requirements <span class="fwtime">1 min</span></h3>
<div class="fwsay">"So it must <i>[2 or 3 functional needs]</i>, with <i>[latency]</i>, about <i>[volume]</i> requests a day, and <i>[risk constraint]</i>. I'll optimise for <i>[the one that matters most]</i>."</div>
<h3>3 · Baseline design <span class="fwtime">5 min</span></h3>
<div class="fwsay">"Here's the simplest version that works." Walk the flow left to right: <i>ingest → chunk & embed → store → retrieve → generate with citations → UI</i>. "I'd ship this first and measure it."</div>
<h3>4 · Where it breaks <span class="fwtime">5 min</span></h3>
<div class="fwsay">"The weakest points are <i>[1]</i> and <i>[2]</i>. For <i>[1]</i> I'd add <i>[fix]</i>, but only if evals show we need it."</div>
<table class="tbl"><tr><th>Common weak point</th><th>Upgrade, when evals justify it</th></tr>
<tr><td>Exact terms missed (product codes, policy names)</td><td>Hybrid search (keywords + vectors) and a reranker</td></tr>
<tr><td>Stale or conflicting documents</td><td>Versioning, metadata filters, one source of truth per policy</td></tr>
<tr><td>Wrong answers on high-stakes topics</td><td>Citations, "I don't know" behaviour, human escalation</td></tr>
<tr><td>Prompt injection via documents or users</td><td>Treat retrieved text as data, limit tools, check outputs</td></tr>
<tr><td>Cost and latency at scale</td><td>Streaming, prompt caching, small model for simple questions</td></tr></table>
<h3>5 · Evals & safety <span class="fwtime">2 min</span></h3>
<div class="fwsay">"I'd build a golden set from real questions, measure retrieval and answer quality separately, gate every change in CI, and monitor thumbs-down and escalations after launch."</div>
<h3>6 · Summarise the trade-offs <span class="fwtime">1 min</span></h3>
<div class="fwsay">"To sum up: <i>[baseline]</i>, chosen because <i>[top requirement]</i>. The main trade-off is <i>[X vs Y]</i>. Next I'd <i>[first upgrade]</i> if evals show <i>[signal]</i>."</div>
<div class="box warnbx"><div class="bx-h">Traps</div>Opening with an agent framework or fine-tuning. Drawing boxes without numbers. Never saying how you'd know it works.</div>`,
src:"Ours, synthesised from course modules 4 to 9",link:["module/m5","M5 · RAG Architecture"]},

{id:"int-biz",grp:"interview",name:"3 · Business case: \"Should we use AI?\"",tag:"Consulting case",
one:"The six-step tech case process with fill-in lines and the AI frameworks plugged in. The most likely format in a consulting interview.",
html:`
<h3>1 · Clarify</h3>
<div class="fwsay">"So <i>[client]</i> wants to know whether <i>[decision]</i>, and success means <i>[metric]</i> by <i>[when]</i>. Is that right? Two questions: <i>[what's the current baseline?]</i> and <i>[any constraint: budget, regulation, data?]</i>"</div>
<h3>2 · Structure</h3>
<div class="fwsay">"I'd look at four things: <b>value</b> (is the prize worth it?), <b>feasibility</b> (data, tech, risk), <b>economics</b> (cost, payback) and <b>adoption</b> (people and process). Let me start with value, because if the prize is small nothing else matters."</div>
<table class="tbl"><tr><th>Branch</th><th>Pull from</th></tr>
<tr><td><b>Value</b></td><td><a class="fwln" onclick="go('fw/usecase')">Value × feasibility</a>: volume, cost per unit, revenue or risk at stake</td></tr>
<tr><td><b>Feasibility</b></td><td><a class="fwln" onclick="go('fw/readiness')">Readiness pillars</a>, error tolerance, <a class="fwln" onclick="go('fw/euai')">regulation</a></td></tr>
<tr><td><b>Economics</b></td><td><a class="fwln" onclick="go('fw/bizcase')">AI business case</a>, <a class="fwln" onclick="go('fw/tc-math')">TCO and payback</a>, <a class="fwln" onclick="go('fw/techeval')">build vs buy</a></td></tr>
<tr><td><b>Adoption</b></td><td><a class="fwln" onclick="go('fw/ppt')">PPT</a>, <a class="fwln" onclick="go('fw/adkar')">ADKAR</a>, <a class="fwln" onclick="go('fw/autonomy')">autonomy ladder</a></td></tr></table>
<h3>3 · Quant</h3>
<div class="fwsay">"Here's how I'd size it: <i>[volume]</i> × <i>[realistic rate]</i> × <i>[saving per unit]</i>, minus <i>[run cost]</i>, against <i>[upfront cost]</i>. Does that approach make sense before I calculate?"</div>
<h3>4 · Qualitative</h3>
<div class="fwsay">"I see three groups of risk: <i>[technical]</i>, <i>[people]</i> and <i>[regulatory]</i>. The biggest is <i>[one]</i>, because <i>[reason]</i>."</div>
<h3>5 · Recommend</h3>
<div class="fwsay">"Yes, but start with <i>[narrow scope]</i>. Three reasons: <i>[value]</i>, <i>[payback]</i>, <i>[manageable risk]</i>. Next steps: a <i>[90-day pilot]</i> with exit criteria of <i>[quality, adoption, cost]</i>."</div>
<h3>Worked example: GenAI in a telecom call centre</h3>
<p>900,000 contacts a month. Human cost about $3 per contact. The client hopes for 30% containment.</p>
<p>Use a realistic 20%: 900k × 12 × 20% = <b>2.16M contacts a year</b> handled by AI. Gross saving 2.16M × $3 = <b>$6.5M</b>. AI cost including review of escalations, about $0.30 per contained contact = <b>$0.65M</b>. Net about <b>$5.8M a year</b>. Build plus change management $2.5M, so payback ≈ $2.5M ÷ $5.8M ≈ <b>5 months</b>.</p>
<div class="box key"><div class="bx-h">What makes it an AI answer, not a generic one</div>Challenging the 30% (error tolerance, knowledge base quality, escalation design), costing human review, and gating each rollout stage on evals.</div>`,
src:"Six-step process from Hacking the Case Interview; branches and example are ours",link:["fw/tc-steps","The six-step tech case process"]},

{id:"int-explain",grp:"interview",name:"4 · Explain a concept",tag:"60-second answers",
one:"Define, mechanism, when to use it, the trade-off, an example. About 60 seconds. The format that exposes bluffing fastest.",
html:`
<h3>Single concept: "What is X?"</h3>
<div class="fwsay"><b>Define:</b> "<i>[X]</i> is <i>[one plain sentence]</i>."<br><b>Mechanism:</b> "It works by <i>[2 sentences on how]</i>."<br><b>When:</b> "You use it when <i>[situation]</i>, and not when <i>[situation]</i>."<br><b>Trade-off:</b> "The cost is <i>[downside]</i>."<br><b>Example:</b> "For example, <i>[real or work example]</i>."</div>
<h3>Comparison: "X vs Y?"</h3>
<div class="fwsay">"Both aim to <i>[shared goal]</i>. They differ on three things: <i>[axis 1]</i>, <i>[axis 2]</i>, <i>[axis 3]</i>. I'd use X when <i>[case]</i> and Y when <i>[case]</i>. My default is <i>[the simpler one]</i>, unless <i>[signal]</i>."</div>
<h3>Worked example: prompt caching</h3>
<p><b>Define:</b> a provider feature that reuses the processing of an identical prompt prefix across requests. <b>Mechanism:</b> the first request computes and stores the prefix; later requests with the same prefix skip that work and are billed less for those tokens. <b>When:</b> long fixed instructions or documents reused across many calls; useless if the start of the prompt changes every time. <b>Trade-off:</b> you must order prompts with fixed content first, and caches expire. <b>Example:</b> a support bot with a 3,000-token system prompt.</p>
<h3>The concept questions to have ready</h3>
<table class="tbl"><tr><td>RAG vs fine-tuning vs long context</td><td>Embeddings and cosine similarity</td></tr>
<tr><td>Chunking strategies and trade-offs</td><td>Hybrid search and reranking</td></tr>
<tr><td>Hallucination: causes and mitigations</td><td>Prompt vs KV vs response caching</td></tr>
<tr><td>Tokens, context windows, cost drivers</td><td>Temperature and sampling</td></tr>
<tr><td>Agents vs workflows; tool calling</td><td>MCP and A2A</td></tr>
<tr><td>Prompt injection and defences</td><td>Evals: golden sets, LLM-as-judge</td></tr>
<tr><td>Reasoning models: when worth the cost</td><td>Precision vs recall; overfitting</td></tr></table>
<div class="box warnbx"><div class="bx-h">Trap</div>Saying more terms to sound expert. One correct mechanism beats five buzzwords. If unsure: "I'm not certain of the exact mechanism, but here's how I'd reason about it."</div>`,
src:"Ours",link:["cards","Flashcards"]},

{id:"int-estimate",grp:"interview",name:"5 · Estimation & market sizing",tag:"Guesstimates",
one:"Clarify, pick a driver tree, use round numbers, calculate out loud, sanity check, then say what it means.",
html:`
<h3>The script</h3>
<div class="fwsay"><b>Clarify:</b> "Do we mean <i>[scope: geography, time period, unit]</i>?"<br><b>Approach:</b> "I'll go <i>[top-down from population / bottom-up from supply]</i>: <i>[driver]</i> × <i>[driver]</i> × <i>[driver]</i>."<br><b>Assumptions:</b> "I'll assume <i>[round number]</i> because <i>[reason]</i>."<br><b>Calculate:</b> say each step out loud.<br><b>Sanity check:</b> "That's about <i>[per-unit figure]</i>, which seems <i>[reasonable / high]</i> compared with <i>[benchmark]</i>."<br><b>So what:</b> "That tells us <i>[implication for the decision]</i>."</div>
<h3>Worked example: monthly LLM bill for a telecom support bot</h3>
<table class="tbl">
<tr><td>Subscribers</td><td>4M</td></tr>
<tr><td>Contact support each month</td><td>25% → 1M contacts</td></tr>
<tr><td>Handled by the bot</td><td>50% → 500k conversations</td></tr>
<tr><td>LLM calls</td><td>6 turns each → 3M calls</td></tr>
<tr><td>Tokens per call</td><td>3,000 in, 300 out → 9B in, 0.9B out</td></tr>
<tr><td>Price (assume)</td><td>$3 per M input, $15 per M output</td></tr>
<tr><td><b>Monthly bill</b></td><td>$27k + $13.5k ≈ <b>$40k</b></td></tr></table>
<p><b>Sanity check:</b> about $0.08 per conversation against roughly $3 for a human contact. <b>So what:</b> model cost is small next to labour. The real budget risk is prompts growing over time, so monitor tokens per call.</p>
<div class="box warnbx"><div class="bx-h">Traps</div>Ugly numbers (use 4M, not 3.87M). Calculating silently. Forgetting the so-what.</div>`,
src:"Standard consulting estimation method; example is ours"},

{id:"int-coding",grp:"interview",name:"6 · Live coding, SQL & take-homes",tag:"Hands on keyboard",
one:"Talk before you type, write the simplest correct version, test it out loud, then improve it.",
html:`
<h3>Live coding script</h3>
<div class="fwsay"><b>Clarify:</b> "What's the input, what's the output, and what about <i>[empty / huge / malformed]</i> input?"<br><b>Approach:</b> "My plan is <i>[steps]</i>. That's <i>[complexity]</i>. Shall I go ahead?"<br><b>Code:</b> simplest correct version first, narrating as you go.<br><b>Test:</b> "Let me run it on <i>[normal example]</i> and <i>[edge case]</i>."<br><b>Improve:</b> "If I had more time I'd <i>[optimisation / error handling]</i>."</div>
<h3>SQL checklist</h3>
<table class="tbl"><tr><td><b>Grain</b></td><td>"One row per <i>[what]</i>?" Say it before writing.</td></tr>
<tr><td><b>Joins</b></td><td>Will this join duplicate rows? Left or inner, and why?</td></tr>
<tr><td><b>Filters</b></td><td>WHERE vs HAVING; date boundaries; time zones</td></tr>
<tr><td><b>Nulls</b></td><td>COUNT(*) vs COUNT(col); NULLs in joins and averages</td></tr>
<tr><td><b>Window functions</b></td><td>ROW_NUMBER for dedupe and latest-per-group; running totals</td></tr>
<tr><td><b>Check</b></td><td>Row counts before and after each step</td></tr></table>
<h3>AI coding tasks to be able to do cold</h3>
<table class="tbl"><tr><td>Call an LLM API with retries and timeouts</td><td>Force and validate JSON output</td></tr>
<tr><td>Minimal RAG: chunk, embed, top-k, answer with sources</td><td>A tool-calling loop with a step limit</td></tr>
<tr><td>A tiny eval: golden set, score, report</td><td>Stream a response to the client</td></tr></table>
<h3>Take-home</h3>
<div class="box key"><div class="bx-h">What gets you hired</div>A README with assumptions, how to run it, how you evaluated it, and what you'd do next. Stick to the time box and say what you cut. A small, tested, honest solution beats a sprawling one.</div>`,
src:"Ours"},

{id:"int-present",grp:"interview",name:"7 · Written case & presentation",tag:"Data pack to deck",
one:"You get a data pack and a deadline, and present to 'the client'. The deck is the Pyramid Principle on 4 or 5 slides.",
html:`
<h3>Time budget (for 60 minutes of prep)</h3>
<table class="tbl"><tr><td>10 min</td><td>Read the question and skim everything. Write your hypothesis.</td></tr>
<tr><td>25 min</td><td>Do only the analysis that proves or kills the hypothesis.</td></tr>
<tr><td>20 min</td><td>Build the slides.</td></tr>
<tr><td>5 min</td><td>Rehearse the opening and the recommendation out loud.</td></tr></table>
<h3>The deck</h3>
<table class="tbl"><tr><td><b>1</b></td><td>Executive summary in SCQA: the answer in the title</td></tr>
<tr><td><b>2 to 4</b></td><td>One reason per slide. The title is the takeaway (an "action title"); one chart or table proves it</td></tr>
<tr><td><b>5</b></td><td>Risks, next steps, what you'd need to confirm</td></tr></table>
<div class="fwsay">"My recommendation is <i>[answer]</i>. Three reasons, one per slide. Then risks and next steps."</div>
<h3>Q&A</h3>
<div class="fwsay">Challenged on a number: "Fair point. Here's my assumption, <i>[X]</i>. If it's actually <i>[Y]</i>, the answer <i>[does / doesn't]</i> change because <i>[reason]</i>."</div>
<div class="box warnbx"><div class="bx-h">Traps</div>Analysing everything in the pack. Topic titles ("Revenue analysis") instead of takeaways ("Revenue fell because of churn, not price"). Running out of time before the recommendation slide.</div>`,
src:"Pyramid Principle (Minto); common Big 4 assessment-centre format",link:["fw/pyramid","Pyramid Principle & SCQA"]},

{id:"int-behav",grp:"interview",name:"8 · Behavioural & fit",tag:"STAR + story bank",
one:"Prepare six stories, not sixty answers. Each story answers several questions when told in STAR, plus what you learned.",
html:`
<h3>The STAR+L script <span class="fwtime">90 sec</span></h3>
<div class="fwsay"><b>Situation:</b> "At <i>[company]</i>, <i>[context in one sentence]</i>."<br><b>Task:</b> "I was responsible for <i>[your part]</i>."<br><b>Action:</b> "I <i>[2 or 3 specific things YOU did]</i>." (Spend most of your time here. Say "I", not "we".)<br><b>Result:</b> "As a result, <i>[number or concrete outcome]</i>."<br><b>Learning:</b> "What I took from it is <i>[lesson]</i>, which I now apply by <i>[habit]</i>."</div>
<h3>The story bank: prepare one story for each row</h3>
<table class="tbl"><tr><th>Story</th><th>Answers</th><th>Kind of example to use</th></tr>
<tr><td><b>Built something from nothing</b></td><td>Initiative, ownership, impact</td><td>An automation or tool nobody asked for that's now used</td></tr>
<tr><td><b>Fixed something broken</b></td><td>Problem-solving, attention to detail</td><td>A pipeline or dashboard whose numbers didn't reconcile</td></tr>
<tr><td><b>Difficult stakeholder</b></td><td>Conflict, client handling, influence</td><td>A client or colleague who disagreed with your approach</td></tr>
<tr><td><b>Failure or mistake</b></td><td>Self-awareness, resilience</td><td>Something you shipped that broke; what you changed after</td></tr>
<tr><td><b>Ambiguity</b></td><td>Structuring, judgement</td><td>A vague request you turned into a clear deliverable</td></tr>
<tr><td><b>Learned fast</b></td><td>Adaptability, curiosity</td><td>A new tool or domain you got productive in quickly</td></tr></table>
<h3>Fit questions to script word for word</h3>
<table class="tbl"><tr><td><b>Tell me about yourself</b></td><td>Present → past → future in 60 to 90 sec: what you do now, the 2 things that got you here, why this role is the next step</td></tr>
<tr><td><b>Why consulting?</b></td><td>Variety of problems, client impact, learning curve, with one concrete moment you enjoyed client work</td></tr>
<tr><td><b>Why this firm?</b></td><td>Something specific: a practice, a client sector, a person you spoke to. Not "prestige"</td></tr>
<tr><td><b>Why leave your job?</b></td><td>Towards something, never away from something</td></tr>
<tr><td><b>Weakness</b></td><td>A real one, plus what you're doing about it</td></tr>
<tr><td><b>Where in 5 years?</b></td><td>Growth inside the path they offer</td></tr></table>
<div class="box warnbx"><div class="bx-h">Traps</div>"We" stories where your part is invisible. No number in the result. A weakness that's a disguised strength.</div>`,
src:"STAR method; story-bank approach common to consulting prep"},

{id:"int-screen",grp:"interview",name:"9 · Recruiter screening call",tag:"Round one",
one:"Fifteen to thirty minutes checking motivation, rough fit and logistics. Easy to pass and easy to lose by being vague.",
html:`
<h3>What they're checking</h3>
<table class="tbl"><tr><td><b>Motivation</b></td><td>Why this role, why now, why this firm</td></tr>
<tr><td><b>Fit</b></td><td>Does your background match the level and service line?</td></tr>
<tr><td><b>Logistics</b></td><td>Notice period, location, work authorisation, availability for interviews</td></tr>
<tr><td><b>Expectations</b></td><td>Salary range, level, start date</td></tr></table>
<h3>The script</h3>
<div class="fwsay"><b>Background (60 sec):</b> "I'm a <i>[role]</i> at <i>[company]</i>, where I <i>[headline achievement]</i>. Before that, <i>[1 line]</i>. I'm looking for <i>[what this role gives you]</i>, which is why <i>[firm / role]</i> stood out."</div>
<div class="fwsay"><b>Salary:</b> "Based on my research for this level in <i>[city]</i>, I'm looking at <i>[researched range]</i>, but I'm flexible depending on the full package and the role." Or, if you'd rather not anchor first: "I'd like to understand the level and package first. What's the budgeted range?"</div>
<div class="fwsay"><b>Close:</b> "What are the next steps, and is there anything in my background you'd like me to clarify for the hiring manager?"</div>
<div class="box key"><div class="bx-h">Have ready before the call</div>Notice period, earliest start date, your researched salary range, two specific reasons for this firm, and the job description open in front of you.</div>`,
src:"Ours"},

{id:"int-ask",grp:"interview",name:"Questions to ask them",tag:"Every round ends here",
one:"Two good questions per round, tailored to who you're talking to. \"No questions\" reads as no interest.",
html:`
<table class="tbl"><tr><th>Interviewer</th><th>Good questions</th></tr>
<tr><td><b>Recruiter</b></td><td>What does the interview process look like from here? What separates candidates who get offers?</td></tr>
<tr><td><b>Manager</b></td><td>What would success look like in my first six months? What's a typical engagement or project the team runs right now?</td></tr>
<tr><td><b>Engineer / peer</b></td><td>How do you evaluate AI systems before they ship? What's the hardest technical problem on the team right now?</td></tr>
<tr><td><b>Partner / director</b></td><td>Where do you see the AI practice growing in the region over the next two years? What do your best people have in common?</td></tr></table>
<div class="box warnbx"><div class="bx-h">Avoid</div>Anything answered on the website, salary or leave in a technical or partner round, and "How did I do?"</div>`,
src:"Ours"},

/* ---------- TECH CASE PLAYBOOK ---------- */
{id:"tc-diff",grp:"play",name:"Tech case vs traditional case",tag:"Know the game",
one:"A tech case is a business case where the central decision is about technology, so the output, the numbers and the risks shift.",
html:`
<table class="tbl"><tr><th></th><th>Traditional case</th><th>Tech case</th></tr>
<tr><td><b>Focus</b></td><td>The business decision</td><td>Business, people <em>and</em> technology together</td></tr>
<tr><td><b>Output</b></td><td>A strategic recommendation</td><td>A recommendation <em>plus</em> an implementation roadmap</td></tr>
<tr><td><b>Numbers</b></td><td>Revenue, cost, profit</td><td>TCO, ROI, payback period, uptime</td></tr>
<tr><td><b>Role of tech</b></td><td>One factor among many</td><td>Central to the solution</td></tr>
<tr><td><b>Timing</b></td><td>Often immediate</td><td>Value builds over months or years</td></tr>
<tr><td><b>Risks</b></td><td>Market and competition</td><td>Adoption, integration, security</td></tr></table>
<div class="box key"><div class="bx-h">The point</div>The solving method is the same as any case. What changes is that you must close with <b>how it gets delivered</b> and you must talk in <b>payback, not price</b>. Prep split suggested in the video: about 80% general case skill, 20% tech-specific.</div>`,
src:"Hacking the Case Interview, Tech Consulting Case Interview video and guide (2026)"},

{id:"tc-steps",grp:"play",name:"The six-step tech case process",tag:"The spine",
one:"Same six steps as a strategy case. Follow them in order and a deeply technical prompt still feels manageable.",
html:`
<ol class="fwsteps">
<li><b>Understand the case.</b> Note context and objective, ask 2 to 3 clarifying questions, then <em>restate the objective</em> and get a yes. Answering the wrong business question is the fastest way to fail.</li>
<li><b>Structure the problem.</b> Ask for a minute, build a tailored framework (PPT or Technology Evaluation are the usual starting blocks), present it confidently.</li>
<li><b>Kick off.</b> Candidate-led: pick the branch to explore first and say why. Interviewer-led: follow their lead.</li>
<li><b>Solve the quant.</b> Lay out the approach and get approval <em>before</em> computing. TCO, ROI and payback are the usual targets.</li>
<li><b>Answer the qualitative.</b> Group ideas into 2 to 3 buckets before speaking. For opinion questions, state your position first, then the reasons.</li>
<li><b>Recommend.</b> Answer, the 2 to 3 strongest reasons, the key risks, then next steps (a regional pilot, vendor reference calls, a security audit). Under 45 seconds.</li>
</ol>
<div class="box warnbx"><div class="bx-h">Five ways tech cases go wrong</div>
<ol style="margin:0;padding-left:18px"><li>Leading with technology instead of the business problem.</li><li>Forcing a memorised framework onto a case it doesn't fit.</li><li>Ignoring change management. Most tech projects fail on adoption, not technology.</li><li>Skipping the math because it looks messier than profit math.</li><li>Name-dropping vendors (AWS, Azure, SAP) without saying why they fit.</li></ol></div>
<div class="box"><div class="bx-h">Volume</div>Aim for 20 to 30 practice cases before interviews, 5 to 10 of them tech cases. Feedback on each case beats raw count.</div>`,
src:"Hacking the Case Interview, Tech Consulting Case Interview video and guide (2026)"},

{id:"tc-types",grp:"play",name:"The seven tech case types",tag:"Pattern-match fast",
one:"Recognise the type in the first 30 seconds and you already know which framework to start from.",
html:`
<table class="tbl"><tr><th>Type</th><th>Typical prompt</th><th>Attack it with</th></tr>
<tr><td><b>Build vs buy</b></td><td>A retailer needs an e-commerce platform</td><td>Technology Evaluation: cost, time to launch, customisation, long-term maintenance</td></tr>
<tr><td><b>Cloud migration</b></td><td>A bank moving core banking to cloud over 3 years</td><td>Cloud Adoption Framework: security, cost, latency, skill gaps</td></tr>
<tr><td><b>Vendor selection</b></td><td>An insurer picking between two claims systems</td><td>Technology Evaluation: features, cost, integration effort, vendor stability</td></tr>
<tr><td><b>Digital transformation</b></td><td>A 100-year-old retailer vs online-first rivals</td><td>PPT: strategy, technology and change management together</td></tr>
<tr><td><b>Cybersecurity</b></td><td>A hospital hit by ransomware</td><td>Roadmap horizons: 30 / 90 / 365 days, security vs user experience</td></tr>
<tr><td><b>AI &amp; automation</b></td><td>A call centre wants GenAI to handle 30% of queries</td><td>Use-case prioritisation, AI business case, autonomy ladder, adoption risk</td></tr>
<tr><td><b>IT modernisation</b></td><td>An agency running a 30-year-old mainframe</td><td>Prioritise systems, rebuild vs replace, transition with no service disruption</td></tr></table>
<div class="box key"><div class="bx-h">For you specifically</div>The AI &amp; automation type is where an AI-literate candidate pulls ahead: most candidates can size savings, few can explain <em>why</em> 30% containment is or isn't realistic (error tolerance, retrieval quality, escalation design, evals).</div>`,
src:"Hacking the Case Interview, Tech Consulting Case Interview video and guide (2026)"},

{id:"tc-math",grp:"play",name:"Tech case math: TCO, ROI, payback",tag:"The numbers",
one:"Three formulas show up in almost every tech case. Frame every investment as a payback period, not an upfront cost.",
html:`
<table class="tbl"><tr><th>Metric</th><th>Formula</th></tr>
<tr><td><b>TCO</b></td><td>Purchase or build + implementation + training + ongoing support &amp; maintenance</td></tr>
<tr><td><b>ROI</b></td><td>(Total benefit − total cost) ÷ total cost</td></tr>
<tr><td><b>Payback</b></td><td>Upfront cost ÷ annual savings</td></tr>
<tr><td>ARR</td><td>MRR × 12</td></tr>
<tr><td>Churn</td><td>Customers lost in period ÷ customers at start</td></tr>
<tr><td>LTV : CAC</td><td>Lifetime value ÷ acquisition cost (3:1 is the usual health bar)</td></tr>
<tr><td>NRR</td><td>(Start recurring revenue + expansion − churn) ÷ start; target above 100%</td></tr></table>
<p style="font-size:13px;color:var(--tx3)">The first three appear in most tech cases; the last four matter when the client is a software business.</p>
<h4>Worked example: the logistics cloud migration</h4>
<p>On-prem costs $20M a year. Migration is $15M upfront, then $14M a year in cloud. Horizon: 5 years.</p>
<p>Stay: $20M × 5 = <b>$100M</b>. Migrate: $15M + $14M × 5 = <b>$85M</b>. Five-year saving <b>$15M</b>. Run-rate saving $6M a year, so payback = $15M ÷ $6M = <b>2.5 years</b>.</p>
<div class="fwcalc">
<div class="eyebrow" style="color:var(--acc2)">Try it: payback calculator ($M)</div>
<div class="fwcalc-in">
<label>Current annual cost<input type="number" id="fc-cur" value="20" step="0.5" oninput="fwCalc()"></label>
<label>Upfront cost<input type="number" id="fc-up" value="15" step="0.5" oninput="fwCalc()"></label>
<label>New annual cost<input type="number" id="fc-new" value="14" step="0.5" oninput="fwCalc()"></label>
<label>Horizon (years)<input type="number" id="fc-yr" value="5" step="1" min="1" oninput="fwCalc()"></label>
</div><div id="fc-out" class="fwcalc-out"></div></div>
<div class="box key"><div class="bx-h">AI twist: unit economics</div>For GenAI cases, size it per unit of work: <b>cost per resolved contact</b> = (inference + retrieval + human review of escalations + eval/monitoring) ÷ contacts resolved. Compare it to today's fully loaded cost per contact, then multiply by <em>realistic</em> containment, not the client's hoped-for rate.</div>`,
src:"Hacking the Case Interview, Tech Consulting Case Interview video and guide (2026); AI unit-economics extension is ours"},

/* ---------- TECH CONSULTING ---------- */
{id:"ppt",grp:"tech",name:"PPT: People, Process, Technology",tag:"Default starting block",
one:"Technology only creates value when the people and the process around it change too. Check all three are aligned.",
when:"Digital transformation, system implementations, change management, and almost any \"why isn't our tool delivering?\" case.",
parts:[["People","Skills, roles, leadership buy-in, incentives, capacity to change"],["Process","Current workflows, bottlenecks, handoffs, what must be redesigned"],["Technology","Tools, scalability, integration with existing systems, data"]],
ai:"A bank rolled out a GenAI copilot and usage is 12%. <b>People:</b> no training, managers still measure handle time the old way. <b>Process:</b> the copilot sits outside the CRM so agents copy-paste. <b>Technology:</b> answers lack citations so agents don't trust them. The fix is mostly not the model.",
say:"\"I'd look at this through people, process and technology, because adoption problems are rarely only technical.\"",
trap:"Treating it as three boxes to list. The value is in the misalignment between them: name where they conflict.",
src:"Common practitioner framework (often attributed to Harold Leavitt's 1960s change model); Hacking the Case Interview"},

{id:"techeval",grp:"tech",name:"Technology Evaluation",tag:"Build vs buy, vendor choice",
one:"Score options on three core criteria, then check the secondary ones before deciding.",
when:"Build vs buy, vendor selection, platform choice, \"which model provider?\"",
parts:[["Meets requirements","Functional fit, customisation, how much of the need it covers out of the box"],["Total cost of ownership","Licence or build, implementation, training, run and maintenance over the horizon"],["Time to launch","How fast value starts, which moves payback"],["Secondary checks","Vendor reputation and stability, scalability, integration effort, exit and switching costs"]],
ai:"Buy a contact-centre AI platform or build on a model API? Buy wins on time to launch; build wins on customisation and data control; TCO depends on volume. Ask about <b>exit cost</b>: can you take your prompts, evals and conversation data with you?",
say:"\"I'd compare the options on three things: how well each meets the requirements, total cost of ownership, and time to launch, then pressure-test vendor stability and exit costs.\"",
trap:"Comparing sticker price instead of TCO, and forgetting the cost of switching later.",
src:"Hacking the Case Interview, Tech Consulting Case Interview guide (2026)",link:["module/m10","M10 · Economics, TCO, Vendors & Procurement"]},

{id:"itil",grp:"tech",name:"ITIL",tag:"IT service management",
one:"The Information Technology Infrastructure Library: the reference model for running IT as a set of services.",
when:"Service desk, application support, IT operating model, outsourcing of IT operations, \"our IT is always firefighting\".",
parts:[["Service strategy","What services, for whom, at what value"],["Service design","SLAs, capacity, availability, continuity"],["Service transition","Change, release and knowledge management"],["Service operation","Incidents, problems, requests, the service desk"],["Continual improvement","Measure, review, improve"]],
ai:"Running an LLM assistant in production is an ITIL problem in disguise: who owns incidents when it gives a harmful answer, what is the SLA, how are prompt and model changes released?",
say:"\"For the operating model I'd use the ITIL lifecycle: strategy, design, transition, operation and continual improvement, and check where the gaps are.\"",
trap:"The five-stage lifecycle is ITIL v3. ITIL 4 (2019) reframes it as a service value system. Interviews mostly use the lifecycle; just don't claim it's the current version.",
src:"AXELOS / PeopleCert ITIL; Hacking the Case Interview"},

{id:"togaf",grp:"tech",name:"TOGAF",tag:"Enterprise architecture",
one:"The Open Group Architecture Framework: how business, data, applications and infrastructure fit together, and how to move from today's state to a target state.",
when:"A client redesigning how its business, data and systems connect: post-merger integration, platform consolidation, ERP replacement.",
parts:[["Business architecture","Strategy, capabilities, processes, organisation"],["Data architecture","Data assets, ownership, flows, governance"],["Application architecture","The systems and how they interact"],["Technology architecture","Infrastructure, networks, cloud, platforms"],["ADM","The Architecture Development Method: a cycle from vision through each architecture to migration planning and governance"]],
ai:"An enterprise AI platform touches all four domains: which capabilities get AI (business), which governed data feeds it (data), which apps call it (application), and where models run (technology).",
say:"\"I'd map current and target state across the four architecture domains, business, data, applications and technology, then plan the migration in between.\"",
trap:"Going deep on technology architecture and skipping business architecture. The business domain is what makes it a consulting answer.",
src:"The Open Group, TOGAF Standard; Hacking the Case Interview"},

{id:"cmmi",grp:"tech",name:"CMMI",tag:"Maturity assessment",
one:"Capability Maturity Model Integration: rates how mature an organisation's processes are on five levels.",
when:"Software development organisations, outsourcing decisions, IT maturity assessments, \"how good is our engineering really?\"",
parts:[["1 · Initial","Ad hoc and reactive; success depends on heroes"],["2 · Managed","Projects are planned and tracked"],["3 · Defined","Standard processes across the organisation"],["4 · Quantitatively managed","Processes measured and controlled with data"],["5 · Optimizing","Continuous improvement from quantitative feedback"]],
ai:"The same ladder works for ML practice: level 1 is notebooks on a laptop, level 3 is a standard pipeline with versioned data and models, level 5 is eval-gated releases and drift monitoring feeding improvements.",
say:"\"I'd place them on a maturity scale first, because the right recommendation for a level-2 organisation is very different from a level-4 one.\"",
trap:"Recommending level-5 practices to a level-1 client. Move one level at a time.",
src:"CMMI Institute (ISACA); Hacking the Case Interview"},

{id:"caf",grp:"tech",name:"Cloud Adoption Framework",tag:"Cloud migration",
one:"Every major cloud provider publishes one; the core logic is the same six questions.",
when:"Cloud migration, data-centre exit, \"should we move to cloud?\"",
parts:[["Business case & ROI","Why move, what it saves or enables, payback"],["Workload assessment","Which apps, in which order, with which dependencies"],["Migration approach","Per workload: rehost, refactor, rebuild or retire (AWS extends this to 7 Rs: retire, retain, rehost, relocate, repurchase, replatform, refactor)"],["Security & compliance","Data residency, access, regulatory constraints"],["Operating model & skills","Who runs it, which skills are missing"],["Cost governance","FinOps: tagging, budgets, reserved capacity, stopping waste"]],
ai:"AI workloads add two questions: data residency for prompts and outputs (which region does inference run in?) and GPU capacity versus pay-per-token APIs.",
say:"\"I'd assess it on the business case, which workloads move and how, security and compliance, the operating model and skills, and cost governance.\"",
trap:"Assuming cloud is always cheaper. Lift-and-shift without cost governance often costs more.",
src:"AWS, Microsoft Azure and Google Cloud adoption frameworks; Hacking the Case Interview"},

/* ---------- AI CONSULTING ---------- */
{id:"usecase",grp:"ai",name:"Use-case prioritisation: value × feasibility",tag:"What to build first",
one:"Score every candidate use case on business value and on feasibility, plot them on a 2×2, start top-right.",
when:"\"Where should we use AI?\", AI strategy, building a roadmap from a long list of ideas.",
parts:[["Value","Cost saved, revenue, risk reduced, customer experience; multiplied by volume (how often it happens)"],["Feasibility","Data available and accessible, technical maturity, integration effort, regulatory exposure"],["Error tolerance","The GenAI-specific axis: what does one wrong answer cost, and can a human catch it?"],["The 2×2","High/high: quick wins. High value, low feasibility: strategic bets (fix data first). Low value, high feasibility: fill-ins. Low/low: drop"]],
ai:"For a telco: drafting agent replies (high volume, human in loop, tolerant) is a quick win; autonomous billing disputes (high value, low error tolerance, messy data) is a strategic bet.",
say:"\"I'd score the long list on value and feasibility, with error tolerance as a feasibility check, and start with the top-right quadrant to fund the harder bets.\"",
trap:"Picking the flashiest use case first. The first project's job is to earn trust and prove the delivery model.",
src:"Standard consulting prioritisation matrix, adapted for GenAI",link:["module/m3","M3 · Data Foundations & Readiness"]},

{id:"readiness",grp:"ai",name:"AI readiness & maturity",tag:"Where the client stands",
one:"Place the client on a maturity level, then diagnose readiness across a handful of pillars to see what blocks the next level.",
when:"Opening an AI strategy engagement, \"are we ready for AI?\", explaining why pilots aren't scaling.",
parts:[["Gartner's 5 levels","Awareness → Active (experiments) → Operational (ML in daily work) → Systemic (new business models) → Transformational (AI central to the value proposition)"],["Pillar: Strategy","Clear use cases tied to P&L owners"],["Pillar: Data","Quality, access, ownership, governance"],["Pillar: Platform","Where models run, integration, MLOps/LLMOps"],["Pillar: Talent","Skills in-house vs partners"],["Pillar: Governance","Risk, policy, compliance, responsible AI"],["Pillar: Adoption","Culture, change management, incentives"]],
ai:"\"Lots of pilots, nothing in production\" usually means Active level with weak Platform and Governance pillars: the fix is a shared delivery platform and an approval path, not more pilots.",
say:"\"Before recommending use cases I'd place them on a maturity scale and check the readiness pillars, because the binding constraint is usually data or governance, not models.\"",
trap:"Presenting the maturity score as the deliverable. Clients pay for the plan to reach the next level.",
src:"Gartner AI maturity model (levels); pillars are a common consulting composite"},

{id:"crispdm",grp:"ai",name:"CRISP-DM",tag:"The ML project lifecycle",
one:"Cross-Industry Standard Process for Data Mining: the six-phase loop most data science projects still follow.",
when:"Scoping an ML or analytics project, explaining delivery phases to a client, diagnosing why a model never shipped.",
parts:[["1 · Business understanding","The decision to improve and how success is measured"],["2 · Data understanding","What exists, its quality, its gaps"],["3 · Data preparation","Cleaning, joining, features; usually most of the effort"],["4 · Modelling","Try candidate approaches"],["5 · Evaluation","Does it meet the business criterion from phase 1?"],["6 · Deployment","Put it into the workflow, then monitor and loop back"]],
ai:"For GenAI the same loop holds with new names: data prep becomes document curation and chunking, modelling becomes prompt/RAG design, evaluation becomes golden sets and LLM judges.",
say:"\"I'd run it as a CRISP-DM loop, and I'd anchor evaluation to the business metric we agree in phase one, not to model accuracy.\"",
trap:"Skipping phase 1. Most failed models answer a question nobody asked.",
src:"CRISP-DM 1.0 (1999 industry consortium)",link:["module/m7","M7 · Evaluation & Quality Systems"]},

{id:"ladder",grp:"ai",name:"Build / buy / partner & the adaptation ladder",tag:"How to get the capability",
one:"Decide who builds it, then climb the cheapest rung of customisation that meets the bar.",
when:"\"Should we build our own model?\", vendor vs in-house, choosing between RAG and fine-tuning.",
parts:[["Buy","SaaS with AI built in. Fastest, least differentiated"],["Partner","A vendor or integrator builds on a platform for you"],["Build","Your team on model APIs or open models. Most control, most ownership cost"],["Rung 1 · Prompting","Instructions and examples. Hours to change"],["Rung 2 · RAG","Ground answers in the client's documents. For changing knowledge"],["Rung 3 · Fine-tuning","Teach format, tone or narrow skills. Not a knowledge store"],["Rung 4 · Pre-training","Almost never justified for an enterprise"]],
ai:"\"We want our own LLM trained on our data\" is usually solved at rung 2: RAG over their documents, with evals proving it before anyone talks about fine-tuning.",
say:"\"Buy where it isn't a differentiator, build where it is, and climb the adaptation ladder only when evals show the lower rung can't hit the bar.\"",
trap:"Recommending fine-tuning to add knowledge. Knowledge that changes belongs in retrieval.",
src:"Ours, synthesised from course modules 5 and 10",link:["lesson/m5/l4","M5 L4 · RAG vs fine-tuning vs long context"]},

{id:"bizcase",grp:"ai",name:"The AI business case",tag:"Survive the CFO",
one:"Value from four levers, minus every cost line, against a measured baseline, as a range with an owner.",
when:"Any AI investment decision, \"what's the ROI?\", defending a programme budget.",
parts:[["Value levers","Cost (time saved, deflection), revenue (conversion, new products), risk (errors, fraud, compliance), speed (cycle time)"],["Baseline","Today's measured cost and performance. No baseline, no credible benefit"],["Cost lines","Inference, retrieval and data infra, integration, evals and monitoring, human review, change management, run team"],["Ranges","Low / mid / high benefit, not a point estimate"],["Owner","A P&L owner who signs for the benefit"]],
ai:"Call-centre deflection: 1M contacts × 30% containment × $4 saved = $1.2M if containment holds. Show 15% / 25% / 30% cases and the cost of reviewing escalations.",
say:"\"I'd build it bottom-up from a measured baseline, show a range rather than a point, include change management as a cost line, and get a P&L owner to sign the benefit.\"",
trap:"Leaving out human review and change management, the two costs finance always finds.",
src:"Ours, synthesised from course module 10",link:["module/m10","M10 · Economics, TCO, Vendors & Procurement"]},

{id:"autonomy",grp:"ai",name:"The autonomy ladder (human in the loop)",tag:"How much to automate",
one:"Set the AI's autonomy by the cost of an error and whether it can be reversed, not by what the model can do.",
when:"Designing any GenAI workflow, agent scope, \"can we fully automate this?\"",
parts:[["Assist","AI suggests, human decides (search, summaries)"],["Augment","AI drafts, human approves every output"],["Automate with review","AI acts; humans sample or review flagged cases"],["Autonomous within guardrails","AI acts alone inside hard limits, with monitoring and rollback"],["The rule","Low error cost and reversible → climb. High cost or irreversible → stay low"]],
ai:"A travel agent bot can autonomously answer baggage questions, should draft refunds for approval, and should never cancel bookings on the strength of an inbound email.",
say:"\"I'd set autonomy by error cost and reversibility: start at augment, earn autonomy with eval data, and keep irreversible actions behind a human.\"",
trap:"Jumping to full autonomy because the demo worked. Climb one rung at a time on evidence.",
src:"Ours, synthesised from course modules 6 and 8",link:["module/m6","M6 · Agents & Orchestration"]},

{id:"pilot",grp:"ai",name:"POC → pilot → production gates",tag:"De-risk delivery",
one:"Three stages, each answering a different question, each with exit criteria agreed up front.",
when:"Planning delivery, rescuing a stalled pilot, \"why do our pilots never scale?\"",
parts:[["POC","Can it work at all? Small data, offline evals, days to weeks"],["Pilot","Does it work here? Real users, real data, one team or region, measured against baseline"],["Production","Can we run it? Reliability, security review, monitoring, cost controls, an owner and on-call"],["Exit criteria","Quality bar, adoption bar, cost per unit, risk sign-off. Agreed before the stage starts"]],
ai:"The pilot that \"went well\" but has no production plan is the most common failure. Write the production criteria during the POC.",

src:"Ours, synthesised from course module 9",link:["lesson/m9/l1","M9 L1 · The POC-to-production gap"]},

{id:"nist",grp:"ai",name:"NIST AI Risk Management Framework",tag:"Govern the risk",
one:"A voluntary US framework with four functions for managing AI risk across the lifecycle; the default vocabulary for AI governance work.",
when:"Responsible AI programmes, risk assessments, building an AI governance operating model.",
parts:[["Govern","Policies, accountability, culture; runs across everything"],["Map","Context: intended use, who is affected, what could go wrong"],["Measure","Assess and track the risks with metrics and tests"],["Manage","Prioritise, treat, monitor and respond"],["GenAI profile","NIST AI 600-1 (2024) applies the framework to generative AI risks"]],
ai:"For a GenAI HR assistant: Map flags bias and privacy, Measure means bias evals and leakage tests, Manage means escalation and audits, Govern names the accountable owner. ISO/IEC 42001 is the certifiable management-system counterpart.",
say:"\"I'd structure governance on the NIST AI RMF, Govern, Map, Measure, Manage, because it's risk-based and maps cleanly onto the EU AI Act and ISO 42001.\"",
trap:"Treating governance as a one-off review. Govern runs continuously.",
src:"NIST AI 100-1 (2023) and NIST AI 600-1 (2024)",link:["module/m11","M11 · Governance, Risk & Responsible AI"]},

{id:"euai",grp:"ai",name:"EU AI Act risk tiers",tag:"Regulation",

{id:"adkar",grp:"ai",name:"ADKAR for AI adoption",tag:"Make people use it",

<script>
/* =================== STATE / STORAGE =================== */
const KEY="aict_v1";
const DEF={xp:0,streak:0,last:null,started:null,lessons:{},quizzes:{},exams:{},cards:{},drills:{},seen:{},cases:{},caseNotes:{},activity:{},fw:{}};
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return Object.assign({},DEF,r||{})}catch(e){return Object.assign({},DEF)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function today(){return new Date().toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}

function touchStreak(){
  const t=today();
  if(!S.started)S.started=t;
  if(S.last===t){save();return}
  if(S.last){const d=daysBetween(S.last,t);S.streak=(d===1)?S.streak+1:1;}else{S.streak=1;}
  S.last=t;save();
}
function addXP(n,label){
  S.xp+=n;
  const t=today();if(!S.activity)S.activity={};S.activity[t]=(S.activity[t]||0)+n;
  save();renderChrome();
  toast((label||"XP earned"),n);
}
/* =================== CONTENT INDEX =================== */
const M=window.MODULES;
const CARDS=window.CARDS;
const modById=id=>M.find(m=>m.id===id);
function allLessons(){let a=[];M.forEach(m=>m.lessons.forEach(l=>a.push({m,l})));return a;}
function lessonDone(mid,lid){return !!(S.lessons[mid+"."+lid]);}
function modLessonsDone(m){return m.lessons.filter(l=>lessonDone(m.id,l.id)).length;}
function modPct(m){const tot=m.lessons.length+(m.exam?1:0);let d=modLessonsDone(m);if(m.exam&&examPassed(m.id))d++;return tot?Math.round(d/tot*100):0;}
function examPassed(mid){const e=S.exams[mid];return e&&e.passed;}
function overall(){
  let tot=0,done=0;
  M.forEach(m=>{tot+=m.lessons.length;done+=modLessonsDone(m);if(m.exam){tot++;if(examPassed(m.id))done++;}});
  return {tot,done,pct:tot?Math.round(done/tot*100):0};
}
/* spaced repetition (Leitner) */
const SR_INT=[0,1,3,7,16,35];
function cardState(id){return S.cards[id]||{box:0,due:today(),seen:false}}
function cardsDue(){return CARDS.filter(c=>{const st=cardState(c.id);return st.due<=today()}).length}
function gradeCard(id,ok){
  let st=cardState(id);st.seen=true;
  if(ok)st.box=Math.min(st.box+1,SR_INT.length-1);else st.box=Math.max(0,st.box-1);
  const dd=new Date();dd.setDate(dd.getDate()+SR_INT[st.box]);
  st.due=dd.toISOString().slice(0,10);
  S.cards[id]=st;save();
}

function fwCalc(){
  const g=id=>parseFloat((document.getElementById(id)||{}).value);
  const cur=g("fc-cur"),up=g("fc-up"),nw=g("fc-new"),yr=g("fc-yr");
  const out=document.getElementById("fc-out");if(!out)return;
  if([cur,up,nw,yr].some(x=>isNaN(x))){out.innerHTML="Fill in all four numbers.";return;}
  const stay=cur*yr,mig=up+nw*yr,save5=stay-mig,run=cur-nw;
  const f=x=>"$"+(Math.round(x*10)/10)+"M";
  const pay=run>0?(Math.round(up/run*10)/10)+" years":"never (no run-rate saving)";
  out.innerHTML='<div><span>Cost of staying</span><b>'+f(stay)+'</b></div><div><span>Cost of switching</span><b>'+f(mig)+'</b></div>'+
    '<div><span>'+yr+'-year saving</span><b style="color:'+(save5>=0?'var(--good)':'var(--crit)')+'">'+f(save5)+'</b></div>'+
    '<div><span>Payback</span><b>'+pay+'</b></div>';

function quizHTML(c,id,label){
  let opts='';
  c.opts.forEach((o,i)=>{opts+='<button class="opt" data-i="'+i+'" data-a="'+c.a+'" data-q="'+id+'"><span class="mk">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>';});
  return '<div class="quiz" data-quiz="'+id+'"><div class="qh"><span class="qi">'+(label||"Question")+'</span></div>'+
    '<div class="qq">'+c.q+'</div>'+opts+'<div class="why" data-why="'+id+'"><b>Why:</b> '+c.why+'</div></div>';
}
function bindQuizzes(){
  document.querySelectorAll(".opt").forEach(b=>{
    b.addEventListener("click",function(){
      const q=this.dataset.q;const wrap=document.querySelector('[data-quiz="'+q+'"]');
      if(wrap.dataset.answered)return;wrap.dataset.answered="1";
      const a=+this.dataset.a;const chosen=+this.dataset.i;
      wrap.querySelectorAll(".opt").forEach(o=>{
        o.classList.add("locked");const oi=+o.dataset.i;
        if(oi===a)o.classList.add("correct");
        else if(oi===chosen)o.classList.add("wrong");
        else o.classList.add("muted");
      });
      const why=wrap.querySelector(".why");why.classList.add("show");
      if(chosen!==a)why.classList.add("bad");
      if(!S.seen[q]){S.seen[q]=1;save();if(chosen===a)addXP(6,"Correct");}
    });
  });
}

/* =================== DRILL ENGINE =================== */
function drillHTML(key){
  const d=DRILLS[key];if(!d)return"";
  let f='';d.fields.forEach(x=>{f+='<div class="field"><label>'+x.label+'</label><input type="number" step="any" id="'+key+'_'+x.id+'" value="'+x.def+'"></div>';});
  return '<div class="drill" id="drill_'+key+'"><h4>'+svg(IC.play,2)+' '+d.title+'</h4><div class="di">'+d.desc+'</div>'+
    '<div class="fields">'+f+'</div>'+
    '<div class="dout" id="'+key+'_out"></div>'+
    (d.guess?'<div class="dguess"><div class="field" style="max-width:180px"><label>'+d.guess.label+'</label><input type="number" step="any" id="'+key+'_guess" placeholder="your estimate"></div><button class="btn sm" onclick="checkGuess(\''+key+'\')">Check my estimate</button><span class="verdict" id="'+key+'_verdict"></span></div><div style="font-size:12px;color:var(--tx3);margin-top:8px">'+d.tip+'</div>':'')+'</div>';
}
function bindDrill(key){const d=DRILLS[key];d.fields.forEach(x=>{document.getElementById(key+'_'+x.id).addEventListener("input",()=>runDrill(key));});runDrill(key);}
function val(key,id){return parseFloat(document.getElementById(key+'_'+id).value)||0;}
function runDrill(key){DRILLS[key].compute(key);}
function checkGuess(key){
  const d=DRILLS[key];const g=parseFloat(document.getElementById(key+'_guess').value);
  const truth=d.answer(key);const v=document.getElementById(key+'_verdict');
  if(isNaN(g)){v.className="verdict no";v.textContent="Enter a number";return}
  const err=Math.abs(g-truth)/Math.abs(truth);
  if(err<=0.2){v.className="verdict ok";v.textContent="Within range ✓ (actual "+d.fmt(truth)+")";if(!S.drills[key]){S.drills[key]=1;save();addXP(12,"Drill solved");}}
  else{v.className="verdict no";v.textContent="Off — actual is "+d.fmt(truth);}
}

/* =================== EXAM ENGINE =================== */
function viewExam(v,mid){
  const isFinal=mid==="final";
  const m=isFinal?null:modById(mid);
  const qs=isFinal?FINAL:(m?m.exam:null);
  if(!qs){go("dashboard");return}
  const title=isFinal?"The Interview Gauntlet":m.t+" — Exam";
  setCrumb((isFinal?'<b onclick="go(\'final\')" style="cursor:pointer">Gauntlet</b>':'<b onclick="go(\'module/'+mid+'\')" style="cursor:pointer">'+m.t+'</b>')+' / Exam');
  let state={i:0,answers:[],qs:shuffle(qs.slice())};
  const startT=Date.now();
  if(window.__examTimer)clearInterval(window.__examTimer);
  window.__examTimer=setInterval(function(){const el=document.getElementById("examClock");if(el){const s=Math.floor((Date.now()-startT)/1000);el.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}},1000);
  renderExamQ();
  function renderExamQ(){
    delete v.dataset.locked;
    const q=state.qs[state.i];
    let opts='';q.opts.forEach((o,i)=>{opts+='<button class="opt" onclick="window.__pick('+i+')" data-i="'+i+'"><span class="mk">'+String.fromCharCode(65+i)+'</span><span>'+o+'</span></button>';});
    v.innerHTML='<div class="page-in read">'+
      '<div class="row" style="justify-content:space-between;align-items:center"><div class="eyebrow">'+title+'</div><span class="mono" id="examClock" style="font-size:12px;color:var(--tx3)" title="Elapsed time">00:00</span></div>'+
      '<div class="row" style="justify-content:space-between;margin:6px 0 4px"><span class="mono" style="font-size:12px;color:var(--tx3)">Question '+(state.i+1)+' / '+state.qs.length+'</span><span class="mono" style="font-size:12px;color:var(--acc)">'+Math.round(state.i/state.qs.length*100)+'%</span></div>'+
      '<div class="bar" style="margin-bottom:22px"><i style="width:'+(state.i/state.qs.length*100)+'%"></i></div>'+
      '<div class="qq" style="font-size:18px;font-weight:700;margin-bottom:18px">'+q.q+'</div>'+opts+
      '<div class="why" data-examwhy><b>Why:</b> '+q.why+'</div>'+
      '<div class="row" style="justify-content:space-between;margin-top:16px"><span class="keyhint hide-sm">Keys <span class="kbd">1</span>–<span class="kbd">'+q.opts.length+'</span> or <span class="kbd">A</span>–<span class="kbd">'+String.fromCharCode(64+q.opts.length)+'</span> · <span class="kbd">Enter</span> next</span><button class="btn pri" id="examNext" style="display:none" onclick="window.__next()">'+(state.i===state.qs.length-1?'See results':'Next question')+' '+svg(IC.arrow,2)+'</button></div>'+
    '</div>';
  }
  window.__pick=function(i){
    const q=state.qs[state.i];const wrap=v;if(wrap.dataset.locked)return;wrap.dataset.locked="1";
    v.querySelectorAll(".opt").forEach(o=>{o.classList.add("locked");const oi=+o.dataset.i;
      if(oi===q.a)o.classList.add("correct");else if(oi===i)o.classList.add("wrong");else o.classList.add("muted");});
    state.answers.push(i===q.a);
    const w=v.querySelector("[data-examwhy]");w.classList.add("show");if(i!==q.a)w.classList.add("bad");
    document.getElementById("examNext").style.display="inline-flex";
  };
  window.__next=function(){
    delete v.dataset.locked;
    if(state.i<state.qs.length-1){state.i++;renderExamQ();window.scrollTo(0,0);}
    else finishExam();
  };
  function finishExam(){
    if(window.__examTimer){clearInterval(window.__examTimer);window.__examTimer=null;}
    const elapsed=Math.floor((Date.now()-startT)/1000);
    const elapStr=String(Math.floor(elapsed/60)).padStart(2,"0")+":"+String(elapsed%60).padStart(2,"0");
    const correct=state.answers.filter(Boolean).length;
    const pct=Math.round(correct/state.qs.length*100);const passed=pct>=75;
    const prev=S.exams[mid]||{best:0};
    const best=Math.max(prev.best||0,pct);
    const firstPass=passed&&!examPassed(mid);
    S.exams[mid]={best,passed:passed||(prev.passed),lastPct:pct,ts:Date.now()};save();touchStreak();
    if(firstPass)addXP(isFinal?120:60,"Exam passed!");
    else if(pct>(prev.lastPct||0))addXP(10,"Improved score");
    v.innerHTML='<div class="page-in result-hero">'+
      '<div class="eyebrow" style="color:'+(passed?'var(--good)':'var(--crit)')+'">'+(passed?'Passed':'Not yet — 75% to pass')+'</div>'+
      '<div class="score" style="color:'+(passed?'var(--good)':'var(--crit)')+'">'+pct+'%</div>'+
      '<div class="mono" style="color:var(--tx2);margin-bottom:6px">'+correct+' of '+state.qs.length+' correct · '+elapStr+' · best '+best+'%</div>'+
      '<div class="pill '+(passed?'pass':'fail')+'" style="margin-bottom:22px">'+(passed?svg(IC.check,2.5)+' unit cleared':'keep going')+'</div>'+
      '<p class="sub" style="margin:0 auto 22px">'+(passed?(isFinal?'You can hold the room. Re-drill anything that slipped and keep the flashcards warm.':'Locked in. The reasoning is yours now — the flashcards will keep it retrievable.'):'Review the explanations, re-read the weak lesson, and retake. Mastery is the retake, not the first try.')+'</p>'+
      '<div class="row" style="justify-content:center">'+
        '<button class="btn" onclick="go(\''+(isFinal?'final':'module/'+mid)+'\')">Back</button>'+
        '<button class="btn pri" onclick="retryExam(\''+mid+'\')">Retake</button>'+
        (passed&&!isFinal?'<button class="btn gold" onclick="go(\'dashboard\')">Continue →</button>':'')+
      '</div></div>';
    window.scrollTo(0,0);
    bindQuizzes();
  }
}
function retryExam(mid){viewExam(document.getElementById("view"),mid);window.scrollTo(0,0);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* =================== FLASHCARDS =================== */
function viewCards(v){
  setCrumb("Flashcards");
  let queue=CARDS.filter(c=>cardState(c.id).due<=today());
  const reviewMode=queue.length>0;
  if(!reviewMode)queue=CARDS.slice();
  queue=shuffle(queue.slice());
  let i=0;
  render();
  function render(){
    if(i>=queue.length){
      v.innerHTML='<div class="page-in fc-stage empty">'+svg(IC.check,2)+'<h2 style="margin:10px 0 6px">Session complete</h2>'+
        '<p class="sub" style="margin:0 auto">'+(reviewMode?'All due cards reviewed. They\'ll resurface on schedule.':'You went through the whole deck.')+'</p>'+
        '<div class="row" style="justify-content:center;margin-top:18px"><button class="btn" onclick="go(\'dashboard\')">Dashboard</button><button class="btn pri" onclick="viewCards(document.getElementById(\'view\'))">Again</button></div></div>';return;
    }
    const c=queue[i];const st=cardState(c.id);
    v.innerHTML='<div class="page-in fc-stage">'+
      '<div class="eyebrow">'+(reviewMode?'Due for review':'Full deck')+' · card '+(i+1)+' / '+queue.length+'</div>'+
      '<h1 class="h-hero" style="font-size:24px">Numbers &amp; one-liners to know cold</h1>'+
      '<div class="bar" style="margin:14px 0"><i style="width:'+((i)/queue.length*100)+'%"></i></div>'+
      '<div class="fc" id="fc" tabindex="0" role="button" aria-label="Flashcard, activate to reveal answer"><div class="fc-inner">'+
        '<div class="fc-face fc-front"><span class="k">'+c.k+'</span><div class="q">'+c.q+'</div></div>'+
        '<div class="fc-face fc-back"><span class="k">answer</span><div class="a">'+c.a+'</div></div>'+
      '</div></div>'+
      '<div class="fc-hint" id="fcHint"><span class="kbd">Space</span> flip · <span class="kbd">1</span> missed · <span class="kbd">2</span> got it</div>'+
      '<div class="fc-grade" id="fcGrade" style="visibility:hidden"><button class="btn" onclick="window.__grade(false)">Missed it</button><button class="btn pri" onclick="window.__grade(true)">Got it ✓</button></div>'+
    '</div>';
    const fc=document.getElementById("fc");
    fc.addEventListener("click",()=>{fc.classList.toggle("flip");if(fc.classList.contains("flip")){document.getElementById("fcGrade").style.visibility="visible";document.getElementById("fcHint").textContent="how did you do?";}});
  }
  window.__grade=function(ok){const c=queue[i];touchStreak();gradeCard(c.id,ok);if(ok)addXP(4,"Card reviewed");i++;render();renderNav();};
}

let toastT;
function toast(msg,xp){const el=document.getElementById("toast");el.innerHTML=(msg)+(xp?' <span class="xpv">+'+xp+' XP</span>':'');el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("show"),2100);}
function resetAll(){if(confirm("Reset all progress, XP, streaks and flashcard scheduling? This cannot be undone.")){localStorage.removeItem(KEY);S=load();renderChrome();go("dashboard");route();toast("Progress reset");}}

/* modal + backup/restore */
function openModal(html){const m=document.getElementById("modal");m.querySelector(".sheet").innerHTML=html;m.classList.add("on");}
function closeModal(){document.getElementById("modal").classList.remove("on");}
function openBackup(){
  const cur=JSON.stringify(S);
  openModal('<h3>Backup &amp; restore</h3>'+
    '<p style="font-size:13px;color:var(--tx2);margin:6px 0 16px">Your progress lives in this browser only. Copy the text below and keep it somewhere safe — or paste a saved backup to restore it (here or on another device).</p>'+
    '<label class="eyebrow" style="display:block;margin-bottom:5px">Your progress · copy this</label>'+
    '<textarea class="ta" id="bkOut" readonly onclick="this.select()" style="min-height:84px;font-family:var(--mono);font-size:11px">'+cur+'</textarea>'+
    '<div class="row" style="margin:9px 0 20px"><button class="btn sm" onclick="copyBackup()">'+svg(IC.check,2)+' Copy</button><span class="mono" style="font-size:11px;color:var(--tx3)">'+overall().done+' units · '+S.xp+' XP · '+casesDoneN()+' cases</span></div>'+
    '<label class="eyebrow" style="display:block;margin-bottom:5px">Restore from a backup · paste, then restore</label>'+
    '<textarea class="ta" id="bkIn" placeholder="Paste a previously copied backup here..." style="min-height:66px;font-family:var(--mono);font-size:11px"></textarea>'+
    '<div class="row" style="justify-content:space-between;margin-top:16px"><button class="btn ghost sm" onclick="closeModal()">Close</button><button class="btn pri" onclick="restoreBackup()">Restore progress</button></div>');
}
function copyBackup(){const t=document.getElementById("bkOut");t.select();try{document.execCommand("copy");toast("Copied to clipboard");}catch(e){toast("Select the text and copy manually");}}
function restoreBackup(){
  const raw=(document.getElementById("bkIn").value||"").trim();
  if(!raw){toast("Paste a backup first");return;}
  try{const obj=JSON.parse(raw);if(!obj||typeof obj!=="object"||!("xp" in obj))throw 0;
    S=Object.assign({},DEF,obj);save();closeModal();renderChrome();go("dashboard");route();toast("Progress restored");}
  catch(e){toast("That doesn't look like a valid backup");}
}

/* theme */
function initTheme(){const t=localStorage.getItem("aict_theme");if(t)document.documentElement.setAttribute("data-theme",t);syncThemeIco();}
function toggleTheme(){const cur=document.documentElement.getAttribute("data-theme");const isDark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;const nx=isDark?"light":"dark";document.documentElement.setAttribute("data-theme",nx);localStorage.setItem("aict_theme",nx);syncThemeIco();}
function syncThemeIco(){const cur=document.documentElement.getAttribute("data-theme");const isDark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;document.getElementById("themeIco").innerHTML=isDark?'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>':'<circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>';}

function closeRail(){document.getElementById("rail").classList.remove("open");document.getElementById("scrim").classList.remove("on");}

/* keyboard controls: exams (1-4 / A-D / Enter) and flashcards (Space / 1 / 2) */
document.addEventListener("keydown",function(e){
  if(document.getElementById("modal").classList.contains("on")){if(e.key==="Escape")closeModal();return;}
  if(e.target&&(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT"))return;
  const h=location.hash;
  if(h.indexOf("exam")>-1){
    let idx=-1;
    if(e.key>="1"&&e.key<="9")idx=+e.key-1;
    else{const c=e.key.toLowerCase();if(c.length===1&&c>="a"&&c<="j")idx=c.charCodeAt(0)-97;}
    if(idx>=0){const opts=document.querySelectorAll("#view .opt");if(opts[idx]){opts[idx].click();e.preventDefault();}return;}
    if(e.key==="Enter"){const n=document.getElementById("examNext");if(n&&n.style.display!=="none"){n.click();e.preventDefault();}}
  } else if(h.indexOf("cards")>-1){
    const fc=document.getElementById("fc");if(!fc)return;
    if(e.key===" "||e.key==="Enter"){fc.click();e.preventDefault();}
    else if(fc.classList.contains("flip")&&window.__grade){
      if(e.key==="1"||e.key==="ArrowLeft"){window.__grade(false);e.preventDefault();}
      else if(e.key==="2"||e.key==="ArrowRight"){window.__grade(true);e.preventDefault();}
    }
  }
});

/* reading-progress bar on lessons and cases */
window.addEventListener("scroll",function(){
  const el=document.getElementById("readbar");if(!el)return;
  const h=location.hash;const on=(h.indexOf("lesson")>-1||h.indexOf("case")>-1);
  if(!on){if(el.style.opacity!=="0")el.style.opacity=0;return;}
  const max=document.documentElement.scrollHeight-window.innerHeight;
  const p=max>40?Math.min(100,window.scrollY/max*100):0;
  el.style.opacity=1;el.querySelector("i").style.width=p+"%";
},{passive:true});

initTheme();renderChrome();route();
