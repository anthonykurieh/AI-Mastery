{id:"l2",t:"Transparent reasoning & shared truth",min:7,html:`
<p class="lead">Two patterns that make a <em>multi-agent</em> system's collective reasoning inspectable and consistent.</p>
<h3>Fractal Chain-of-Thought (FCoT) Embedding</h3>
<p><strong>When:</strong> you need the whole system's reasoning inspectable, not just the top-level call. <strong>How:</strong> embed structured, nested chain-of-thought at <em>every</em> level — the orchestrator and each specialist reason explicitly and legibly, so their thinking composes into an auditable whole. <strong>Example:</strong> collaborative research synthesis where each contributing agent's reasoning is captured and nested under the overall argument. <strong>Payoff:</strong> a reviewer (human or agent) can trace <em>why</em> the system concluded what it did, at any depth.</p>
<h3>Shared Epistemic Memory</h3>
<p><strong>When:</strong> agents must operate from one consistent picture of the world. <strong>How:</strong> a common, versioned knowledge store agents read and write, so everyone shares the same facts and updates. <strong>Example:</strong> coordinating a response to a supply-chain disruption where all agents work from the same current state. <strong>Watch-outs:</strong> consistency, versioning, and trust in what's written to shared memory.</p>
<h3>Pattern composition for systemic reliability</h3>
<p>These aren't used in isolation. The book stresses <strong>composing</strong> patterns: anchor the constraints, embed FCoT for transparency, audit for fidelity, and share epistemic memory for consistency — together they produce a system that is reliable <em>and</em> explainable, which is the whole point of maturity Level 4.</p>
<div class="box key"><div class="bx-h">FCoT is the loan example's ‘mind’</div>The single-agent loan use case is guided by the FCoT framework — structured, recursive reasoning with a verification loop — so the agent's decision (approve/reject) comes with legible, auditable reasoning. Explainability isn't a report you add later; it's designed into how the agent thinks.</div>

id:"m8",n:"8",spine:true,t:"Robustness & Fault Tolerance Patterns",
sub:"The largest pattern family — because production is where agents fail. Voting, timeouts, recovery, security, and graceful degradation, chained to the reliability you need.",
lessons:[
{id:"l1",t:"The robustness spectrum & voting",min:8,html:`
<p class="lead">Robustness isn't a switch — it's a spectrum of ~five levels. You reach the reliability your use case demands by <em>chaining</em> fault-tolerance patterns, and you must <em>measure</em> where you are.</p>
<h3>How the patterns fit together</h3>
<p>No single pattern makes a system robust. A loan application, for example, might chain: validate inputs, run the critical decision through <strong>voting</strong>, <strong>escalate</strong> low-confidence cases, <strong>time out</strong> hung agents, <strong>retry</strong> transient failures adaptively, and <strong>checkpoint</strong> progress. Measure robustness with metrics like success rate under fault injection, mean time to recovery, and graceful-degradation coverage.</p>
<h3>Voting patterns — reliability through redundancy</h3>
<p><strong>Parallel Execution Consensus:</strong> run the same critical task on several agents in parallel and require agreement before proceeding — e.g. validating a credit-score assessment with multiple independent checks. <strong>Majority Voting Across Agents:</strong> take the majority answer of N agents to finalize a decision (e.g. a loan approval). Both trade cost for reliability, and both depend on the agents' errors being <em>independent</em> (see the consensus drill in Coordination II).</p>
<div class="box key"><div class="bx-h">Redundancy has a price and a precondition</div>Voting multiplies cost by N and only helps when agents fail independently. Use it on the <em>critical, hard-to-reverse</em> decisions (a loan approval, a compliance verdict), not on every step.</div>
`,checks:[

{q:"Majority voting is worth its N× cost specifically on:",opts:["Critical, hard-to-reverse decisions with independent agents","Every step of the workflow, for consistent reliability","Cheap read-only lookups where errors are easy to spot","Formatting and summarization steps near the end"],a:0,why:"Reserve expensive redundancy for high-stakes decisions, and only when errors are independent — otherwise the votes correlate and you pay N× for nothing."}

{id:"l2",t:"Timeouts, escalation & recovery",min:9,html:`
<p class="lead">Agents hang, drift, and crash. Five patterns keep a run alive and moving.</p>
<ul>
<li><strong>Watchdog Timeout Supervisor</strong> — a supervisor kills/restarts any agent that runs past a deadline, so one stuck agent can't freeze the system (e.g. a hanging analysis agent).</li>
<li><strong>Delayed Escalation Strategy</strong> — on low confidence, don't fail immediately; try lighter recovery first, then escalate (e.g. a low-confidence compliance check goes to a stronger model or a human only after cheaper options).</li>
<li><strong>Adaptive Retry with Prompt Mutation</strong> — on failure, analyze <em>why</em> and modify the prompt/approach before retrying, instead of repeating the same failing call (e.g. fixing a failed data extraction).</li>
<li><strong>Auto-Healing Agent Resuscitation</strong> — detect a crashed agent and automatically restart it with its state, so the system self-recovers (e.g. restarting a crashed data-processing agent).</li>
<li><strong>Incremental Checkpointing</strong> — persist state after each stage so a long pipeline resumes from the last good checkpoint instead of from scratch (e.g. a multi-stage document pipeline).</li>
</ul>
<div class="box key"><div class="bx-h">Retry, but reasoned</div>The book's ‘Retry’ discipline (from R⁵) is <em>adaptive</em>: blind retries repeat the same failure. Analyze the error, mutate the approach, then retry — the difference between a loop that wastes tokens and one that actually recovers.</div>
`,checks:[

],

{id:"l3",t:"Security, degradation & auditability",min:9,html:`
<p class="lead">The rest of the fault-tolerance family: defend against attacks, degrade gracefully under limits, and stay auditable.</p>
<h4>Security</h4>
<ul>
<li><strong>Agent Self-Defense</strong> — an agent detects and neutralizes adversarial input aimed at it (e.g. a prompt-injection attack on a feedback summarizer).</li>
<li><strong>Agent Mesh Defense</strong> — defense-in-depth across the network: a compromised agent is contained by its peers and can't reach sensitive tools/data (e.g. stopping a compromised chatbot from touching a database).</li>
<li><strong>Execution Envelope Isolation (sandboxing)</strong> — run risky actions (code execution) in a constrained sandbox so a malicious/buggy agent can't harm the host.</li>
</ul>
<h4>Graceful degradation</h4>
<ul>
<li><strong>Rate-Limited Invocation</strong> — throttle calls to respect downstream limits (e.g. a credit-bureau API) instead of hammering and failing.</li>
<li><strong>Fallback Model Invocation</strong> — if the primary model fails/times out, fail over to a secondary so the agent stays available.</li>
<li><strong>Trust Decay and Scoring</strong> — track each agent/source's reliability and down-weight the flaky ones over time (self-optimizing routing).</li>
<li><strong>Canary Agent Testing</strong> — roll out an upgraded agent to a small slice of traffic first, watch it, then promote — safe upgrades.</li>
<li><strong>Optimizing for Translation Overhead</strong> — cut the cost of converting data between agents/formats (e.g. summarizing a large document once rather than re-passing it everywhere).</li>
</ul>
<h4>Auditability</h4>
<p><strong>Causal Dependency Graph</strong> — record which inputs, agents, and steps caused each output, so you can trace <em>why</em> a decision was made (e.g. auditing a loan decision after the fact). This is the observability backbone AgentOps needs.</p>
<div class="box key"><div class="bx-h">Map to the security you already know</div>Self-Defense, Mesh Defense, and Sandboxing are the agentic form of ‘don't trust input, contain blast radius, least privilege’. Fallback + Rate-Limiting + Canary are the availability engineering (fail fast, throttle, roll out safely) that keep an autonomous system dependable.</div>
`,checks:[

{q:"You need to prove, after the fact, exactly why a loan was denied. The pattern:",opts:["Shared Epistemic Memory","Fallback Model Invocation","Fractal Chain-of-Thought","Causal Dependency Graph"],a:3,why:"The causal graph is the audit trail: it links every contributing factor to the outcome, which regulated decisions require."}
]

{id:"l1",t:"The five interaction patterns",min:8,html:`
<p class="lead">Autonomy is a dial, not a switch. These five patterns describe every hand-off between people and agents, each with a different trust and control profile.</p>
<div class="tblwrap"><table class="tbl"><tr><th>Pattern</th><th>Who initiates → who acts</th><th>Example</th></tr>
<tr><td class="mono">Agent Calls Human</td><td>Agent escalates to a person (HITL)</td><td>A loan agent pauses on an ambiguous application and asks a human to decide.</td></tr>
<tr><td class="mono">Human Delegates to Agent</td><td>Person hands a goal to an agent</td><td>Delegating market research to an agent and getting a report back.</td></tr>
<tr><td class="mono">Human Calls Agent</td><td>Person invokes an agent for a task</td><td>Asking an agent to check an order status.</td></tr>
<tr><td class="mono">Agent Delegates to Agent</td><td>Agent hands a sub-task to another agent</td><td>A lead agent delegating parts of a financial analysis to specialists.</td></tr>
<tr><td class="mono">Agent Calls Proxy Agent</td><td>Agent works through a proxy representing another party</td><td>A cross-enterprise loyalty program where one company's agent talks to another's proxy agent.</td></tr>
</table></div>
<div class="box key"><div class="bx-h">Agent Calls Human is the safety keystone</div>The most important of the five: when confidence is low or the stakes are high, the agent <strong>pauses and escalates to a person</strong> rather than acting. This is how you get most of the automation benefit while a human backstops the consequential decisions — the same instinct behind Delayed Escalation and Conflict Resolution's escalation paths. Design the escalation triggers (confidence thresholds, risk categories, ambiguity) deliberately.</div>
<p><strong>Agent Calls Proxy Agent</strong> is the pattern that makes <em>cross-organization</em> agent collaboration possible: your agent never touches the other company's internals — it talks to a proxy that represents them, preserving boundaries and trust.</p>

{id:"l1",t:"Building a capable single agent",min:8,html:`
<p class="lead">Before multi-agent complexity, master the single agent. These five patterns stack into one that's genuinely production-worthy — and they map onto the anatomy loop.</p>
<ul>
<li><strong>Single Agent Baseline</strong> — one LLM + tools solving a well-defined task (e.g. a simple loan-approval agent). The starting point everything else builds on.</li>
<li><strong>Agent-Specific Context and Memory</strong> — give the agent state so it's coherent across a conversation/session (e.g. a stateful conversational loan agent that remembers the applicant).</li>
<li><strong>Sensing with RAG</strong> — retrieval as perception, grounding the agent in current, private facts (e.g. a RAG-enabled loan agent checking live policy).</li>
<li><strong>Structured Reasoning and Self-Correction</strong> — the agent plans, critiques its own draft against criteria, and revises before acting (the ReAct/Reflexion idea as an internal pattern; e.g. a self-correcting loan agent).</li>
<li><strong>Multimodal Sensory Input</strong> — sense beyond text: images, documents, audio (e.g. reading a loan application from a scanned image).</li>
</ul>
<div class="box key"><div class="bx-h">They map onto the anatomy</div>Memory = the Memory component; Sensing with RAG and Multimodal input = the Sense component; Structured Reasoning & Self-Correction = the Reason/Plan components with an internal feedback loop. The agent-level patterns are just the anatomy, made concrete and reliable — and each maps to a measurable success metric.</div>

lessons:[
{id:"l1",t:"The four production patterns",min:8,html:`
<p class="lead">These patterns are about the <em>system</em> around the agents — the plumbing that makes a fleet governable, discoverable, secure, and responsive.</p>
<ul>
<li><strong>Tool and Agent Registry</strong> — a discoverable catalog of available tools and agents (capabilities, schemas) so the system binds to the right one at run time instead of hardcoding. <em>Example:</em> a dynamic procurement system discovering supplier agents. This is the enterprise realization of the A2A agent-card idea.</li>
<li><strong>Real-Time Compliance Monitoring</strong> — continuously check agent actions against policy <em>as they happen</em>, blocking or flagging violations live. <em>Example:</em> a HIPAA-compliant healthcare agent whose every output is screened for PHI leakage in real time.</li>
<li><strong>Agent Authentication and Authorization</strong> — agents have identities and scoped permissions; a request is authenticated and authorized before it runs. <em>Example:</em> a multi-departmental analytics system where each agent can only touch data its role permits (least privilege).</li>
<li><strong>Event-Driven Reactivity</strong> — agents react to events (messages, webhooks, state changes) rather than only running on request. <em>Example:</em> an automated customer-support system that wakes agents when a ticket arrives.</li>
</ul>
<div class="box key"><div class="bx-h">Identity is the foundation of agent security</div>Once agents act autonomously and call tools, ‘which agent is allowed to do what’ becomes a first-class question. <strong>Agent authn/authz</strong> + <strong>real-time compliance monitoring</strong> together are how you let autonomous agents loose without letting them exceed their authority — the production-grade version of least privilege and the audit trail.</div>

id:"m12",n:"12",spine:true,t:"Building Agents That Learn",
sub:"The flywheel and the R⁵ disciplines that turn ‘prompt and pray’ into ‘operate and improve’ — plus the economics that decide whether it ships.",
lessons:[
{id:"l1",t:"The Self-Improvement Flywheel & R⁵",min:8,html:`
<p class="lead">A learning agent is a closed loop that generates, judges its own output, and feeds the lesson back. Two frameworks make that loop safe and real.</p>
<h3>The Self-Improvement Flywheel</h3>
<p>Four stages, repeated: <strong>Generate</strong> (produce a solution) → <strong>Evaluate</strong> (score it against quality criteria) → <strong>Learn</strong> (update/tune toward better outputs) → <strong>Deploy</strong> (release the improvement). The <strong>Evaluate</strong> stage is the crucial one — <em>a system can only improve what it can measure.</em> And the Learn stage must balance <strong>exploitation</strong> (refining known-good strategies) with <strong>exploration</strong> (trying novel ones) or it stagnates in a local optimum.</p>
<div class="box warnbx"><div class="bx-h">A self-updating loop is a risk</div>If the agent learns from bad data or hallucinates during evaluation, the flywheel becomes a <em>vicious</em> cycle of degradation. That's why you need engineering discipline governing it — the R⁵ model.</div>
<h3>The R⁵ model — operate and improve</h3>
<ul>
<li><strong>Relax</strong> — actively manage context and latency so agents stay coherent under load (fight lost-in-the-middle).</li>
<li><strong>Reflect</strong> — inject deliberate self-critique checkpoints so agents improve mid-run without retraining.</li>
<li><strong>Reference</strong> — surface provenance (citations, retrieval traces) so outputs are attributable and defensible.</li>
<li><strong>Retry</strong> — make error handling adaptive and reasoned, not blind repetition.</li>
<li><strong>Report</strong> — quantify factuality, consistency, and process quality to close the feedback loop.</li>
</ul>
<div class="box key"><div class="bx-h">How they connect</div>The flywheel is the <em>what</em> (a continuous learning loop); R⁵ is the <em>how</em> (the disciplines that keep it production-safe). The flywheel is essentially a large-scale implementation of R⁵'s Reflect, Retry, and Report loops.</div>
`,checks:[
{q:"Why is ‘Evaluate’ the crucial stage of the Self-Improvement Flywheel?",opts:["It's the cheapest stage to scale up across many tasks","It's the fastest stage to run, so it sets the pace","Without measurement, there's no signal to improve on","It's the only stage that doesn't need labelled data"],a:2,why:"Measurement is the whole basis of improvement. Poor evaluation turns the flywheel into a vicious cycle, which is why R⁵'s Report discipline matters."},
{q:"The R⁵ ‘Reference’ discipline is about:",opts:["Retrying failed steps with a changed approach","Managing context length and response latency","Adding self-critique checkpoints during a run","Surfacing provenance so outputs can be checked"],a:3,why:"Reference = grounding/provenance, connecting back to maturity Level 4. Each R⁵ letter is a distinct production discipline."}
],
ex:[{type:"order",title:"The Self-Improvement Flywheel",intro:"Order the four stages of one turn of the flywheel.",items:["Generate — produce a candidate solution","Evaluate — score it against quality criteria","Learn — update/tune toward better outputs","Deploy — release the improvement for the next cycle"],why:"Generate → Evaluate → Learn → Deploy, repeated. Evaluate is crucial (you can only improve what you measure); Learn must balance exploitation with exploration."}]
},
{id:"l2",t:"Patterns for learning safely",min:8,html:`
<p class="lead">The patterns that implement the flywheel — and the key insight that an agent can't grade its own homework.</p>
<ul>
<li><strong>Hybrid (Planner + Scorer) Architecture</strong> — split generation from evaluation into two agents so the critic is <em>objective</em>. A single agent judging itself rationalizes its mistakes (a kind of ‘mode collapse’ where it reinforces its own errors). This is the foundational pattern for all self-improvement.</li>
<li><strong>Custom Evaluation Metrics</strong> — generic metrics miss what matters; define task-specific ones (the book's <em>STEPScore</em> example scores multi-step process quality, not just the final answer).</li>
<li><strong>Preference-Controlled Synthetic Data Generation</strong> — generate training data steered toward desired preferences, to teach the model what ‘good’ looks like at scale.</li>
<li><strong>Advanced tuning</strong> — foundational tuning (SFT + PEFT) for capability, then <strong>preference-based tuning (DPO)</strong> to align outputs with human/quality preferences.</li>
<li><strong>Coevolved Agent Training</strong> — agents improve against each other (e.g. a generator vs a critic) so both get stronger over time.</li>
<li><strong>Adversarial Testing & Red Teaming</strong> — deliberately attack your own agents to find failures before adversaries (or production) do.</li>
</ul>
<div class="box key"><div class="bx-h">The keystone insight</div>You cannot let one agent both create and objectively judge its own work — it will rationalize. Every reliable learning system structurally <strong>separates the generator from the evaluator</strong> (Planner + Scorer). That separation is what makes the flywheel's feedback trustworthy.</div>
`,checks:[
{q:"Why does the Hybrid (Planner + Scorer) architecture use two separate agents?",opts:["A self-judging agent rationalizes its own mistakes","Two agents running in parallel finish tasks faster","It roughly halves the token cost of every task","It lets each agent run on a different vendor's model"],a:0,why:"Structural separation of generation and evaluation is what makes the learning feedback objective and reliable — the same logic as Instruction Fidelity Auditing."},
{q:"Preference-based tuning (DPO) is used to:",opts:["Add large amounts of new factual knowledge to the model","Shrink the amount of context the model needs per task","Speed up inference, especially on long input prompts","Align outputs with preferences for what good looks like"],a:3,why:"DPO aligns to preferences; SFT/PEFT builds capability; RAG supplies facts. Different tools for different jobs."}
]
},
{id:"l3",t:"Tokenomics & measuring ROI",min:8,drill:"tokenomics",html:`
<p class="lead">Learning agents and multi-agent systems are expensive to run. Two patterns keep them fundable: control the token spend, and prove the business value. Run the tokenomics drill above, then the ROI drill below.</p>
<h3>Cost Management and Tokenomics</h3>
<p><strong>The problem:</strong> multi-agent systems fan out into many LLM calls (orchestrator + specialists + reflection loops), each re-sending context — so cost scales with agents and steps, not just tasks. <strong>The levers</strong> (from the drill): route easy sub-tasks to cheaper models, trim and cache context, cap output and reflection iterations, and batch async work. Instrument cost per task and per feature so it never surprises you.</p>
<h3>Measuring Business Value (ROI)</h3>
<p><strong>The problem:</strong> a system that works technically still has to justify its cost. <strong>The pattern:</strong> quantify value = tasks × time saved × loaded rate × <em>realistic</em> automation rate, minus run+ops cost; express it as ROI and payback. The honest variable is the <strong>automation rate</strong> — demos automate 100% of the happy path; production automates 60–80% and escalates the rest (which is why Agent-Calls-Human matters to the business case, not just to safety).</p>
`,checks:[
{q:"Why does a multi-agent system's cost scale faster than the number of tasks?",opts:["Network fees rise sharply with traffic between agents","Storage costs grow quickly with every agent that's added","Multi-agent systems need much larger models for every role","Each task fans out into many calls, each re-sending context"],a:3,why:"The fan-out multiplier is the whole point of the tokenomics drill. Control it with routing, context trimming, caching, and capping reflection loops."},
{q:"The variable that most often breaks an agent ROI case is:",opts:["The model's name","The price per token","The automation rate","The framework chosen"],a:2,why:"Honest ROI uses the real automation rate and full run+ops cost. This is exactly why HITL escalation shapes the business case, not just safety."}
],

sub:"How to sequence the whole journey by maturity level — and how to choose between ADK, CrewAI, and LangGraph to build it.",
lessons:[
{id:"l1",t:"The implementation roadmap",min:8,html:`
<p class="lead">The book closes the loop: a practical, level-by-level roadmap that tells you which patterns to implement in what order, so effort maps to a validated state of maturity.</p>
<div class="tblwrap"><table class="tbl"><tr><th>Level</th><th>Principle</th><th>Focus &amp; representative patterns</th></tr>
<tr><td class="mono">1 · Foundational</td><td>Get a single agent working reliably</td><td>Single Agent Baseline, context/memory, Sensing with RAG, structured reasoning. Prove value on one well-defined task.</td></tr>
<tr><td class="mono">2 · Production-ready service</td><td>Make it robust, secure, and governable</td><td>Add fault-tolerance (watchdog, retry, fallback, checkpointing), compliance monitoring, authn/authz, HITL escalation, observability. This is the demo→production gap.</td></tr>
<tr><td class="mono">3 · Self-improving ecosystem</td><td>Let it learn and coordinate at scale</td><td>Multi-agent coordination, the Self-Improvement Flywheel + R⁵, custom evals, learning patterns. Autonomy earned by evidence.</td></tr>
</table></div>
<div class="box key"><div class="bx-h">The strategic reflection guide</div>Four questions to place yourself and plan: <strong>Where are you today?</strong> (assess current maturity) · <strong>What is your minimum viable agent?</strong> (the smallest reliable Level-1 win) · <strong>What is your path to production?</strong> (the Level-2 robustness/governance patterns you'll need) · <strong>What is your North Star?</strong> (the Level-3 autonomy you're building toward). Pattern-first, reverse-engineered from a target capability.</div>
<p>The discipline is the same one from Chapter 1: don't build everything — pick the target capability, identify the handful of patterns that deliver that level, and implement exactly those.</p>
`,checks:[
{q:"A team has a single agent working on one task and wants to reach production. Their roadmap focus (Level 2) is:",opts:["Adding more specialist agents straight away","Robustness, security, governance and observability","Moving on to self-improvement and learning loops","Fine-tuning a bigger model for the same task"],a:1,why:"Level 2 is about making the working agent reliable, secure, and governable. Multi-agent coordination and learning (Level 3) come after production-readiness."}
],

{id:"l2",t:"Choosing a framework: ADK, CrewAI, LangGraph",min:8,html:`
<p class="lead">Frameworks accelerate but don't replace design — the patterns are the architecture; the framework is how you express them. Three dominate, with different philosophies.</p>
<div class="tblwrap"><table class="tbl"><tr><th></th><th>Google ADK</th><th>CrewAI</th><th>LangGraph</th></tr>
<tr><td class="mono">Core abstraction</td><td>Production-grade agents + runtimes</td><td>Role-playing teams (a ‘crew’)</td><td>Stateful graph (a state machine)</td></tr>
<tr><td class="mono">Control flow</td><td>Planner-driven; sequential or parallel</td><td>High-level: sequential or hierarchical</td><td>Fine-grained: graph edges, cycles, branches</td></tr>
<tr><td class="mono">State</td><td>Managed (session/runtime)</td><td>Implicit (passed task→task)</td><td>Explicit (a central State object per node)</td></tr>
<tr><td class="mono">Guardrails</td><td>Callbacks/middleware (PII, HITL, caching)</td><td>Event-driven hooks</td><td>Built into graph logic</td></tr>
<tr><td class="mono">Sweet spot</td><td>Enterprise, Google ecosystem, robust ops</td><td>Fast to build collaborative crews</td><td>Complex control flow, cycles, inspectable state</td></tr>
</table></div>
<div class="box key"><div class="bx-h">How to choose</div><strong>CrewAI</strong> when you want to stand up a collaborative team fast with simple sequential/hierarchical flow. <strong>LangGraph</strong> when you need cycles, conditional branching, and explicit, inspectable state (retry loops, ‘if validation failed go to rejection node’) — the advanced patterns need this control. <strong>ADK</strong> when you want production runtimes, managed state, and callback guardrails, especially in the Google/Vertex ecosystem. Match the framework to your <em>maturity level and control needs</em> — and remember the pattern is the architecture, the framework just expresses it.</div>
`,checks:[
{q:"Your agent workflow needs conditional loops — ‘if validation fails, go to the rejection node; else continue to credit check’ — with inspectable state at every step. Best fit:",opts:["LangGraph","CrewAI","Google ADK","A single prompt"],a:0,why:"LangGraph models the app as a state machine with explicit state and conditional edges — ideal for cycles, branching, and debuggable control flow."},
{q:"The book's stance on frameworks vs patterns:",opts:["Avoid frameworks altogether and build from scratch","The framework you pick effectively is the architecture","Standardize on one framework before designing anything","Patterns are the architecture; frameworks express them"],a:3,why:"Pattern-first: choose the architecture (patterns) for your target capability, then pick the framework whose control model best expresses it."}
]
}
],

<script>
/* ============ CASE LAB DATA (agentic design challenges) ============ */
window.CASES=[
{id:"coord",cls:"gen",type:"Pattern selection · Coordination",title:"Choose the coordination pattern",
blurb:"A logistics firm wants specialist agents to collaborate on order fulfilment. Pick the right coordination pattern and defend it.",
scenario:"A logistics company wants agents for <b>inventory, routing, and customer-notification</b> to work together to fulfil orders. Orders are high-volume, must be <b>auditable</b> for disputes, and the steps are largely known in advance. Choose a coordination pattern and justify it against the alternatives.",
debrief:"The move was to read the requirements (known steps + auditability) straight into a pattern (Supervisor), and to reject swarm/blackboard for concrete reasons, not taste. Naming why the alternatives lose is what separates a pattern user from a pattern collector.",
steps:[
{t:"Read the requirements into a pattern",prompt:"Which coordination pattern fits, and what in the requirements points to it?",hint:"Known steps + auditability are strong signals.",
model:"<b>Supervisor Architecture (centralized orchestration).</b> The steps are largely known and the process must be auditable — both point to a central orchestrator that decomposes the order, delegates to the inventory/routing/notification specialists (via A2A), and integrates results. Predictable and traceable, which auditability demands.",
rubric:["Chose Supervisor / centralized orchestration","Tied it to ‘known steps’ (predictable decomposition)","Tied it to ‘auditability’ (central, traceable control)","Mentioned specialists + A2A delegation"]},
{t:"Reject the alternatives — with reasons",prompt:"Why not a Swarm, a Blackboard, or just an Agent Router?",hint:"Each fails a specific requirement.",
model:"<b>Swarm:</b> emergent, decentralized behaviour is hard to audit and predict — fails the auditability requirement. <b>Blackboard:</b> great for opportunistic, order-free collaboration, but here the order <em>is</em> known, so its flexibility is unneeded overhead and shared-state contention is a risk at high volume. <b>Agent Router:</b> only dispatches one request to one agent — it can't coordinate a multi-step, multi-specialist workflow. The supervisor is the least coordination that meets all requirements.",
rubric:["Rejected swarm on auditability/predictability","Rejected blackboard (order is known; needless flexibility/contention)","Rejected router (can't coordinate multi-step work)","Invoked ‘least coordination that meets the requirements’"]},
{t:"Name the trade-off and guard it",prompt:"What's the main weakness of your choice, and which pattern guards it?",hint:"Centralization has a cost.",
model:"The supervisor is a <b>bottleneck and single point of failure</b>. Guard it with robustness patterns: a <b>Watchdog Timeout Supervisor</b> and <b>Auto-Healing Resuscitation</b> so a stuck/crashed orchestrator recovers, <b>Incremental Checkpointing</b> so a long fulfilment resumes, and a <b>Supervision Tree</b> if you want fault isolation across specialists. Chain robustness onto the coordination choice.",
rubric:["Identified the supervisor as bottleneck / single point of failure","Named a concrete guard (watchdog, auto-healing, checkpointing, supervision tree)","Showed pattern-chaining (coordination + robustness)","Kept the trade-off honest rather than claiming no downside"]}
]},
{id:"robust",cls:"gen",type:"Pattern selection · Robustness",title:"Diagnose the failure, prescribe the pattern",
blurb:"Four production incidents on an agentic pipeline. Match each to the fault-tolerance pattern that fixes it.",
scenario:"An agentic document-processing pipeline has four recurring incidents: (1) one agent occasionally <b>hangs forever</b>, freezing the run; (2) a long job <b>crashes at stage 9 of 10</b> and restarts from scratch; (3) an extraction step <b>fails repeatedly on the same malformed input</b>; (4) a critical classification is <b>sometimes wrong</b> and the error is costly. Prescribe a pattern for each.",
debrief:"Robustness is a vocabulary: each failure mode has a named pattern. Fluency is hearing the symptom and naming the pattern — and knowing that voting only helps when the errors are independent.",
steps:[
{t:"Match failures to patterns",prompt:"Prescribe the fault-tolerance pattern for each of the four incidents.",hint:"One named pattern each.",
model:"(1) Hanging agent → <b>Watchdog Timeout Supervisor</b> (kill/restart past a deadline). (2) Crash-restarts-from-scratch → <b>Incremental Checkpointing</b> (resume from the last good stage). (3) Repeated failure on the same input → <b>Adaptive Retry with Prompt Mutation</b> (analyze the error, change the approach, then retry). (4) Costly wrong classification → <b>Majority Voting Across Agents</b> / <b>Parallel Execution Consensus</b> (run N independent agents, take the majority).",
rubric:["Watchdog Timeout for the hang","Incremental Checkpointing for the crash/restart","Adaptive Retry with Prompt Mutation for repeated same-input failure","Majority Voting / Parallel Consensus for the costly wrong answer"]},
{t:"The catch on voting",prompt:"For incident 4, what must be true for voting to actually help — and what would defeat it?",hint:"Independence.",
model:"Voting helps only if each agent is <b>better than chance</b> and their errors are <b>independent</b>. If all N agents use the <em>same model and prompt</em>, they share the same blind spot and vote the same wrong answer — the votes correlate and you pay N× for no gain. Defeat the correlation by <b>diversifying models and/or prompts</b> so the errors are genuinely independent.",
rubric:["Stated agents must be better than chance (p>0.5)","Stated errors must be independent","Explained that same model/prompt ⇒ correlated errors ⇒ voting fails","Prescribed diversifying models/prompts"]},
{t:"When to escalate instead",prompt:"For the costly classification, when should you escalate to a human instead of voting?",hint:"Cost vs stakes.",
model:"When the error is <b>high-stakes or irreversible</b> and confidence is low, don't just vote — <b>escalate to a human</b> (Agent Calls Human), optionally after a <b>Delayed Escalation</b> tries cheaper recovery first. Voting reduces error but never to zero; for consequential, hard-to-reverse decisions a human backstop is the responsible design, and it also keeps the ROI case honest.",
rubric:["Escalate when high-stakes/irreversible + low confidence","Named Agent Calls Human (HITL)","Mentioned Delayed Escalation (cheap recovery before human)","Noted voting reduces but never eliminates error"]}
]},
{id:"harden",cls:"ai",type:"Design & hardening",title:"Take a brittle monolith to production",
blurb:"A single-agent prototype works in the demo. Harden it into a Level-2 production service.",
scenario:"A team has a <b>single-agent</b> prototype that handles support tickets end to end. It works in the demo, but leadership won't ship it: no monitoring, no failure handling, no guardrails, and one hallucination could be costly. Design the path from working prototype to production-ready service.",
debrief:"You just walked the demo→production gap the whole book is about — Level 1 to Level 2 — by chaining robustness, human-in-the-loop, compliance, and observability onto a working agent. Production isn't a bigger model; it's the patterns around the model.",
steps:[
{t:"Name the gap",prompt:"Why won't a working prototype ship? Frame the Level-1 → Level-2 gap.",hint:"Demo = happy path.",
model:"A demo is the happy path; production is everything else. The gap is <b>robustness</b> (it has no failure handling), <b>governance/safety</b> (no guardrails on a costly hallucination), <b>observability</b> (no way to see or debug what it did), and <b>a human backstop</b> for the cases it shouldn't decide alone. That's precisely the maturity-model Level-1 → Level-2 transition.",
rubric:["Framed it as the demo→production (Level 1→2) gap","Named missing robustness / failure handling","Named missing guardrails/safety for hallucination risk","Named missing observability and human backstop"]},
{t:"Chain the patterns",prompt:"Which specific patterns do you add, and what does each fix?",hint:"Robustness + HITL + compliance + observability.",
model:"<b>Robustness:</b> Adaptive Retry (transient failures), Fallback Model Invocation (primary down), Watchdog Timeout (hangs), Rate-Limited Invocation (respect downstream APIs). <b>Safety:</b> Agent Calls Human for low-confidence/high-stakes tickets; Real-Time Compliance Monitoring + callbacks to catch policy/PII issues live. <b>Trust:</b> grounding with citations (Reference) so answers are checkable. <b>Observability:</b> step-level tracing (AgentOps) + a Causal Dependency Graph so any bad answer is traceable.",
rubric:["Added concrete robustness patterns (retry/fallback/watchdog/rate-limit)","Added HITL escalation for low-confidence/high-stakes","Added compliance monitoring / guardrails + grounding","Added observability (tracing / causal graph)"]},
{t:"Prove it's ready",prompt:"How do you demonstrate to leadership that it's now production-ready?",hint:"Measure robustness and value.",
model:"Show <b>measured</b> reliability, not vibes: success rate under <b>fault injection</b>, mean-time-to-recovery, escalation rate, and a compliance-violation rate of ~0 on a labelled test set. Then the <b>business case</b>: ROI from the tokenomics/ROI drills using the <em>realistic</em> automation rate (with the escalated minority costed as human time). Robustness measured + ROI justified is what ‘ready’ means.",
rubric:["Proposed measuring robustness under fault injection (success rate, MTTR)","Included escalation rate + compliance violation rate","Tied readiness to a measured business case (ROI, realistic automation rate)","Framed readiness as measured, not asserted"]}
]},
{id:"compliance",cls:"ai",type:"Design & hardening",title:"Design a compliance-critical agent",
blurb:"A healthcare agent handles patient data under HIPAA. Design it so it can be trusted and audited.",
scenario:"You're designing an agent that answers clinician questions using <b>patient records</b>. It must never leak protected health information to an unauthorized user, every answer must be <b>auditable</b>, and a wrong answer on a clinical question must be escalated. Design the architecture and the patterns that make it defensible.",
debrief:"Compliance-critical design is pattern composition: identity + live monitoring + provenance + inspectable reasoning + a human backstop. No single pattern makes it trustworthy; the composition does — which is the book's Level-4 message.",
steps:[
{t:"Identity & access first",prompt:"What's the foundational layer, and which patterns implement it?",hint:"Who is allowed to see what?",
model:"<b>Agent Authentication and Authorization</b> is foundational: every request is authenticated and the agent enforces <b>least-privilege</b> access so PHI only reaches authorized users. Enforce per-user permissions at retrieval so the RAG layer can't surface records the requester isn't entitled to. Identity is the base of agent security once the agent acts autonomously.",
rubric:["Started with authn/authz (identity + least privilege)","Enforced per-user permissions at retrieval (no PHI leakage)","Framed identity as the security foundation","Connected it to the RAG/sensing layer"]},
{t:"Monitor, ground, and make it inspectable",prompt:"Which patterns give you live safety, trust, and auditability?",hint:"Real-time + provenance + transparent reasoning.",
model:"<b>Real-Time Compliance Monitoring</b> screens every output for PHI/policy violations as it happens (via callbacks). <b>Grounding/Reference</b>: every clinical claim cites the record it came from, so answers are checkable. <b>Fractal Chain-of-Thought</b> + a <b>Causal Dependency Graph</b> make the reasoning and the inputs behind each answer fully inspectable — the audit trail regulators require.",
rubric:["Real-Time Compliance Monitoring via callbacks","Grounding/citations for every clinical claim","FCoT / inspectable reasoning","Causal Dependency Graph for the audit trail"]},
{t:"The human backstop",prompt:"Where does the human belong, and why is that both a safety and a business decision?",hint:"Agent Calls Human.",
model:"Route low-confidence or high-stakes clinical questions to a clinician via <b>Agent Calls Human</b> (optionally after Delayed Escalation tries cheaper recovery). It's a <b>safety</b> decision (never auto-decide a consequential clinical call at low confidence) and a <b>business</b> one (the escalated fraction sets the realistic automation rate in the ROI case). Compose all of it — identity, monitoring, grounding, inspectability, HITL — because Level-4 trust comes from composition, not any single pattern.",
rubric:["Agent Calls Human for low-confidence/high-stakes clinical questions","Framed HITL as both safety and business (automation rate)","Emphasized composition of patterns for trust","Coherent end-to-end defensible design"]}
]},
{id:"loan",cls:"run",type:"Running build · Loan processing",title:"Loan processing: single → multi-agent",
blurb:"The book's spine example. Design the single-agent version, then decompose it into a resilient multi-agent crew.",
scenario:"Build an agentic <b>loan-processing</b> system. It must handle a multi-step workflow (intake → validation → credit check → risk → decision), make <b>auditable, explainable</b> approve/deny decisions, and handle exception paths (rejections). Start as a single agent, then evolve it. This is the arc of the book's two use-case chapters.",
debrief:"You just traced the book's central journey: a capable-but-brittle monolith (Level 3/5) becomes a resilient, maintainable crew (Level 4/6) by decomposing into specialists under a supervisor with guardrails — while FCoT keeps every decision explainable. One system, every pattern.",
steps:[
{t:"The single agent's mind (FCoT)",prompt:"Design the single-agent version. How do you make its decisions reliable and explainable?",hint:"Instruction contract + recursive reasoning + verification.",
model:"A <b>monolithic agent</b> with tools for each step, guided by the <b>Fractal Chain-of-Thought</b> framework: an <b>instruction contract</b> encoding governance/safety rules (the constraints it must follow), and a <b>recursive reasoning loop</b> that plans, executes a step, and <b>verifies</b> before continuing. FCoT makes the approve/deny decision <b>explainable</b> — the reasoning is legible and auditable. This is a capable Level-5 agent, but brittle: one mind doing everything.",
rubric:["Single agent with per-step tools","Used FCoT: instruction contract (governance/safety)","Recursive plan → act → verify loop","Named the weakness: capable but brittle monolith"]},
{t:"Decompose into a crew",prompt:"Evolve it to multi-agent. What's the architecture and why is it better?",hint:"Supervisor + specialists + guardrails.",
model:"A <b>Supervisor (orchestrator)</b> delegates to <b>specialist agents</b> — validation, credit-check, risk — each with dedicated tools, coordinating via <b>A2A</b> (Agent Delegates to Agent). Add <b>production guardrails</b> (callbacks for safety/PII, compliance monitoring) and <b>observability</b> in the execution loop. This is more <b>robust</b> (isolate failures), <b>maintainable</b> (change one specialist without touching others), and <b>scalable</b> (add specialists as complexity grows) — the Level-4 resilient team versus the Level-3 brittle monolith.",
rubric:["Supervisor orchestrator + specialist agents (validation/credit/risk)","A2A delegation (Agent Delegates to Agent)","Production guardrails + observability in the loop","Justified robustness / maintainability / scalability gains"]},
{t:"Handle the exception path & map to levels",prompt:"How does the crew handle a rejection, and how does the whole build map to the maturity levels?",hint:"Critical reasoning + escalation; Level 3→4/6.",
model:"On a <b>high-risk / denied</b> path, the risk specialist's critical reasoning drives a documented denial; ambiguous cases <b>escalate to a human</b> (Agent Calls Human) rather than auto-denying. Mapping: the single agent is the <b>capable-but-brittle monolith (≈Level 3/5)</b>; the supervised crew with guardrails and A2A is the <b>resilient, collaborative team (≈Level 4/6)</b>. Beyond that, adding the learning flywheel + R⁵ would push toward a self-improving ecosystem (Level 3 of the implementation roadmap).",
rubric:["Exception/denied path handled with explainable critical reasoning","Ambiguous cases escalate to a human (HITL)","Mapped single-agent → Level 3/5 (brittle monolith)","Mapped multi-agent crew → Level 4/6 (resilient team)"]}
]},
{id:"learn",cls:"run",type:"Running build · Self-improvement",title:"Make the loan agent learn",
blurb:"Take the loan system to the self-improving level — safely. Design the flywheel and the R⁵ disciplines.",
scenario:"Leadership wants the loan system to <b>get better over time</b> from its own production experience — without the risk of it learning the wrong lessons. Design the self-improvement loop and the guardrails that keep it from degrading.",
debrief:"Self-improvement is a loop you must engineer, not switch on. Planner+Scorer for objective evaluation, a real metric, R⁵ discipline, and human oversight are what turn a flywheel into a virtuous cycle instead of a vicious one.",
steps:[
{t:"Structure the loop objectively",prompt:"What's the core architecture, and why can't one agent do it alone?",hint:"An agent can't grade its own homework.",
model:"Use the <b>Hybrid (Planner + Scorer) architecture</b>: a planner generates decisions, a <b>separate</b> scorer evaluates them against quality criteria. One agent can't objectively judge its own work — it rationalizes (mode collapse), producing a biased learning signal. The separation is what makes the <b>Self-Improvement Flywheel</b> (Generate → Evaluate → Learn → Deploy) trustworthy. Remember: you can only improve what you can measure.",
rubric:["Hybrid Planner + Scorer (separate generator and evaluator)","Explained why self-evaluation fails (rationalization / mode collapse)","Named the flywheel: Generate → Evaluate → Learn → Deploy","‘Can only improve what you can measure’"]},
{t:"Measure the right thing",prompt:"What do you evaluate, and how do you avoid a vicious cycle?",hint:"Custom metrics + R⁵.",
model:"Define <b>Custom Evaluation Metrics</b> for what actually matters — not just final approve/deny accuracy but <b>process quality</b> (a STEPScore-style metric over the reasoning steps) and compliance adherence. Govern the loop with <b>R⁵</b>: Reference (provenance), Report (quantify factuality/consistency), Reflect (self-critique), Retry (adaptive), Relax (context/latency). Without disciplined evaluation, learning from bad data turns the flywheel <b>vicious</b>.",
rubric:["Custom, task-specific metrics (not just final accuracy)","Included process-quality / compliance in the metric","Applied R⁵ disciplines to govern the loop","Named the vicious-cycle risk from bad evaluation"]},
{t:"Keep humans and exploration in",prompt:"What final safeguards keep the learning safe and effective?",hint:"Oversight + exploration/exploitation + red teaming.",
model:"Keep a <b>human in the loop</b> approving model updates before Deploy (don't auto-ship a self-tuned lender). Balance <b>exploitation vs exploration</b> so it doesn't stagnate in a local optimum. Run <b>Adversarial Testing & Red Teaming</b> against each candidate before promotion, and roll out via <b>Canary Agent Testing</b> to a small traffic slice first. Learning is powerful and dangerous — gate it with oversight, testing, and staged rollout.",
rubric:["Human approval gate before deploying updates","Balanced exploitation with exploration","Adversarial testing / red teaming before promotion","Staged rollout via canary testing"]}
]}
];
</script>
<script>
var FINAL=[
{q:"Foundations · An agent (vs a workflow) is:",opts:["A RAG pipeline that keeps memory between sessions","An LLM in a loop with tools that chooses its next action","An LLM with a long system prompt and many tools attached","A model fine-tuned to complete one specific task"],a:1,why:"Agent = model-driven control loop; workflow = code-driven fixed path. That distinction decides whether you even need an agent."},
{q:"Foundations · MCP vs A2A:",opts:["Both connect agents to humans","MCP: agent to tools; A2A: agent to agent","MCP: agent to agent; A2A: agent to tools","MCP for training; A2A for serving"],a:1,why:"An orchestrator uses A2A to delegate to specialists; each specialist uses MCP to reach its tools."},
{q:"Maturity · Your maturity level is determined by:",opts:["Your total AI budget","How many GPUs you have access to","The patterns you implement","The size of your base model"],a:2,why:"Pattern-first architecture: reverse-engineer the patterns your target capability needs, rather than building everything."},
{q:"Adaptation · An agent is factually wrong about your current policies. Lightest fix:",opts:["Stronger prompting","Full fine-tuning","A bigger model","RAG"],a:3,why:"Missing facts ⇒ RAG. Fine-tuning is for behaviour/style. Reach for the lightest technique that meets the need."},
{q:"Coordination · A regulated workflow needs predictability and a full audit trail. Pattern:",opts:["Swarm","Supervisor","Blackboard","Contract-Net"],a:1,why:"Auditability + predictability ⇒ supervisor. Swarm trades those away for emergent flexibility."},
{q:"Coordination · Tasks should go to whichever agent is currently cheapest/best, decided at run time:",opts:["Supervisor Architecture","Blackboard Knowledge Hub","Contract-Net Marketplace","Agent Router"],a:2,why:"Bidding-based dynamic allocation is Contract-Net — great for load-balancing, at the cost of bidding overhead."},
{q:"Coordination · Majority voting improves accuracy only when:",opts:["There are many agents taking part in the vote","Every agent uses the biggest available model","Agents beat chance and err independently","Temperature is set to zero for all agents"],a:2,why:"Correlated errors (same model/prompt/blind spot) defeat voting; diversify to keep votes independent."},
{q:"Compliance · To catch an agent silently violating a rule in its brief:",opts:["Majority Voting","Rate limiting","Persistent Instruction Anchoring","Instruction Fidelity Auditing"],a:3,why:"An agent rationalizes its own output, so objective checking needs an external auditor."},
{q:"Robustness · An extraction step keeps failing on the same input. Pattern:",opts:["Majority Voting across agents","Adaptive Retry with Prompt Mutation","Incremental Checkpointing","Retry the identical call with backoff"],a:1,why:"Blind retries repeat the failure; reasoned recovery (the R⁵ ‘Retry’) mutates the approach first."},
{q:"Robustness · To prove after the fact exactly why a loan was denied:",opts:["Causal Dependency Graph","Fallback Model Invocation","Canary Agent Testing","Fractal CoT"],a:0,why:"The causal graph is the audit trail linking every contributing factor to the decision."},
{q:"Robustness · A compromised agent must not reach the customer database. Pattern:",opts:["Agent Mesh Defense","Trust Decay","Rate-Limited Invocation","Canary Agent Testing"],a:0,why:"Mesh defense contains lateral movement via least-privilege policy at each hop."},
{q:"Human-agent · The load-bearing safety pattern is:",opts:["Agent Delegates to Agent","Agent Calls Proxy Agent","Human Calls Agent","Agent Calls Human"],a:3,why:"HITL escalation captures the easy majority automatically and backstops the consequential minority."},
{q:"Learning · The Hybrid (Planner + Scorer) architecture separates generation from evaluation because:",opts:["It's cheaper than running a single large model","An agent can't objectively judge its own work","It removes the need for any labelled training data","Two smaller models run faster than one large one"],a:1,why:"Structural separation of generator and evaluator is what makes the self-improvement feedback trustworthy."},
{q:"Learning · The R⁵ disciplines are:",opts:["Relax, Reflect, Reference, Retry, Report","Retrieve, Reflect, Reference, Retry, Review","Read, Reason, Reference, Retry, Report","Relax, Reflect, Route, Recover, Report"],a:0,why:"Manage context/latency, self-critique, provenance, adaptive recovery, and quantified reporting — operate-and-improve."},
{q:"Economics · A multi-agent system's cost scales with:",opts:["LLM calls and re-sent context per task","The number of tasks completed per day","The size of the model in each role","The storage used for agent memory"],a:0,why:"Fan-out multiplies cost; control it with routing, caching, context trimming, and capping reflection loops."},
{q:"Economics · The most fragile assumption in an agent ROI case is:",opts:["The GPU rental cost","The automation rate","The price per token","The framework chosen"],a:1,why:"Model the realistic automation rate and full run+ops cost; the escalated fraction is human time. HITL shapes the business case, not just safety."},
{q:"Frameworks · You need conditional loops, cycles, and inspectable explicit state. Best fit:",opts:["CrewAI","ADK","A single prompt","LangGraph"],a:3,why:"LangGraph models the app as a state machine with explicit state and conditional edges — ideal for advanced control flow."},
{q:"Roadmap · A working single agent needs to reach production. The Level-2 focus is:",opts:["Moving straight on to self-improvement and learning loops","Robustness, security, governance, observability","Fine-tuning a bigger model for the same narrow task","Adding more specialist agents to the existing team"],a:1,why:"Level 1 proves value with one reliable agent; Level 2 hardens it; Level 3 adds coordination and learning."}
];
</script>


<script>
/* ============ CASE LAB HELPERS ============ */
function caseDone(id){return !!(S.cases[id]&&S.cases[id].done);}
function casesTotal(){return (window.CASES||[]).length;}
function casesDoneN(){return (window.CASES||[]).filter(c=>caseDone(c.id)).length;}

function viewLab(v){
  setCrumb("Case Lab");
  const groups=[
    ["gen","Pattern-selection challenges","Given a scenario, pick the right pattern and defend it — the judgment the whole book builds toward."],
    ["ai","Design & hardening challenges","Architect and harden real agentic systems — coordination, robustness, human-in-the-loop, production."],
    ["run","The running build","The loan-processing system, end to end — from a single monolithic agent to a resilient multi-agent crew."]
  ];
  let secs='';
  groups.forEach(g=>{
    const items=(window.CASES||[]).filter(c=>c.cls===g[0]);
    if(!items.length)return;
    let cards='';
    items.forEach(c=>{
      const dn=caseDone(c.id);
      cards+='<button class="modcard '+(dn?'dn':'')+'" onclick="go(\'case/'+c.id+'\')">'+
        '<div class="top"><span class="num">'+(dn?svg(IC.check,2.5):svg(IC.target,2))+'</span>'+
        '<h3 style="flex:1">'+c.title+'</h3><span class="casetype '+c.cls+'">'+c.type.split(" · ")[0]+'</span></div>'+
        '<p>'+c.blurb+'</p>'+
        '<div class="meta"><span>'+c.steps.length+' steps</span>'+(dn?'<span class="pill pass" style="font-size:10px">completed</span>':'')+
        '<span style="margin-left:auto">'+svg(IC.arrow,2)+'</span></div></button>';
    });
    secs+='<div style="margin:28px 0 12px"><div class="eyebrow" style="color:var(--acc2)">'+g[1]+'</div>'+
      '<p style="font-size:13px;color:var(--tx2);margin:4px 0 0">'+g[2]+'</p></div><div class="grid g2">'+cards+'</div>';
  });
  v.innerHTML='<div class="page-in">'+
    '<div class="eyebrow">Do, don\'t just read · self-graded</div>'+
    '<h1 class="h-hero">Case Lab</h1>'+
    '<p class="sub">Work real cases end to end. Draft your structure, then reveal a model answer and score yourself against the rubric — the same loop a case interview runs. '+casesDoneN()+' of '+casesTotal()+' completed.</p>'+
    '<div class="box key" style="margin-top:18px"><div class="bx-h">'+svg(IC.play,2)+' How to use it</div>For each step, think out loud — type your structure in the box — <em>then</em> reveal. Say your answer aloud and timed; the discomfort is the training. The goal isn\'t matching the model word for word, it\'s hitting the rubric and reasoning cleanly.</div>'+
    secs+'</div>';
}

function viewCase(v,id){
  const c=(window.CASES||[]).find(x=>x.id===id);
  if(!c){go("lab");return;}
  setCrumb('<b onclick="go(\'lab\')" style="cursor:pointer">Case Lab</b> / '+c.title);
  let i=0;
  render();
  function render(){
    const step=c.steps[i];
    const notes=(S.caseNotes[id]&&S.caseNotes[id][i])||"";
    let bar='';c.steps.forEach((s,k)=>{bar+='<i class="'+(k<i?'done':(k===i?'on':''))+'"></i>';});
    let rub='';step.rubric.forEach(r=>{rub+='<li onclick="__rubTog(this)"><span class="cb">'+svg(IC.check,2.6)+'</span><span>'+r+'</span></li>';});
    v.innerHTML='<div class="page-in read">'+
      '<div class="row" style="justify-content:space-between;align-items:flex-start"><div class="eyebrow" style="flex:1">'+c.type+'</div><span class="casetype '+c.cls+'">'+c.type.split(" · ")[0]+'</span></div>'+
      '<h1 class="h-hero" style="font-size:clamp(22px,3vw,30px);margin-top:4px">'+c.title+'</h1>'+
      (i===0?'<div class="box" style="margin:14px 0"><div class="bx-h">'+svg(IC.target,2)+' The brief</div>'+c.scenario+'</div>':'')+
      '<div class="stepbar">'+bar+'</div>'+
      '<div class="eyebrow" style="color:var(--acc2)">Step '+(i+1)+' of '+c.steps.length+' · '+step.t+'</div>'+
      '<div style="font-size:17px;font-weight:650;margin:8px 0 6px;line-height:1.4">'+step.prompt+'</div>'+
      (step.hint?'<div style="font-size:12.5px;color:var(--tx3);margin-bottom:6px"><b>Hint:</b> '+step.hint+'</div>':'')+
      '<label class="eyebrow" style="display:block;margin:16px 0 6px">Your working · saved locally</label>'+
      '<textarea class="ta" id="caseNote" placeholder="Structure your thinking out loud here before revealing the model answer...">'+notes.replace(/</g,"&lt;").replace(/>/g,"&gt;")+'</textarea>'+
      '<div class="row" style="margin-top:12px"><button class="btn pri" id="revealBtn" onclick="__caseReveal()">Reveal model answer &amp; rubric</button></div>'+
      '<div class="reveal" id="reveal"><h4>Model answer</h4><div class="model">'+step.model+'</div>'+
        '<div class="eyebrow" style="color:var(--acc2);margin-top:16px">Did your answer hit these? · tap to self-check</div>'+
        '<ul class="rubric">'+rub+'</ul>'+
        '<div class="row" style="margin-top:18px;justify-content:flex-end">'+
          (i>0?'<button class="btn sm ghost" onclick="__casePrev()">← Previous</button>':'')+
          '<button class="btn '+(i===c.steps.length-1?'gold':'pri')+'" onclick="__caseNext()">'+(i===c.steps.length-1?'Finish case':'Next step')+' '+svg(IC.arrow,2)+'</button></div>'+
      '</div></div>';
    const note=document.getElementById("caseNote");
    note.addEventListener("input",function(){if(!S.caseNotes[id])S.caseNotes[id]={};S.caseNotes[id][i]=note.value;save();});
  }
  window.__rubTog=function(el){el.classList.toggle("on");};
  window.__caseReveal=function(){var r=document.getElementById("reveal");r.classList.add("show");document.getElementById("revealBtn").style.display="none";r.scrollIntoView({behavior:"smooth",block:"nearest"});};
  window.__casePrev=function(){if(i>0){i--;render();window.scrollTo(0,0);}};
  window.__caseNext=function(){
    if(i<c.steps.length-1){i++;render();window.scrollTo(0,0);}
    else{
      const first=!caseDone(id);
      S.cases[id]={done:true,ts:Date.now()};save();touchStreak();
      if(first)addXP(45,"Case completed!");
      caseSummary();
    }
  };
  function caseSummary(){
    v.innerHTML='<div class="page-in result-hero">'+
      '<div style="width:78px;height:78px;border-radius:50%;background:var(--goodwash);color:var(--good);display:grid;place-items:center;margin:0 auto 12px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>'+
      '<div class="eyebrow" style="color:var(--good)">Case complete</div>'+
      '<h2 style="margin:6px 0 8px">'+c.title+'</h2>'+
      '<p class="sub" style="margin:0 auto 22px">'+c.debrief+'</p>'+
      '<div class="row" style="justify-content:center"><button class="btn" onclick="go(\'lab\')">Back to Case Lab</button><button class="btn pri" onclick="retryCase(\''+id+'\')">Run it again</button></div></div>';
    window.scrollTo(0,0);renderNav();renderChrome();
  }
}
function retryCase(id){viewCase(document.getElementById("view"),id);window.scrollTo(0,0);}
</script>
<script>
/* ============ CHARTS ============ */
function activitySpark(){
  const days=14;const base=new Date(new Date().toISOString().slice(0,10)+"T00:00:00");
  const arr=[];for(let k=days-1;k>=0;k--){const dd=new Date(base);dd.setDate(dd.getDate()-k);const key=dd.toISOString().slice(0,10);arr.push({key,v:(S.activity&&S.activity[key])||0});}
  const max=Math.max(1,...arr.map(a=>a.v));const total=arr.reduce((s,a)=>s+a.v,0);
  const W=100,H=40,gap=1.6,bw=(W-gap*(days-1))/days;
  let bars='';arr.forEach((a,i)=>{const h=a.v?Math.max(2.5,a.v/max*H):1.2;const x=i*(bw+gap);const y=H-h;const cur=i===days-1;
    bars+='<rect x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+bw.toFixed(2)+'" height="'+h.toFixed(2)+'" rx="1" fill="'+(a.v?"var(--acc)":"var(--line)")+'" opacity="'+(a.v?(cur?1:0.82):1)+'"><title>'+a.key+" · "+a.v+" XP</title></rect>";});
  return '<div class="chartcard"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="eyebrow">XP earned · last 14 days</span><span class="mono" style="font-size:13px;font-weight:700;color:var(--acc)">'+total+'</span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:58px;display:block" role="img" aria-label="Experience points earned each of the last 14 days">'+bars+'</svg>'+
    '<div class="mono" style="font-size:10px;color:var(--tx3);display:flex;justify-content:space-between;margin-top:5px"><span>14 days ago</span><span>today</span></div></div>';
}
function masteryChart(){
  let rows='';M.forEach(m=>{const p=modPct(m);rows+='<div class="mrow"><span class="mn">'+m.n+'</span><span class="ml" title="'+m.t+'">'+m.t+'</span><div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div><span class="mp">'+p+'%</span></div>';});
  return '<div class="chartcard"><div class="eyebrow" style="margin-bottom:10px">Mastery by module</div>'+rows+'</div>';
}
/* ============ EXERCISE ENGINES ============ */
window.__EX=window.__EX||{};
function _norm(s){return (s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[;]+$/,"");}
function exFillcodeHTML(x,key){
  window.__EX[key]=x;
  let esc=x.code.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  esc=esc.replace(/\[\[(\d+)\]\]/g,function(_,n){const b=x.blanks[+n-1];const sz=Math.max(4,(b.a[0]||"").length+1);return '<input class="blankin" data-ex="'+key+'" data-n="'+(+n-1)+'" size="'+sz+'" placeholder="'+(b.ph||"?")+'" aria-label="blank '+n+'" autocapitalize="off" autocorrect="off" spellcheck="false">';});
  return '<div class="exbox"><div class="ex-h">'+svg(IC.play,2)+' Code completion · '+x.title+'</div>'+
    (x.intro?'<div class="ex-i">'+x.intro+'</div>':'')+
    '<pre class="codeex">'+esc+'</pre>'+
    '<div class="row" style="margin-top:11px"><button class="btn sm pri" onclick="checkFill(\''+key+'\')">Check</button><button class="btn sm ghost" onclick="revealFill(\''+key+'\')">Reveal</button><span class="exmsg" id="msg_'+key+'"></span></div>'+
    '<div class="why" data-why="'+key+'"><b>Why:</b> '+x.why+'</div></div>';
}
function checkFill(key){
  const x=window.__EX[key];let all=true;
  document.querySelectorAll('[data-ex="'+key+'"]').forEach(inp=>{const n=+inp.dataset.n;const acc=x.blanks[n].a.map(_norm);const ok=acc.indexOf(_norm(inp.value))>-1;inp.classList.remove("ok","bad");inp.classList.add(ok?"ok":"bad");if(!ok)all=false;});
  const msg=document.getElementById("msg_"+key);
  if(all){msg.className="exmsg ok";msg.textContent="All correct ✓";document.querySelector('[data-why="'+key+'"]').classList.add("show");if(!S.drills[key]){S.drills[key]=1;save();touchStreak();addXP(12,"Exercise solved");}}
  else{msg.className="exmsg bad";msg.textContent="Some blanks are off — adjust or reveal";}
}
function revealFill(key){
  const x=window.__EX[key];
  document.querySelectorAll('[data-ex="'+key+'"]').forEach(inp=>{const n=+inp.dataset.n;inp.value=x.blanks[n].a[0];inp.classList.remove("bad");inp.classList.add("ok");});
  document.querySelector('[data-why="'+key+'"]').classList.add("show");const msg=document.getElementById("msg_"+key);msg.className="exmsg";msg.textContent="";
}
function exOrderHTML(x,key){
  window.__EX[key]=x;
  const idx=x.items.map((_,i)=>i);
  for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t;}
  // guard against accidental already-sorted shuffle
  if(idx.every((v,i)=>v===i)&&idx.length>1){idx.push(idx.shift());}
  let lis='';idx.forEach(oi=>{lis+='<li class="ordli" data-idx="'+oi+'"><span class="ord-move"><button class="ord-btn" onclick="orderMove(this,-1)" aria-label="Move up">▲</button><button class="ord-btn" onclick="orderMove(this,1)" aria-label="Move down">▼</button></span><span class="ord-num"></span><span>'+x.items[oi]+'</span></li>';});
  return '<div class="exbox"><div class="ex-h">'+svg(IC.play,2)+' Put it in order · '+x.title+'</div>'+
    (x.intro?'<div class="ex-i">'+x.intro+'</div>':'')+
    '<ul class="orderlist" id="ord_'+key+'">'+lis+'</ul>'+
    '<div class="row" style="margin-top:11px"><button class="btn sm pri" onclick="checkOrder(\''+key+'\')">Check order</button><span class="exmsg" id="msg_'+key+'"></span></div>'+
    '<div class="why" data-why="'+key+'"><b>Why:</b> '+x.why+'</div></div>';
}
function orderMove(btn,dir){
  const li=btn.closest("li");const list=li.parentNode;
  if(dir<0){const prev=li.previousElementSibling;if(prev)list.insertBefore(li,prev);}
  else{const next=li.nextElementSibling;if(next)list.insertBefore(next,li);}
}
function checkOrder(key){
  const list=document.getElementById("ord_"+key);const lis=list.querySelectorAll("li");let ok=true;
  lis.forEach((li,pos)=>{const good=(+li.dataset.idx===pos);li.classList.remove("ok","bad");li.classList.add(good?"ok":"bad");if(!good)ok=false;});
  const msg=document.getElementById("msg_"+key);
  if(ok){msg.className="exmsg ok";msg.textContent="Correct order ✓";document.querySelector('[data-why="'+key+'"]').classList.add("show");if(!S.drills[key]){S.drills[key]=1;save();touchStreak();addXP(12,"Exercise solved");}}
  else{msg.className="exmsg bad";msg.textContent="Not quite — reorder and check again";}
}

<script>
/* =================== STATE / STORAGE =================== */
const KEY="agentic_v1";
const DEF={xp:0,streak:0,last:null,started:null,lessons:{},quizzes:{},exams:{},cards:{},drills:{},seen:{},cases:{},caseNotes:{},activity:{}};
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return Object.assign({},DEF,r||{})}catch(e){return Object.assign({},DEF)}}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function today(){return new Date().toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5)}

function touchStreak(){
  const t=today();
  if(!S.started)S.started=t;
  if(S.last===t){save();return}
  if(S.last){const d=daysBetween(S.last,t);S.streak=(d===1)?S.streak+1:1;}else{S.streak=1;}
  S.last=t;save();
}
function addXP(n,label){
  S.xp+=n;
  const t=today();if(!S.activity)S.activity={};S.activity[t]=(S.activity[t]||0)+n;
  save();renderChrome();
  toast((label||"XP earned"),n);
}
/* =================== CONTENT INDEX =================== */
const M=window.MODULES;
const CARDS=window.CARDS;
const modById=id=>M.find(m=>m.id===id);
function allLessons(){let a=[];M.forEach(m=>m.lessons.forEach(l=>a.push({m,l})));return a;}
function lessonDone(mid,lid){return !!(S.lessons[mid+"."+lid]);}
function modLessonsDone(m){return m.lessons.filter(l=>lessonDone(m.id,l.id)).length;}
function modPct(m){const tot=m.lessons.length+(m.exam?1:0);let d=modLessonsDone(m);if(m.exam&&examPassed(m.id))d++;return tot?Math.round(d/tot*100):0;}
function examPassed(mid){const e=S.exams[mid];return e&&e.passed;}
function overall(){
  let tot=0,done=0;
  M.forEach(m=>{tot+=m.lessons.length;done+=modLessonsDone(m);if(m.exam){tot++;if(examPassed(m.id))done++;}});
  return {tot,done,pct:tot?Math.round(done/tot*100):0};
}
/* spaced repetition (Leitner) */
const SR_INT=[0,1,3,7,16,35];
function cardState(id){return S.cards[id]||{box:0,due:today(),seen:false}}
function cardsDue(){return CARDS.filter(c=>{const st=cardState(c.id);return st.due<=today()}).length}
function gradeCard(id,ok){
  let st=cardState(id);st.seen=true;
  if(ok)st.box=Math.min(st.box+1,SR_INT.length-1);else st.box=Math.max(0,st.box-1);
  const dd=new Date();dd.setDate(dd.getDate()+SR_INT[st.box]);
  st.due=dd.toISOString().slice(0,10);
  S.cards[id]=st;save();
}

/* =================== DASHBOARD =================== */

function dashLink(href,t,d,badge){var ic=href==="cards"?"cards":(href==="lab"?"target":"award");return '<button class="modcard" onclick="go(\''+href+'\')"><div class="top"><span class="num">'+svg(IC[ic],2)+'</span><h3 style="font-size:14.5px">'+t+'</h3></div><p>'+d+'</p><div class="meta"><span style="color:var(--acc)">'+badge+'</span><span style="margin-left:auto">'+svg(IC.arrow,2)+'</span></div></button>';}

/* =================== LESSON VIEW =================== */
function viewLesson(v,mid,lid){
  const m=modById(mid);if(!m){go("dashboard");return}
  const idx=m.lessons.findIndex(l=>l.id===lid);const l=m.lessons[idx];if(!l){go("module/"+mid);return}
  setCrumb('<b onclick="go(\'module/'+m.id+'\')" style="cursor:pointer">'+m.t+'</b> / '+l.t);
  const dn=lessonDone(mid,lid);
  let html='<div class="page-in read">'+
    '<div class="eyebrow">Module '+m.n+' · Lesson '+(idx+1)+' of '+m.lessons.length+'</div>'+
    '<h1 class="h-hero" style="font-size:clamp(24px,3.5vw,32px)">'+l.t+'</h1>'+
    '<div id="laSlot"></div>'+
    '<div class="prose" style="margin-top:18px">'+l.html+'</div>';
  if(l.drill)html+=drillHTML(l.drill);
  if(l.checks){
    html+='<div class="divider"></div><div class="eyebrow" style="color:var(--acc2)">Check your understanding</div>';
    l.checks.forEach((c,i)=>{html+=quizHTML(c,mid+"_"+lid+"_c"+i,"Check "+(i+1));});
  }
  if(l.ex){
    html+='<div class="divider"></div><div class="eyebrow" style="color:var(--acc2)">Practice exercises</div>';
    l.ex.forEach((x,i)=>{const key=mid+"_"+lid+"_ex"+i;html+=(x.type==="order")?exOrderHTML(x,key):exFillcodeHTML(x,key);});
  }
  html+='<div class="divider"></div><div class="row" style="justify-content:space-between">'+
    (idx>0?'<button class="btn sm ghost" onclick="go(\'lesson/'+mid+'/'+m.lessons[idx-1].id+'\')">← Previous</button>':'<span></span>')+
    '<button class="btn pri" id="doneBtn" onclick="completeLesson(\''+mid+'\',\''+lid+'\','+idx+')">'+(dn?'Completed ✓ · Continue':'Mark complete')+' '+svg(IC.arrow,2)+'</button></div>';
  html+='</div>';
  v.innerHTML=html;
  if(window.LessonAudio)LessonAudio.mount(document.getElementById('laSlot'),{course:'agentic',mid:mid,lid:lid,title:l.t,module:m.t,nextHash:m.lessons[idx+1]?'lesson/'+mid+'/'+m.lessons[idx+1].id:''});
  bindQuizzes();
  if(l.drill)bindDrill(l.drill);
