<title>Agentic Architecture — Interactive</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#0f1518; --ink2:#151d21; --ink3:#1c262b;
  --paper:#f3f6f4; --paper2:#ffffff; --paper3:#e9eeec;
  --bg:var(--paper); --surf:var(--paper2); --surf2:var(--paper3);
  --line:#d3ddd9; --line2:#c2cec9;
  --tx:#12201d; --tx2:#3b4e48; --tx3:#55675e;
  --acc:#0a6e62; --acc2:#0a5a50; --accdim:#7fcdc4; --accwash:#dcf0ed;
  --gold:#8c6310; --goldwash:#f6ecd6;
  --good:#157a49; --warn:#8a6410; --crit:#b92e2b;
  --goodwash:#dcf0e5; --critwash:#f6dede;
  --shadow:0 1px 2px rgba(16,40,36,.06),0 8px 24px -12px rgba(16,40,36,.14);
  --shadow2:0 2px 4px rgba(16,40,36,.05),0 18px 44px -20px rgba(16,40,36,.22);
  --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:14px; --r2:10px; --r3:7px;
  --rail:270px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1316; --surf:#111a1e; --surf2:#16211f;
    --line:#25322f; --line2:#31413d;
    --tx:#e7efec; --tx2:#a7b9b3; --tx3:#8a9b94;
    --acc:#28bda9; --acc2:#3ccdba; --accdim:#2f5a55; --accwash:#123029;
    --gold:#e0b054; --goldwash:#2b2313;
    --good:#3cc37f; --warn:#e0a94e; --crit:#ef6b6b;
    --goodwash:#12291f; --critwash:#2c1717;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
    --shadow2:0 2px 6px rgba(0,0,0,.35),0 22px 50px -22px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1316; --surf:#111a1e; --surf2:#16211f;
  --line:#25322f; --line2:#31413d;
  --tx:#e7efec; --tx2:#a7b9b3; --tx3:#8a9b94;
  --acc:#28bda9; --acc2:#3ccdba; --accdim:#2f5a55; --accwash:#123029;
  --gold:#e0b054; --goldwash:#2b2313;
  --good:#3cc37f; --warn:#e0a94e; --crit:#ef6b6b;
  --goodwash:#12291f; --critwash:#2c1717;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.6);
  --shadow2:0 2px 6px rgba(0,0,0,.35),0 22px 50px -22px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#f3f6f4; --surf:#ffffff; --surf2:#e9eeec;
  --line:#d3ddd9; --line2:#c2cec9;
  --tx:#12201d; --tx2:#3b4e48; --tx3:#55675e;
  --acc:#0a6e62; --acc2:#0a5a50; --accdim:#7fcdc4; --accwash:#dcf0ed;
  --gold:#8c6310; --goldwash:#f6ecd6;
  --good:#157a49; --warn:#8a6410; --crit:#b92e2b;
  --goodwash:#dcf0e5; --critwash:#f6dede;
}
:root{--onfill:#fff}
@media (prefers-color-scheme:dark){:root{--onfill:#08201c}}
:root[data-theme="dark"]{--onfill:#08201c}
:root[data-theme="light"]{--onfill:#fff}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;font-size:16px}
h1,h2,h3,h4{line-height:1.2;text-wrap:balance;margin:0}
a{color:var(--acc);text-decoration:none}
button{font-family:inherit;color:inherit}svg{flex:none}
::selection{background:var(--accwash);color:var(--tx)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:600}

/* ============ SHELL ============ */
.app{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surf);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40}
.rail::-webkit-scrollbar{width:8px}.rail::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(150deg,var(--acc),var(--acc2));
  display:grid;place-items:center;flex:none;box-shadow:0 3px 10px -3px var(--acc)}
.brand .mark svg{width:19px;height:19px}
.brand b{font-size:14.5px;letter-spacing:-.01em;display:block;line-height:1.15}
.brand span{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.08em;text-transform:uppercase}
.railprog{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.navwrap{padding:10px 10px 26px;flex:1}
.navsec{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx3);
  padding:14px 10px 6px;font-weight:600}
.navitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;cursor:pointer;
  padding:8px 10px;border-radius:9px;color:var(--tx2);font-size:13.5px;transition:background .12s,color .12s;position:relative}
.navitem:hover{background:var(--surf2);color:var(--tx)}
.navitem.on{background:var(--accwash);color:var(--acc2);font-weight:600}
.navitem .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none;
  font-family:var(--mono);font-size:11px;font-weight:700;background:var(--surf2);color:var(--tx2)}
.navitem.on .ico{background:var(--acc);color:var(--onfill)}
.navitem .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navitem .pct{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.navitem.done .ico::after{content:"";position:absolute}
.navdone{color:var(--good)!important}

.courseswitch{display:flex;gap:4px;padding:10px 10px;border-bottom:1px solid var(--line)}.cs-opt{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:4px;font-size:11.5px;font-weight:650;padding:8px 4px;white-space:nowrap;border-radius:8px;text-decoration:none;color:var(--tx2);border:1px solid transparent;transition:.12s;white-space:nowrap}.cs-opt:hover{background:var(--surf2);color:var(--tx)}.cs-opt.active{background:var(--accwash);color:var(--acc2);border-color:var(--accdim);cursor:default}
/* ============ TOPBAR ============ */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 26px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.burger{display:none}
.crumb{font-family:var(--mono);font-size:11.5px;color:var(--tx3);letter-spacing:.03em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb b{color:var(--tx2)}
.stat{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px;font-weight:600;
  padding:5px 10px;border-radius:20px;background:var(--surf);border:1px solid var(--line);color:var(--tx2)}
.stat svg{width:14px;height:14px}
.stat.xp{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 32%,var(--line))}
.stat.streak{color:var(--warn)}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surf);cursor:pointer;
  display:grid;place-items:center;color:var(--tx2);transition:.12s}
.iconbtn:hover{color:var(--tx);border-color:var(--line2)}
.iconbtn svg{width:16px;height:16px}

/* ============ CONTENT ============ */
.content{padding:34px 26px 90px;max-width:1080px;width:100%;margin:0 auto;flex:1}
.read{max-width:70ch}
.page-in{animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* headings + prose */
.h-hero{font-size:clamp(26px,4vw,38px);letter-spacing:-.02em;font-weight:800;margin-bottom:8px}
.sub{color:var(--tx2);font-size:16px;max-width:64ch}
.lead{font-size:17px;color:var(--tx2)}
.prose h3{font-size:19px;font-weight:750;margin:30px 0 8px;letter-spacing:-.01em}
.prose h4{font-size:14px;font-weight:700;margin:22px 0 6px;color:var(--acc2);
  font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 16px;padding-left:20px}
.prose li{margin:5px 0}
.prose strong{color:var(--tx);font-weight:700}
.prose code{font-family:var(--mono);font-size:.86em;background:var(--surf2);padding:1.5px 5px;border-radius:5px;
  border:1px solid var(--line)}
.prose em{color:var(--tx);font-style:italic}
.kd{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* callouts */
.box{border:1px solid var(--line);border-radius:var(--r2);padding:15px 17px;margin:18px 0;background:var(--surf)}
.box .bx-h{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  margin-bottom:7px;display:flex;align-items:center;gap:7px}
.box.key{background:var(--accwash);border-color:color-mix(in srgb,var(--acc) 26%,var(--line))}
.box.key .bx-h{color:var(--acc2)}
.box.warnbx{background:var(--critwash);border-color:color-mix(in srgb,var(--crit) 30%,var(--line))}
.box.warnbx .bx-h{color:var(--crit)}
.box.add{background:var(--goldwash);border-color:color-mix(in srgb,var(--gold) 34%,var(--line))}
.box.add .bx-h{color:var(--gold)}
.box.num{background:var(--surf2);font-family:var(--mono);font-size:13.5px;line-height:1.75;white-space:pre-wrap;
  overflow-x:auto}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid transparent}
.tag.added{background:var(--goldwash);color:var(--gold);border-color:color-mix(in srgb,var(--gold) 34%,transparent)}
.tag.spine{background:var(--accwash);color:var(--acc2)}

/* data table */
.tbl{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.5px;overflow:hidden;border-radius:10px;
  border:1px solid var(--line)}
.tblwrap{overflow-x:auto;margin:16px 0}
.tbl th{background:var(--surf2);text-align:left;padding:9px 12px;font-family:var(--mono);font-size:11px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--tx2);border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl .mono{font-size:12.5px}

/* ============ CARDS / GRIDS ============ */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:820px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;position:relative}
.tile .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);font-weight:600}
.tile .big{font-family:var(--mono);font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.tile .foot{font-size:12px;color:var(--tx3);margin-top:3px}
.tile.accent .big{color:var(--acc)}
.tile.gold .big{color:var(--gold)}

/* module cards */
.modcard{display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.15s;text-align:left;
  border:1px solid var(--line);background:var(--surf);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.modcard:hover{transform:translateY(-2px);box-shadow:var(--shadow2);border-color:var(--line2)}
.modcard .top{display:flex;align-items:center;gap:11px}
.modcard .num{width:34px;height:34px;border-radius:9px;background:var(--surf2);display:grid;place-items:center;
  font-family:var(--mono);font-weight:800;font-size:14px;color:var(--tx2);flex:none}
.modcard.dn .num{background:var(--acc);color:var(--onfill)}
.modcard h3{font-size:15.5px;letter-spacing:-.01em;flex:1;color:var(--tx)}
.modcard p{font-size:13px;color:var(--tx2);margin:0;flex:1}
.modcard .meta{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;color:var(--tx3)}

/* progress bar + ring */
.bar{height:7px;border-radius:6px;background:var(--surf2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.gold>i{background:linear-gradient(90deg,var(--gold),#e8bd66)}
.ring{--v:0;width:64px;height:64px;border-radius:50%;flex:none;
  background:conic-gradient(var(--acc) calc(var(--v)*1%),var(--surf2) 0);
  display:grid;place-items:center;position:relative}
.ring::before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surf)}
.ring b{position:relative;font-family:var(--mono);font-size:14px;font-weight:800}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;border-radius:10px;
  font-size:14px;font-weight:650;padding:10px 17px;border:1px solid var(--line2);background:var(--surf);color:var(--tx);
  transition:.14s;text-align:center}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onfill);box-shadow:0 4px 12px -4px var(--acc)}
.btn.pri:hover{background:var(--acc2);border-color:var(--acc2)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--onfill)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ============ QUIZ / CHECK ============ */
.quiz{border:1px solid var(--line);border-radius:var(--r);background:var(--surf);padding:18px;margin:22px 0;box-shadow:var(--shadow)}
.quiz .qh{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.quiz .qh .qi{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--acc2)}
.quiz .qq{font-size:15.5px;font-weight:650;margin:8px 0 14px;line-height:1.4}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;border:1px solid var(--line);
  background:var(--surf);border-radius:10px;padding:11px 13px;margin-bottom:9px;transition:.12s;font-size:14px;color:var(--tx)}
.opt:hover:not(.locked){border-color:var(--acc);background:var(--accwash)}
.opt .mk{width:23px;height:23px;border-radius:6px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--tx3);transition:.12s}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--good);background:var(--goodwash)}
.opt.correct .mk{background:var(--good);border-color:var(--good);color:var(--onfill)}
.opt.wrong{border-color:var(--crit);background:var(--critwash)}
.opt.wrong .mk{background:var(--crit);border-color:var(--crit);color:var(--onfill)}
.opt.muted{opacity:.55}
.why{margin-top:6px;padding:12px 14px;border-radius:10px;background:var(--surf2);font-size:13.5px;line-height:1.6;
  border-left:3px solid var(--acc);display:none}
.why.show{display:block;animation:fade .25s}
.why b{color:var(--acc2)}
.why.bad{border-left-color:var(--crit)}.why.bad b{color:var(--crit)}

/* ============ DRILL (calculators) ============ */
.drill{border:1px solid var(--line2);border-radius:var(--r);background:var(--surf);padding:18px;margin:22px 0;box-shadow:var(--shadow)}
.drill h4{font-family:var(--mono);color:var(--acc2);margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.drill .di{font-size:13.5px;color:var(--tx2);margin-bottom:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx3);margin-bottom:4px}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);
  color:var(--tx);font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.dout{background:var(--surf2);border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:13.5px;line-height:1.8;
  white-space:pre-wrap;border:1px dashed var(--line2)}
.dout b{color:var(--acc)}
.dguess{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px}
.verdict{font-family:var(--mono);font-size:13px;font-weight:700;padding:8px 12px;border-radius:8px;display:none}
.verdict.ok{display:inline-block;background:var(--goodwash);color:var(--good)}
.verdict.no{display:inline-block;background:var(--critwash);color:var(--crit)}

/* ============ CASE LAB ============ */
.ta{width:100%;min-height:120px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:14px;line-height:1.55;resize:vertical}
.ta:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:var(--acc)}
.stepbar{display:flex;gap:5px;margin:12px 0 18px}
.stepbar i{height:5px;flex:1;border-radius:5px;background:var(--surf2);transition:background .3s}
.stepbar i.on{background:var(--acc)}
.stepbar i.done{background:var(--acc2)}
.reveal{margin-top:16px;border:1px solid var(--accdim);background:var(--accwash);border-radius:12px;padding:16px 18px;display:none}
.reveal.show{display:block;animation:fade .3s}
.reveal h4{font-family:var(--mono);color:var(--acc2);text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin:0 0 8px}
.reveal .model{font-size:14px;line-height:1.6}
.reveal .model b{color:var(--tx)}
.rubric{list-style:none;padding:0;margin:12px 0 0}
.rubric li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line2);font-size:13.5px;cursor:pointer;color:var(--tx2)}
.rubric li .cb{width:21px;height:21px;border-radius:6px;border:1.6px solid var(--line2);flex:none;display:grid;place-items:center;color:transparent;transition:.12s}
.rubric li .cb svg{width:13px;height:13px}
.rubric li.on{color:var(--tx)}
.rubric li.on .cb{background:var(--good);border-color:var(--good);color:var(--onfill)}
.casetype{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;flex:none}
.casetype.ai{background:var(--accwash);color:var(--acc2)}
.casetype.gen{background:var(--goldwash);color:var(--gold)}
.casetype.run{background:var(--critwash);color:var(--crit)}

/* ============ FLASHCARDS ============ */
.fc-stage{max-width:620px;margin:0 auto}
.fc{perspective:1600px;height:320px;margin:20px 0;cursor:pointer}
.fc-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);border:1px solid var(--line);
  background:var(--surf);box-shadow:var(--shadow2);display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:34px}
.fc-face .k{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  position:absolute;top:16px;left:18px}
.fc-front .q{font-size:20px;font-weight:650;line-height:1.35}
.fc-back{transform:rotateY(180deg);background:var(--accwash);border-color:var(--accdim)}
.fc-back .a{font-size:17px;line-height:1.5}

<script>
/* ============ INTERACTIVE DRILLS ============ */
var DRILLS={
  tokenomics:{
    title:"Agentic tokenomics — why multi-agent multiplies cost",
    desc:"A multi-agent task fans out into many LLM calls (orchestrator + specialists + reflection loops). Each call re-sends context. Watch the bill scale with agents and steps, not just tasks. Rates are $ per million tokens.",
    fields:[
      {id:"calls",label:"LLM calls / task",def:12},
      {id:"in",label:"avg input tok / call",def:3500},
      {id:"out",label:"avg output tok / call",def:400},
      {id:"tasks",label:"tasks / month",def:50000},
      {id:"irate",label:"input $/Mtok",def:3},
      {id:"orate",label:"output $/Mtok",def:15}
    ],
    compute:function(k){
      var perCall=(val(k,"in")*val(k,"irate")+val(k,"out")*val(k,"orate"))/1e6;
      var perTask=perCall*val(k,"calls");
      var monthly=perTask*val(k,"tasks");
      document.getElementById(k+"_out").innerHTML=
        "cost / call   = ("+val(k,"in")+"×$"+val(k,"irate")+" + "+val(k,"out")+"×$"+val(k,"orate")+")/1e6 = <b>$"+perCall.toFixed(4)+"</b>\n"+
        "cost / task   = $"+perCall.toFixed(4)+" × "+val(k,"calls")+" calls = <b>$"+perTask.toFixed(3)+"</b>\n"+
        "cost / month  = $"+perTask.toFixed(3)+" × "+val(k,"tasks").toLocaleString()+" = <b>$"+Math.round(monthly).toLocaleString()+"</b>\n"+
        "a single-agent version (1 call) would cost ≈ $"+Math.round(monthly/val(k,"calls")).toLocaleString()+"/mo — the fan-out is a "+val(k,"calls")+"× multiplier.";
    },
    guess:{label:"Your monthly $ estimate"},
    answer:function(k){return (val(k,"in")*val(k,"irate")+val(k,"out")*val(k,"orate"))/1e6*val(k,"calls")*val(k,"tasks");},
    fmt:function(x){return "$"+Math.round(x).toLocaleString();},
    tip:"Chapter 11 lesson: every extra agent, reflection loop, and re-sent context is billable. Control it with routing (cheap model for easy sub-tasks), context trimming, caching the stable prefix, and capping reflection iterations — before you cut agents."
  },
  roi:{
    title:"Agent ROI — the number that funds the project",
    desc:"An agent automates part of a workflow. ROI = (value created − cost) / cost. Value = tasks × minutes saved × loaded labor rate × automation rate. Be honest about the automation rate and the run cost.",
    fields:[
      {id:"tasks",label:"tasks / month",def:20000},
      {id:"mins",label:"minutes saved / task",def:6},
      {id:"rate",label:"loaded labor $/hour",def:45},
      {id:"auto",label:"automation rate %",def:70},
      {id:"cost",label:"monthly run+ops cost $",def:9000}
    ],
    compute:function(k){
      var hours=val(k,"tasks")*val(k,"mins")/60*(val(k,"auto")/100);
      var value=hours*val(k,"rate");
      var net=value-val(k,"cost");
      var roi=val(k,"cost")>0?net/val(k,"cost")*100:0;
      document.getElementById(k+"_out").innerHTML=
        "hours saved/mo = "+val(k,"tasks").toLocaleString()+" × "+val(k,"mins")+"min × "+val(k,"auto")+"% = <b>"+Math.round(hours).toLocaleString()+" h</b>\n"+
        "value / month  = "+Math.round(hours).toLocaleString()+"h × $"+val(k,"rate")+" = <b>$"+Math.round(value).toLocaleString()+"</b>\n"+
        "net / month    = value − $"+val(k,"cost").toLocaleString()+" = <b>$"+Math.round(net).toLocaleString()+"</b>\n"+
        "ROI            = net / cost = <b>"+Math.round(roi)+"%</b>   ·   payback in ~"+(value>0?(val(k,"cost")/value).toFixed(2):"∞")+" months";
    },
    guess:{label:"Your ROI % estimate"},
    answer:function(k){var hours=val(k,"tasks")*val(k,"mins")/60*(val(k,"auto")/100);var value=hours*val(k,"rate");return (value-val(k,"cost"))/val(k,"cost")*100;},
    fmt:function(x){return Math.round(x)+"%";},
    tip:"The automation rate is where honest business cases live or die. A demo automates 100% of the happy path; production automates 60–80% and escalates the rest to a human. Model the realistic rate, include ops cost, and quote a range."
  },
  consensus:{
    title:"Majority voting — why N noisy agents beat one",
    desc:"Run the same task on N independent agents (each correct with probability p) and take the majority answer. This computes the probability the majority is correct — the math behind the Majority Voting and Parallel Execution Consensus patterns.",
    fields:[
      {id:"p",label:"single-agent accuracy %",def:75},
      {id:"n",label:"number of agents (odd)",def:5}
    ],
    compute:function(k){
      var p=val(k,"p")/100;var N=Math.max(1,Math.round(val(k,"n")));
      function C(n,r){var x=1;for(var i=0;i<r;i++)x=x*(n-i)/(i+1);return x;}
      var need=Math.floor(N/2)+1;var prob=0;
      for(var i=need;i<=N;i++)prob+=C(N,i)*Math.pow(p,i)*Math.pow(1-p,N-i);
      document.getElementById(k+"_out").innerHTML=
        "single agent  = <b>"+(p*100).toFixed(0)+"%</b> correct\n"+
        "voting rule   = need "+need+" of "+N+" to agree\n"+
        "system (majority correct) = <b>"+(prob*100).toFixed(1)+"%</b>\n"+
        "error dropped from "+((1-p)*100).toFixed(0)+"% to "+((1-prob)*100).toFixed(1)+"% — at "+N+"× the cost. Diminishing returns once p is high.";
    },
    guess:{label:"Your system accuracy % estimate"},
    answer:function(k){var p=val(k,"p")/100;var N=Math.max(1,Math.round(val(k,"n")));function C(n,r){var x=1;for(var i=0;i<r;i++)x=x*(n-i)/(i+1);return x;}var need=Math.floor(N/2)+1;var prob=0;for(var i=need;i<=N;i++)prob+=C(N,i)*Math.pow(p,i)*Math.pow(1-p,N-i);return prob*100;},
    fmt:function(x){return x.toFixed(1)+"%";},
    tip:"Voting only helps when agents are better than chance (p>0.5) and their errors are independent. Correlated errors (same model, same prompt, same blind spot) break the assumption — diversify models or prompts to keep the votes independent."
  }
};

/* ============ FLASHCARDS: patterns & concepts to know cold ============ */
window.CARDS=[
  {id:"a1",k:"Foundations",q:"The agent anatomy loop, in order?",a:"Sense → Reason → Plan → Act → (Memory throughout) → sense the result. A continuous feedback loop; multi-agent adds Coordinate."},
  {id:"a2",k:"Foundations",q:"MCP vs A2A in one line each?",a:"MCP = an agent connects to tools/data (vertical integration). A2A = agents connect to each other (horizontal). MCP for tools, A2A for teamwork."},
  {id:"a3",k:"Foundations",q:"LLM vs workflow vs agent?",a:"LLM = one call. Workflow = code decides a fixed path, LLM fills slots. Agent = the LLM decides the path in a sense-reason-act loop with tools."},
  {id:"a4",k:"Maturity",q:"GenAI Maturity Model, L0–L6?",a:"0 data foundation · 1 select+prompt+serve · 2 RAG · 3 tuning (PEFT/FFT) · 4 grounding+eval · 5 single-agent · 6 multi-agent."},
  {id:"a5",k:"Maturity",q:"What moves you up the maturity model?",a:"The specific patterns you implement. Target a capability, reverse-engineer the 4–5 patterns that deliver it, master those — pattern-first, not build-everything."},
  {id:"a6",k:"Maturity",q:"Agentic AI Maturity spectrum?",a:"1 basic (fixed workflow+tools) · 2 dynamic tool selection · 3 introspective (ReAct/Reflexion, self-correct) · 4 multi-agent (supervisor) · 5–6 decentralized collaboration, consensus, swarm."},
  {id:"a7",k:"Coordination",q:"Agent Router pattern — what/when?",a:"Intent-based routing: a lightweight classifier sends each request to the right specialist agent. Use when you have distinct request types and one entry point."},
  {id:"a8",k:"Coordination",q:"Supervisor vs Swarm?",a:"Supervisor = centralized orchestrator delegates to specialists (predictable, auditable — the default). Swarm = decentralized, emergent coordination (flexible, harder to govern)."},
  {id:"a9",k:"Coordination",q:"Blackboard Knowledge Hub?",a:"Specialists read/write a shared workspace instead of messaging directly; a controller triggers whoever can contribute next. Great for collaborative diagnosis-style problems."},
  {id:"a10",k:"Coordination",q:"Contract-Net Marketplace?",a:"A manager announces a task; agents bid; the best bid wins the contract. Good for dynamic task/resource allocation (e.g. selecting a cloud provider)."},
  {id:"a11",k:"Coordination",q:"Consensus vs Negotiation patterns?",a:"Consensus = agents debate/vote to converge on one answer (e.g. forecasting debate). Negotiation = self-interested agents bargain over a shared resource to a mutually acceptable deal."},
  {id:"a12",k:"Coordination",q:"When do you NOT need multi-agent?",a:"When a single agent or a fixed workflow can do it. Multi-agent adds coordination cost, latency, and failure surface — earn it with genuine parallelism or specialization."},
  {id:"a13",k:"Explainability",q:"Instruction Fidelity Auditing?",a:"A separate auditor checks that the agent actually followed each instruction/constraint in its brief — catches silent drift from the contract (e.g. a mis-applied discount rule)."},
  {id:"a14",k:"Explainability",q:"Fractal Chain-of-Thought (FCoT)?",a:"Structured, nested reasoning embedded at every level (orchestrator and each specialist) so the whole system's thinking is inspectable, not just the top call."},
  {id:"a15",k:"Explainability",q:"Persistent Instruction Anchoring?",a:"Re-inject the non-negotiable constraints at every step so long runs don't ‘forget’ them (fights lost-in-the-middle drift in e.g. financial reporting)."},
  {id:"a16",k:"Explainability",q:"Shared Epistemic Memory?",a:"A common, versioned knowledge store agents read/write so the team shares one consistent picture of the world (e.g. a supply-chain disruption)."},
  {id:"a17",k:"Robustness",q:"The robustness spectrum idea?",a:"Robustness is a spectrum of ~5 levels; you chain fault-tolerance patterns to reach the reliability your use case demands, and measure it."},
  {id:"a18",k:"Robustness",q:"Watchdog Timeout Supervisor?",a:"A supervisor kills or restarts any agent that hangs past a deadline, so one stuck agent can't freeze the system. Pairs with Auto-Healing resuscitation."},
  {id:"a19",k:"Robustness",q:"Adaptive Retry with Prompt Mutation?",a:"On failure, don't just repeat — analyze why it failed and modify the prompt/approach before retrying. Turns blind retries into reasoned recovery (the R⁵ ‘Retry’)."},
  {id:"a20",k:"Robustness",q:"Incremental Checkpointing?",a:"Persist state after each stage so a long pipeline resumes from the last good checkpoint instead of restarting — essential for multi-stage jobs."},
  {id:"a21",k:"Robustness",q:"Majority Voting across agents?",a:"Run N agents, take the majority answer to cut error — only works when p>0.5 and errors are independent. Diversify models/prompts to keep votes independent."},
  {id:"a22",k:"Robustness",q:"Fallback Model Invocation?",a:"If the primary model fails or times out, fail over to a secondary (cheaper/available) model so the agent stays up. Availability over peak quality."},
  {id:"a23",k:"Robustness",q:"Trust Decay and Scoring?",a:"Track each agent/source's reliability over time; down-weight ones that repeatedly produce bad output. Self-optimizing routing away from flaky components."},
  {id:"a24",k:"Security",q:"Agent Mesh Defense?",a:"Defense-in-depth across the agent network: a compromised agent is contained and can't reach sensitive tools/data because peers enforce policy at each hop."},
  {id:"a25",k:"Security",q:"Execution Envelope Isolation?",a:"Sandbox risky actions (code execution, tool calls) in a constrained environment so a malicious or buggy agent can't damage the host — least privilege, contained blast radius."},
  {id:"a26",k:"Human-Agent",q:"Agent Calls Human (HITL escalation)?",a:"The agent pauses and escalates to a person when confidence is low or stakes are high (e.g. a loan ambiguity). The load-bearing safety pattern for consequential actions."},
  {id:"a27",k:"Human-Agent",q:"The five human-agent interaction modes?",a:"Agent-calls-human, human-delegates-to-agent, human-calls-agent, agent-delegates-to-agent, agent-calls-proxy-agent. Different trust and control profiles."},
  {id:"a28",k:"Agent-level",q:"Structured Reasoning & Self-Correction?",a:"An agent plans, critiques its own draft against criteria, and revises before acting — the ReAct/Reflexion idea packaged as an internal pattern."},
  {id:"a29",k:"System-level",q:"Tool & Agent Registry?",a:"A discoverable catalog of tools/agents (with capabilities/schemas) so the system can find and bind to the right one at runtime instead of hardcoding."},
  {id:"a30",k:"Learning",q:"The Self-Improvement Flywheel?",a:"Generate → Evaluate → Learn → Deploy, repeated. You can only improve what you can measure, so Evaluate is the crucial stage; balance exploitation with exploration."},
  {id:"a31",k:"Learning",q:"The R⁵ model?",a:"Relax (manage context/latency), Reflect (self-critique checkpoints), Reference (provenance/citations), Retry (reasoned recovery), Report (quantify quality). Operate-and-improve, not prompt-and-pray."},
  {id:"a32",k:"Learning",q:"Hybrid (Planner + Scorer) architecture?",a:"Split generation from evaluation into two agents so the critic is objective — an agent can't reliably grade its own homework (mode collapse). Foundation of self-improvement."},
  {id:"a33",k:"Frameworks",q:"ADK vs CrewAI vs LangGraph?",a:"ADK = production runtimes + managed state + callback guardrails (Google). CrewAI = role-playing crews, sequential/hierarchical, implicit state. LangGraph = explicit stateful graph, fine-grained cycles/branches."},
  {id:"a34",k:"Frameworks",q:"When to pick LangGraph?",a:"When you need cycles, branching, and explicit inspectable state — advanced control flow (retry loops, conditional routing). It models the app as a state machine."},

{id:"l1",t:"LLM vs workflow vs agent",min:7,html:`
<p class="lead">The word ‘agent’ is overloaded. The book's definition is operational and worth memorizing, because it tells you when you actually need one — and when you don't.</p>
<h3>Three things, not one</h3>
<ul>
<li><strong>An LLM call</strong> is a single request-response. Powerful, but stateless and passive — it does exactly one turn.</li>
<li><strong>An automated workflow</strong> is a predefined sequence where <em>your code</em> decides the path and LLM calls fill specific slots (classify, extract, draft). Predictable and auditable.</li>
<li><strong>An AI agent</strong> is an LLM placed in a <em>loop</em> with tools, where <em>the model itself</em> decides what to do next to reach a goal — sensing, reasoning, planning, acting, and observing the result.</li>
</ul>
<div class="box key"><div class="bx-h">The judgment this unlocks</div>If the path is knowable in advance, a <strong>workflow</strong> is cheaper, faster, and easier to debug. Reserve <strong>agents</strong> for genuinely open-ended tasks where the sequence can't be predetermined. ‘We built an agent’ is not a boast when a five-step workflow would have done the job.</div>
<h3>The agent anatomy</h3>
<p>Each agent has an internal structure that produces its behaviour: <strong>Goals</strong> (what it's trying to achieve), <strong>Sense</strong> (perception — gathering context from APIs, databases, sensors; ‘context is king’), <strong>Reason</strong> (the LLM cognition core), <strong>Plan</strong> (devise the next steps), <strong>Act</strong> (execute via tools), <strong>Memory</strong> (state and past experience), and — only in multi-agent systems — <strong>Coordinate</strong> (align with other agents).</p>

{id:"l2",t:"The GenAI Maturity Model (L0–L6)",min:8,html:`
<p class="lead">The book's organizing spine. It's not just a description of where you are — it's a build order, because <em>each level is reached by implementing specific patterns.</em></p>
<div class="tblwrap"><table class="tbl"><tr><th>Level</th><th>Focus</th><th>What it adds</th></tr>
<tr><td class="mono">0</td><td>Data foundation</td><td>Acquire, clean, curate, govern data. Without it, nothing above works.</td></tr>
<tr><td class="mono">1</td><td>Select + prompt + serve</td><td>Pick a model, prompt it, serve via API. Basic tool use via function calling starts here.</td></tr>
<tr><td class="mono">2</td><td>Contextual enhancement (RAG)</td><td>Fetch external knowledge to ground answers — a chatbot pulling the latest policy.</td></tr>
<tr><td class="mono">3</td><td>Tuning for specificity</td><td>PEFT or full fine-tuning to specialize terminology, style, behaviour for a role.</td></tr>
<tr><td class="mono">4</td><td>Grounding & evaluation</td><td>Citations linking outputs to sources + robust eval for accuracy, bias, safety — trust.</td></tr>
<tr><td class="mono">5</td><td>Single-agent systems</td><td>One autonomous agent: multi-step reasoning, planning, tool use. Needs AgentOps.</td></tr>
<tr><td class="mono">6</td><td>Multi-agent systems</td><td>Specialized agents collaborate, coordinate (A2A), negotiate on problems beyond one agent.</td></tr>
</table></div>
<div class="box key"><div class="bx-h">The strategic move — pattern-first architecture</div>Don't try to ‘build AI’. Pick a <strong>target capability</strong> (e.g. ‘fully auditable and safe for financial transactions’), then <strong>reverse-engineer the four or five patterns</strong> that deliver that level of reliability, and master exactly those. Every technical investment then maps directly to a validated state of maturity and business value. Levels 5–6 get expanded later into their own Agentic AI Maturity spectrum.</div>
`,checks:[
{q:"A team jumps straight to a multi-agent system (L6) but their source data is ungoverned and dirty. The maturity model's warning:",opts:["Level 0, the data foundation, must come first","Agents can clean the data as part of their task","Fine-tuning will compensate for messy data","More agents will cross-check the bad data"],a:0,why:"The levels are cumulative. Sophisticated agentic AI relies on the preceding levels — data foundation, context, grounding — being in place."},
{q:"The model says your maturity level is determined by:",opts:["The patterns you implement","Your total AI budget this year","The size of the model you use","How many GPUs you can access"],a:0,why:"Patterns are the vehicle that moves you along the roadmap. Pattern-first, not build-everything, is the cost-effective path."}
]

{id:"l3",t:"The agentic stack: function calling, MCP & A2A",min:7,html:`
<p class="lead">Three interoperability layers turn a chatbot into a system. Know what each connects.</p>
<h3>Function calling — the agent acts</h3>
<p>You give the LLM a list of tools, each with a <strong>name</strong>, a clear <strong>description</strong>, and a <strong>parameter schema</strong>. The reasoning core decides <em>when</em> to use a tool, <em>which</em>, and <em>what arguments</em>, then emits a structured (JSON) object naming the call. Your code executes it and feeds the result back into the loop. The description is what the model routes on — vague descriptions are routing bugs.</p>
<h3>MCP — the agent connects to tools</h3>
<p>The <strong>Model Context Protocol</strong> standardizes how an agent describes, discovers, and securely invokes tools and data sources as interoperable services. Think <strong>vertical integration</strong>: connecting one agent to everything it needs.</p>
<h3>A2A — agents connect to each other</h3>
<p>The <strong>Agent-to-Agent</strong> protocol is a shared language for structured task delegation between agents, regardless of framework or vendor. Think <strong>horizontal integration</strong>: connecting agents into a team. Discovery works via an <strong>agent card</strong> (advertises capabilities) exposed by an <strong>agent server</strong> (the A2A endpoint).</p>
<div class="box key"><div class="bx-h">The mental model, and how they compose</div><strong>MCP = agent → tools. A2A = agent → agents.</strong> They work together: an orchestrator uses <strong>A2A</strong> to delegate to specialist agents; each specialist uses <strong>MCP</strong> to reach its tools and data; results flow back through A2A.</div>
`,checks:[
{q:"An orchestrator agent needs to hand a sub-task to a specialist agent built by another team on a different framework. Which layer?",opts:["MCP","Function calling","A shared vector database","A2A"],a:3,why:"A2A connects agents to agents. MCP connects an agent to its tools/data. Function calling is how a single LLM triggers one tool."},
{q:"Why does the tool ‘description’ field matter so much?",opts:["It's displayed to end users inside the chat interface","It's only there because the JSON schema syntax requires it","It controls which permission level the tool runs with","The model routes on it to pick the tool and arguments"],a:3,why:"The model routes on names and descriptions. Tool quality — sharp descriptions, narrow typed params — is most of what makes function calling reliable."}
],

{id:"l4",t:"Why production-grade GenAI is hard",min:6,html:`
<p class="lead">A demo is the happy path. The book is honest that most of the difficulty — and most of the value of the patterns — lives in everything else.</p>
<p>The architectural features that make agentic systems powerful also make them demanding: <strong>modularity</strong> (add/remove agents without a redesign), <strong>scalability</strong> (handle many agents, data sources, interactions), <strong>adaptability</strong> (the sense-reason-act loop learns over time), <strong>multimodality</strong>, and <strong>collaboration</strong> via shared memory or protocols. Each is an engineering commitment, not a free feature.</p>
<div class="box warnbx"><div class="bx-h">The challenges that block production</div>Low-latency inter-agent communication; managing diverse data and knowledge representation; reliable tool use; hallucination and reliability; observability into <em>why</em> a multi-agent system did something; security across an expanded attack surface; and the operational discipline (AgentOps) to monitor, log, and manage the agent life cycle. The rest of the book is a catalog of patterns that each attack one of these.</div>
<p>This is why the pattern-first mindset matters: you don't need every pattern, you need the specific ones that close the gaps between your demo and the reliability your use case demands.</p>
`,checks:[
{q:"Compared to a single LLM app, a multi-agent system's hardest new problems include:",opts:["Inter-agent latency, observability, security surface, AgentOps","Mainly a higher token bill from the extra calls between agents","Mainly writing and maintaining separate prompts for each agent","Mainly picking a framework that supports teams of agents"],a:0,why:"Coordination, observability, security, and operations are the production challenges the pattern catalog exists to address. The model itself is rarely the blocker."}
]
}
],

{q:"The agent anatomy loop is:",opts:["Prompt, respond, store the result, then reset","Plan, act, sense, reason, then the task ends","Retrieve, generate, validate, then respond","Sense, reason, plan, act, closed by feedback"],a:3,why:"The continuous sense-reason-plan-act-feedback loop grounded in memory is what produces autonomous behaviour."},
{q:"GenAI Maturity Level 2 is:",opts:["Single-agent systems with tool use","Tuning the model for specificity","Grounding outputs with evaluation","Contextual enhancement with RAG"],a:3,why:"L0 data · L1 select/prompt/serve · L2 RAG · L3 tuning · L4 grounding+eval · L5 single-agent · L6 multi-agent."},

]

id:"m2",n:"2",spine:false,t:"Agent-Ready LLMs",
sub:"Choosing, deploying, and operating the model at an agent's core — where tool-use reliability matters more than leaderboard rank.",
lessons:[
{id:"l1",t:"Selecting a model for agents",min:8,html:`
<p class="lead">An agent's cognition core has different requirements than a chatbot. The best benchmark score is not the selection criterion — reliable tool use often is.</p>
<div class="tblwrap"><table class="tbl"><tr><th>Criterion</th><th>Why it matters for an agent</th></tr>
<tr><td class="mono">Context window</td><td>Must hold the system prompt, tool schemas, memory, retrieved context, and the running trace. Agents consume context fast.</td></tr>
<tr><td class="mono">Size &amp; specialization</td><td>Bigger isn't always better — a smaller, faster model that routes tools reliably can beat a larger one for an agent role. Match model to the sub-task.</td></tr>
<tr><td class="mono">Native tool use / function calling</td><td>The decisive capability. An agent that can't reliably emit valid, correct tool calls is not agent-ready, whatever its reasoning score.</td></tr>
<tr><td class="mono">Robustness, reliability, safety</td><td>Resistance to prompt injection, consistent formatting, refusal behaviour — the agent will run unattended in a loop.</td></tr>
<tr><td class="mono">Adaptability / fine-tunability</td><td>Can you specialize it (PEFT/FFT) if the role demands domain terminology or behaviour?</td></tr>
<tr><td class="mono">Cost &amp; latency</td><td>Multiplied across every call in every loop — see the tokenomics drill. A cheap model in the right slot is a design decision, not a compromise.</td></tr>
</table></div>
<div class="box key"><div class="bx-h">The agent-specific instinct</div>Select per <em>role</em>, not once globally. A cheap, fast model handles routing and simple sub-tasks; a stronger model handles the hard reasoning. This tiering is one of the biggest cost and latency levers you have.</div>
`,checks:[
{q:"For an agent, the single most important selection criterion the book emphasizes beyond raw reasoning is:",opts:["The longest context window","The top reasoning benchmark score","The largest parameter count","Reliable native tool use"],a:3,why:"Agents act through tools. If function calling is unreliable, nothing else matters. Tool-use reliability, robustness, and cost-per-role often beat leaderboard rank for agent roles."}
]
},
{id:"l2",t:"Serving & performance optimization",min:7,html:`
<p class="lead">Where the model runs shapes latency, cost, privacy, and control. Three archetypes, three optimization axes.</p>
<h3>Serving architectures</h3>
<ul>
<li><strong>Cloud-hosted APIs</strong> — fastest to start, no ops, elastic. You trade some control and data residency; cost scales with usage.</li>
<li><strong>Self-hosted models</strong> — full control, data stays in your environment, customizable. You own the GPUs, serving, and upgrades — justified by scale, residency, or deep customization.</li>
<li><strong>Edge deployment</strong> — small models on-device for privacy, offline operation, and ultra-low latency; limited by device compute.</li>
</ul>
<h3>The three optimization axes</h3>
<ul>
<li><strong>Latency reduction</strong> — streaming, smaller/distilled models for simple steps, caching stable prefixes, cutting unnecessary tool round-trips.</li>
<li><strong>Throughput maximization</strong> — batching and concurrency so one deployment serves many agent calls.</li>
<li><strong>Cost optimization</strong> — route easy sub-tasks to cheaper models, trim context, cap output and reflection loops. In agents these compound because there are many calls per task.</li>
</ul>
<div class="box add"><div class="bx-h">Optimizing for tool interaction</div>An agent's latency is often dominated not by the model but by the <strong>tool round-trips</strong> — each API/DB call adds latency and a failure point. Design tools to be fast, idempotent, and coarse enough to avoid chatty back-and-forth.</div>
`,checks:[
{q:"A hospital needs an agent that processes patient data with strict residency and offline capability. The serving choice leans toward:",opts:["A public cloud API, provided patient data is anonymized first","Whichever hosted API is cheapest per token at their volume","The largest frontier API, for the best accuracy on clinical text","Self-hosted or edge, driven by residency and offline needs"],a:3,why:"Residency, privacy, and offline operation are the classic reasons to self-host or run at the edge, even when an API would be cheaper. Match serving to the constraint."}
]
},
{id:"l3",t:"AgentOps: operating agents in production",min:6,html:`
<p class="lead">LLMOps for a passive model isn't enough. Agents act, loop, and coordinate — so they need operational discipline built for autonomy.</p>
<p><strong>AgentOps</strong> extends LLMOps to the realities of agentic systems: monitoring and logging every step of the sense-reason-act loop, tracing tool calls and inter-agent messages, versioning prompts and tools, managing the agent life cycle (deploy, update, roll back), and watching cost and reliability continuously.</p>
<div class="box key"><div class="bx-h">Why observability is non-negotiable here</div>When a single agent gives a wrong answer you inspect one call. When a multi-agent system does, you need a <strong>trace</strong> across orchestrator and specialists to see <em>which</em> agent, tool, or hand-off caused it. Without step-level observability, a multi-agent failure is undebuggable — which is why several later patterns (Causal Dependency Graph, Fractal CoT) exist specifically to make reasoning inspectable.</div>
<p>This maps directly to Level 5+ of the maturity model: mature AgentOps is a prerequisite for trusting an autonomous agent in production, not an afterthought.</p>
`,checks:[
{q:"A multi-agent system occasionally returns a wrong result and no one can tell why. The AgentOps gap is:",opts:["No step-level tracing across agents and hand-offs","Each agent's context window is too short for the task","Too few agents are cross-checking each other's results","The base model is too small for the work it's doing"],a:0,why:"Collective behaviour is only debuggable with per-step, per-agent traces. This is why observability is core to AgentOps and why patterns like the Causal Dependency Graph exist."}
]
}
],

id:"m3",n:"3",spine:true,t:"The Adaptation Spectrum: RAG → Fine-tuning → Grounding",
sub:"How a generic model becomes a specialized agent — and the Agentic AI Maturity spectrum that says which pattern you need next.",
lessons:[
{id:"l1",t:"From generic LLM to specialized agent",min:8,html:`
<p class="lead">Turning a general model into a reliable agent core is rarely one technique — it's a deliberate combination, chosen by requirement, resources, and how much customization the role truly needs.</p>
<h3>The adaptation spectrum (reach for the lightest that works)</h3>
<ul>
<li><strong>In-context learning / prompting</strong> — steer behaviour with instructions and examples in the prompt. Zero training. First resort.</li>
<li><strong>RAG</strong> — inject external <em>knowledge</em> at run time. Fixes ‘the model doesn't know our facts’.</li>
<li><strong>Grounding</strong> — link outputs back to sources (citations) for trust and auditability.</li>
<li><strong>PEFT</strong> (LoRA/adapters) — tune a small slice of weights for style, format, or behaviour. Cheap, fast.</li>
<li><strong>Full fine-tuning</strong> — retrain substantial weights for deep specialization. Costly; last resort.</li>
</ul>
<h3>The Agentic AI Maturity spectrum</h3>
<p>The book expands maturity Levels 5–6 into their own progression, which explains <em>why</em> later patterns appear:</p>
<div class="tblwrap"><table class="tbl"><tr><th>Stage</th><th>What the agent can do</th></tr>
<tr><td class="mono">1 Basic</td><td>Single agent, fixed workflow, calls predefined tools via function calling.</td></tr>
<tr><td class="mono">2 Dynamic tools</td><td>Single agent dynamically <em>chooses</em> from a set of approved tools per problem.</td></tr>
<tr><td class="mono">3 Introspective</td><td>ReAct + Reflexion: step-by-step reasoning and self-correction via feedback loops.</td></tr>
<tr><td class="mono">4 Multi-agent</td><td>Specialists coordinate in structured, supervised workflows (predictable, auditable).</td></tr>
<tr><td class="mono">5–6 Collaborative</td><td>Decentralized collaboration — negotiation, consensus, swarm — for highly dynamic problems.</td></tr>
</table></div>
<div class="box key"><div class="bx-h">Why this spectrum matters</div>Each stage introduces new failure modes, so each calls for new patterns. Dynamic tools need routing; introspection needs self-correction; multi-agent needs coordination and conflict resolution. The spectrum is a map of which pattern family you'll need next.</div>
`,checks:[

{id:"l2",t:"RAG for contextual enhancement",min:7,html:`
<p class="lead">RAG is the workhorse of Level 2 — and the book grounds it in three concrete agent roles that show the same mechanism serving very different goals.</p>
<h3>Three agents, one pattern</h3>
<ul>
<li><strong>Customer-support agent</strong> — retrieves the latest product/policy docs before answering, so it's never stale.</li>
<li><strong>Financial-analyst agent</strong> — pulls timely market data and reports so its analysis reflects current conditions, not training-cutoff knowledge.</li>
<li><strong>Compliance agent</strong> — retrieves current regulations and transaction context to monitor for violations against the rules as they are <em>now</em>.</li>
</ul>
<p>The common thread: the model's parametric knowledge is frozen and generic; RAG supplies what's <strong>fresh, private, and specific</strong>. For agents, retrieval is a <em>sensing</em> capability — it's how the agent perceives the current state of its domain.</p>
<div class="box key"><div class="bx-h">RAG as sensing</div>Later the book formalizes this as the <strong>Sensing with RAG</strong> agent-level pattern: retrieval isn't a bolt-on, it's part of the agent's perception. An agent that senses via RAG stays grounded in current reality instead of hallucinating from stale weights.</div>
`,checks:[
{q:"Across the support, analyst, and compliance examples, what does RAG fundamentally provide the agent?",opts:["Faster inference on very long documents","Specialized behavior, tone and output format","Fresh, private, domain-specific knowledge","A larger effective context window for free"],a:2,why:"RAG supplies what's timely and proprietary. Framed as an agent capability, it's sensing — how the agent perceives the current state of its world before reasoning."}
]
},
{id:"l3",t:"Fine-tuning, ICL & grounding",min:7,html:`
<p class="lead">When knowledge injection isn't enough — when you need the model to <em>behave</em> differently — you tune. When you need trust, you ground.</p>
<h3>PEFT vs full fine-tuning</h3>
<p><strong>PEFT</strong> (parameter-efficient fine-tuning — LoRA, adapters) modifies only a small part of the model: cheap, fast, low-risk, and enough for adopting domain terminology, a house style, or a consistent output format. <strong>Full fine-tuning</strong> retrains substantial weights: powerful for deep specialization but expensive and easy to over-do. The rule of thumb: fine-tune for <em>behaviour and style</em>, use RAG for <em>facts</em> — and prefer the lightest option that meets the need.</p>
<h3>In-context learning for adaptation</h3>
<p>Often you don't need to tune at all: well-chosen examples in the prompt (ICL) adapt behaviour on the fly. The book's product-feedback-analyzer agent uses ICL to classify and structure feedback purely from examples — no training run.</p>
<h3>Grounding the output</h3>
<p><strong>Grounding</strong> ties the model's answer to verifiable sources — citations, retrieval traces — so a human (or an auditor agent) can check it. This is the heart of maturity Level 4: it converts fluent output into <em>trustworthy, defensible</em> output, and it's the foundation the R⁵ ‘Reference’ discipline builds on later.</p>
`,checks:[
{q:"An agent needs to consistently produce output in your firm's specific report format and tone, but its facts (from RAG) are already correct. The right tool:",opts:["A larger model that follows formatting instructions better","PEFT or in-context examples, since it's a style problem","Full fine-tuning, because the format has to be exactly right","More RAG, adding past example reports to the retrieval index"],a:1,why:"Style/format/behaviour ⇒ PEFT or ICL. Facts ⇒ RAG. Full fine-tuning is overkill for a formatting requirement and prefer the lightest option that works."}
]
},
{id:"l4",t:"Hierarchical architecture: orchestrators & specialists",min:6,html:`
<p class="lead">The book's reference structure for business-process automation — and the backbone of the loan-processing use case you'll build in the Case Lab.</p>
<p>A <strong>hierarchical agentic architecture</strong> pairs an <strong>orchestrator</strong> (a coordinator that decomposes the goal and delegates) with <strong>specialist</strong> agents (each an expert in one sub-task with its own tools). The orchestrator plans and routes; specialists execute; results flow back up. This gives you the reliability of structure with the flexibility of specialization — and it maps to Agentic Maturity Stage 4.</p>
<div class="box key"><div class="bx-h">Governance and observability via callbacks</div>The architecture threads <strong>callbacks</strong> through every hand-off — hooks that can inspect, filter, redact, or block input/output before and after each agent or tool call. This is where governance lives: PII redaction, safety checks, human-in-the-loop gates, and the audit trail. Callbacks are how you make an autonomous hierarchy <em>controllable</em>.</div>
<p>Keep this shape in mind — nearly every coordination, robustness, and compliance pattern that follows is a refinement of the orchestrator/specialist relationship or of the callbacks that guard it.</p>
`,checks:[
{q:"In a hierarchical agent architecture, callbacks primarily provide:",opts:["Faster inference when passing work between agents","Lower token costs through shared response caching","Extra model capacity for the specialist agents","Governance and observability at every hand-off"],a:3,why:"Callbacks are the control surface of the hierarchy: safety filtering, PII redaction, human-in-the-loop gates, and logging. They turn an autonomous system into a governable one."}
]
}
],

sub:"Data stores, environment context, and who-talks-to-whom — plus the travel and loan case studies that recur through the book.",

{id:"l1",t:"Data stores & environment context",min:6,html:`
<p class="lead">An agent is only as good as what it can perceive and remember. Its ‘environment’ is a set of data stores it senses and acts upon.</p>
<h3>The environment context</h3>
<ul>
<li><strong>Digital business context</strong> — unstructured data (text, images), structured data (databases, <strong>knowledge graphs</strong> for semantic relationships), and <strong>vector stores</strong> for similarity search over embeddings.</li>
<li><strong>Physical context</strong> — for embodied agents: sensors (cameras, IoT) and actuators (robotic arms).</li>
<li><strong>Shared memory / communication hub</strong> — in multi-agent systems, a coordination surface where agents exchange information, plans, and goals.</li>
</ul>
<div class="box key"><div class="bx-h">Memory is not one thing</div>Agents blend short-term working memory (the current task/trace), long-term memory (past experience, learned facts), and shared memory (team state). Knowledge graphs earn special mention: they give agents a <em>structured, semantic</em> understanding of entities and relationships that plain vector search can't, unlocking deeper reasoning.</div>
`,checks:[
{q:"Why does the book highlight knowledge graphs alongside vector stores?",opts:["They model entities and relationships for multi-hop reasoning","They're much cheaper to store than embeddings at large scale","They remove the need for a separate relational database","They retrieve similar passages faster than vector indexes do"],a:0,why:"Vector stores find ‘similar’ text; knowledge graphs encode explicit relationships between entities, supporting multi-hop, structured reasoning that pure similarity can't."}
]
},
{id:"l2",t:"Interaction models & two case studies",min:8,html:`
<p class="lead">How agents relate to tools, to each other, and to humans defines the system's shape. Two recurring examples make it concrete.</p>
<h3>Interaction models, from simple to collaborative</h3>
<ul>
<li><strong>Single agent + tools</strong> — one agent using function calling / MCP. The Level-5 baseline.</li>
<li><strong>Hierarchical (orchestrated)</strong> — an orchestrator delegates to specialists (via A2A). Structured, auditable — the workhorse.</li>
<li><strong>Peer / decentralized</strong> — agents coordinate directly, negotiating or reaching consensus without a central boss. Flexible, harder to govern.</li>
</ul>
<p>A2A makes cross-agent interaction work through two pieces: an <strong>agent server</strong> (the endpoint exposing an agent's A2A interface) and an <strong>agent card</strong> (a discovery document advertising its capabilities), so an orchestrator can find and delegate to the right specialist.</p>
<h3>Case study — Travel Planning Agent</h3>
<p>A single agent takes a goal (‘book a trip to Tokyo within budget’), senses via flight/hotel APIs, plans an itinerary, and acts by booking — a clean Level-5 single-agent example of the full anatomy loop.</p>
<h3>Case study — Agentic Loan Processing</h3>
<p>The book's spine example. A loan application flows through stages — intake, validation, credit check, risk assessment, decision — each a natural specialist. As a <strong>single agent</strong> it's a capable but brittle monolith; as a <strong>multi-agent</strong> system, an orchestrator coordinates specialists (via A2A), which is more robust, maintainable, and scalable. You'll build both in the Case Lab.</p>
<div class="box key"><div class="bx-h">The through-line</div>Loan processing recurs because it has everything: multi-step workflow, high stakes (needs governance and audit), clear specialization (each stage is an expert), and exception paths (rejections). Watch how each new pattern in the book improves this one system.</div>
`,checks:[
{q:"The loan-processing example works as both a single-agent and multi-agent design. The multi-agent version's advantage is:",opts:["Lower token cost, because each individual agent is smaller","Robustness, maintainability and scalability as it grows","No need for any governance between the processing stages","Faster end-to-end processing time for each loan application"],a:1,why:"Decomposing the workflow into specialists under an orchestrator improves resilience and maintainability. The monolith is capable but brittle; the crew scales."},
{q:"An orchestrator discovers which specialist can handle a sub-task via:",opts:["Hardcoded imports in the orchestrator","A vector search over agent descriptions","An MCP tool listing","The agent card, served by the agent server"],a:3,why:"A2A uses agent servers (endpoints) and agent cards (capability discovery) so orchestrators can find and delegate to the right agent dynamically."}
]
}
],

{q:"A2A discovery relies on:",opts:["Function-calling schemas","An agent server and an agent card","A DNS record and an API key","A vector store of agent descriptions"],a:1,why:"The agent card advertises capabilities; the agent server exposes the interface — together they let orchestrators find and delegate to specialists."},
{q:"The loan-processing example is used throughout because it has:",opts:["A process that only ever needs one external tool","A simple, single-step decision with one clear outcome","Many steps, high stakes, clear specialists, exception paths","A workflow with no exceptions or rejections at all"],a:2,why:"Its richness lets each new pattern demonstrably improve the same system — the book's teaching device."},

]
});

id:"m5",n:"5",spine:true,t:"Coordination I — Delegation & Topologies",
sub:"How work gets routed and split across agents: routing, centralized vs decentralized delegation, and the composition topologies that structure a team.",
lessons:[
{id:"l1",t:"Routing work: the Agent Router",min:7,html:`
<p class="lead">Every coordination pattern answers one question — <em>who does what, and who decides?</em> The first and simplest: getting each request to the right agent.</p>
<h3>Strategic frame</h3>
<p>Coordination patterns span from <strong>foundational</strong> (structured, supervised — maturity Stage 4) to <strong>advanced</strong> (self-correcting, decentralized — Stages 5–6). Start structured; earn decentralization. Pick the <em>least</em> coordination that solves the problem, because every added mechanism adds latency, cost, and failure surface.</p>
<h3>The Agent Router (intent-based routing)</h3>
<p><strong>When:</strong> you have one entry point but several distinct request types, each best handled by a different specialist. <strong>How:</strong> a lightweight classifier reads the request's intent and dispatches it to the matching agent — no heavy orchestration, just a switchboard. <strong>Example:</strong> a compliance request lands, the router recognizes it as ‘transaction monitoring’ and sends it to the compliance agent rather than the support or analyst agent. <strong>Watch-outs:</strong> the router is a single point of failure and only as good as its intent classification; ambiguous requests need a fallback or clarification path.</p>
<div class="box key"><div class="bx-h">Router vs Supervisor</div>A <strong>router</strong> dispatches and steps back (one hop, fire-and-forget). A <strong>supervisor</strong> stays in charge, delegates sub-tasks, and integrates results across multiple hops. Use a router to <em>pick</em> an agent; a supervisor to <em>manage</em> several.</div>
`,checks:[
{q:"A single support inbox receives billing, technical, and compliance questions, each handled best by a different specialist agent. The natural first pattern:",opts:["Agent Router","Swarm Architecture","Blackboard Knowledge Hub","Consensus voting"],a:0,why:"Distinct request types + one entry point ⇒ intent-based routing. It's the lightest coordination that solves ‘who should handle this?’."}
]
},
{id:"l2",t:"Task delegation: Supervisor vs Swarm",min:8,html:`
<p class="lead">Once a task needs several agents working together, you choose <em>who's in charge</em>: a central boss, or no boss at all.</p>
<h3>Supervisor Architecture (centralized orchestration)</h3>
<p><strong>When:</strong> a complex task decomposes into sub-tasks that must be coordinated predictably and auditably. <strong>How:</strong> a central <strong>supervisor</strong> (orchestrator / meta-agent) breaks the goal into sub-tasks, delegates each to the right specialist, and integrates the results. <strong>Example:</strong> centralized loan processing — the supervisor routes the application through validation, credit, and risk specialists and assembles the decision. <strong>Trade-offs:</strong> predictable, auditable, easy to reason about — but the supervisor is a bottleneck and a single point of failure.</p>
<h3>Swarm Architecture (emergent decentralized coordination)</h3>
<p><strong>When:</strong> the problem is dynamic and benefits from parallel, flexible exploration with no fixed decomposition. <strong>How:</strong> many agents follow simple local rules and coordinate through the environment or lightweight signals; global behaviour <em>emerges</em>. <strong>Example:</strong> decentralized content creation where agents pick up and extend pieces of work opportunistically. <strong>Trade-offs:</strong> resilient (no single point of failure) and adaptive — but harder to predict, govern, and audit.</p>
<div class="box key"><div class="bx-h">The default and the exception</div><strong>Supervisor is the enterprise default</strong> because governance, auditability, and predictability usually matter more than emergent flexibility. Reach for a <strong>swarm</strong> only when the dynamism genuinely rewards decentralization and you can tolerate weaker predictability.</div>
`,checks:[
{q:"A regulated loan workflow must be predictable and fully auditable. Supervisor or swarm?",opts:["Contract-Net, so each step goes to the best bidder","Either, since both can log their decisions","Swarm, for resilience with no single point of failure","Supervisor, for predictability and an audit trail"],a:3,why:"Auditability and predictability point to a supervisor. Swarms trade those away for emergent flexibility, which regulated workflows can't accept."},
{q:"The main risk of the Supervisor pattern is:",opts:["It behaves unpredictably under heavy load","It can't delegate work to specialist agents","Its decisions are difficult to audit afterwards","It's a bottleneck and single point of failure"],a:3,why:"Centralization buys predictability at the cost of a central dependency. Later robustness patterns (watchdog, auto-healing, supervision tree) exist partly to protect it."}
],

{id:"l3",t:"Composition topologies",min:8,html:`
<p class="lead">Three structural patterns for <em>how a team is wired together</em> — beyond simple boss-and-workers.</p>
<h3>Blackboard Knowledge Hub</h3>
<p><strong>When:</strong> a hard problem needs diverse specialists contributing opportunistically, with no fixed order. <strong>How:</strong> agents read and write a <strong>shared workspace</strong> (the ‘blackboard’) rather than messaging each other; a controller invokes whichever specialist can contribute next given the current state. <strong>Example:</strong> collaborative medical diagnosis — labs, imaging, and history agents each add findings to the board until a diagnosis emerges. <strong>Trade-offs:</strong> flexible and extensible, but the shared state can become a contention and consistency challenge.</p>
<h3>Contract-Net Marketplace (mediator + bids)</h3>
<p><strong>When:</strong> a task should go to the currently best-suited or cheapest agent, decided dynamically. <strong>How:</strong> a mediator <strong>announces</strong> a task; candidate agents <strong>bid</strong>; the mediator awards the <strong>contract</strong> to the best bid. <strong>Example:</strong> selecting a cloud-provider agent by having providers bid on cost/latency. <strong>Trade-offs:</strong> great for dynamic allocation and load-balancing, but bidding adds latency and overhead.</p>
<h3>Supervision Tree with Guarded Capabilities</h3>
<p><strong>When:</strong> you need resilience and least-privilege in a hierarchy. <strong>How:</strong> agents are arranged in a <strong>tree</strong> where supervisors monitor children and restart or contain failures, and each node is granted only the <strong>capabilities</strong> it needs. <strong>Example:</strong> a resilient web scraper where a supervisor restarts failed scraper children without taking down the run. <strong>Trade-offs:</strong> strong fault isolation and security, at the cost of more architectural machinery.</p>
<div class="box key"><div class="bx-h">Pick by the coordination problem</div><strong>Blackboard</strong> = shared workspace for opportunistic collaboration. <strong>Contract-Net</strong> = dynamic task/resource allocation by bidding. <strong>Supervision Tree</strong> = fault isolation + least privilege. Each solves a different ‘how do we wire the team?’ question.</div>
`,checks:[
{q:"Several specialist agents must collaborate on a diagnosis with no fixed order, each adding findings as they become relevant. The topology:",opts:["Blackboard Knowledge Hub","Contract-Net Marketplace","Supervision Tree","Agent Router"],a:0,why:"Opportunistic, order-free collaboration around shared state is the blackboard pattern — the medical-diagnosis example."},
{q:"You want tasks awarded to whichever agent is currently cheapest/best-suited, decided at run time. The pattern:",opts:["Supervisor Architecture","Contract-Net Marketplace","Blackboard Knowledge Hub","Swarm Architecture"],a:1,why:"Bidding-based dynamic allocation is Contract-Net (the cloud-provider-selection example). It shines for load-balancing and dynamic assignment."}
]
}
],

id:"m6",n:"6",spine:false,t:"Coordination II — Collective Intelligence",
sub:"When agents must think together: planning, sharing knowledge, debating to consensus, negotiating, allocating scarce resources, and resolving conflict.",
lessons:[
{id:"l1",t:"Planning, knowledge sharing & tool routing",min:8,html:`
<p class="lead">Three patterns for making a team more than the sum of its agents — coordinating the <em>work</em>, the <em>knowledge</em>, and the <em>tools</em>.</p>
<h3>Multi-Agent Planning</h3>
<p><strong>When:</strong> a goal needs a plan that spans several agents' capabilities. <strong>How:</strong> agents jointly (or via a planner) decompose the goal, assign sub-tasks, and sequence dependencies before executing. <strong>Example:</strong> generating a market-analysis report — research, analysis, and writing agents plan who does what and in what order. <strong>Watch-outs:</strong> planning overhead and the need to re-plan when reality diverges.</p>
<h3>Knowledge Sharing</h3>
<p><strong>When:</strong> agents keep re-solving problems others have already solved. <strong>How:</strong> a shared store of solutions/experiences agents contribute to and draw from. <strong>Example:</strong> customer-service agents sharing resolved-ticket solutions so the team answers faster over time. <strong>Watch-outs:</strong> keeping shared knowledge fresh, consistent, and trustworthy.</p>
<h3>Tool Routing in Multi-Agent Contexts</h3>
<p><strong>When:</strong> many agents and many tools, and you need the right tool invoked by the right agent efficiently. <strong>How:</strong> a routing layer directs tool requests to the appropriate provider/agent. <strong>Example:</strong> an intelligent personal assistant routing a calendar request vs a search request to the right backend. <strong>Watch-outs:</strong> the router's classification quality and latency.</p>
<div class="box key"><div class="bx-h">Common thread</div>These patterns externalize what a single agent keeps in its head — the <em>plan</em>, the <em>knowledge</em>, the <em>tool map</em> — into shared structures so a whole team can use them coherently.</div>
`,checks:[
{q:"A support team's agents keep independently rediscovering fixes for the same recurring issues. The pattern:",opts:["Knowledge Sharing","Consensus","Multi-Agent Planning","Negotiation"],a:0,why:"Reusing collective experience across agents is Knowledge Sharing — the shared customer-service solutions example."}
]
},
{id:"l2",t:"Consensus & Negotiation",min:8,drill:"consensus",html:`
<p class="lead">Two ways agents reconcile differences: cooperatively converging on one answer, or bargaining between competing interests.</p>
<h3>Consensus</h3>
<p><strong>When:</strong> multiple agents produce differing answers and you need one reliable decision. <strong>How:</strong> agents <strong>debate, critique, and vote</strong> to converge — majority vote, weighted vote, or structured debate. <strong>Example:</strong> a financial-forecasting debate where several analyst agents argue and converge on a forecast. <strong>Why it works:</strong> aggregating independent, better-than-chance opinions cuts error — run the drill below to see the math, and note the catch: it only helps when the agents' errors are <em>independent</em>.</p>
<h3>Agent Negotiation</h3>
<p><strong>When:</strong> agents have <em>competing</em> goals over a shared resource or outcome. <strong>How:</strong> structured offer/counter-offer until they reach a mutually acceptable deal. <strong>Example:</strong> two agents negotiating for a shared compute resource. <strong>Watch-outs:</strong> negotiation can stall or reach poor equilibria; you need protocols, deadlines, and fallback rules.</p>
<div class="box key"><div class="bx-h">Consensus vs Negotiation</div><strong>Consensus</strong> = cooperative agents converging on the <em>truth/best answer</em>. <strong>Negotiation</strong> = self-interested agents converging on a <em>deal</em>. Different goals, different protocols.</div>
`,checks:[
{q:"The consensus (majority-voting) pattern only reliably improves accuracy when:",opts:["Agents beat chance and their errors are independent","All the agents use the largest available model","At least seven agents take part in each vote","Temperature is set to zero for every agent voting"],a:0,why:"Voting aggregates independent signal. If all agents share the same failure mode, they vote the same wrong answer together. Diversify models/prompts to keep votes independent."},
{q:"Two agents both want exclusive access to the same limited resource. The right pattern:",opts:["Knowledge Sharing","Negotiation","Consensus","Formation Control"],a:1,why:"Competing goals over a shared resource is negotiation, not consensus. Consensus is for cooperative agents converging on one answer."}
]
},
{id:"l3",t:"Resource allocation, conflict resolution & formation",min:7,html:`
<p class="lead">Three patterns for keeping a busy multi-agent system coherent under contention and scale.</p>
<h3>Resource Allocation</h3>
<p><strong>When:</strong> many agents compete for limited resources (compute, tools, physical assets). <strong>How:</strong> a mechanism assigns resources efficiently and fairly — market-based, priority-based, or optimization-driven. <strong>Example:</strong> autonomous robots allocated across tasks in a smart factory.</p>
<h3>Conflict Resolution</h3>
<p><strong>When:</strong> agents reach incompatible decisions or actions. <strong>How:</strong> a defined strategy resolves it — <strong>hierarchical</strong> (escalate to a supervisor), <strong>policy-based</strong> (apply a rule), <strong>negotiation</strong>, or <strong>game-theoretic</strong>. <strong>Example:</strong> resolving an enterprise-workflow conflict where two agents disagree on next steps. <strong>Essentials:</strong> conflict <em>detection</em> first, <strong>explainable</strong> resolutions (an audit trail), defined <strong>escalation paths</strong> to a human, and simulation to test for resilience.</p>
<h3>Formation Control</h3>
<p><strong>When:</strong> agents (often physical) must maintain a coordinated spatial or logical structure. <strong>How:</strong> local rules keep the group in formation as it moves/adapts. <strong>Example:</strong> an agricultural drone swarm holding formation to cover a field. <strong>Watch-outs:</strong> robustness to individual failures and communication delays.</p>
<div class="box key"><div class="bx-h">The reliability throughline</div>Conflict resolution captures the book's governance instinct: <strong>detect</strong> the conflict, resolve it <strong>explainably</strong>, and always have a <strong>human escalation path</strong>. That trio — detect, explain, escalate — recurs across the compliance and robustness patterns too.</div>

id:"m7",n:"7",spine:false,t:"Explainability & Compliance Patterns",
sub:"Making an agent's reasoning inspectable and its adherence provable — the patterns that turn a black box into an auditable system.",

{id:"l1",t:"Auditing & anchoring instructions",min:8,html:`
<p class="lead">In regulated work, ‘it usually follows the rules’ isn't good enough. Two patterns make instruction-following <em>provable</em> and <em>durable</em>.</p>
<h3>Instruction Fidelity Auditing</h3>
<p><strong>When:</strong> an agent must demonstrably follow every instruction and constraint in its brief. <strong>How:</strong> a <strong>separate auditor</strong> checks the output (and reasoning) against each stated instruction, flagging any that were skipped or violated. <strong>Example:</strong> auditing an e-commerce discount application to confirm the agent applied exactly the eligible discounts — no more, no less. <strong>Why:</strong> catches silent drift from the contract that the acting agent won't self-report, because it can't reliably audit itself.</p>
<h3>Persistent Instruction Anchoring</h3>
<p><strong>When:</strong> long runs cause an agent to ‘lose the thread’ of its constraints (the lost-in-the-middle problem). <strong>How:</strong> re-inject the non-negotiable constraints at every step so they stay salient throughout. <strong>Example:</strong> maintaining hard constraints across a long financial-reporting task so a rule stated at the start still binds at step 40. <strong>Watch-outs:</strong> anchoring costs context budget — anchor the <em>critical</em> constraints, not everything.</p>
<div class="box key"><div class="bx-h">Why a separate auditor?</div>The same principle as the Planner+Scorer split you'll meet later: an agent rationalizes its own mistakes. Objective checking requires an <em>external</em> evaluator. Auditing and anchoring together give you a system that both <em>stays</em> on-contract and can <em>prove</em> it did.</div>
`,checks:[

{q:"On a long task, a constraint set at the start stops being honoured by later steps. The fix:",opts:["Incremental Checkpointing","Persistent Instruction Anchoring","Adaptive Retry","Instruction Fidelity Auditing"],a:1,why:"Re-anchoring keeps non-negotiable constraints present throughout a long run, countering the tendency to lose mid-context information."}
